# Install as .github/workflows/release-train.yml (tools/release/README.md).
# The bot creates a GitHub-verified version commit, then its branch and tag; only release.yml publishes.
name: Daily release

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      nightly-run-id:
        description: ID of the completed full nightly on main to release
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-train
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash

jobs:
  prepare:
    # workflow_run is privileged: never check out a PR's or another repository's code.
    if: >-
      ${{ vars.RELEASE_TRAIN != 'off'
      && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'schedule'
      || (github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.display_title == 'Nightly (full budgets)')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Validate manual input before checking out and executing the selected commit's code.
      - name: Select the completed full nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_RUN: ${{ github.event.workflow_run.id || inputs.nightly-run-id }}
        run: |
          set -euo pipefail
          if ! [[ "$NIGHTLY_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::nightly-run-id must be a numeric run ID."
            exit 1
          fi
          nightly_json=$(gh run view "$NIGHTLY_RUN" --json workflowName,headBranch,status,conclusion,event,displayTitle,headSha)
          if ! nightly_sha=$(jq -er '
            select(.workflowName == "Nightly" and .headBranch == "main"
              and .status == "completed" and .conclusion == "success"
              and (.event == "schedule" or (.event == "workflow_dispatch"
                and .displayTitle == "Nightly (full budgets)")))
            | .headSha | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' <<< "$nightly_json"); then
            echo "::error::Select a successful full Nightly run on main."
            exit 1
          fi
          echo "id=$NIGHTLY_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$nightly_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.nightly.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      - uses: $/.github/actions/node-pnpm
      - name: Prepare the version commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_RUN: ${{ steps.nightly.outputs.id }}
          GIT_AUTHOR_NAME: laminapdf-release[bot]
          GIT_AUTHOR_EMAIL: laminapdf-release[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: laminapdf-release[bot]
          GIT_COMMITTER_EMAIL: laminapdf-release[bot]@users.noreply.github.com
        run: cargo xtask release prepare --run "$NIGHTLY_RUN"
      # Refuse an obsolete selection before creating remote refs; release.yml checks again.
      - name: Check that the latest full nightly still permits the release
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cargo xtask release-guard --commit HEAD
      - name: Create the release bot's token
        if: steps.version.outputs.ready == 'true'
        id: bot
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish the signed version commit and tag
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          parent=$(git rev-parse 'HEAD^')
          parent_tree=$(git rev-parse "$parent^{tree}")
          # Changed text files go inline in tree requests: a blob request per file would pass
          # GitHub's 80-a-minute limit on content-creating requests (199 package-docs files).
          # Requests carry 50 entries each, built on the tree before: one request with all 289
          # files of v0.2.0-alpha.4 (1 MiB) took two minutes, and the next release's got a 502.
          entries="$RUNNER_TEMP/release-entries"
          rm -rf "$entries" && mkdir "$entries"
          count=0
          # Deletions go first, so a file that becomes a folder can't clash with its old path
          # when the two land in different requests.
          while IFS= read -r -d '' path; do
            mode=$(git --literal-pathspecs ls-tree "$parent" -- "$path" | awk 'NR == 1 { print $1 }')
            test -n "$mode"
            count=$((count + 1))
            jq -n --arg path "$path" --arg mode "$mode" \
              '{path: $path, mode: $mode, type: "blob", sha: null}' > "$entries/$(printf '%06d' "$count").json"
          done < <(git diff --no-renames --name-only --diff-filter=D -z "$parent" HEAD)
          while IFS= read -r -d '' path; do
            mode=$(git --literal-pathspecs ls-tree HEAD -- "$path" | awk 'NR == 1 { print $1 }')
            test -n "$mode"
            git cat-file blob "HEAD:$path" > "$RUNNER_TEMP/release-file"
            count=$((count + 1))
            entry="$entries/$(printf '%06d' "$count").json"
            if ! LC_ALL=C grep -q $'\x00' "$RUNNER_TEMP/release-file" \
              && iconv -f UTF-8 -t UTF-8 "$RUNNER_TEMP/release-file" > /dev/null 2>&1; then
              jq -n --arg path "$path" --arg mode "$mode" --rawfile content "$RUNNER_TEMP/release-file" \
                '{path: $path, mode: $mode, type: "blob", content: $content}' > "$entry"
            else
              # Binary content can't go inline: upload it as a blob (rare in a release commit).
              base64 < "$RUNNER_TEMP/release-file" | tr -d '\n' > "$RUNNER_TEMP/release-file.b64"
              blob=$(jq -n --rawfile content "$RUNNER_TEMP/release-file.b64" \
                '{content: $content, encoding: "base64"}' \
                | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - \
                | jq -er '.sha | select(test("^[0-9a-f]{40}$"))')
              jq -n --arg path "$path" --arg mode "$mode" --arg sha "$blob" \
                '{path: $path, mode: $mode, type: "blob", sha: $sha}' > "$entry"
            fi
          done < <(git diff --no-renames --name-only --diff-filter=ACMRTUXB -z "$parent" HEAD)
          test "$count" -gt 0
          # A tree's SHA depends only on its content, so a request that failed on GitHub's side
          # (5xx, timeout) is safe to send again. A 4xx answer won't change: fail on it at once.
          # Three tries at most keep a hanging batch inside the job's 30 minutes.
          post_tree() {
            local attempt sha
            for attempt in 1 2 3; do
              if sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$1" \
                2> "$RUNNER_TEMP/release-tree.err" | jq -er '.sha | select(test("^[0-9a-f]{40}$"))'); then
                echo "$sha"
                return 0
              fi
              cat "$RUNNER_TEMP/release-tree.err" >&2
              if grep -q 'HTTP 4[0-9][0-9]' "$RUNNER_TEMP/release-tree.err"; then
                return 1
              fi
              echo "::warning::Tree request failed (attempt $attempt of 3)." >&2
              if ((attempt < 3)); then sleep $((attempt * 15)); fi
            done
            return 1
          }
          files=("$entries"/*.json)
          signed_tree=$parent_tree
          for ((i = 0; i < ${#files[@]}; i += 50)); do
            jq -s --arg base_tree "$signed_tree" '{base_tree: $base_tree, tree: .}' "${files[@]:i:50}" \
              > "$RUNNER_TEMP/release-tree.json"
            signed_tree=$(post_tree "$RUNNER_TEMP/release-tree.json")
          done
          # The tree GitHub builds must be the one prepared here, byte for byte.
          test "$signed_tree" = "$tree"
          signed_sha=$(jq -n --arg message "release: $TAG" --arg tree "$signed_tree" --arg parent "$parent" \
            '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - \
            | jq -er '.sha | select(test("^[0-9a-f]{40}$"))')
          signed=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$signed_sha")
          test "$(jq -er .tree.sha <<< "$signed")" = "$tree"
          test "$(jq -er 'if (.parents | length) == 1 then .parents[0].sha else empty end' <<< "$signed")" = "$parent"
          jq -e '.verification.verified == true and .verification.reason == "valid"' <<< "$signed" >/dev/null

          # A signing or verification failure leaves no refs, so the release lane cannot start.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/heads/$BRANCH" --raw-field sha="$signed_sha" >/dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/tags/$TAG" --raw-field sha="$signed_sha" >/dev/null
