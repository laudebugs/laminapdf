# Configuration for `cargo xtask check docs-snippets` (docs/guidelines/examples.md).
#
# The TypeScript and Rust examples that show the same task. Each pair must share a name
# (`links-and-outlines.ts`, `links_and_outlines.rs`) and the first sentence of its header comment.
# A TypeScript example and a Rust example whose names match must be listed here.
#
# `[[test-example]]` (at the end) lists the examples the `test-scaffolding` rule skips.

[[pair]]
ts = "packages/sdk/examples/hello.ts"
rust = "crates/laminapdf/examples/hello.rs"

[[pair]]
ts = "packages/sdk/examples/invoice.ts"
rust = "crates/laminapdf/examples/invoice.rs"

[[pair]]
ts = "packages/sdk/examples/multilingual.ts"
rust = "crates/laminapdf/examples/multilingual.rs"

[[pair]]
ts = "packages/sdk/examples/images-and-vectors.ts"
rust = "crates/laminapdf/examples/images_and_vectors.rs"

[[pair]]
ts = "packages/sdk/examples/links-and-outlines.ts"
rust = "crates/laminapdf/examples/links_and_outlines.rs"

[[pair]]
ts = "packages/sdk/examples/generate-then-edit.ts"
rust = "crates/laminapdf/examples/generate_then_edit.rs"

[[pair]]
ts = "packages/sdk/examples/pdf-ua-report.ts"
rust = "crates/laminapdf/examples/pdf_ua_report.rs"

[[pair]]
ts = "packages/sdk/examples/pdf-a-archive.ts"
rust = "crates/laminapdf/examples/pdf_a_archive.rs"

[[pair]]
ts = "packages/sdk/examples/pdf-a3-invoice-with-xml.ts"
rust = "crates/laminapdf/examples/pdf_a3_invoice_with_xml.rs"

[[pair]]
ts = "packages/sdk/examples/extract-markdown.ts"
rust = "crates/laminapdf/examples/extract_markdown.rs"

[[pair]]
ts = "packages/sdk/examples/snapshot-test.ts"
rust = "crates/laminapdf/examples/snapshot_test.rs"

# Examples whose subject is testing a reader's own PDFs. They fix the file ID and the dates on
# purpose, so the `test-scaffolding` rule skips them. Keep the list short: each entry needs a reason.

[[test-example]]
path = "packages/sdk/examples/snapshot-test.ts"
reason = "shows the options a reader's test passes in place of the clock and a random file ID"

[[test-example]]
path = "crates/laminapdf/examples/snapshot_test.rs"
reason = "shows the options a reader's test passes in place of the clock and a random file ID"
