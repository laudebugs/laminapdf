[[model]]
name = "docling-layout-heron"
kind = "layout"
description = "Docling's Heron document-layout detector (RT-DETRv2), its official ONNX export"
# The Hugging Face repository's commit, so the file never changes under the pin.
revision = "40bde044036bb181c130ddf6c51792187268748f"
url = "https://huggingface.co/docling-project/docling-layout-heron-onnx/resolve/40bde044036bb181c130ddf6c51792187268748f/model.onnx"
file = "model.onnx"
bytes = 171220471
sha256 = "59c81a3a2923042d85034ffc487f8f47e4854117e879aef89b2b9f728fb4922a"
weights_licence = "Apache-2.0"
weights_licence_source = "https://huggingface.co/docling-project/docling-layout-heron-onnx"
code_licence = "MIT AND Apache-2.0"
code_licence_source = "https://raw.githubusercontent.com/docling-project/docling-ibm-models/HEAD/LICENSE (MIT); https://raw.githubusercontent.com/lyuwenyu/RT-DETR/HEAD/LICENSE (Apache-2.0)"
training_data = "DocLayNet, CDLA-Permissive-1.0 (https://huggingface.co/datasets/docling-project/DocLayNet)"
read_on = "2026-11-08"

