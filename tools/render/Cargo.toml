# Its own workspace (excluded from the root one, like fuzz/): the fast lane never compiles hayro.
# Every version is pinned by this folder's Cargo.lock (`--locked`); Dependabot covers only the
# root workspace, so a bump is deliberate and comes with `cargo xtask render-golden --update`.
[workspace]

[package]
name = "render-golden"
description = "lamina's render goldens (todo B5c, ADR 0018 tier 8): renders PDFs with hayro, reads PDFium's renders (pdfium.py), compares them with the committed PNGs and with each other; and render-diff (todo X3b), the nightly hayro-vs-PDFium diff through laminapdf-render's adapters. A tool: never a dependency of a crate."
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/laudebugs/lamina"
publish = false
# Two binaries: `render-golden` (the default, `cargo xtask render-golden`) and `render-diff`
# (`cargo xtask render-diff`, the nightly hayro-vs-PDFium diff through laminapdf-render, todo X3b).
default-run = "render-golden"

[dependencies]
# MIT OR Apache-2.0
anyhow = "1.0.104"
# render-diff renders through lamina's own adapters (ADR 0004): the hayro adapter and the PDFium
# one (pdfium-render, bound at runtime to the library `cargo xtask fetch-pdfium` unpacks).
# lamina's own page count stands in for a file neither engine could open (its rows count once per page).
laminapdf-cos = { path = "../../crates/laminapdf-cos" }
laminapdf-render = { path = "../../crates/laminapdf-render", features = ["hayro"] }
laminapdf-render-pdfium = { path = "../../crates/laminapdf-render-pdfium" }
# The pure-Rust PDF renderer, the CI oracle of the hayro-parity spike (C1a): same pin. Tools
# only, never a core dependency. Apache-2.0 OR MIT (dependencies: kurbo, vello_cpu, skrifa-family
# crates, moxcms, pic-scale, …: MIT/Apache/BSD/Zlib; `cargo xtask deny` checks this lockfile too).
hayro = { version = "=0.8.0" }
# MIT OR Apache-2.0
png = { version = "=0.18.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[lints.rust]
unsafe_code = "deny"            # core crates additionally #![forbid(unsafe_code)]
missing_docs = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }   # enforced: CI's -D warnings turns these into errors
must_use_candidate = "allow"    # pedantic allow-list: each entry says why (here: #[must_use] on every getter is noise)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
redundant_clone = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"                   # unfinished code never merges; keep todo!/unimplemented! on your branch
unimplemented = "deny"
allow_attributes = "deny"       # outer #[allow] is rejected: use #[expect] (inner #![allow] is not covered)
allow_attributes_without_reason = "deny"   # every #[allow]/#[expect] states why

[lints.rustdoc]
broken_intra_doc_links = "deny"
