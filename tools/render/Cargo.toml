[package]
name = "render-golden"
description = "lamina's render goldens (todo B5c, ADR 0018 tier 8): renders PDFs with hayro, reads PDFium's renders (pdfium.py), compares them with the committed PNGs and with each other. A tool: never a dependency of a crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
# The pure-Rust PDF renderer, the CI oracle of the hayro-parity spike (C1a): same pin. Tools
# only, never a core dependency (ADR 0001: lamina-render is web C2). Apache-2.0 OR MIT
# (dependencies: kurbo, vello_cpu, skrifa-family crates, moxcms, pic-scale, …: MIT/Apache/BSD/Zlib;
# cargo-deny checks them).
hayro = { version = "=0.8.0" }
png = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
