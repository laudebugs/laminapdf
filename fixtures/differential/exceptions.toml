# Deliberate differences between lamina and pypdf in the differential suite (ADR 0018 tier 6,
# ADR 0003 §4). Each entry: the input (a corpus file or a mutant `<stem>-m<i>.pdf`), the fact
# (outcome | page_count | outline_titles), the ADR 0003 rule behind lamina's answer, and why
# the two readers differ. crates/lamina-model/tests/differential.rs skips exactly these and
# fails on an entry that is no longer needed.
#
# Grouped by cause; regenerate the expectations (not this list) when the mutants change.

[[exception]]
file = "enc-m0.pdf"
facts = ["outcome", "page_count", "outline_titles"]
rule = "ADR 0003 §1: Repair"
reason = "the truncated file has no usable xref; lamina rebuilds it by scanning object headers and reads the document, pypdf gives up"

