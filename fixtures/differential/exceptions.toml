# ---- Nightly lane: per-file exceptions against the other tools ----
# (pypdf's side of these is in full-exceptions.toml; without pypdf in `tools`, the PR lanes skip them.)

[[exception]]
file = "enc-f5.pdf"
facts = ["outcome"]
tools = ["pdfjs", "pdfium", "qpdf"]
rule = "ADR 0003 §1: Rejected (a malformed object is an error for the call that resolves it)"
reason = "the damage is inside the /Encrypt dictionary, which open must read to decrypt the file; lamina fails with a syntax error, the other readers recover a partial dictionary (as in full-exceptions.toml for pypdf)"

# ---- Nightly lane: classes (lamina vs live pdf.js, PDFium, qpdf and pypdf) ----

[[class]]
facts = ["outcome"]
lamina = "repaired"
theirs = "failed"
rule = "ADR 0003 §1: Repair"
reason = "lamina rebuilds a missing or broken xref by scanning every `n g obj` header and reads the document; the other reader gives up on the same damage"

[[class]]
facts = ["outcome"]
tools = ["pypdf"]
lamina = "repaired"
theirs = "opened"
rule = "ADR 0003 §1: Repair"
reason = "both read the damaged file; pypdf's repair is detected from its log warnings (tools/corpus-facts/facts.py REPAIR_HINTS) and some of its recoveries log none"

[[class]]
facts = ["page_count"]
relation = "lamina-skips"
rule = "ADR 0003 §1: Page tree"
reason = "lamina's walk skips kids that are missing, unparsable or not dictionaries (and a missing /Pages is 0 pages); the other readers trust /Count or scan the file for /Type /Page objects"

[[class]]
facts = ["outline_titles"]
relation = "lamina-skips"
rule = "ADR 0003 §2: outline-item-skipped"
reason = "lamina skips an outline item that is missing, not a dictionary or unreadable, with its subtree; the other readers keep a placeholder or recover the item"

[[class]]
facts = ["outcome"]
lamina_facts = { error = "missing-root" }
rule = "ADR 0003 §1: Rejected (no catalog even after repair)"
reason = "the catalog no longer parses or resolves; lamina fails with missing-root, the other reader recovers a partial catalog or scans for pages without one"

[[class]]
facts = ["outcome"]
lamina_facts = { error = "reference-cycle" }
rule = "ADR 0003 §1: Page tree (a node reached twice is ReferenceCycle)"
reason = "a page or intermediate node appears twice in the page tree (a duplicated kid or a loop); lamina rejects it, the other reader skips the repeat or the loop"

[[class]]
facts = ["outcome"]
theirs = "failed"
lamina_facts = { page_count = 0 }
rule = "ADR 0003 §1: Page tree (missing /Pages → 0 pages)"
reason = "the page tree is gone or unreadable; lamina opens the document with no pages, the other reader rejects a document without one"

[[class]]
file = "outline-*"
facts = ["outline_titles"]
tools = ["pdfjs"]
theirs = []
rule = "ADR 0003 §2: outline-item-skipped"
reason = "in mutants of outline.pdf with a damaged item, pdf.js drops the whole outline; lamina skips only the unreadable items and keeps the rest"

# ---- Nightly lane: known disagreements (lamina bugs or open questions, each tracked) ----

[[exception]]
file = "pdfjs/test/pdfs/issue22011.pdf"
facts = ["page_count"]
tools = ["pdfjs"]
rule = "ADR 0003 §1: Dictionary key that is not a name"
reason = "the 40th page's dictionary has a stray `)`, which lamina, PDFium, qpdf and pypdf read past (57 pages); the pinned pdfjs-dist 6.4.299 stops the page walk there (40 pages), a bug pdf.js fixed in 6.5 (mozilla/pdf.js#22013)"

# ---- Nightly lane: page text (`differential --live --text`, todo B9f) ----

[[class]]
facts = ["text"]
lamina = ""
lamina_facts = { page_error = "unsupported-filter" }
rule = "ADR 0003 §1: Unsupported filter (the document opens; only decoding that stream fails)"
reason = "a content stream of the page uses a filter lamina doesn't decode (BrotliDecode, an image filter in /Contents; ASCIIHex, ASCII85, LZW and RunLength decode since todo E3i), so the page's extraction fails and it has no text; the tool decodes it. The missing standard filters are https://github.com/laudebugs/laminapdf/issues/108"

[[class]]
facts = ["text"]
lamina = ""
lamina_facts = { page_error = "decompress" }
rule = "ADR 0003 §1: Truncated Flate data (no output → Error::Decompress)"
reason = "the page's Flate content gives no output (an empty or damaged stream); lamina's extraction of the page fails with decompress, the tool reads what it can or an empty page"

[[class]]
facts = ["text"]
lamina = ""
lamina_facts = { page_error = "unexpected-eof" }
rule = "ADR 0003 §1: Rejected (a malformed object is an error for the call that resolves it)"
reason = "an object the page's content needs is truncated; lamina's extraction of that page fails, the tool recovers part of it"

[[class]]
facts = ["text"]
lamina_facts = { error = "reference-cycle" }
rule = "ADR 0003 §1: Page tree (a node reached twice is ReferenceCycle)"
reason = "a page or node appears twice in the page tree; lamina rejects the document (so no page text), the tool skips the repeat or the loop and extracts the pages"

[[class]]
facts = ["text"]
lamina_facts = { error = "missing-root" }
rule = "ADR 0003 §1: Rejected (no catalog even after repair)"
reason = "the catalog doesn't parse or resolve; lamina rejects the document (so no page text), the tool recovers a partial catalog or scans for pages"

[[class]]
facts = ["text"]
relation = "unmapped"
lamina_warning = "unmapped-glyph"
rule = "ADR 0003 §2: warnings (unmapped-glyph: a glyph without a Unicode value is U+FFFD, with the warning)"
reason = "the texts differ only where lamina writes U+FFFD for a glyph that has no Unicode value (no ToUnicode entry, glyph name or cmap), and the tool writes nothing or a control character for it"

[[class]]
file = "pdfbox/pdfbox-layout-*/src/test/resources/pdf/GlyphLayoutDIN91379*_ActualText.pdf"
facts = ["text"]
tools = ["pdftotext"]
relation = "pdfdoc-undefined-replaced"
rule = "ADR 0003 §1: an undefined PDFDocEncoding byte keeps its own scalar"
reason = "the files end an /ActualText string with undefined byte 0x9F; lamina preserves U+009F, while pdftotext displays U+FFFD"

[[known]]
facts = ["text"]
issue = "https://github.com/laudebugs/laminapdf/issues/106"
reason = "lamina writes U+FFFD for glyphs pdf.js or pdftotext map to Unicode (built-in encodings of embedded fonts, predefined CJK CMaps without ToUnicode, symbolic fonts)"

