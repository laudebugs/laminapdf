# Deliberate differences between lamina and the other readers in the differential suite
# (ADR 0018 tier 6, ADR 0003 §4).
#
# [[exception]] (both lanes): the input (a corpus file, a mutant `<stem>-m<i>.pdf`, or an
# external corpus file `<source>/<path>`), the facts (outcome | page_count | outline_titles), the
# ADR 0003 rule behind lamina's answer, and why the readers differ; `tools` (pdfjs, pdfium, qpdf,
# pypdf) defaults to pypdf, the PR lane's only tool. crates/lamina-model/tests/differential.rs
# skips exactly these and fails on an entry that is no longer needed.
#
# [[class]] (nightly lane only, `cargo xtask differential --live`): a whole class of deliberate
# differences, matched on the values rather than one file: `file` (a glob, default "*"), `facts`,
# `tools` (default all), and any of `lamina` / `theirs` (the two values) and `relation`
# ("lamina-skips": a lower page count, or outline titles that are a shorter subsequence).
#
# [[known]] (nightly lane only): a disagreement that is a lamina bug or an open question, not a
# rule, tracked by `issue` (a URL) until it is fixed, like an ignored flaky test (ADR 0018 §4).
#
# The nightly report lists every disagreement, how many each class and known entry excused,
# and the entries a tool now agrees with. Grouped by cause; regenerate the expectations (not
# this list) when the mutants change.

[[exception]]
file = "enc-m0.pdf"
facts = ["outcome", "page_count", "outline_titles"]
rule = "ADR 0003 §1: Repair"
reason = "the truncated file has no usable xref; lamina rebuilds it by scanning object headers and reads the document, pypdf gives up"

