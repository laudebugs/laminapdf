# Deliberate differences between lamina and the other readers in the differential suite
# (ADR 0018 tier 6, ADR 0003 §4).
#
# [[exception]] (every lane): the input (`file`, or `files` for several that differ for the
# same reason: a corpus file, a mutant `<stem>-m<i>.pdf`, or an external corpus file
# `<source>/<path>`), the facts (outcome | page_count | outline_titles), the ADR 0003 rule behind
# lamina's answer, and why the readers differ. `tools` (pdfjs, pdfium, qpdf, pypdf) defaults to
# pypdf, the PR lanes' only tool; an entry whose `tools` leaves out pypdf is skipped there.
# crates/lamina-model/tests/differential.rs skips exactly these and fails on an entry that is no
# longer needed.
#
# [[class]] (nightly lane only, `cargo xtask differential --live`): a whole class of deliberate
# differences, matched on the values rather than one file: `file` (a glob, `*` for any run of
# characters; default "*"), `facts`, `tools` (default all), and any of: `lamina` / `theirs` (the
# two values of the fact), `lamina_facts` (an inline table of lamina's other facts that must
# match, including its `error` code when it failed, e.g. `{ error = "missing-root" }` or
# `{ page_count = 0 }`) and `relation` ("lamina-skips": a lower page count, or outline titles
# that are a shorter subsequence of the tool's).
#
# Page text (nightly lane only, `cargo xtask differential --live --text`, todo B9f): `[[class]]`
# and `[[known]]` entries with `facts = ["text"]` (alone) and `tools` from pdfjs, pdftotext. A
# class's `lamina` / `theirs` are the page's text with whitespace and bidi controls removed;
# `lamina_facts` can match the file's `outcome` or `error`, or the page's `page_error` (the code
# its extraction failed with); `lamina_warning` names a warning code lamina raised on the file;
# `relation` can also be "lamina-skips" (lamina's characters are a shorter subsequence of the
# tool's), "same-characters" (the same characters in another order) or "unmapped" (the texts
# differ only by lamina's U+FFFD where the tool writes nothing or a control character). A text
# `[[known]]` covers every page of its file. Per-file `[[exception]]`s don't take text (the PR
# lanes read them).
#
# [[known]] (nightly lane only): a disagreement that is a lamina bug or an open question, not a
# rule, tracked by `issue` (its URL; "PENDING" is accepted but warned about on every run and
# listed in the report) until it is fixed, like an ignored flaky test (ADR 0018 §4).
#
# The nightly report lists every disagreement, how many each class and known entry excused,
# and the entries a tool now agrees with. Grouped by cause; regenerate the expectations (not
# this list) when the mutants change.

