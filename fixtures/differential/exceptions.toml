# ---- Nightly lane: page text (`differential --live --text`, todo B9f) ----

[[class]]
facts = ["text"]
lamina = ""
lamina_facts = { page_error = "unsupported-filter" }
rule = "ADR 0003 §1: Unsupported filter (the document opens; only decoding that stream fails)"
reason = "a content stream of the page uses a filter lamina doesn't decode (ASCIIHexDecode, ASCII85Decode, BrotliDecode, an image filter in /Contents), so the page's extraction fails and it has no text; the tool decodes it. The missing standard filters are https://github.com/laudebugs/lamina/issues/108"

[[class]]
facts = ["text"]
lamina = ""
lamina_facts = { page_error = "decompress" }
rule = "ADR 0003 §1: Truncated Flate data (no output → Error::Decompress)"
reason = "the page's Flate content gives no output (an empty or damaged stream); lamina's extraction of the page fails with decompress, the tool reads what it can or an empty page"

[[class]]
facts = ["text"]
lamina = ""
lamina_facts = { page_error = "unexpected-eof" }
rule = "ADR 0003 §1: Rejected (a malformed object is an error for the call that resolves it)"
reason = "an object the page's content needs is truncated; lamina's extraction of that page fails, the tool recovers part of it"

[[class]]
facts = ["text"]
lamina_facts = { error = "reference-cycle" }
rule = "ADR 0003 §1: Page tree (a node reached twice is ReferenceCycle)"
reason = "a page or node appears twice in the page tree; lamina rejects the document (so no page text), the tool skips the repeat or the loop and extracts the pages"

[[class]]
facts = ["text"]
lamina_facts = { error = "missing-root" }
rule = "ADR 0003 §1: Rejected (no catalog even after repair)"
reason = "the catalog doesn't parse or resolve; lamina rejects the document (so no page text), the tool recovers a partial catalog or scans for pages"

[[class]]
facts = ["text"]
relation = "unmapped"
lamina_warning = "unmapped-glyph"
rule = "ADR 0003 §2: warnings (unmapped-glyph: a glyph without a Unicode value is U+FFFD, with the warning)"
reason = "the texts differ only where lamina writes U+FFFD for a glyph that has no Unicode value (no ToUnicode entry, glyph name or cmap), and the tool writes nothing or a control character for it"

