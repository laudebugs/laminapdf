# ---- Nightly lane: classes (lamina vs live pdf.js, PDFium, qpdf and pypdf) ----

[[class]]
facts = ["outcome"]
lamina = "repaired"
theirs = "failed"
rule = "ADR 0003 §1: Repair"
reason = "lamina rebuilds a missing or broken xref by scanning every `n g obj` header and reads the document; the other reader gives up on the same damage"

[[class]]
facts = ["outcome"]
tools = ["pypdf"]
lamina = "repaired"
theirs = "opened"
rule = "ADR 0003 §1: Repair"
reason = "both read the damaged file; pypdf's repair is detected from its log warnings (tools/corpus-facts/facts.py REPAIR_HINTS) and some of its recoveries log none"

[[class]]
facts = ["page_count"]
relation = "lamina-skips"
rule = "ADR 0003 §1: Page tree"
reason = "lamina's walk skips kids that are missing, unparsable or not dictionaries (and a missing /Pages is 0 pages); the other readers trust /Count or scan the file for /Type /Page objects"

[[class]]
facts = ["outline_titles"]
relation = "lamina-skips"
rule = "ADR 0003 §2: outline-item-skipped"
reason = "lamina skips an outline item that is missing, not a dictionary or unreadable, with its subtree; the other readers keep a placeholder or recover the item"

[[class]]
facts = ["outcome"]
lamina_facts = { error = "missing-root" }
rule = "ADR 0003 §1: Rejected (no catalog even after repair)"
reason = "the catalog no longer parses or resolves; lamina fails with missing-root, the other reader recovers a partial catalog or scans for pages without one"

[[class]]
facts = ["outcome"]
lamina_facts = { error = "reference-cycle" }
rule = "ADR 0003 §1: Page tree (a node reached twice is ReferenceCycle)"
reason = "a page or intermediate node appears twice in the page tree (a duplicated kid or a loop); lamina rejects it, the other reader skips the repeat or the loop"

[[class]]
facts = ["outcome"]
theirs = "failed"
lamina_facts = { page_count = 0 }
rule = "ADR 0003 §1: Page tree (missing /Pages → 0 pages)"
reason = "the page tree is gone or unreadable; lamina opens the document with no pages, the other reader rejects a document without one"

