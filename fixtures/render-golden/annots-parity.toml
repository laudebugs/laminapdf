# The annotation appearance parity suite (todo E4g): the limits `cargo xtask annots-parity`
# applies to the matrix (every annotation subtype × property set × page turn). Goldens are
# rewritten only by `cargo xtask annots-parity --update`; review the PNG diff.

# Each engine against its committed PNG (`annots-parity/<page>-<engine>.png`, 72 dpi), as in
# thresholds.toml: the same engine at the same pinned version on the same architecture renders
# the same pixels, so none may differ. PDFium is pypdfium2's wheel (tools/render/requirements.txt),
# hayro is pinned by tools/render/Cargo.lock, and pdf.js and its canvas (@napi-rs/canvas, Skia)
# by tools/render/pnpm-lock.yaml. The goldens are made on macOS arm64, where the nightly runs.
[golden.hayro]
max_diff_pixels = 0
delta_e = 2.3
min_ssim = 0.99

[golden.pdfium]
max_diff_pixels = 0
delta_e = 2.3
min_ssim = 0.99

[golden.pdfjs]
max_diff_pixels = 0
delta_e = 2.3
min_ssim = 0.99

# hayro and pdf.js each against PDFium at 150 dpi, with the hayro-parity spike's metric
# (spikes/hayro-parity/README.md, "Method"). Measured on 2026-11-16 (macOS arm64; pypdfium2
# 5.14.0, hayro 0.8.0, pdf.js 6.4.299):
#
# - hayro: at worst 0.766 % of pixels, SSIM 0.9895 (pages 1–3, 5–7 and 9–11).
# - pdf.js: at worst 0.855 % of pixels, SSIM 0.9889 (the same pages, and 0.504 % on page 0).
#
# Upright pages stay under the spike's `pass` limit of 0.5 %. The worst are the turned pages,
# for two reasons that are the engines', not the appearances': PDFium keeps a note's icon
# upright on a turned page (the NoRotate flag, ISO 32000-2 §12.5.3), while hayro and pdf.js
# turn it with the page; and the words and strokes land up to a pixel apart. Opaque saturated
# colours count more pixels than half-transparent ones. The limits sit just above the worst.
[parity.hayro]
max_diff_percent = 0.8
min_ssim = 0.985

[parity.pdfjs]
max_diff_percent = 0.9
min_ssim = 0.985

# Known differences: one entry per page and check that needs a looser limit, with the reason,
# as in thresholds.toml (example = "annots-matrix"; check = "golden-<engine>" or
# "parity-<engine>"). An entry that matches no page fails the run.
