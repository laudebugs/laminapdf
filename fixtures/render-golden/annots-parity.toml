# The annotation appearance parity suite (todo E4g): the limits `cargo xtask annots-parity`
# applies to the matrix (every annotation subtype × property set × page turn). Goldens are
# rewritten only by `cargo xtask annots-parity --update`; review the PNG diff.

# Each engine against its committed PNG (`annots-parity/<page>-<engine>.png`, 72 dpi), as in
# thresholds.toml: the same engine at the same pinned version on the same architecture renders
# the same pixels, so none may differ. PDFium is pypdfium2's wheel (tools/render/requirements.txt),
# hayro is pinned by tools/render/Cargo.lock, and pdf.js and its canvas (@napi-rs/canvas, Skia)
# by tools/render/pnpm-lock.yaml. The goldens are made on macOS arm64, where the nightly runs.
[golden.hayro]
max_diff_pixels = 0
delta_e = 2.3
min_ssim = 0.99

[golden.pdfium]
max_diff_pixels = 0
delta_e = 2.3
min_ssim = 0.99

[golden.pdfjs]
max_diff_pixels = 0
delta_e = 2.3
min_ssim = 0.99

# hayro and pdf.js each against PDFium at 150 dpi, with the hayro-parity spike's metric
# (spikes/hayro-parity/README.md, "Method"). The defaults hold every upright page (pages 0, 4, 8
# and 12), just above the worst measured on 2026-11-18 with the stamps' row (macOS arm64;
# pypdfium2 5.14.0, hayro 0.8.0, pdf.js 6.4.299): hayro 0.932 % (page 0), SSIM ≥ 0.9941; pdf.js
# 0.960 % (page 0), SSIM ≥ 0.9931. The stamps' thick frames and lettering land about a pixel
# apart, as the squares' sides do. A mark missing from one engine (a few thousand of the page's 694,000 pixels) fails.
# Turned pages that need more have a known difference below, each with what it measured.
[parity.hayro]
max_diff_percent = 0.95
min_ssim = 0.993

[parity.pdfjs]
max_diff_percent = 0.98
min_ssim = 0.992

# The corpus edit test: each page of a corpus file against itself after every annotation moved
# 1 pt, per engine at 72 dpi. Measured at worst 0.048 % of pixels, SSIM 0.9863 (a moved square
# and circle redrawn by PDFium); a page that draws blank or broken after the save falls far
# outside this.
[corpus]
max_diff_percent = 0.25
min_ssim = 0.98

# Known differences: one entry per page and check that needs a looser limit, with the reason,
# as in thresholds.toml (example = "annots-matrix"; check = "golden-<engine>" or
# "parity-<engine>"). An entry that matches no page fails the run. Each limit sits just above
# what the page measured.
[[known]]
example = "annots-matrix"
page = 1
check = "parity-hayro"
max_diff_percent = 1.36
min_ssim = 0.985
reason = "turned 90°: measured 1.314 %, SSIM 0.9864. PDFium keeps the note's and the file attachment's icons upright (NoRotate, ISO 32000-2 §12.5.3); hayro turns them with the page, and the words, strokes and the stamps' frames land about a pixel apart"

