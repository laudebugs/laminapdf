[package]
name = "laminapdf-syntax"
description = "PDF syntax layer: object model, serialization, lexer, parser and stream filters (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "parser", "lexer", "document"]
categories = ["parser-implementations", "encoding"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[lints]
workspace = true

[features]
default = ["saslprep"]
# SASLprep (RFC 4013) for R5/R6 passwords (ISO 32000-2 §7.6.4.3.3): stringprep and its Unicode
# tables. Without it a password is tried as its UTF-8 bytes only, which is the same for ASCII
# passwords and for non-ASCII ones already in their prepared form (the WASM base module leaves it
# out and `@laminapdf/sdk` normalises passwords to NFKC; ADR 0016 §5).
saslprep = ["dep:stringprep"]
# The ADR 0026 §1 object as `Diagnostic` and its serialisation (serde, serde_json): for the
# crates that hand errors to another language (the façade, laminapdf-render).
json = ["dep:serde", "dep:serde_json"]

[dependencies]
aes = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
stringprep = { workspace = true, optional = true }
miniz_oxide = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
# The test helpers every crate shares, by path only so `cargo publish` drops it
# (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
# Reads fixtures/codes.json in the kind test.
serde_json = { workspace = true }
