[package]
name = "laminapdf-render-pdfium"
description = "Render PDF pages with PDFium from Rust, loaded at runtime, behind laminapdf-render's renderer interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "pdfium", "render", "rendering", "raster"]
categories = ["rendering", "graphics"]

# Edge: FFI into a C++ library loaded at runtime from the file system (ADR 0004 §5).
[package.metadata.laminapdf]
layer = "edge"

[dependencies]
laminapdf-render = { workspace = true }
pdfium-render = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The goldens and cross-checks render with both backends and compare sizes with lamina's model.
laminapdf = { path = "../laminapdf" }
# The append API's render diffs (tests/append.rs): pages edited and saved, then rendered.
laminapdf-content = { path = "../laminapdf-content" }
laminapdf-cos = { path = "../laminapdf-cos" }
laminapdf-model = { path = "../laminapdf-model" }
laminapdf-save = { path = "../laminapdf-save", features = ["test-support"] }
laminapdf-render = { path = "../laminapdf-render", features = ["hayro"] }
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
