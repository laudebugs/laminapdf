[package]
name = "laminapdf-render-pdfium"
description = "The PDFium adapter of laminapdf-render's RenderBackend (ADR 0004): native PDFium through pdfium-render, bound at runtime to the pinned pdfium-binaries build, reading Lamina PDF's ByteSource through PDFium's custom file access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "pdfium", "render", "raster"]
categories = ["rendering", "graphics"]

# Edge: FFI into a C++ library loaded at runtime from the file system (ADR 0004 §5).
[package.metadata.laminapdf]
layer = "edge"

[dependencies]
laminapdf-render = { workspace = true }
pdfium-render = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The goldens and cross-checks render with both backends and compare sizes with lamina's model.
laminapdf = { path = "../laminapdf" }
laminapdf-render = { path = "../laminapdf-render", features = ["hayro"] }
png = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
