[package]
name = "laminapdf-interchange"
description = "Import and export PDF comments as XFDF (ISO 19444-1), FDF and Markdown, with imports applied as one undoable step."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Reached through the façade (`laminapdf::Document::export_annotations`), so published with it.
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "xfdf", "fdf", "annotations", "comments"]
categories = ["parser-implementations", "encoding"]

[package.metadata.docs.rs]
all-features = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-ops = { workspace = true }
laminapdf-syntax = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The test helpers every crate shares, by path only (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }

[lints]
workspace = true
