[package]
name = "laminapdf-text"
description = "Fonts and text layout for generated PDFs: loading (skrifa), shaping (HarfRust), bidi and line breaking (ICU4X), glyph usage, subsetting (subsetter) and Type 0 embedding with /W and ToUnicode; the standard 14 fonts with bundled AFM metrics and simple-font encodings (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "font", "shaping", "text-extraction"]
categories = ["text-processing", "encoding"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[dependencies]
laminapdf-content = { workspace = true }
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
harfrust = { workspace = true }
icu_properties = { workspace = true }
icu_segmenter = { workspace = true }
laminapdf-syntax = { workspace = true }
sha2 = { workspace = true }
skrifa = { workspace = true }
subsetter = { workspace = true }
thiserror = { workspace = true }
unicode-bidi = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
laminapdf-save = { path = "../laminapdf-save", features = ["test-support"] }
pdf-writer = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
