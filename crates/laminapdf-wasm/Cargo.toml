[package]
name = "laminapdf-wasm"
description = "wasm-bindgen bindings of the Lamina PDF façade: owned handles for documents, builders, pages, fonts and images, JSON records with tsify types, errors as the ADR 0026 object; built twice by `cargo xtask wasm` (base and text modules) into @laminapdf/wasm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: an edge crate (wasm-bindgen, js-sys), also linted and built for wasm32.
[package.metadata.laminapdf]
layer = "edge"
wasm = true

[lib]
# cdylib: the .wasm `cargo xtask wasm` post-processes; rlib: the native unit tests.
crate-type = ["cdylib", "rlib"]

[features]
default = ["build"]
# The builder without text (vector and image pages, navigation, metadata): part of the base
# module. Off only to measure the read/edit/save core alone (ADR 0016 §5).
build = ["laminapdf/build"]
# The text module (ADR 0016 §4): fonts, shaped text and text boxes (lamina's `text`). Without it,
# the base module: open, read, edit, save, and build vector and image pages.
text = ["build", "extract", "laminapdf/text", "laminapdf/markdown", "laminapdf/document"]
# Text extraction (`WasmPage.text`, B9c): lamina's extractor without the builder's text.
extract = ["laminapdf/extract"]
# Reader mode (`WasmDocument.reflow`, U4b): in the extract module only, so the text module keeps its
# size budget.
reflow = ["extract", "laminapdf/reflow"]

[dependencies]
laminapdf = { workspace = true, features = ["page-checks"] }
laminapdf-ops = { workspace = true, features = ["tsify"] }
laminapdf-source = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tsify = { workspace = true }
wasm-bindgen = { workspace = true, features = ["std"] }

[dev-dependencies]
# The test helpers every crate shares (code-organization.md §6), by path only: `cargo publish`
# drops such dev-dependencies.
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
