[package]
name = "laminapdf-ops"
description = "Typed, serialisable editing ops over the COS overlay: transactions with savepoints, undo and redo (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
keywords = ["pdf", "undo", "editing", "document"]
categories = ["data-structures"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[features]
# TypeScript declarations for the op types via tsify (ADR 0002); enabled by laminapdf-wasm (B6a).
tsify = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
# Builds test inputs with the writer. A dev-dependency cycle Cargo accepts; unit tests in `src/`
# see a second copy of this crate through it, so they use only its writer (laminapdf-cos types).
laminapdf-save = { path = "../laminapdf-save" }
proptest = { workspace = true }

[lints]
workspace = true
