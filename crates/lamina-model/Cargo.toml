[package]
name = "lamina-model"
description = "Typed, tolerant views over a PDF's COS graph (pages, outline, Info, name and number trees, page labels) and stable LaminaIds (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[dependencies]
lamina-cos = { workspace = true }
lamina-syntax = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
