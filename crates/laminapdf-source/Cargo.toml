[package]
name = "laminapdf-source"
description = "Edge byte sources for Lamina PDF: a sparse source filled range by range (remote and lazy inputs), the fetch-and-retry loop over `data-pending`, and native file and memory-mapped sources."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
keywords = ["pdf", "range-requests", "streaming", "mmap"]
categories = ["filesystem", "encoding"]

# Read by `cargo xtask`: an edge crate. The sparse source and the retry loop are pure and build
# for wasm32 (laminapdf-wasm uses them); file and mmap sources sit behind `native` and `mmap`.
[package.metadata.laminapdf]
layer = "edge"
wasm = true

[features]
default = []
# Positioned-read file sources (`FileSource`): std::fs, not for wasm32.
native = []
# Memory-mapped files (`MmapSource`, memmap2): opt in; see the SIGBUS note on the type.
mmap = ["native", "dep:memmap2"]

[dependencies]
laminapdf = { workspace = true }
laminapdf-cos = { workspace = true }
memmap2 = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
laminapdf = { path = "../laminapdf", features = ["saslprep"] }
# The spike-era Writer builds the large generated file the byte-count criterion needs.
laminapdf-save = { path = "../laminapdf-save" }

[lints]
workspace = true
