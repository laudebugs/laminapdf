[package]
name = "laminapdf-extract"
description = "Text extraction for retrieval and LLMs (ADR 0030): blocks in reading order with boxes in top-left points, hidden text flagged and dropped (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Reached through the façade (`laminapdf::extract`), so published with it.
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "extraction", "reading-order", "rag"]
categories = ["text-processing"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.docs.rs]
all-features = true

[package.metadata.laminapdf]
layer = "core"

[features]
default = ["reflow"]
# serde derives on the output types (laminapdf.extract/1 names) and the JSON serialiser.
serde = ["dep:serde", "dep:serde_json"]
# JSON Schema derives (schemars) on the output types: tests/json_schema.rs writes and checks
# schemas/extract.schema.json with it. No shipped surface needs it at run time.
schema = ["serde", "dep:schemars"]
# Reader mode (`reflow`): blocks in the structure tree's order with figure crops. On by default, so
# `cargo test -p laminapdf-extract` runs its tests; the workspace dependency turns defaults off, so the
# façade's `reflow` feature decides, and the WASM text module, which builders load, leaves it out
# (ADR 0016 §6).
reflow = []

[dependencies]
laminapdf-content = { workspace = true }
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-syntax = { workspace = true }
laminapdf-text = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
# The test helpers every crate shares, by path only (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
laminapdf-build = { path = "../laminapdf-build", features = ["text"] }
laminapdf-save = { path = "../laminapdf-save", features = ["test-support"] }
boon = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[[test]]
name = "reflow"
required-features = ["reflow"]
