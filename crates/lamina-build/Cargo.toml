[package]
name = "lamina-build"
description = "Generating PDFs: a builder over the COS overlay with pages and boxes, paths, colour (device and ICC), opacity and blend modes, clipping and images (JPEG pass-through, PNG with soft masks, raw RGBA) (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[dependencies]
lamina-cos = { workspace = true }
lamina-model = { workspace = true }
lamina-ops = { workspace = true }
lamina-syntax = { workspace = true }
pdf-writer = { workspace = true }
png = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lamina-content = { workspace = true }
lamina-save = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
