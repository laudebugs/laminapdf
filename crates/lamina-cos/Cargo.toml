[package]
name = "lamina-cos"
description = "PDF file structure (COS): tolerant reader with xref repair and the page tree, plus the writer (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[dependencies]
lamina-syntax = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Builds test inputs with the writer. A dev-dependency cycle Cargo accepts: the integration
# tests link the one library `lamina-save` links; unit tests in `src/` must not use it.
lamina-save = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# Release-mode benchmarks for the nightly lane (`cargo xtask bench`; ADR 0018 tier 11).
[[bench]]
name = "read"
harness = false

[lints]
workspace = true
