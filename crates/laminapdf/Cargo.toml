[package]
name = "laminapdf"
description = "The Lamina PDF façade: one crate for opening, reading, editing (ops, undo), saving and building PDFs, with one error type, jobs and cancellation shaped for the bindings (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
# docs/ is generated (gitignored, so `include` must name it). Release preparation commits it in the
# release tree, and the version PR brings that snapshot to main; `cargo xtask publish crates`
# regenerates it, so a stale or missing snapshot is published as freshly generated.
include = ["src/**", "schemas/**", "examples/**", "tests/**", "benches/**", "docs/**", "README.md"]
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "pdf-generation", "pdf-editing", "document", "wasm"]
categories = ["encoding", "parser-implementations", "text-processing", "wasm"]
# `explain` carries the text of docs/errors/*.md as raw strings (src/generated/explain.rs, generated
# from fixtures/codes.json by `cargo xtask gen codes`), so the published crate needs no outside file.

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[features]
default = ["text", "saslprep"]
# SASLprep for R5/R6 passwords (RFC 4013; laminapdf-syntax's `saslprep`). Left out of the WASM
# base module (ADR 0016 §5).
saslprep = ["laminapdf-cos/saslprep"]
# The builder without text (laminapdf-build: pages, paths, colour, images, links, navigation,
# metadata): the WASM base module's builder (ADR 0016 §4). Without it (and `text`) the crate
# opens, reads, edits and saves documents only.
build = ["dep:laminapdf-build"]
# Text extraction alone (laminapdf-text's extractor: `page_text`, `laminapdf::extract`), without the
# builder: what a reader needs (B9c; ADR 0016 §4 places it by size).
extract = ["dep:laminapdf-text", "dep:laminapdf-extract"]
# Fonts and text on top of the builder (laminapdf-text: shaping, bidi, line breaking, subsetting).
text = ["build", "extract", "laminapdf-build/text"]
# `laminapdf::explain(code)`: every code's explain page (docs/errors/<code>.md, ADR 0026 §6), about
# 80 KB of text. Off by default and in the WASM modules; the CLI turns it on.
explain = []

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-ops = { workspace = true }
laminapdf-save = { workspace = true }
laminapdf-syntax = { workspace = true, features = ["json"] }
laminapdf-text = { workspace = true, optional = true }
laminapdf-extract = { workspace = true, optional = true, features = ["serde"] }
laminapdf-build = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
# Validates serialised errors against the generated laminapdf.error/1 schema (tests/error_contract.rs).
boon = { workspace = true }
# The data-fields test builds one value of every variant of the wrapped crates' errors.
laminapdf-build = { path = "../laminapdf-build", features = ["text"] }
laminapdf-text = { path = "../laminapdf-text" }
serde_json = { workspace = true }
# The report bench checks its bytes against the TS suite's REPORT_SHA256.
criterion = { workspace = true }
sha2 = { workspace = true }

[[example]]
name = "hello"
required-features = ["text"]

[[example]]
name = "element_flow"
required-features = ["text"]

[[example]]
name = "extract_markdown"
required-features = ["extract"]

[[example]]
name = "snapshot_test"
required-features = ["text"]

[[example]]
name = "invoice"
required-features = ["text"]

[[example]]
name = "multilingual"
required-features = ["text"]

[[example]]
name = "images_and_vectors"
required-features = ["text"]

[[example]]
name = "links_and_outlines"
required-features = ["text"]

[[example]]
name = "generate_then_edit"
required-features = ["text"]

[[example]]
name = "pdf_ua_report"
required-features = ["text"]

[[example]]
name = "pdf_a_archive"
required-features = ["text"]

[[example]]
name = "pdf_a3_invoice_with_xml"
required-features = ["text"]

# Not a golden example: lamina's page text for the nightly lane's live text differential
# (`cargo xtask differential --live --text`, todo B9f). Its own folder keeps it out of the
# examples that `cargo xtask examples` and tests/examples.rs discover.
[[example]]
name = "text-facts"
path = "examples/differential/text-facts.rs"
required-features = ["extract"]

# Not a golden example either: lamina's Markdown for the extraction benchmark (`cargo xtask
# extract-bench`, todo L3f), which scores it with the benchmark's own tests.
[[example]]
name = "extract-bench"
path = "examples/differential/extract-bench.rs"
required-features = ["extract"]

[[test]]
name = "examples"
required-features = ["text"]

# Release-mode benchmarks for the nightly lane (`cargo xtask bench`; ADR 0018 tier 11): the
# 100-page text report of pdf-library §4 (todo B5d).
[[bench]]
name = "report"
harness = false
required-features = ["text"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
