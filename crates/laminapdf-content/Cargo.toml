[package]
name = "laminapdf-content"
description = "Read-only content-stream interpreter: tolerant tokenizer, graphics and text state, Form XObjects and marked content, reported to a visitor (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-syntax = { workspace = true }

[dev-dependencies]
laminapdf-save = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
