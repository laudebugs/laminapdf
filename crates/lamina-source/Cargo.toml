[package]
name = "lamina-source"
description = "Edge byte sources for lamina: a sparse source filled range by range (remote and lazy inputs), the fetch-and-retry loop over `data-pending`, and native file and memory-mapped sources."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: an edge crate. The sparse source and the retry loop are pure and build
# for wasm32 (lamina-wasm uses them); file and mmap sources sit behind `native` and `mmap`.
[package.metadata.lamina]
layer = "edge"
wasm = true

[features]
default = []
# Positioned-read file sources (`FileSource`): std::fs, not for wasm32.
native = []
# Memory-mapped files (`MmapSource`, memmap2): opt in; see the SIGBUS note on the type.
mmap = ["native", "dep:memmap2"]

[dependencies]
lamina = { workspace = true }
lamina-cos = { workspace = true }
memmap2 = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
lamina = { workspace = true, features = ["saslprep"] }
# The spike-era Writer builds the large generated file the byte-count criterion needs.
lamina-save = { workspace = true }

[lints]
workspace = true
