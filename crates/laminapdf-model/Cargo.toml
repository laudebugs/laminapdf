[package]
name = "laminapdf-model"
description = "Typed, tolerant views over a PDF's COS graph (pages, outline, Info, name and number trees, page labels) and stable LaminaPdfIds (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "document", "outline", "structure-tree"]
categories = ["parser-implementations"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-syntax = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
# Builds test inputs with the writer. A dev-dependency cycle Cargo accepts; unit tests in `src/`
# see a second copy of this crate through it, so they use only its writer (laminapdf-cos types).
laminapdf-save = { path = "../laminapdf-save" }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
