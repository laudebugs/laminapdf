[package]
name = "laminapdf-model"
description = "Typed views of a PDF document in Rust: pages, outline, document info, page labels, name trees and the structure tree, read tolerantly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "document", "outline", "structure-tree", "parser"]
categories = ["parser-implementations"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[features]
default = ["edit"]
# The write side the page ops build on: the page-tree editor, the name and number tree writers,
# `PageLabels::remap`/`write` and `PageReferences`. Off for the workspace's other crates (their
# dependency turns default features off), so crates that only read compile none of it: its
# callers otherwise change how the shared read path is optimised.
edit = ["navigation"]
# The outline's tree editor (OutlineTree): what the outline and named-destination ops need,
# without the page-tree editor and the reference index, whose code changes how the shared read
# path is inlined. laminapdf-ops turns it on.
navigation = ["tree-write"]
# Only the name and number tree writers, `set_catalog_entry` and `PageLabels::write`/`remap`:
# what `laminapdf-ops`' `SetPageLabels` calls, so the ops (and every WASM module) need neither
# the page-tree editor nor `PageReferences`.
tree-write = []

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-syntax = { workspace = true }
quick-xml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
# Builds test inputs with the writer. A dev-dependency cycle Cargo accepts; unit tests in `src/`
# see a second copy of this crate through it, so they use only its writer (laminapdf-cos types).
laminapdf-save = { path = "../laminapdf-save", features = ["test-support"] }
proptest = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# The write side's tests need its feature (on by default).
[[test]]
name = "page_tree"
required-features = ["edit"]

[[test]]
name = "references"
required-features = ["edit"]

[[test]]
name = "outline_tree"
required-features = ["navigation"]

[[test]]
name = "trees"
required-features = ["edit"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
