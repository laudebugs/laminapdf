[package]
name = "laminapdf-model"
description = "Typed, tolerant views over a PDF's COS graph (pages, outline, Info, name and number trees, page labels) and stable LaminaIds (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-syntax = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Builds test inputs with the writer. A dev-dependency cycle Cargo accepts; unit tests in `src/`
# see a second copy of this crate through it, so they use only its writer (laminapdf-cos types).
laminapdf-save = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
