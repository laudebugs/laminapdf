[package]
name = "lamina"
description = "The lamina façade: one crate for opening, reading, editing (ops, undo), saving and building PDFs, with one error type, jobs and cancellation shaped for the bindings (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The hint table and the docs URL come from fixtures/codes.json (build.rs), so `cargo package`
# would need it inside the crate; nothing is published yet (pdf-library §6).
build = "build.rs"

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[features]
default = ["text"]
# Fonts and the builder (lamina-text, lamina-build: shaping, bidi, line breaking, subsetting).
# Without it the crate opens, reads, edits and saves documents only: the structure-only build
# for WASM splitting. lamina-build depends on lamina-text, so the builder goes with it.
text = ["dep:lamina-text", "dep:lamina-build"]

[dependencies]
lamina-cos = { workspace = true }
lamina-model = { workspace = true }
lamina-ops = { workspace = true }
lamina-save = { workspace = true }
lamina-syntax = { workspace = true }
lamina-text = { workspace = true, optional = true }
lamina-build = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "hello"
required-features = ["text"]

[[example]]
name = "invoice"
required-features = ["text"]

[[example]]
name = "multilingual"
required-features = ["text"]

[[example]]
name = "vectors"
required-features = ["text"]

[[example]]
name = "links_and_outlines"
required-features = ["text"]

[[example]]
name = "generate_then_edit"
required-features = ["text"]

[[test]]
name = "examples"
required-features = ["text"]

[lints]
workspace = true
