[package]
name = "lamina"
description = "The lamina façade: one crate for opening, reading, editing (ops, undo), saving and building PDFs, with one error type, jobs and cancellation shaped for the bindings (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `explain` includes docs/errors/*.md (src/generated/codes.rs, generated from
# fixtures/codes.json by `cargo xtask gen codes`), so `cargo package` would need them inside the
# crate; nothing is published yet (pdf-library §6).

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[features]
default = ["text", "saslprep"]
# SASLprep for R5/R6 passwords (RFC 4013; lamina-syntax's `saslprep`). Left out of the WASM
# base module (ADR 0016 §5).
saslprep = ["lamina-cos/saslprep"]
# The builder without text (lamina-build: pages, paths, colour, images, links, navigation,
# metadata): the WASM base module's builder (ADR 0016 §4). Without it (and `text`) the crate
# opens, reads, edits and saves documents only.
build = ["dep:lamina-build"]
# Text extraction alone (lamina-text's extractor: `page_text`, `lamina::extract`), without the
# builder: what a reader needs (B9c; ADR 0016 §4 places it by size).
extract = ["dep:lamina-text"]
# Fonts and text on top of the builder (lamina-text: shaping, bidi, line breaking, subsetting).
text = ["build", "extract", "lamina-build/text"]
# `lamina::explain(code)`: every code's explain page (docs/errors/<code>.md, ADR 0026 §6), about
# 80 KB of text. Off by default and in the WASM modules; the CLI turns it on.
explain = []

[dependencies]
lamina-cos = { workspace = true }
lamina-model = { workspace = true }
lamina-ops = { workspace = true }
lamina-save = { workspace = true }
lamina-syntax = { workspace = true }
lamina-text = { workspace = true, optional = true }
lamina-build = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Validates serialised errors against the generated lamina.error/1 schema (tests/error_contract.rs).
boon = { workspace = true }
# The data-fields test builds one value of every variant of the wrapped crates' errors.
lamina-build = { workspace = true, features = ["text"] }
lamina-text = { workspace = true }
serde_json = { workspace = true }
# The report bench checks its bytes against the TS suite's REPORT_SHA256.
criterion = { workspace = true }
sha2 = { workspace = true }

[[example]]
name = "hello"
required-features = ["text"]

[[example]]
name = "invoice"
required-features = ["text"]

[[example]]
name = "multilingual"
required-features = ["text"]

[[example]]
name = "vectors"
required-features = ["text"]

[[example]]
name = "links_and_outlines"
required-features = ["text"]

[[example]]
name = "generate_then_edit"
required-features = ["text"]

# Not a golden example: lamina's page text for the nightly lane's live text differential
# (`cargo xtask differential --live --text`, todo B9f). Its own folder keeps it out of the
# examples that `cargo xtask examples` and tests/examples.rs discover.
[[example]]
name = "text-facts"
path = "examples/differential/text-facts.rs"
required-features = ["extract"]

[[test]]
name = "examples"
required-features = ["text"]

# Release-mode benchmarks for the nightly lane (`cargo xtask bench`; ADR 0018 tier 11): the
# 100-page text report of pdf-library §4 (todo B5d).
[[bench]]
name = "report"
harness = false
required-features = ["text"]

[lints]
workspace = true
