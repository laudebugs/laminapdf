[package]
name = "laminapdf-cli"
# Also the Homebrew formula's `desc` (dist): at most 80 characters, no leading article.
description = "Inspect, check, rotate and extract PDFs, with JSON output for scripts and agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io: the binary ships as release archives, Homebrew and npm (todo L4d,
# dist-workspace.toml).
publish = false
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "cli"]
categories = ["command-line-utilities"]

# Read by `cargo xtask`: an app crate, so it may use the file system, stdin and stdout.
[package.metadata.laminapdf]
layer = "app"

# cargo-dist (dist-workspace.toml): this crate's binary is the one dist builds, with the MCP server.
[package.metadata.dist]
dist = true
features = ["mcp"]

[[bin]]
name = "laminapdf"
path = "src/main.rs"
# Its rustdoc would land on the `laminapdf` library's page (same output name); the command
# layer's docs are the library's.
doc = false

[features]
default = []
# `laminapdf mcp`: the commands as tools of an MCP server on stdio (L4c). Off by default, so the
# command layer and the plain CLI never pull in tokio or rmcp; release binaries turn it on (L4d).
mcp = ["dep:rmcp", "dep:tokio"]

[dependencies]
laminapdf = { workspace = true, features = ["extract", "explain", "markdown", "document", "page-checks"] }
# Only for the `laminapdf_build` tool's schema, which inlines `laminapdf.document/1`'s.
laminapdf-build = { workspace = true, features = ["schema"] }
# Only for `laminapdf schema extract`, which embeds `laminapdf.extract/1`'s schema.
laminapdf-extract = { workspace = true, features = ["schema"] }
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anstream = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
indicatif = { workspace = true }
# `laminapdf render`: hayro built in, PDFium bound at run time from LAMINA_PDF_PDFIUM_DIR, PNG out.
laminapdf-render = { workspace = true, features = ["hayro"] }
laminapdf-render-pdfium = { workspace = true }
png = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# A name of its own: laminapdf-build, -cli, -save and -text each have an `examples/golden.rs`, and
# four examples called `golden` would all link to `target/debug/examples/golden(.exe)`, which
# collides on Windows when two link at once (LNK1104).
[[example]]
name = "golden-cli"
path = "examples/golden.rs"

[dev-dependencies]
# The test helpers every crate shares, by path only (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
boon = { workspace = true }
proptest = { workspace = true }
# tests/mcp.rs builds its injection fixture with the builder (path only: never published).
laminapdf = { path = "../laminapdf", features = ["text"] }
# tests/mcp.rs talks to `laminapdf mcp` through rmcp's own client.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
