[package]
name = "lamina-syntax"
description = "PDF syntax layer: object model, serialization, lexer, parser and stream filters (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[lints]
workspace = true

[dependencies]
aes = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
stringprep = { workspace = true }
miniz_oxide = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Reads fixtures/codes.json in the kind test.
serde_json = { workspace = true }
