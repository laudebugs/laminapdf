[package]
name = "laminapdf-render"
description = "Render PDF pages to RGBA pixel tiles in Rust behind one renderer interface, with limits on output size, cancellation, and a pure-Rust backend (hayro) behind a feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "render", "rendering", "raster", "pdf-renderer"]
categories = ["rendering", "graphics"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds). The PDFium
# adapter needs FFI and dynamic loading, so it is the separate edge crate laminapdf-render-pdfium.
[package.metadata.laminapdf]
layer = "core"

[features]
# The pure-Rust renderer (hayro 0.8, MIT OR Apache-2.0): ADR 0004's CI oracle and debug choice.
# Off by default, so crates that only need the trait don't compile it.
hayro = ["dep:hayro"]
# Page export to PNG, JPEG and TIFF (`export_pages`, todo E3h). Off by default, so the web
# reader's renderer doesn't carry the encoders: the browser encodes PNG and JPEG there.
export = ["dep:png", "dep:jpeg-encoder", "dep:tiff"]

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-syntax = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
hayro = { workspace = true, optional = true }
png = { workspace = true, optional = true }
jpeg-encoder = { workspace = true, optional = true }
tiff = { workspace = true, optional = true }

[dev-dependencies]
# The test helpers every crate shares, by path only (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
boon = { workspace = true }
# Decoding what `export_pages` wrote, in tests/export.rs.
png = { workspace = true }
tiff = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
