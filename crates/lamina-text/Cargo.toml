[package]
name = "lamina-text"
description = "Fonts for generated PDFs: loading (skrifa), glyph usage, subsetting (subsetter) and Type 0 embedding with /W and ToUnicode (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[dependencies]
lamina-cos = { workspace = true }
sha2 = { workspace = true }
skrifa = { workspace = true }
subsetter = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lamina-save = { workspace = true }
pdf-writer = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
