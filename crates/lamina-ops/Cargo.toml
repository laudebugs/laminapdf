[package]
name = "lamina-ops"
description = "Typed, serialisable editing ops over the COS overlay: transactions with savepoints, undo and redo (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.lamina]
layer = "core"

[features]
# TypeScript declarations for the op types via tsify (ADR 0002); enabled by lamina-wasm (B6a).
tsify = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
lamina-cos = { workspace = true }
lamina-model = { workspace = true }
lamina-syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
