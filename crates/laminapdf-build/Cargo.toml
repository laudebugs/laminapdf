[package]
name = "laminapdf-build"
description = "Generate PDFs in Rust: pages, vector paths, colour, images, shaped text, links, outlines, metadata, tagged PDF and PDF/UA and PDF/A output. Most programs use it through the laminapdf crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "pdf-generation", "tagged-pdf", "pdf-a", "pdf-ua"]
categories = ["encoding", "graphics"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[features]
default = ["text"]
# Fonts, text runs and text boxes (laminapdf-text: skrifa, subsetter, HarfRust, ICU4X, the standard
# 14). Without it: pages, paths, colour, images, links, navigation and metadata, the base of the
# WASM split (ADR 0016 §4).
text = ["dep:laminapdf-text"]
# Markdown in, flowing pages out (ADR 0032 §6): `Builder::markdown` over pulldown-cmark.
markdown = ["text", "dep:pulldown-cmark"]
# JSON documents in, flowing pages out (ADR 0032 §6): `laminapdf.document/1`, its templates
# (`flow::document::fill`) and `Builder::document`.
serde = ["text", "dep:serde", "dep:serde_json", "dep:serde_path_to_error"]
# The document format's JSON Schema (schemars): tests/document_schema.rs writes and checks
# schemas/document.schema.json.
schema = ["serde", "dep:schemars"]

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-ops = { workspace = true }
laminapdf-syntax = { workspace = true }
laminapdf-text = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_path_to_error = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
pdf-writer = { workspace = true }
# zlib for PNG image data (surface/png/decode.rs; the same copy laminapdf-syntax's Flate uses).
miniz_oxide = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
# Writes the PNGs the image tests read, and is the reference decoder surface/png/ is compared with.
png = { workspace = true }
laminapdf-content = { path = "../laminapdf-content" }
laminapdf-save = { path = "../laminapdf-save", features = ["test-support"] }
serde_json = { workspace = true }
proptest = { workspace = true }
# Validates the fixture documents against the committed schema (tests/document_schema.rs).
boon = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
