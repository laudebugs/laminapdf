[package]
name = "laminapdf-tiff-wasm"
description = "wasm-bindgen bindings of laminapdf-render's TIFF writer: the module lamina_pdf_tiff, built by `cargo xtask wasm` into @laminapdf/wasm, which the web reader's document worker loads when a TIFF export starts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Edge: JS bindings.
[package.metadata.laminapdf]
layer = "edge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
laminapdf-render = { workspace = true, features = ["tiff"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true, features = ["std"] }

[lints]
workspace = true
