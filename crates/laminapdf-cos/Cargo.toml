[package]
name = "laminapdf-cos"
description = "PDF file structure (COS): tolerant reader with xref repair and the page tree, plus the writer (pure, bytes in / bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "parser", "xref", "document"]
categories = ["parser-implementations", "encoding"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[features]
default = ["saslprep"]
# SASLprep for R5/R6 passwords (laminapdf-syntax's `saslprep`).
saslprep = ["laminapdf-syntax/saslprep"]

[dependencies]
laminapdf-syntax = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Workspace crates by path only, without a version: `cargo publish` drops such dev-dependencies,
# so the tests' cycles (laminapdf-save depends on this crate) never reach crates.io.
# The test helpers every crate shares (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
criterion = { workspace = true }
# Builds test inputs with the writer. A dev-dependency cycle Cargo accepts: the integration
# tests link the one library `laminapdf-save` links; unit tests in `src/` must not use it.
laminapdf-save = { path = "../laminapdf-save" }
serde_json = { workspace = true }
sha2 = { workspace = true }

# Release-mode benchmarks for the nightly lane (`cargo xtask bench`; ADR 0018 tier 11).
[[bench]]
name = "read"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
