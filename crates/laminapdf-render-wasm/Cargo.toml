[package]
name = "laminapdf-render-wasm"
description = "wasm-bindgen bindings of laminapdf-render's hayro adapter (ADR 0004 §5): one module, lamina_pdf_render_hayro, built by `cargo xtask wasm` into @laminapdf/wasm and wrapped by @laminapdf/render-hayro."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Edge: JS bindings.
[package.metadata.laminapdf]
layer = "edge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
laminapdf-render = { workspace = true, features = ["hayro"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true, features = ["std"] }

[lints]
workspace = true
