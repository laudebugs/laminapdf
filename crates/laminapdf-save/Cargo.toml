[package]
name = "laminapdf-save"
description = "Save edited PDFs in Rust: an incremental update appended after the original bytes, or a full rewrite, chosen by a planner that checks the document's signatures and permissions first."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords = ["pdf", "incremental-save", "writer", "signatures", "pdf-editing"]
categories = ["encoding"]

# Read by `cargo xtask`: core crates get the portability checks (no I/O, clocks or threads;
# no runtime/binding dependencies; #![forbid(unsafe_code)]; wasm32/iOS/Android builds).
[package.metadata.laminapdf]
layer = "core"

[features]
# The spike-era `Writer` and `incremental_update` as `laminapdf_save::test_support`, for the
# workspace's tests and doc examples: not part of the product API.
test-support = []

[dependencies]
laminapdf-cos = { workspace = true }
laminapdf-model = { workspace = true }
laminapdf-ops = { workspace = true }
laminapdf-syntax = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# A name of its own: laminapdf-build, -cli, -save and -text each have an `examples/golden.rs`, and
# four examples called `golden` would all link to `target/debug/examples/golden(.exe)`, which
# collides on Windows when two link at once (LNK1104).
[[example]]
name = "golden-save"
path = "examples/golden.rs"

[dev-dependencies]
# This crate's own tests use `test_support` (Cargo allows the self-dependency for tests).
laminapdf-save = { path = ".", features = ["test-support"] }
# The test helpers every crate shares, by path only so `cargo publish` drops it
# (code-organization.md §6).
laminapdf-test-fixtures = { path = "../laminapdf-test-fixtures" }
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

# Release-mode save benchmarks for the nightly lane (`cargo xtask bench`; ADR 0018 tier 11).
[[bench]]
name = "save"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature, as `cargo xtask check rust` documents it (docs.rs uses the default ones otherwise).
all-features = true
