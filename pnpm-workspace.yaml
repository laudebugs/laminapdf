# One pnpm workspace for the repo (docs/guidelines/code-organization.md §1).
# spikes/ is deliberately not matched: spikes keep their own lockfiles and are never imported.
packages:
  - packages/*
  - apps/*

# Run package scripts through pnpm's cross-platform shell, so `VAR=1 astro build` and `&&` work
# on Windows too, where scripts would otherwise run in cmd.exe (todo X6).
shellEmulator: true

# Install scripts that may run. esbuild's postinstall only re-checks the platform binary that
# its optional dependency already installed, so it stays off; so do deno's (its bin.cjs runs the
# binary of its optional dependency) and workerd's (wrangler finds the binary itself). bun's
# `bin/bun` is a placeholder its postinstall replaces with the binary of its optional dependency.
allowBuilds:
  bun: true
  deno: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  workerd: false

# Shared third-party versions; packages depend on them with "catalog:" (typescript.md).
catalog:
  # The public API report of @laminapdf/sdk, compared with the published version's in
  # `cargo xtask semver` (todo P3). MIT; it bundles its own TypeScript 5.9 (Apache-2.0), apart
  # from the workspace's; its argparse 1.0 is Python-2.0, as the docs site's 2.0 is. Dev-only.
  # Pinned to a release at least two weeks old when added.
  "@microsoft/api-extractor": 7.60.1
  "@arethetypeswrong/cli": 0.18.5
  "@biomejs/biome": 2.6.5
  # Versioning (ADR 0017): the npm half of the lockstep version; `cargo xtask version sync` does
  # the crates. Dev-only, MIT (its @changesets/*, @manypkg/*, cac, semver, tinyexec: MIT/ISC).
  "@changesets/cli": 3.0.3
  "@types/node": 26.6.6
  # @laminapdf/ui's demo page, built with the React Compiler through Babel (C4f): the compiler and
  # its check of the chrome's components. Dev-only, MIT (@babel/* and their dependencies: MIT).
  # Each pinned to a release at least two weeks old when added.
  "@babel/core": 7.29.7
  "@rolldown/plugin-babel": 0.3.0
  "@types/babel__core": 7.20.5
  "@vitejs/plugin-react": 6.2.1
  babel-plugin-react-compiler: 1.0.0
  # @laminapdf/icons' React entry (an optional peer) and its browser tests; React 19 per ADR 0009.
  # MIT. Each pinned to a release at least two weeks old when added.
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/browser-playwright": 5.1.0
  # JSON Schema 2020-12 validation of LaminaPdfError.toJSON() against laminapdf.error/1 (tests only).
  # MIT (fast-deep-equal, json-schema-traverse, require-from-string: MIT; fast-uri: BSD-3-Clause)
  ajv: 8.20.0
  # Accessibility checks in browser tests (@laminapdf/icons' gallery). MPL-2.0, dev-only: never
  # shipped (ADR 0019).
  axe-core: 4.14.0
  # The gallery's screenshot and axe tests (apps/gallery, todo U6f). Dev-only: @playwright/test is
  # Apache-2.0 and matches `playwright` below; @axe-core/playwright is MPL-2.0 and matches axe-core.
  "@axe-core/playwright": 4.14.0
  # Lighthouse CI for the reader's release gate (apps/web/lighthouserc.json, todo C7c). Apache-2.0,
  # as is lighthouse itself; dev-only. Pinned to a release at least two weeks old when added.
  "@lhci/cli": 0.16.0
  "@playwright/test": 1.64.1
  bun: 1.4.4
  # The desktop reader's shell (ADR 0008): the same minor as the tauri crate (2.12). MIT OR
  # Apache-2.0. Each pinned to a release at least two weeks old when added.
  "@tauri-apps/api": 2.12.4
  "@tauri-apps/cli": 2.12.4
  # The desktop reader's end-to-end tests (D2e): WebdriverIO with the Tauri service and its
  # frontend plugin, pinned to the WebdriverIO versions @wdio/tauri-service 1.5.1 depends on, so
  # one copy is installed. MIT. Dev-only; the plugin is bundled only into e2e builds.
  "@wdio/cli": 9.31.9
  "@wdio/globals": 9.31.3
  "@wdio/local-runner": 9.31.9
  "@wdio/mocha-framework": 9.31.9
  "@wdio/spec-reporter": 9.31.2
  "@wdio/tauri-plugin": 1.5.1
  "@wdio/tauri-service": 1.5.1
  webdriverio: 9.31.9
  deno: 2.9.6
  # Maintainability checks in `cargo xtask check ts` (Q2u): import cycles and cross-package
  # imports, duplicated blocks, unused exports and files. Dev-only. dependency-cruiser and jscpd:
  # MIT; knip: ISC. Each pinned to a release at least two weeks old when added.
  dependency-cruiser: 18.7.2
  esbuild: 0.28.2
  jscpd: 5.4.2
  knip: 6.44.1
  playwright: 1.64.1
  # pdf.js, which the reader's save e2e tests reopen saved files with (todo E1f), at the version the
  # round-trip and differential tools pin. Apache-2.0. Dev-only.
  pdfjs-dist: 6.5.438
  publint: 0.3.25
  # @laminapdf/ui's accessible primitives (ADR 0009: React Aria Components). Apache-2.0, as are its
  # @react-aria/* and @internationalized/* packages. Pinned to a release at least two weeks old.
  react-aria-components: 1.22.1
  react: 19.3.1
  react-dom: 19.3.1
  # The website's code colouring at build time. MIT. The release Astro itself depends on, so one copy
  # installs.
  shiki: 4.6.0
  typescript: 7.0.2
  vite: 8.3.6
  vitest: 5.1.0
  wrangler: 4.158.0

# Named catalogs: versions one package needs apart from the default catalog's.
catalogs:
  typedoc:
    # apps/docs: TypeDoc 0.28 runs on the TypeScript compiler API, which TypeScript 7 (the
    # native compiler above) no longer has; its peer range ends at 6.0. Only the docs site's
    # API reference and typecheck use it. dependency-cruiser's `packageExtensions` pin below
    # names the same version: change both together.
    typescript: 6.0.3

# Fail installs on the wrong Node version instead of warning.
engineStrict: true

# dependency-cruiser parses TypeScript with the compiler API, which TypeScript 7 (the native
# compiler) no longer has: it gets TypeScript 6. Keep the version equal to `catalogs.typedoc`'s.
packageExtensions:
  dependency-cruiser@18.6.0:
    dependencies:
      typescript: 6.0.3
