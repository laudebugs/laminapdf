# Allowlist for `cargo xtask docs-links --external`, the nightly external link check (todo X3c).
# URLs starting with a `prefix` are listed in the report but not fetched: hosts that refuse
# automated requests (bot walls, logins, aggressive rate limits) even though the page exists.
# Every entry needs a `reason`. The check warns about entries that no longer match any link.
#
# [[allow]]
# prefix = "https://example.com/"
# reason = "answers 403 to non-browser clients"

[[allow]]
prefix = "https://github.com/laudebugs/laminapdf/"
reason = "the repository is private: its PRs, issues and runs answer 404 without a login"

[[allow]]
prefix = "https://github.com/laudebugs/lamina/"
reason = "the repository's name before the 2026-11-01 rename, still in older links; like the new name, it answers 404 without a login (GitHub redirects it)"

[[allow]]
prefix = "https://app.semanticdiff.com/"
reason = "answers 429 to automated clients (rate limit or bot protection)"

[[allow]]
prefix = "https://business.adobe.com/"
reason = "stalls non-browser clients until they time out, over HTTP/1.1 and HTTP/2 (bot protection)"

[[allow]]
prefix = "https://cacm.acm.org/research/the-semantic-reader-project"
reason = "answers 403 to automated clients from some networks (Cloudflare bot protection); it failed the 2026-11-02 nightly and answered 200 when re-checked that day. The prefix is the whole page URL, so the host's other links stay checked"

