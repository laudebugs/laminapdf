# The desktop update's end-to-end test (todo D5c; ADR 0014): an installed Lamina PDF 0.0.1 refuses
# a tampered 0.0.2 and then updates itself to the real one from the update Worker's `staging`
# channel, on macOS, Windows and Linux (AppImage). apps/desktop/e2e/update/update-test.ts runs it.
#
# Two modes:
# - `local`, on pull requests (forks included): the Worker runs on the runner under `wrangler dev`
#   with local R2. These jobs name no secret and no environment (a workflows.rs test holds that).
# - `staging`, on pushes to main, every night and by hand, never on a pull request: the deployed
#   staging Worker and the `lamina-pdf-staging` bucket, in the `desktop-staging` environment
#   (deployment branches: main) with CLOUDFLARE_STAGING_R2_TOKEN, which writes that bucket only,
#   and its STAGING_R2_ACCESS_KEY_ID: a bucket-scoped token writes through R2's S3 API only.
#   No job gets a token for `lamina-pdf-releases`. The legs run one at a time, since each writes
#   the channel's one manifest.
#
# Both versions are built here with a throwaway updater key ($/.github/actions/desktop-update-builds),
# so no signing secret is stored. Actions are locked by .github/workflows/actions.lock (ADR 0019).
name: Desktop update e2e

on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/e2e/update/**
      - apps/updates/**
      - crates/laminapdf-desktop-os/**
      - Cargo.lock
      - .github/actions/desktop-update-builds/**
      - .github/workflows/desktop-update-e2e.yml
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/e2e/update/**
      - apps/updates/**
      - crates/laminapdf-desktop-os/**
      - Cargo.lock
      - .github/actions/desktop-update-builds/**
      - .github/workflows/desktop-update-e2e.yml
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A PR's newer push cancels its older run. Staging runs share `desktop-staging-channel` with the
  # desktop release workflow's signed trial runs, which write the same channels/staging.json, so
  # they queue rather than overlap (GitHub keeps one pending run per group: a newer one replaces it).
  group: ${{ github.event_name == 'pull_request' && format('desktop-update-e2e-{0}', github.event.pull_request.number) || 'desktop-staging-channel' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  local:
    name: Update e2e, local (${{ matrix.os }})
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04 }
          - { os: macos, runner: macos-15 }
          - { os: windows, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-shared-key: desktop-update-e2e
          cache-bin: false
      - name: Set up Node and pnpm
        uses: $/.github/actions/node-pnpm
      - name: Install WebKitGTK (Linux only)
        uses: $/.github/actions/linux-webkit
      - name: Install wasm-bindgen
        uses: $/.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build the packages the frontend imports
        run: cargo xtask desktop-frontend
      - name: Build the old and new apps with a throwaway updater key
        id: builds
        uses: $/.github/actions/desktop-update-builds
      - name: Run the update test on local R2
        # Its own limit, under the job's, so a hang still uploads the app's logs.
        timeout-minutes: 25
        env:
          UPDATE_TEST_MODE: local
          UPDATE_TEST_OLD: ${{ steps.builds.outputs.old }}
          UPDATE_TEST_NEW: ${{ steps.builds.outputs.new }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
              node apps/desktop/e2e/update/update-test.ts
          else
            node apps/desktop/e2e/update/update-test.ts
          fi
      - name: Upload the app's reports and logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-update-e2e-local-${{ matrix.os }}
          path: target/desktop-update-e2e/
          if-no-files-found: ignore

  staging:
    name: Update e2e, staging (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' && github.repository == 'laudebugs/laminapdf' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    environment: desktop-staging
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04 }
          - { os: macos, runner: macos-15 }
          - { os: windows, runner: windows-2025 }
    steps:
      # Until the owner creates the environment's secret, the run says so and passes.
      - name: Check the staging token is set
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_STAGING_R2_TOKEN }}
          KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KEY_ID" ]; then
            echo "::notice::desktop-staging lacks CLOUDFLARE_STAGING_R2_TOKEN or STAGING_R2_ACCESS_KEY_ID; skipping the staging update test (apps/updates/README.md)"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.set == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.set == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-shared-key: desktop-update-e2e
          cache-bin: false
      - name: Set up Node and pnpm
        if: steps.token.outputs.set == 'true'
        uses: $/.github/actions/node-pnpm
      - name: Install WebKitGTK (Linux only)
        if: steps.token.outputs.set == 'true'
        uses: $/.github/actions/linux-webkit
      - name: Install wasm-bindgen
        if: steps.token.outputs.set == 'true'
        uses: $/.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build the packages the frontend imports
        if: steps.token.outputs.set == 'true'
        run: cargo xtask desktop-frontend
      - name: Build the old and new apps with a throwaway updater key
        id: builds
        if: steps.token.outputs.set == 'true'
        uses: $/.github/actions/desktop-update-builds
      - name: Run the update test on the staging Worker
        if: steps.token.outputs.set == 'true'
        timeout-minutes: 25
        env:
          UPDATE_TEST_MODE: staging
          UPDATE_TEST_OLD: ${{ steps.builds.outputs.old }}
          UPDATE_TEST_NEW: ${{ steps.builds.outputs.new }}
          # R2's S3 API with the bucket's token (apps/updates/scripts/r2.ts names them).
          CLOUDFLARE_STAGING_R2_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_R2_TOKEN }}
          STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
              node apps/desktop/e2e/update/update-test.ts
          else
            node apps/desktop/e2e/update/update-test.ts
          fi
      - name: Upload the app's reports and logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-update-e2e-staging-${{ matrix.os }}
          path: target/desktop-update-e2e/
          if-no-files-found: ignore
