# TEMPORARY (D2a): the desktop app built, launched and photographed on each OS's hosted runner,
# for the PR's screenshots. Deleted before merge.
name: Desktop screenshots (temporary)

on:
  push:
    branches: [feat/d2a-desktop-scaffold]
    paths: [".github/workflows/desktop-screens.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-screens
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  screens:
    name: Screenshot (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04 }
          - { os: windows, runner: windows-2025 }
          - { os: macos, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-save-if: false
          cache-shared-key: desktop
          cache-bin: false
      - uses: ./.github/actions/node-pnpm
      - uses: ./.github/actions/linux-webkit
      - run: pnpm --filter "@laminapdf/desktop^..." run build
      - run: pnpm --filter @laminapdf/desktop tauri build --debug --no-bundle
      - name: Launch and photograph (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb x11-apps imagemagick
          mkdir -p shots
          for mode in default compositing-off; do
            extra=""
            if [ "$mode" = compositing-off ]; then extra="WEBKIT_DISABLE_COMPOSITING_MODE=1"; fi
            xvfb-run -a -s "-screen 0 1280x900x24" bash -c "
              env WEBKIT_DISABLE_DMABUF_RENDERER=1 $extra ./target/debug/laminapdf-desktop > shots/linux-$mode.log 2>&1 &
              sleep 25
              import -window root shots/linux-$mode.png || true
              xwd -root -silent | convert xwd:- shots/linux-$mode-xwd.png || true
              kill %1 || true
            "
          done
          cat shots/*.log
      - name: Launch and photograph (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $app = Start-Process -FilePath target/debug/laminapdf-desktop.exe -PassThru -RedirectStandardOutput shots/windows.log -RedirectStandardError shots/windows-err.log
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("shots/windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $app.Id -Force
          Get-Content shots/windows.log, shots/windows-err.log
      - name: Launch and photograph (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p shots
          ./target/debug/laminapdf-desktop > shots/macos.log 2>&1 &
          sleep 25
          screencapture -x shots/macos.png || true
          kill %1 || true
          cat shots/macos.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots/
