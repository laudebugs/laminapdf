# The desktop update Worker's deploys (ADR 0014; apps/updates/README.md).
# Pushes to main that touch the Worker (and manual runs on main): `staging` checks it, deploys
# staging-updates.laminapdf.com (wrangler.jsonc's env.staging) and smoke-tests it; then `production`
# deploys updates.laminapdf.com in its own `updates-production` environment (not the reader's
# `production`, which may gain reviewers or a tag rule of its own; GitHub creates it on first use), smoke-tests it, and rolls back to
# the previous deployment when the smoke test fails. Pull requests get the Worker's typecheck and
# tests from the fast lane's `cargo xtask check ts`, so nothing here runs on them.
# Production deploys from main without the reader's tag gate: the Worker holds no release data, so a
# deploy changes how manifests are read, never what users are offered. That comes from the manifests
# in R2 (apps/updates/scripts/manifest.ts). Without the Cloudflare secrets the deploy steps skip
# with a notice and the jobs pass (.github/actions/cloudflare-secrets).
# Actions are locked by .github/workflows/actions.lock (ADR 0019, todo X11): `uses:` names a release
# tag, and `gh actions-lock` rewrites the lockfile after a `uses:` line changes; Dependabot bumps both.
name: Update Worker

on:
  push:
    branches: [main]
    paths:
      - apps/updates/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/updates-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates-deploy
  cancel-in-progress: false

env:
  # Wrangler's usage metrics off (ADR 0011: no telemetry).
  WRANGLER_SEND_METRICS: "false"

jobs:
  staging:
    name: Update Worker staging
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.secrets.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: secrets
        uses: $/.github/actions/cloudflare-secrets
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          setup: apps/updates/README.md
      - if: steps.secrets.outputs.enabled == 'true'
        uses: $/.github/actions/node-pnpm
      - name: Check the Worker
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          pnpm --filter @laminapdf/updates run typecheck
          pnpm --filter @laminapdf/updates run test
      - name: Deploy staging
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: apps/updates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --env staging --message "main at $SHA"
      - name: Smoke-test staging
        if: steps.secrets.outputs.enabled == 'true'
        run: apps/updates/scripts/smoke.sh https://staging-updates.laminapdf.com

  production:
    name: Update Worker production
    needs: staging
    if: ${{ needs.staging.outputs.deployed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: updates-production
    env:
      URL: https://updates.laminapdf.com
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The secrets are checked again here, since an environment can hold its own: without them the
      # job skips with a notice, as staging does.
      - id: secrets
        uses: $/.github/actions/cloudflare-secrets
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          setup: apps/updates/README.md
      - if: steps.secrets.outputs.enabled == 'true'
        uses: $/.github/actions/node-pnpm
      - name: Deploy production
        id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: apps/updates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --env="" --message "main at $SHA"
      - name: Smoke-test production
        id: smoke
        if: steps.deploy.outcome == 'success'
        run: |
          apps/updates/scripts/smoke.sh "$URL"
          echo "Update Worker: $URL at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      # Whenever the deploy went out and its smoke test didn't pass. The job still fails. The first
      # deploy has no deployment to go back to, so its rollback fails too.
      - name: Roll back a deploy that didn't pass its smoke test
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        working-directory: apps/updates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          pnpm exec wrangler rollback --env="" --yes --message "main at $SHA didn't pass its smoke test"
          echo "::error::main at $SHA didn't pass its smoke test on $URL and was rolled back to the previous deployment"
          exit 1
