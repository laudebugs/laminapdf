# The desktop update Worker's deploys (todo D5a; ADR 0014; apps/updates/README.md).
# Pushes to main that touch the Worker (and manual runs on main): check it, deploy staging
# (staging-updates.laminapdf.com, wrangler.jsonc's env.staging), smoke-test it, then deploy
# production (updates.laminapdf.com) and smoke-test that. Pull requests get the Worker's typecheck
# and tests from the fast lane's `cargo xtask check ts`, so nothing here runs on them.
# The Worker only reads R2: releasing is writing manifests (apps/updates/scripts/manifest.ts), not a
# deploy. Without the Cloudflare secrets the deploy steps skip with a notice and the job passes.
name: Update Worker

on:
  push:
    branches: [main]
    paths:
      - apps/updates/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/updates-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Update Worker (staging, then production)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: secrets
        uses: ./.github/actions/cloudflare-secrets
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          setup: apps/updates/README.md
      - if: steps.secrets.outputs.enabled == 'true'
        uses: ./.github/actions/node-pnpm
      - name: Check the Worker
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          pnpm --filter @laminapdf/updates run typecheck
          pnpm --filter @laminapdf/updates run test
      - name: Deploy staging
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: apps/updates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --env staging --message "main at $SHA"
      - name: Smoke-test staging
        if: steps.secrets.outputs.enabled == 'true'
        run: apps/updates/scripts/smoke.sh https://staging-updates.laminapdf.com
      - name: Deploy production
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: apps/updates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --message "main at $SHA"
      - name: Smoke-test production
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          apps/updates/scripts/smoke.sh https://updates.laminapdf.com
          echo "Update Worker: https://updates.laminapdf.com and https://staging-updates.laminapdf.com at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
