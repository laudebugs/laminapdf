# Docs site deploys (todo B7a): apps/docs on Cloudflare Workers static assets (apps/docs/wrangler.toml).
#
# Pull requests that touch the site or anything it is built from (paths below):
# - `preview-build` builds the PR's site with no secrets and uploads dist/ as an artifact.
# - `preview-deploy` holds the Cloudflare secrets and never checks out or runs the PR's code: it
#   takes wrangler.toml and the Wrangler version from the default branch, installs that exact
#   Wrangler into a fresh npm cache, uploads the artifact as a preview version under the alias
#   pr-<number> and comments its URL on the PR (one comment, updated on every push).
# Pushes to main (and manual runs on main) build and deploy production in one job (`production`):
# main is trusted. Production is https://docs.laminapdf.com (the custom domain route in wrangler.toml).
#
# Fork PRs are skipped (they must never run on self-hosted runners or see the secrets). Without
# the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the deploy steps are skipped with a
# notice and the jobs pass. The fast lane checks the build on every PR anyway (`cargo xtask check
# ts`). Nothing a PR controls is interpolated into a script: values reach `run:` through `env:`.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Docs site

on:
  pull_request:
    paths: &inputs
      - apps/docs/**
      - packages/pdf/**
      - packages/wasm/package.json
      - crates/lamina/examples/**
      - fixtures/golden/examples/**
      - fixtures/codes.json
      - fixtures/codes.schema.json
      - docs/errors/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .nvmrc
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR previews are cancelled; production deploys run one after another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wrangler's usage metrics off (ADR 0011: no telemetry), Astro's too.
  WRANGLER_SEND_METRICS: "false"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  preview-build:
    name: Docs preview (build)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per-job install dir: the default (~/setup-pnpm) is shared by every self-hosted
          # runner on the same machine, and concurrent jobs delete each other's pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lamina/docs build
      # Previews are never indexed (ADR 0011 §1's rule for non-production builds).
      - name: Mark the preview noindex
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> apps/docs/dist/_headers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview-dist
          path: apps/docs/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview-deploy:
    name: Docs preview (deploy)
    needs: preview-build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
      # The preview comment.
      pull-requests: write
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Docs deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The owner needs to add them (see apps/docs/README.md) to deploy the docs site; until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # The default branch's deploy configuration, never the PR's. It goes in its own folder:
      # a sparse checkout of the job's workspace would leave the runner's shared checkout
      # sparse, and the next job on this runner would fail to check out.
      - name: Check out the default branch's deploy configuration
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .docs-base
          persist-credentials: false
          sparse-checkout: |
            apps/docs/wrangler.toml
            pnpm-workspace.yaml
            .nvmrc
          sparse-checkout-cone-mode: false
      - name: Read the Wrangler version
        id: tooling
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: .docs-base
        run: |
          if [ ! -f apps/docs/wrangler.toml ]; then
            echo "::notice title=Docs preview skipped::The default branch has no apps/docs/wrangler.toml yet (the PR that adds the site); previews start once it is on main."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^  wrangler: \([0-9][0-9.]*\)$/\1/p' pnpm-workspace.yaml)
          if [ -z "$version" ]; then
            echo "::error file=pnpm-workspace.yaml::no exact wrangler version in the default catalog"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.tooling.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .docs-base/.nvmrc
      - name: Download the preview build
        if: steps.tooling.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview-dist
          path: .docs-base/apps/docs/dist/
      - name: Upload a preview version
        id: preview
        if: steps.tooling.outputs.ready == 'true'
        working-directory: .docs-base/apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_VERSION: ${{ steps.tooling.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          # A fresh npm cache: nothing an earlier job left on this runner is reused.
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          rm -rf "$npm_config_cache" "$WRANGLER_OUTPUT_FILE_PATH"
          npx --yes "wrangler@$WRANGLER_VERSION" versions upload --preview-alias "pr-$PR" --message "PR #$PR at $SHA"
          url=$(node -e '
            const lines = require("node:fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            const upload = lines.map((l) => JSON.parse(l)).filter((e) => e.type === "version-upload").at(-1);
            process.stdout.write(upload?.preview_alias_url ?? upload?.preview_url ?? "");
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL (is preview_urls on for the lamina-docs Worker?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          marker="<!-- lamina-docs-preview -->"
          body=$(printf '%s\n**Docs preview:** %s\n\nBuilt from %s. Updated on every push to this PR.' "$marker" "$URL" "$SHA")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      - name: Remove the deploy configuration checkout
        if: always()
        run: rm -rf .docs-base

  production:
    name: Docs production
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Docs deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The owner needs to add them (see apps/docs/README.md) to deploy the docs site; until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.enabled == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the site
        if: steps.secrets.outputs.enabled == 'true'
        run: pnpm --filter @lamina/docs build
      - name: Deploy production
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --message "main at $SHA"
