# Docs site deploys (todos B7a, P4): apps/docs on Cloudflare Workers static assets (apps/docs/wrangler.toml).
#
# Pull requests that touch the site or anything it is built from (paths below):
# - `preview-build` builds the PR's site with no secrets and uploads dist/ as an artifact.
# - `preview-deploy` holds the Cloudflare secrets and never checks out or runs the PR's code: it
#   takes wrangler.toml and the Wrangler version from the default branch, installs that exact
#   Wrangler into a fresh npm cache, uploads the artifact as a preview version under the alias
#   pr-<number> and comments its URL on the PR (one comment, updated on every push).
# Pushes to main (and manual runs on main without a tag) build main as the next docs and deploy them
# in one job (`next`) to https://next.docs.laminapdf.com, the Worker lamina-pdf-docs-next
# (wrangler.toml's [env.next]): every page says it describes unreleased changes, and every response
# is noindex. https://docs.laminapdf.com shows the latest release only (ADR 0017 §7, ADR 0011 §1):
# `production` builds a v<version> tag with LAMINA_PDF_ENV=production, the one build that names its
# version and may be indexed, and deploys it. The release lane calls it once the packages are
# published (workflow_call with `tag`); a manual run with `tag` redeploys a release by hand. Every
# other build, previews included, marks itself noindex (apps/docs/plugins/release.mjs). main and
# release tags are trusted. With `dry-run`, next and production build and check the site and deploy
# nothing (`wrangler deploy --dry-run`, which needs no secrets): the release lane's dry runs use it.
#
# Fork deploy previews are skipped because they cannot receive deployment secrets. Without
# the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the deploy steps are skipped with a
# notice and the jobs pass. The fast lane checks the build on every PR anyway (`cargo xtask check
# ts`). Nothing a PR controls is interpolated into a script: values reach `run:` through `env:`.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Docs site

on:
  pull_request:
    paths: &inputs
      - apps/docs/**
      - packages/sdk/**
      - packages/tokens/**
      - packages/fonts/**
      - packages/site-kit/**
      # The website's pages: the shared header links to each one once it exists.
      - apps/site/src/pages/**
      - packages/wasm/package.json
      - crates/laminapdf/examples/**
      - fixtures/golden/examples/**
      - fixtures/codes.json
      - fixtures/codes.schema.json
      - docs/errors/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .nvmrc
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag (v<version>) to deploy to docs.laminapdf.com. Empty: deploy main to next.docs.laminapdf.com."
        required: false
        default: ""
      dry-run:
        description: Build and check the site, and deploy nothing.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: The release tag (v<version>) whose docs go to docs.laminapdf.com.
        required: true
        type: string
      dry-run:
        description: Build and check the site, and deploy nothing.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One group per PR, one for next, one for production whichever tag it deploys (and one for
  # production's dry runs), so two deploys of one Worker never overlap.
  group: docs-${{ github.event.pull_request.number || (inputs.tag != '' && (inputs.dry-run && 'production-dry-run' || 'production')) || github.ref }}
  # Superseded PR previews are cancelled; next and production deploys run one after another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wrangler's usage metrics off (ADR 0011: no telemetry), Astro's too.
  WRANGLER_SEND_METRICS: "false"
  ASTRO_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  preview-build:
    name: Docs preview (build)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-pnpm
      # Without LAMINA_PDF_ENV=production the build marks every response noindex (ADR 0011 §1).
      - run: pnpm --filter @laminapdf/docs build
      - uses: laudebugs/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview-dist
          path: apps/docs/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview-deploy:
    name: Docs preview (deploy)
    needs: preview-build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      # The preview comment.
      pull-requests: write
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Docs deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The owner needs to add them (see apps/docs/README.md) to deploy the docs site; until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Use the default branch's deploy configuration, never the PR's.
      - name: Check out the default branch's deploy configuration
        if: steps.secrets.outputs.enabled == 'true'
        uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .docs-base
          persist-credentials: false
          sparse-checkout: |
            apps/docs/wrangler.toml
            pnpm-workspace.yaml
            .nvmrc
          sparse-checkout-cone-mode: false
      - name: Read the Wrangler version
        id: tooling
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: .docs-base
        run: |
          if [ ! -f apps/docs/wrangler.toml ]; then
            echo "::notice title=Docs preview skipped::The default branch has no apps/docs/wrangler.toml yet (the PR that adds the site); previews start once it is on main."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^  wrangler: \([0-9][0-9.]*\)$/\1/p' pnpm-workspace.yaml)
          if [ -z "$version" ]; then
            echo "::error file=pnpm-workspace.yaml::no exact wrangler version in the default catalog"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.tooling.outputs.ready == 'true'
        uses: laudebugs/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .docs-base/.nvmrc
      - name: Download the preview build
        if: steps.tooling.outputs.ready == 'true'
        uses: laudebugs/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview-dist
          path: .docs-base/apps/docs/dist/
      - name: Upload a preview version
        id: preview
        if: steps.tooling.outputs.ready == 'true'
        working-directory: .docs-base/apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_VERSION: ${{ steps.tooling.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          # A fresh npm cache: nothing an earlier job left on this runner is reused.
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          rm -rf "$npm_config_cache" "$WRANGLER_OUTPUT_FILE_PATH"
          npx --yes "wrangler@$WRANGLER_VERSION" versions upload --env="" --preview-alias "pr-$PR" --message "PR #$PR at $SHA"
          url=$(node -e '
            const lines = require("node:fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            const upload = lines.map((l) => JSON.parse(l)).filter((e) => e.type === "version-upload").at(-1);
            process.stdout.write(upload?.preview_alias_url ?? upload?.preview_url ?? "");
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL (is preview_urls on for the lamina-pdf-docs Worker?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          marker="<!-- lamina-pdf-docs-preview -->"
          body=$(printf '%s\n**Docs preview:** %s\n\nBuilt from %s. Updated on every push to this PR.' "$marker" "$URL" "$SHA")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      - name: Remove the deploy configuration checkout
        if: always()
        run: rm -rf .docs-base

  next:
    name: Docs next
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')) }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The mode: deploy with the secrets, dry-run when asked (no secrets needed), else skip.
      - name: Check for the Cloudflare secrets
        id: mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Docs deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The owner needs to add them (see apps/docs/README.md) to deploy the docs site; until then this job only skips."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.mode.outputs.mode != 'skip'
        uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.mode.outputs.mode != 'skip'
        uses: ./.github/actions/node-pnpm
      # Without LAMINA_PDF_ENV=production, every page says it describes unreleased changes and links
      # to the released docs, and the build marks every response noindex.
      - name: Build the site as the next docs
        if: steps.mode.outputs.mode != 'skip'
        run: pnpm --filter @laminapdf/docs build
      - name: Deploy next
        if: steps.mode.outputs.mode != 'skip'
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ steps.mode.outputs.mode }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$MODE" = "dry-run" ]; then
            pnpm exec wrangler deploy --env next --dry-run
          else
            pnpm exec wrangler deploy --env next --message "main at $SHA"
          fi

  production:
    name: Docs production
    # The release lane's call (`secrets: inherit`) or a manual run with a tag. Inside a called
    # workflow github.event_name is the caller's, so the tag input is what marks this job's runs.
    if: ${{ inputs.tag != '' }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The mode: deploy with the secrets, dry-run when asked (no secrets needed), else skip.
      - name: Check for the Cloudflare secrets
        id: mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Docs deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The owner needs to add them (see apps/docs/README.md) to deploy the docs site; until then this job only skips."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (v<version>)"
            exit 1
          fi
      - if: steps.mode.outputs.mode != 'skip'
        uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - if: steps.mode.outputs.mode != 'skip'
        uses: ./.github/actions/node-pnpm
      - name: Check that the tag names the docs' version
        if: steps.mode.outputs.mode != 'skip'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p 'require("./packages/sdk/package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG holds version $version; the docs would name the wrong version"
            exit 1
          fi
      - name: Build the site
        if: steps.mode.outputs.mode != 'skip'
        env:
          # The one build that search engines may index, and that names its version.
          LAMINA_PDF_ENV: production
        run: pnpm --filter @laminapdf/docs build
      - name: Deploy production
        if: steps.mode.outputs.mode != 'skip'
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ steps.mode.outputs.mode }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$MODE" = "dry-run" ]; then
            pnpm exec wrangler deploy --env="" --dry-run
          else
            pnpm exec wrangler deploy --env="" --message "release $TAG"
          fi
