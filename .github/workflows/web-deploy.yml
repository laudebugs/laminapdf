# The reader's deploys (todo C4d): apps/web on Cloudflare Workers static assets
# (apps/web/wrangler.jsonc; setup, rollbacks and deploying by hand in apps/web/DEPLOY.md).
#
# Pull requests from this repository:
# - `preview-build` classifies the PR with `cargo xtask changes` (its `web` output: the reader's
#   inputs, listed once in tools/xtask/src/changes.rs). When none changed, it reports success and
#   nothing deploys. Otherwise it builds the reader with no secrets (`cargo xtask web build`) and
#   uploads apps/web/dist/ as an artifact.
# - `preview-deploy` holds the Cloudflare secrets and never checks out or runs the PR's code: it
#   takes wrangler.jsonc and the Wrangler version from the default branch and installs that exact
#   Wrangler into a fresh npm cache. If the lamina-pdf-web Worker doesn't exist yet, it creates
#   it once, with a placeholder page and no route, since `versions upload` needs a Worker to
#   upload to. It then uploads the artifact as a preview version under the alias pr-<number>,
#   which leaves production as it is, and comments the preview URL, the commit and the build's
#   gzip sizes on the PR (one comment, updated on every push).
# - `preview-smoke` runs the PR's smoke test (apps/web/e2e/smoke.test.ts) against that URL, with
#   no secrets.
# Pushes to main (and manual runs on main): `staging` classifies the push the same way (a manual
# run always deploys), builds main, deploys it to https://staging-app.laminapdf.com
# (wrangler.jsonc's env.staging, the Worker lamina-pdf-web-staging) and runs the smoke test
# there. main is trusted.
# Tags web-v<version>: `production-checks` builds the tag and runs the reader's typecheck and its
# e2e suite in Chromium against `wrangler dev`; C7c adds the release gates here. `production`
# needs it: it deploys that same build to https://app.laminapdf.com (environment `production`)
# and runs the smoke test; if the smoke test fails, it rolls back to the previous deployment and
# fails. Tags are never path-filtered, and nothing else deploys production.
#
# Fork PRs are skipped, as in docs.yml and site.yml: they must never run on self-hosted runners
# or see the secrets. Without the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the
# deploy steps skip with a notice and the jobs pass. Nothing a PR controls is interpolated into a
# script: values reach `run:` through `env:`. Actions are pinned by full commit SHA with the
# release in a comment (ADR 0019).
name: Web reader

on:
  pull_request:
  push:
    branches: [main]
    tags: ["web-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR, one for staging and one for production, so two deploys of one Worker
  # never overlap.
  group: web-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
  # Superseded PR previews are cancelled; staging and production deploys run one after another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wrangler's usage metrics off (ADR 0011: no telemetry).
  WRANGLER_SEND_METRICS: "false"

jobs:
  preview-build:
    name: Reader preview (build)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # ci.yml's wasm job's build directory: `cargo xtask web build` compiles the same modules
      # with the same profile, targets and features, so each reuses the other's output.
      - uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: ci-wasm
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # As in ci.yml's wasm job: rust-cache's post step hangs on self-hosted macOS runners.
          cache: false
      - name: Classify the changed paths
        id: changes
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"
      # Same versions as ci.yml's wasm job and tools/xtask/src/doctor.rs; xtask fails if they drift.
      - if: steps.changes.outputs.web == 'true'
        uses: ./.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      - if: steps.changes.outputs.web == 'true'
        uses: ./.github/actions/node-pnpm
      - name: Build the reader
        if: steps.changes.outputs.web == 'true'
        run: cargo xtask web build
      - if: steps.changes.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-preview-dist
          path: apps/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Say why nothing deploys
        if: steps.changes.outputs.web != 'true'
        run: |
          echo "No preview: this PR changes none of the reader's inputs (cargo xtask changes)." >> "$GITHUB_STEP_SUMMARY"

  preview-deploy:
    name: Reader preview (deploy)
    needs: preview-build
    if: ${{ needs.preview-build.outputs.web == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
      # The preview comment.
      pull-requests: write
    outputs:
      url: ${{ steps.preview.outputs.url }}
    env:
      WORKER: lamina-pdf-web
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Reader deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (apps/web/DEPLOY.md); until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # The default branch's deploy configuration, never the PR's, in its own folder: a sparse
      # checkout of the job's workspace would leave the runner's shared checkout sparse.
      - name: Check out the default branch's deploy configuration
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .web-base
          persist-credentials: false
          sparse-checkout: |
            apps/web/wrangler.jsonc
            pnpm-workspace.yaml
            .nvmrc
          sparse-checkout-cone-mode: false
      - name: Read the Wrangler version
        id: tooling
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: .web-base
        run: |
          version=$(sed -n 's/^  wrangler: \([0-9][0-9.]*\)$/\1/p' pnpm-workspace.yaml)
          if [ -z "$version" ]; then
            echo "::error file=pnpm-workspace.yaml::no exact wrangler version in the default catalog"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .web-base/.nvmrc
      - name: Download the preview build
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-preview-dist
          path: .web-base/apps/web/dist/
      # `versions upload` refuses a Worker that doesn't exist, and production's first deploy waits
      # for the first web-v* tag (C7c). So the first preview creates the Worker: a placeholder
      # page, no route, no workers.dev address, preview URLs on.
      - name: Create the Worker once
        if: steps.secrets.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION: ${{ steps.tooling.outputs.version }}
          PLACEHOLDER: ${{ runner.temp }}/web-placeholder
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$WORKER")
          case "$status" in
            200) echo "$WORKER exists." ;;
            404)
              rm -rf "$PLACEHOLDER" "$npm_config_cache"
              mkdir -p "$PLACEHOLDER/public"
              echo '<!doctype html><title>Lamina PDF</title><p>The Lamina PDF reader is not released yet.</p>' > "$PLACEHOLDER/public/index.html"
              printf '{"name":"%s","compatibility_date":"2026-10-01","workers_dev":false,"preview_urls":true,"assets":{"directory":"./public"},"observability":{"enabled":false}}\n' "$WORKER" > "$PLACEHOLDER/wrangler.json"
              npx --yes "wrangler@$WRANGLER_VERSION" deploy --config "$PLACEHOLDER/wrangler.json" --message "Placeholder until the first web-v* release"
              echo "Created the Worker $WORKER with a placeholder page and no route." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Cloudflare answered $status when asked for the Worker $WORKER"
              exit 1
              ;;
          esac
      - name: Upload a preview version
        id: preview
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: .web-base/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_VERSION: ${{ steps.tooling.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          # A fresh npm cache: nothing an earlier job left on this runner is reused.
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          rm -rf "$npm_config_cache" "$WRANGLER_OUTPUT_FILE_PATH"
          npx --yes "wrangler@$WRANGLER_VERSION" versions upload --env="" --preview-alias "pr-$PR" --message "PR #$PR at $SHA"
          url=$(node -e '
            const lines = require("node:fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            const upload = lines.map((l) => JSON.parse(l)).filter((e) => e.type === "version-upload").at(-1);
            process.stdout.write(upload?.preview_alias_url ?? upload?.preview_url ?? "");
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL (are preview URLs on for the $WORKER Worker?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Reader preview: $url" >> "$GITHUB_STEP_SUMMARY"
      # What C7c's size budgets will hold: all the JavaScript and WebAssembly the build ships, each
      # file gzipped on its own. Read from the artifact; none of the PR's code runs.
      - name: Measure the build
        id: sizes
        if: steps.preview.outputs.url != ''
        working-directory: .web-base/apps/web/dist
        run: |
          node -e '
            const fs = require("node:fs"), zlib = require("node:zlib");
            const files = fs.readdirSync("assets");
            const kb = (ext) => (files.filter((f) => f.endsWith(ext))
              .reduce((n, f) => n + zlib.gzipSync(fs.readFileSync("assets/" + f), { level: 9 }).length, 0) / 1024).toFixed(1);
            process.stdout.write("js=" + kb(".js") + "\nwasm=" + kb(".wasm") + "\n");
          ' >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL on the PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
          JS_KB: ${{ steps.sizes.outputs.js }}
          WASM_KB: ${{ steps.sizes.outputs.wasm }}
        run: |
          marker="<!-- lamina-pdf-web-preview -->"
          body=$(printf '%s\n**Reader preview:** %s\n\nBuilt from %s: JavaScript %s KB and WebAssembly %s KB gzipped. Updated on every push to this PR.' \
            "$marker" "$URL" "$SHA" "$JS_KB" "$WASM_KB")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      - name: Remove the deploy configuration checkout
        if: always()
        run: rm -rf .web-base

  preview-smoke:
    name: Reader preview (smoke test)
    needs: preview-deploy
    if: ${{ needs.preview-deploy.outputs.url != '' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-pnpm
      # The browsers stay in the runner's own tool cache, as in ci.yml's pdf-runtimes jobs.
      - name: Install Chromium
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TOOL_CACHE/ms-playwright" pnpm --filter @laminapdf/web exec playwright install chromium
      - name: Smoke-test the preview
        env:
          LAMINA_PDF_SMOKE_URL: ${{ needs.preview-deploy.outputs.url }}
        run: pnpm --filter @laminapdf/web run smoke

  staging:
    name: Reader staging
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      URL: https://staging-app.laminapdf.com
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Reader deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (apps/web/DEPLOY.md); until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # ci.yml's wasm job's build directory, as in preview-build.
      - if: steps.secrets.outputs.enabled == 'true'
        uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: ci-wasm
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      # A push deploys only when the reader's inputs changed since the commit before it; a manual
      # run, or a push whose earlier commit isn't known, always does.
      - name: Classify the changed paths
        id: changes
        if: steps.secrets.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            cargo xtask changes --base "$BEFORE"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.web == 'true'
        uses: ./.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      - if: steps.changes.outputs.web == 'true'
        uses: ./.github/actions/node-pnpm
      - name: Build the reader
        if: steps.changes.outputs.web == 'true'
        run: cargo xtask web build
      - name: Deploy staging
        if: steps.changes.outputs.web == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          pnpm exec wrangler deploy --env staging --message "main at $SHA"
          echo "Reader staging: $URL ($SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Chromium
        if: steps.changes.outputs.web == 'true'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TOOL_CACHE/ms-playwright" pnpm --filter @laminapdf/web exec playwright install chromium
      - name: Smoke-test staging
        if: steps.changes.outputs.web == 'true'
        env:
          LAMINA_PDF_SMOKE_URL: ${{ env.URL }}
        run: pnpm --filter @laminapdf/web run smoke
      - name: Say why nothing deployed
        if: steps.secrets.outputs.enabled == 'true' && steps.changes.outputs.web != 'true'
        run: |
          echo "No staging deploy: this push changes none of the reader's inputs (cargo xtask changes)." >> "$GITHUB_STEP_SUMMARY"

  # C7c adds the release gates (runtimes, Lighthouse, installability) to this job's checks.
  production-checks:
    name: Reader production (checks)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web-v') }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a reader release tag (web-v<version>)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ci.yml's wasm job's build directory: `cargo xtask web build` compiles the same modules
      # with the same profile, targets and features, so each reuses the other's output.
      - uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: ci-wasm
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: ./.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      - uses: ./.github/actions/node-pnpm
      - name: Build the reader
        run: cargo xtask web build
      - name: Typecheck the reader
        run: pnpm --filter @laminapdf/web run typecheck:wasm
      - name: Install Chromium
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TOOL_CACHE/ms-playwright" pnpm --filter @laminapdf/web exec playwright install chromium
      - name: The reader's e2e suite in Chromium
        env:
          LAMINA_PDF_E2E_BROWSER: chromium
        run: pnpm --filter @laminapdf/web run e2e
      # The build these checks passed is the one production deploys.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-production-dist
          path: apps/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  production:
    name: Reader production
    needs: production-checks
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web-v') }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      URL: https://app.laminapdf.com
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Reader deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (apps/web/DEPLOY.md); until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.enabled == 'true'
        uses: ./.github/actions/node-pnpm
      - name: Download the checked build
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-production-dist
          path: apps/web/dist/
      - name: Deploy production
        id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          pnpm exec wrangler deploy --env="" --message "release $TAG"
          echo "Reader production: $URL ($TAG)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Chromium
        if: steps.deploy.outcome == 'success'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TOOL_CACHE/ms-playwright" pnpm --filter @laminapdf/web exec playwright install chromium
      - name: Smoke-test production
        id: smoke
        if: steps.deploy.outcome == 'success'
        env:
          LAMINA_PDF_SMOKE_URL: ${{ env.URL }}
        run: pnpm --filter @laminapdf/web run smoke
      # The job still fails: the smoke test's step did.
      - name: Roll back a release that failed its smoke test
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          pnpm exec wrangler rollback --env="" --yes --message "$TAG failed its smoke test"
          echo "::error::$TAG failed its smoke test on $URL and was rolled back to the previous deployment"
