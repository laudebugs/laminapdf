# Release lane (ADR 0018 §2, ADR 0017; todos B7b, P1, P5): on a `v*` tag, everything the PR lanes and
# the nightly lane run, on the release commit, plus the packaging checks and clean installs; then,
# only when every one of them passed, the publish jobs (ADR 0017 §7). Only a tag push publishes:
# a `workflow_dispatch` run, even on a tag, does the same with `--dry-run`, so it uploads
# nothing and creates no release.
#
#   guard           refuses to go on unless the latest completed full nightly.yml run on main
#                   (scheduled, or dispatched with every input at its default) succeeded on the release commit or an ancestor (`cargo xtask release-guard`), and checks that a tag names the version
#                   (`cargo xtask version check-tag`); `--version-only` sets `nightly` to `skip` when
#                   the release commit adds only the version bump and packaged docs to the commit that nightly tested
#   fast            the fast lane: `cargo xtask check` (with `version sync --check`) and `size`,
#                   over `cargo xtask wasm` (which runs publint and attw on @laminapdf/sdk)
#   full suites     the full lane's: the full differential set, every fuzz target, the round
#                   trip, the examples and render goldens, the capability matrix, @laminapdf/sdk in
#                   every runtime, and `cargo xtask check` on hosted Linux Arm64
#   nightly         nightly.yml itself, called as a reusable workflow on the release commit, unless
#                   the guard found only release-generated changes on top of a nightly-passed commit
#   verify-install  `cargo xtask verify-install`: the `pnpm pack` tarballs and the `laminapdf` crate
#                   (path and git dependencies, the git one pinned to the tag) in clean projects
#                   outside the checkout: Node 22, 24 and 26, Deno, Bun, Chromium (a Vite app),
#                   workerd (`wrangler dev --local`) and a Rust binary
#   release         passes when every job above passed
#   publish-crates  `cargo xtask publish crates`: every `publish = true` crate, with a crates.io token
#                   from trusted publishing (rust-lang/crates-io-auth-action; no stored token)
#   pack-npm        `cargo xtask publish npm-pack`: the fixed group built and packed, with
#                   publish.json (version, dist-tag, order), uploaded as an artifact
#   publish-npm     on a GitHub-hosted runner (npm's trusted publishing accepts no other) with an
#                   OIDC token and no checkout: `npm publish` of each tarball in publish.json's order;
#                   no stored npm token and no approval step
#   github-release  CycloneDX SBOMs (`cargo xtask sbom`) and, for a tag, the GitHub release with them
#   registry        after a tag's publish jobs (todo P3): `cargo xtask verify-install --from-registry`,
#                   the published version from npm and crates.io in the same runtimes. One job waits
#                   for the version on both registries (a registry can take a few minutes to serve
#                   it) and checks the Rust binary; then Node 22, 24 and 26 and the rest run
# npm provenance and artifact attestations, which need a public repository, aren't set up yet
# (ADR 0017 §7).
#
# Besides the tag trigger it runs on `workflow_dispatch`, so the lane can be tried without a tag:
#   gh workflow run release.yml --ref <branch-or-tag> [-f ref=<tag-or-sha>]
# `ref` (default: the dispatched ref's commit) is what every job checks out and what
# verify-install's git dependency pins; the called nightly workflow always runs on the dispatched
# ref's commit, so dispatch on the ref you test. Same runner rules as the other lanes (ci.yml):
# hosted Linux x64 (macOS Arm64 for WebKit and the render goldens) with explicit tool setup and
# main-only Rust cache writes. Artifacts are prefixed `release-` so they never clash with the
# nightly jobs' in the same run.
# Actions are locked by .github/workflows/actions.lock (ADR 0019, todo X11): `uses:` names a release
# tag, and `gh actions-lock` rewrites the lockfile after a `uses:` line changes; Dependabot bumps both.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag (v<version>) or full commit SHA on main under test (empty for the dispatched ref's commit)
        default: ""
      fuzz-seconds:
        description: Seconds per fuzz target in the nightly suites
        default: "600"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries (ADR 0018 §4).
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Guard (latest nightly on main, tag = version)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # gh run list on nightly.yml.
      actions: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      nightly: ${{ steps.guard.outputs.nightly }}
    steps:
      # A tag push tests the tag; a dispatch tests `inputs.ref`, else the dispatched commit. Every
      # job checks this ref out and runs its code, on main's cache, so a dispatched `ref` must be
      # code that is already trusted: a release tag (only maintainers and the release bot push
      # tags), or a full commit SHA on the default branch. Checked through the API, before any
      # checkout.
      - name: The ref under test
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            if [[ "$INPUT_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              if ! gh api "repos/$GH_REPO/git/ref/tags/$INPUT_REF" > /dev/null; then
                echo "::error::$INPUT_REF is not a tag of this repository"
                exit 1
              fi
            elif [[ "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]]; then
              # `behind` or `identical`: the commit is on the default branch.
              status=$(gh api "repos/$GH_REPO/compare/$DEFAULT_BRANCH...$INPUT_REF" --jq .status)
              if [ "$status" != behind ] && [ "$status" != identical ]; then
                echo "::error::$INPUT_REF is not a commit of $DEFAULT_BRANCH (compare: $status)"
                exit 1
              fi
            else
              echo "::error::ref must be a release tag (v<version>) or a full commit SHA on $DEFAULT_BRANCH, not '$INPUT_REF'"
              exit 1
            fi
            ref=$INPUT_REF
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            ref=$GITHUB_REF_NAME
          else
            ref=$GITHUB_SHA
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing $ref"
      # Full history: the guard checks the nightly run's commit is an ancestor of this one.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      # --version-only: `nightly=skip` when HEAD adds only the version bump and packaged docs to
      # the commit that nightly tested, so the lane doesn't run it again.
      - name: Refuse unless the latest full nightly on main is green on an ancestor
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cargo xtask release-guard --commit HEAD --version-only
      - name: A tag must name the version (v<version>)
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          case "$REF" in
            v*) cargo xtask version check-tag "$REF" ;;
            *) echo "Not a tag ($REF): version check-tag skipped" ;;
          esac

  # The fast lane's checks on the release commit (ci.yml's rust and wasm jobs in one).
  fast:
    name: Fast lane (check, wasm with publint and attw, size)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: $/.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2,wasm-bindgen@0.2.129,twiggy@0.8.0
      - uses: $/.github/actions/node-pnpm
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      # Inline, not .github/actions/linux-webkit: a dispatch checks out another ref, whose local
      # actions this lane must not run. The list matches the action's (doctor.rs tests both).
      - name: Install WebKitGTK 4.1 and D-Bus development packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config
      - run: cargo xtask check
      # Builds the modules and @laminapdf/sdk, tests them in Node and Vite, and runs publint
      # --strict and attw --pack on the package (the packaging checks).
      - run: cargo xtask wasm
      - name: Upload the built packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-lamina-pdf-dist
          path: |
            packages/wasm/dist/
            packages/sdk/dist/
          if-no-files-found: error
          retention-days: 7
      - run: cargo xtask size

  differential:
    name: Differential (full mutant set)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - uses: $/.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo xtask differential --full

  # The full lane's fuzz smoke at main's budget (2 minutes per target, 2 at once), from the corpus
  # main saved; the release never saves the corpus. The nightly suites below fuzz for 10 minutes.
  fuzz:
    name: Fuzz smoke (2 min per target)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - uses: $/.github/actions/install-tools
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the fuzz corpus saved on main
        uses: actions/cache/restore@v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo xtask fuzz --all --time 120 --jobs 2
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  check-linux:
    name: Check (Linux ARM64)
    needs: guard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          # Restores main's cache; a tag run never saves one.
          cache: true
          cache-save-if: false
          cache-bin: false
      - uses: $/.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      # Inline, not .github/actions/linux-webkit: a dispatch checks out another ref, whose local
      # actions this lane must not run. The list matches the action's (doctor.rs tests both).
      - name: Install WebKitGTK 4.1 and D-Bus development packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config
      - run: cargo xtask check

  roundtrip:
    name: Round trip (lamina, qpdf, pdf.js, PDFium)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/qpdf
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: qpdf and a Python venv with pypdfium2
        run: |
          qpdf --version
          python3 -m venv "$RUNNER_TEMP/roundtrip-venv"
          "$RUNNER_TEMP/roundtrip-venv/bin/pip" install -r tools/roundtrip/requirements.txt
      - run: cargo xtask roundtrip
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/roundtrip-venv/bin/python

  examples:
    name: Examples (goldens, qpdf, PDFium and hayro render goldens)
    needs: guard
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/qpdf
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - name: qpdf and a Python venv with pypdfium2
        run: |
          qpdf --version
          python3 -m venv "$RUNNER_TEMP/render-venv"
          "$RUNNER_TEMP/render-venv/bin/pip" install -r tools/render/requirements.txt
      - run: cargo xtask examples
      - run: cargo xtask render-golden
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/render-venv/bin/python

  capabilities:
    name: Capability matrix
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - run: cargo xtask capabilities --check

  # @laminapdf/sdk's example suite in every runtime over the fast job's build (the fast lane runs
  # Node 22, 26 and Chromium, the full lane the rest; the release runs them all).
  pdf-runtimes:
    name: "@laminapdf/sdk in ${{ matrix.runtime }}${{ matrix.node && format(' {0}', matrix.node) || '' }}"
    needs: [guard, fast]
    # WebKit on macOS (closest to Safari); every other runtime on Linux.
    runs-on: ${{ matrix.runtime == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, node: "22" }
          - { runtime: node, node: "24" }
          - { runtime: node, node: "26" }
          - { runtime: chromium, node: "" }
          - { runtime: firefox, node: "" }
          - { runtime: webkit, node: "" }
          - { runtime: deno, node: "" }
          - { runtime: bun, node: "" }
          - { runtime: workerd, node: "" }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-lamina-pdf-dist
          path: packages/
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      - uses: $/.github/actions/node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Keep the Playwright browsers in the runner's tool cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
      - if: matrix.runtime == 'chromium' || matrix.runtime == 'firefox'
        uses: $/.github/actions/playwright-deps
        with:
          browsers: ${{ matrix.runtime }}
      - env:
          RUNTIME: ${{ matrix.runtime }}
        run: cargo xtask pdf-runtimes "$RUNTIME"

  # The nightly lane's jobs on the release commit (X3a's nightly.yml has `workflow_call` for
  # this), with `record: false`: no benchmark history pushed to bench-data, no fuzz cache saved,
  # no issue opened (the `release` job fails instead). The two write permissions are only there
  # because GitHub refuses to call a workflow whose jobs declare more than the caller grants; the
  # steps that would use them are gated on `record` (release.rs's no-publish test checks that).
  # Its own concurrency group, so it neither waits for nor cancels a night on main.
  nightly:
    name: Nightly suites
    needs: guard
    if: ${{ needs.guard.outputs.nightly != 'skip' }}
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/nightly.yml
    with:
      fuzz-seconds: ${{ inputs.fuzz-seconds || '600' }}
      record: false
      concurrency-group: release-nightly-${{ github.run_id }}

  # Clean installs outside the checkout (ADR 0018 §2). Full history, so the git dependency on
  # this clone (verify-install's default --git-url) finds the tag or commit under test.
  verify-install:
    name: verify-install (${{ matrix.name }})
    needs: [guard, fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Node 22, node: "22", runtimes: node }
          - { name: Node 24, node: "24", runtimes: node }
          - { name: Node 26, node: "26", runtimes: node }
          - { name: "Deno, Bun, Chromium, workerd, Rust", node: "", runtimes: deno bun chromium workerd rust }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-lamina-pdf-dist
          path: packages/
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      # Deno, Bun, Vite, Playwright and wrangler are @laminapdf/sdk's pinned dev dependencies.
      - uses: $/.github/actions/node-pnpm
        with:
          node-version: ${{ matrix.node }}
      # verify-install's Chromium check (a Vite app in Playwright's Chromium).
      - uses: $/.github/actions/playwright-deps
      - name: Keep the Playwright browsers in the runner's tool cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
      # The temporary projects go in runner.temp, outside the checkout.
      - env:
          RUNTIMES: ${{ matrix.runtimes }}
          GIT_REF: ${{ needs.guard.outputs.ref }}
          TMPDIR: ${{ runner.temp }}
        run: |
          # shellcheck disable=SC2086 # RUNTIMES is a space-separated list.
          cargo xtask verify-install $RUNTIMES --git-ref "$GIT_REF" --git-url "file://$GITHUB_WORKSPACE"

  # Every job must pass. Only nightly may be skipped, when the guard proved the commit adds only
  # generated release changes to a nightly-tested one.
  # The publish jobs below need it.
  release:
    name: Release checks passed
    if: always()
    needs:
      [
        guard,
        fast,
        differential,
        fuzz,
        check-linux,
        roundtrip,
        examples,
        capabilities,
        pdf-runtimes,
        nightly,
        verify-install,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          NIGHTLY: ${{ needs.guard.outputs.nightly }}
          REF: ${{ needs.guard.outputs.ref }}
        run: |
          set -euo pipefail
          failed=$(jq -r --arg nightly "$NIGHTLY" 'to_entries
            | map(select(.value.result != "success"
                and ((.key == "nightly" and $nightly == "skip" and .value.result == "skipped") | not)))
            | map("\(.key): \(.value.result)") | join(", ")' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::release checks failed: $failed"
            exit 1
          fi
          echo "Every release check passed on $REF."

  # Publishing (ADR 0017 §7, todo P1): only after every check passed; for real only on a tag push
  # (`github.event_name == 'push' && github.ref_type == 'tag'`; a dispatch on a tag is a dry run).
  # A re-run after a partial publish skips the crates and packages already at the version.
  # crates.io trusted publishing accepts GitHub-hosted runners, so the
  # workflow's OIDC token buys a short-lived crates.io token and no crates.io secret exists.
  publish-crates:
    name: Publish the crates${{ !(github.event_name == 'push' && github.ref_type == 'tag') && ' (dry run)' || '' }}
    needs: [guard, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # crates.io's trusted-publisher entries for these crates require the `release` environment:
    # the OIDC token only names it (claim `environment`) when the job declares it.
    environment: release
    permissions:
      contents: read
      # For rust-lang/crates-io-auth-action's token exchange (crates.io trusted publishing).
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      # `publish crates` regenerates the crate's docs/ with apps/docs/scripts/package-docs.mjs,
      # which imports @laminapdf/site-kit from the pnpm workspace. On a release commit the output
      # equals the committed snapshot, so Cargo publishes a clean tree.
      - uses: $/.github/actions/node-pnpm
      - name: Get a crates.io token (trusted publishing)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: cargo xtask publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          DRY_RUN: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is empty or one flag.
          cargo xtask publish crates $DRY_RUN

  # The npm tarballs, built and packed on our runner; publish-npm publishes them.
  pack-npm:
    name: Pack the npm packages
    needs: [guard, fast, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-lamina-pdf-dist
          path: packages/
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      - uses: $/.github/actions/node-pnpm
      - run: pnpm install --frozen-lockfile
      # The tarballs and publish.json (the version, its dist-tag and the order).
      - run: cargo xtask publish npm-pack
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-npm-packs
          path: target/xtask/npm-packs/
          if-no-files-found: error
          retention-days: 7

  # npm's trusted publishing accepts only cloud-hosted runners (ADR 0017 §7), so this one job runs
  # on GitHub's. It checks out nothing and runs no code from the repository or the tarballs: it
  # downloads them, checks every value it reads from publish.json, and npm exchanges the job's OIDC
  # token for a short-lived publish token. A re-run leaves out the packages npm already has at the
  # version.
  publish-npm:
    name: Publish the npm packages${{ !(github.event_name == 'push' && github.ref_type == 'tag') && ' (dry run)' || '' }}
    needs: [guard, release, pack-npm]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.pack-npm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm's trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-npm-packs
          path: packs/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later, newer than the npm some Node releases bundle.
      - name: Install npm 11.17.0
        run: npm install --global npm@11.17.0
      - name: npm publish, dependencies first
        working-directory: packs
        env:
          REF: ${{ needs.guard.outputs.ref }}
          DRY_RUN: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          version=$(jq -r .version publish.json)
          tag=$(jq -r .tag publish.json)
          entries=$(jq -r '.packages[] | "\(.name) \(.tarball)"' publish.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "publish.json's version: $version"
          [[ "$tag" =~ ^[a-z]+$ ]] || fail "publish.json's dist-tag: $tag"
          case "$REF" in
            v*) [ "$REF" = "v$version" ] || fail "publish.json is $version, the tag $REF" ;;
          esac
          [ -n "$entries" ] || fail "publish.json lists no packages"
          while read -r name tarball; do
            [[ "$name" =~ ^@laminapdf/[a-z0-9-]+$ ]] || fail "publish.json's package name: $name"
            [[ "$tarball" =~ ^[a-z0-9.-]+\.tgz$ && -f "$tarball" ]] || fail "publish.json's tarball for $name: $tarball"
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is on npm already: skipped"
              continue
            fi
            # shellcheck disable=SC2086 # DRY_RUN is empty or one flag.
            npm publish "./$tarball" --access public --tag "$tag" --ignore-scripts $DRY_RUN
          done <<<"$entries"

  # SBOMs for every published crate and package; for a tag, the GitHub release that carries them
  # with the version's changelog. A dry run uploads the SBOMs as an artifact instead.
  github-release:
    name: SBOMs and the GitHub release${{ !(github.event_name == 'push' && github.ref_type == 'tag') && ' (dry run)' || '' }}
    needs: [guard, publish-crates, publish-npm]
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # gh release create.
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      # Same version as tools/xtask/src/doctor.rs.
      - uses: $/.github/actions/install-tools
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: $/.github/actions/node-pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask sbom target/sbom
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-sbom
          path: target/sbom/
          if-no-files-found: error
          retention-days: 30
      - name: Create the GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo xtask release-notes "$TAG" target/release-notes.md
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file target/release-notes.md --verify-tag \
            "${prerelease[@]}" target/sbom/*.json

  # Todo P3: the published version, installed from npm and crates.io as the install page tells
  # users to, in every runtime verify-install covers. Tag pushes only: a dry run publishes
  # nothing. A registry can take a few minutes to serve a version just published, so this job
  # polls both registries for up to two hours first (one runner waits, not the whole matrix),
  # then checks the Rust binary from crates.io. If the wait times out, re-run the failed jobs.
  registry-ready:
    name: The published version on npm and crates.io (Rust binary)
    needs: [guard, publish-crates, publish-npm]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      - uses: $/.github/actions/node-pnpm
      - env:
          TMPDIR: ${{ runner.temp }}
        run: cargo xtask verify-install rust --from-registry --wait 120

  verify-registry:
    name: verify-install from the registries (${{ matrix.name }})
    needs: [guard, registry-ready]
    if: ${{ !cancelled() && needs.registry-ready.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Node 22, node: "22", runtimes: node }
          - { name: Node 24, node: "24", runtimes: node }
          - { name: Node 26, node: "26", runtimes: node }
          - { name: "Deno, Bun, Chromium, workerd", node: "", runtimes: deno bun chromium workerd }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      # Deno, Bun, Vite, Playwright and wrangler are @laminapdf/sdk's pinned dev dependencies.
      - uses: $/.github/actions/node-pnpm
        with:
          node-version: ${{ matrix.node }}
      # verify-install's Chromium check (a Vite app in Playwright's Chromium).
      - uses: $/.github/actions/playwright-deps
      - name: Keep the Playwright browsers in the runner's tool cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
      - env:
          RUNTIMES: ${{ matrix.runtimes }}
          TMPDIR: ${{ runner.temp }}
        run: |
          # shellcheck disable=SC2086 # RUNTIMES is a space-separated list.
          cargo xtask verify-install $RUNTIMES --from-registry

  # docs.yml otherwise permits an owner without Cloudflare secrets to skip deployment.
  # The automatic release must fail instead of calling that a completed release.
  docs-ready:
    name: Require the production docs credentials
    needs: [publish-crates, publish-npm, github-release, verify-registry]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success' && needs.github-release.result == 'success' && needs.verify-registry.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse to skip the production deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The daily release requires the production docs credentials."
            exit 1
          fi

  # Only tag pushes deploy released docs; a dispatched release remains a dry run.
  docs:
    name: Deploy the released docs
    needs: [guard, docs-ready]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.docs-ready.result == 'success' }}
    # The reusable workflow declares a PR-comment permission, even though that job is skipped here.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.guard.outputs.ref }}
    secrets: inherit

  version-pr:
    name: Merge the published version back to main
    needs: [guard, docs]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.docs.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - name: Create the release bot's token
        id: bot
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the version pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="release/$TAG"
          remote=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            ls-remote --heads origin "refs/heads/$branch")
          if [ -z "$remote" ]; then
            echo "No version branch: a manual release, or its version PR already merged."
            exit 0
          fi
          if [ "${remote%%[[:space:]]*}" != "$COMMIT" ]; then
            echo "::error::The version branch differs from the published commit; recover it by hand."
            exit 1
          fi
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            printf 'Published %s and deployed its docs. Merge this version bump to consume the released changesets.\n' "$TAG" > "$RUNNER_TEMP/version-pr.md"
            pr=$(gh pr create --head "$branch" --base main --title "release: $TAG" --body-file "$RUNNER_TEMP/version-pr.md")
          fi
          gh pr merge "$pr" --auto --squash --match-head-commit "$COMMIT"
