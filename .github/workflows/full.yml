# CI full lane (ADR 0018 §2, todo X4): every PR and every push to main, next to the fast lane
# (ci.yml). It always runs, so its required check never waits as "Expected": `changes` decides
# whether the change touches code, the suites run only if it does (pushes to main run them
# all), and `gate` — the one check branch protection requires — passes when every suite passed
# or was not needed. Never add a workflow-level `paths` filter here.
#
# Adding a suite (B3c round-trip, B5c render goldens and qpdf, B4b/B5b extraction, B6c
# runtimes): copy the `if:` of an existing suite, `needs: [changes, …]`, and add the job to
# `gate`'s `needs`. A suite missing from `gate.needs` doesn't block merges.
#
# Self-hosted runners (select-runner.yml) are macOS ARM64 machines shared by several runners:
# jobs on them isolate the Rust install, install pnpm into ${{ runner.temp }}, and use
# rust-cache only on GitHub-hosted runners (see ci.yml).
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Full lane

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

jobs:
  # Docs-only when every path changed since the merge base is on the docs allowlist
  # (tools/xtask/src/changes.rs); anything else, including root config, is code.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.pr.outputs.code || steps.push.outputs.code }}
    steps:
      - name: Pushes to main run every suite
        id: push
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the merge base with the base branch is always present.
          fetch-depth: 0
      # xtask only needs to build for the host: the bare pinned toolchain, without
      # rust-toolchain.toml's components and cross targets (as in ci.yml's TypeScript job).
      - name: Read the pinned Rust version
        if: github.event_name == 'pull_request'
        id: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - if: github.event_name == 'pull_request'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: ""
          target: ""
          override: false
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"

  select-runner:
    name: Choose CI runner
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/select-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # The fast lane's `cargo xtask check` on the two OSes ci.yml didn't use: ci.yml runs on the
  # self-hosted macOS runner when one is online and on Ubuntu otherwise, so this job takes
  # whichever of Linux and macOS is left (select-runner gives both workflows the same answer
  # unless a runner goes on- or offline in between).
  check-unix:
    name: Fast lane on ${{ contains(needs.select-runner.outputs.runner, 'self-hosted') && 'Linux' || 'macOS' }}
    needs: [changes, select-runner]
    # Still run if the runner check failed: the empty output means ci.yml used Ubuntu.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.code == 'true' || github.event_name == 'push') }}
    runs-on: ${{ contains(needs.select-runner.outputs.runner, 'self-hosted') && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  check-windows:
    name: Fast lane on Windows
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  # ADR 0018 tier 6: lamina vs pypdf's precomputed facts over 500 fixed-seed mutants
  # (fixtures/differential/mutants-500.json). No Python: the facts are committed.
  differential:
    name: Differential (500 mutants)
    needs: [changes, select-runner]
    # Still run if the runner check failed: an empty output falls back to GitHub-hosted Ubuntu.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.code == 'true' || github.event_name == 'push') }}
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: cargo xtask differential --mutants 500

  # ADR 0018 tier 9: every fuzz target for 2 minutes under default Limits (the nightly lane
  # runs 10). The corpus is cached between runs, so each run starts where the last one ended.
  fuzz:
    name: Fuzz smoke (2 min per target)
    needs: [changes, select-runner]
    # Still run if the runner check failed: an empty output falls back to GitHub-hosted Ubuntu.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.code == 'true' || github.event_name == 'push') }}
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      # The pinned stable toolchain (rust-toolchain.toml) builds xtask; fuzz/ needs nightly.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      # One corpus per OS and architecture; a new entry per run, restored from the newest.
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-pr-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-pr-${{ runner.os }}-${{ runner.arch }}-
      # Adds the seeds from fixtures/ and fuzz/seeds/ to the corpus, then runs each target.
      - run: cargo xtask fuzz --all --time 120
      - name: Save the fuzz corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-pr-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The required check. Passes when `changes` succeeded and every suite either succeeded or
  # was skipped because the change is docs-only; fails on any failure or cancellation, and if
  # a suite that should have run was skipped.
  gate:
    name: gate
    if: always()
    needs: [changes, check-unix, check-windows, differential, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every suite passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_SUITES: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ]; then
            echo "::error::the changes job ended with '$changes'"
            exit 1
          fi
          echo "Suites needed: $RUN_SUITES"
          failed=0
          for job in $(jq -r 'del(.changes) | keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            echo "$job: $result"
            case "$result" in
              success) ;;
              skipped)
                if [ "$RUN_SUITES" = true ]; then
                  echo "::error::$job was skipped but the change touches code"
                  failed=1
                fi
                ;;
              *)
                echo "::error::$job ended with '$result'"
                failed=1
                ;;
            esac
          done
          exit "$failed"
