# CI full lane (ADR 0018 §2, todo X4): every PR and every push to main, next to the fast lane
# (ci.yml). It always runs, so its required check never waits as "Expected": `changes` decides
# whether the change touches code (the docs allowlist is defined in tools/xtask/src/changes.rs),
# the suites run only if it does (pushes to main always count as code), and `gate` — the one
# check branch protection requires — passes when every suite passed or was not needed. Never add
# a workflow-level `paths` filter here.
#
# Adding a suite (B5c render goldens and qpdf, B4b/B5b extraction, B6c
# runtimes): give the job `needs: changes`, `runs-on: [self-hosted, macOS, ARM64]` and exactly
# this condition, then add it to `gate`'s `needs`:
#
#     if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
#
# A suite missing from `gate.needs` doesn't block merges. `check-linux` is the one exception to
# that condition: it also needs `changes`' `linux` output to be 'true', which it is only while
# the repository variable LINUX_RUNNER is 'true' (the owner's switch: `gh variable set
# LINUX_RUNNER --body true`) and the runner's heartbeat (LINUX_RUNNER_HEARTBEAT, refreshed by
# tools/ci-runner/linux/loop.sh) is under 15 minutes old. Otherwise the job is skipped, so
# `gate` doesn't wait on a runner that isn't there, and `gate` accepts that skip. Both read the
# one output, so changing the variables mid-run can't make them disagree.
#
# Every job runs on self-hosted runners on one Mac: the two macOS ARM64 runners, where jobs
# isolate the Rust install (isolate-rust-home), install pnpm into ${{ runner.temp }} and don't
# use rust-cache (see ci.yml), and one Linux ARM64 runner in a container on the same Mac
# (tools/ci-runner/linux/README.md), which runs `check-linux` only. There is no Windows runner
# (X6); the fast lane covers `cargo xtask check` on macOS.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Full lane

on:
  pull_request:
    # `edited` too: retargeting a PR (a new base branch) changes what `changes` diffs against.
    # A title or body edit also reruns the lane; the result is the same, only slower.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

jobs:
  # Also runs `cargo xtask check docs` on every PR (gate fails if it fails).
  # `code` is exactly "true" or "false": a PR is docs-only when every path changed since the
  # merge base with its base branch is on the docs allowlist; pushes to main are always code.
  changes:
    name: Changed paths
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    outputs:
      code: ${{ steps.pr.outputs.code || steps.push.outputs.code }}
      linux: ${{ steps.linux.outputs.linux }}
    steps:
      # `linux` is exactly "true" or "false": whether check-linux may be scheduled (see the top).
      # A runner that dies after this step leaves the job queued until it comes back; the
      # recovery steps are in tools/ci-runner/linux/README.md.
      - name: Is the Linux runner switched on and alive?
        id: linux
        env:
          SWITCH: ${{ vars.LINUX_RUNNER }}
          HEARTBEAT: ${{ vars.LINUX_RUNNER_HEARTBEAT }}
        run: |
          linux=false
          if [ "$SWITCH" = true ]; then
            if [[ "$HEARTBEAT" =~ ^[0-9]+$ ]] && [ $(( $(date +%s) - HEARTBEAT )) -le 900 ]; then
              linux=true
            else
              echo "::warning::LINUX_RUNNER is true but the Linux runner's heartbeat is missing or older than 15 minutes, so check-linux is skipped (tools/ci-runner/linux/README.md)"
            fi
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
      - name: Pushes to main run every suite
        id: push
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the merge base with the base branch is always present.
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/isolate-rust-home
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/host-rust
        with:
          cache: false
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"
      # Docs-only PRs skip both lanes' suites, so the docs checks run here, under `gate`:
      # every relative link, the todo board and path portability (no network).
      - name: Docs checks (links, todo board, portable paths)
        if: github.event_name == 'pull_request'
        run: cargo xtask check docs

  # ADR 0018 tier 6: lamina vs pypdf's precomputed facts over the full set, 36 fixed-seed
  # mutants per corpus file (fixtures/differential/full.json). No Python: the facts are
  # committed. Runs under nextest's ci profile, so a hang is killed.
  differential:
    name: Differential (full mutant set)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo.
          cache: false
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo xtask differential --full

  # ADR 0018 tier 9: every fuzz target for 2 minutes under default Limits (the nightly lane
  # runs 10). Every run starts from the corpus last saved on main; only pushes to main save
  # it, minimised first (`cargo fuzz cmin`), so the cache stays one bounded entry per runner OS.
  fuzz:
    name: Fuzz smoke (2 min per target)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      # The pinned stable toolchain (rust-toolchain.toml) builds xtask; fuzz/ needs nightly.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the fuzz corpus saved on main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-
      # Adds the seeds from fixtures/ and fuzz/seeds/ to the corpus, then runs each target.
      - run: cargo xtask fuzz --all --time 120
      - name: Minimise the corpus before saving it
        if: github.event_name == 'push'
        run: cargo xtask fuzz cmin
      - name: Save the fuzz corpus
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # `cargo xtask check` (docs, Rust, TypeScript) on Linux ARM64, in the runner container on the
  # Mac (todo X5, tools/ci-runner/linux/README.md). Each job gets a fresh container from an image
  # with the pinned Rust toolchain already in ~/.rustup and ~/.cargo, and nothing it writes
  # survives the job, so there is no isolate-rust-home here. Build output comes back through
  # GitHub's cache instead (rust-cache, saved by pushes to main only): a PR can restore main's
  # cache but never write one main reads, so PR code can't plant anything a main run executes.
  # The container is capped at 3 CPUs and 6 GB so the macOS runners keep their share.
  check-linux:
    name: Check (Linux ARM64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.changes.outputs.linux == 'true' }}
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `toolchain` input: installs exactly what rust-toolchain.toml pins (already in the
      # image unless main bumped it since the image was built).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Dependencies' build output and the registry. Only pushes to main save it (PR caches
          # are scoped to their PR anyway; this keeps them from filling the repository's quota).
          # Unlike on macOS, rust-cache's post step has no `sudo purge` here.
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # The tools come from install-action below on every run.
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # No `version` input: uses packageManager from package.json. The default install dir is
      # fine here: the container is the job's own (the macOS jobs need `dest`, see ci.yml).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  # ADR 0018 tier 7 (todo B3c): lamina saves every fixture x proving op x mode, reopens each
  # output, and qpdf --check, pdf.js and PDFium check them (`cargo xtask roundtrip`). Needs
  # qpdf on the runner (Homebrew), Node (pdfjs-dist from tools/roundtrip/package.json) and a
  # per-job Python venv with tools/roundtrip/requirements.txt.
  roundtrip:
    name: Round trip (lamina, qpdf, pdf.js, PDFium)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: qpdf and a Python venv with pypdfium2
        run: |
          qpdf --version
          python3 -m venv "$RUNNER_TEMP/roundtrip-venv"
          "$RUNNER_TEMP/roundtrip-venv/bin/pip" install -r tools/roundtrip/requirements.txt
      - run: cargo xtask roundtrip
        env:
          LAMINA_PYTHON: ${{ runner.temp }}/roundtrip-venv/bin/python
      - name: Upload the outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roundtrip-outputs
          path: target/xtask/roundtrip/
          if-no-files-found: ignore

  # Todo X2 (full-editor §3): run every test tagged `/// capability: <ID> <surface> <status>`
  # and fail when docs/capabilities/README.md differs from what they prove, or one fails.
  # `cargo xtask check docs` (in `changes`, every PR) already rejects a README that claims more
  # than any tagged test could prove; this job checks the tests actually pass. Plain cargo test.
  capabilities:
    name: Capability matrix
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: cargo xtask capabilities --check

  # The required check. Fails unless `changes` succeeded with `code` exactly "true" or "false";
  # then every suite must have succeeded (code) or been skipped (docs-only). Any failure,
  # cancellation, or skip of a suite that should have run fails it. The one allowed skip on a
  # code change is `check-linux` while `changes`' `linux` output is 'false'.
  gate:
    name: gate
    if: always()
    needs: [changes, differential, fuzz, check-linux, roundtrip, capabilities]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Check every suite passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          LINUX: ${{ needs.changes.outputs.linux }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ]; then
            echo "::error::the changes job ended with '$changes'"
            exit 1
          fi
          case "$CODE" in
            true|false) echo "Suites needed: $CODE" ;;
            *)
              echo "::error::the changes job's code output is '$CODE', not true or false"
              exit 1
              ;;
          esac
          case "$LINUX" in
            true|false) echo "Linux runner scheduled: $LINUX" ;;
            *)
              echo "::error::the changes job's linux output is '$LINUX', not true or false"
              exit 1
              ;;
          esac
          failed=0
          for job in $(jq -r 'del(.changes) | keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            echo "$job: $result"
            if [ "$job" = check-linux ] && [ "$LINUX" = false ] && [ "$result" = skipped ]; then
              echo "::notice::check-linux skipped: the Linux runner is switched off or not alive"
              continue
            fi
            case "$CODE/$result" in
              true/success | false/skipped) ;;
              *)
                echo "::error::$job ended with '$result' (suites needed: $CODE)"
                failed=1
                ;;
            esac
          done
          exit "$failed"
