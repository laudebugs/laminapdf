# CI full lane (ADR 0018 §2, todo X4): every PR and every push to main, next to the fast lane
# (ci.yml). It always runs, so its required check never waits as "Expected": `changes` decides
# whether the change touches code (the docs allowlist is defined in tools/xtask/src/changes.rs),
# the suites run only if it does (pushes to main always count as code), and `gate` passes when
# every suite passed or was not needed. Branch protection requires `gate` and ci.yml's
# `fast-gate` (todo X7). Never add a workflow-level `paths` filter here.
#
# Adding a suite: give it `needs: changes`, the code-change condition below, and add it to
# `gate.needs`. All code suites are required, including the hosted Linux Arm64 and Windows x64
# checks. A suite with its own path filter (`desktop`) uses its own `changes` output instead,
# and the gate's loop maps the job to that output.
# Fresh hosted VMs replace the persistent Mac runners and Linux container.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Full lane

on:
  pull_request:
    # `edited` too: retargeting a PR (a new base branch) changes what `changes` diffs against.
    # A title or body edit also reruns the lane; the result is the same, only slower.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  # A newer run cancels the older one, on PRs and on main alike (todo X9d): nothing reads a push to
  # main's own result (the release trains wait on the nightly and on tag pushes), and the newer run
  # saves the caches again. A commit whose run was cancelled has no result of its own; a break it
  # brought shows in the next run.
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  # Also runs `cargo xtask check docs` on every PR (gate fails if it fails).
  # `code` is exactly "true" or "false": a PR is docs-only when every path changed since the
  # merge base with its base branch is on the docs allowlist; pushes to main are always code.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.pr.outputs.code || steps.push.outputs.code }}
      desktop: ${{ steps.pr.outputs.desktop || steps.push.outputs.desktop }}
      render: ${{ steps.pr.outputs.render || steps.push.outputs.render }}
    steps:
      - name: Pushes to main run every suite
        id: push
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "code=true"
            echo "desktop=true"
            echo "render=true"
          } >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the merge base with the base branch is always present.
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/host-rust
        with:
          cache: true
          shared-key: xtask
          save: "false"
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"
      # Docs-only PRs skip both lanes' suites, so the docs checks run here, under `gate`:
      # links, prose, snippets, the todo board, portable paths and generated files (no network).
      - name: Docs checks (cargo xtask check docs)
        if: github.event_name == 'pull_request'
        run: cargo xtask check docs

  # ADR 0018 tier 9: every fuzz target under default Limits, 2 at once (`--jobs 2`: built once,
  # then separate cargo-fuzz processes): 30 s per target on PRs, a smoke test that keeps the PR
  # lane short, and 2 minutes on pushes to main, so the corpus main saves keeps growing (the
  # nightly lane runs 10 minutes per target). Every run starts from the corpus last saved on
  # main; only pushes to main save it, minimised first (`cargo fuzz cmin`), so the cache stays
  # one bounded entry per runner OS.
  fuzz:
    name: Fuzz smoke (${{ github.event_name == 'pull_request' && '30 s' || '2 min' }} per target)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned stable toolchain (rust-toolchain.toml) builds xtask; fuzz/ needs nightly.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the fuzz corpus saved on main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-
      # Adds the seeds from fixtures/ and fuzz/seeds/ to the corpus, builds every target, then
      # fuzzes them 2 at once to fit the hosted runner's memory with libFuzzer's
      # per-input timeout scaled to 40 s for the shared CPU, and at most 4 x 2048 MB of memory;
      # fails if any target failed (all of them still run).
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '30' || '120' }}
        run: cargo xtask fuzz --all --time "$SECONDS_PER_TARGET" --jobs 2
      - name: Minimise the corpus before saving it
        if: github.event_name == 'push'
        run: cargo xtask fuzz cmin
      - name: Save the fuzz corpus
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
      # Each target's libFuzzer output, streamed to a file while it runs, so a cancelled or
      # timed-out job still shows how far every target got.
      - name: Upload the fuzz logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-logs
          path: target/xtask/fuzz/
          if-no-files-found: ignore

  # Full Rust and TypeScript checks on hosted Linux Arm64, in addition to ci.yml's
  # six-platform native Rust matrix. Every code change must pass this job.
  check-linux:
    name: Check (Linux ARM64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs exactly what rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # ci.yml's Rust job's linux-arm64 leg builds the same and saves this cache on main; this
          # job only restores it (one cache, not two copies of about 600 MB).
          cache: true
          cache-save-if: false
          cache-shared-key: rust
          # The tools come from install-tools below on every run.
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # Versions come from package.json and .nvmrc.
      # The pnpm store is restored on every run and saved only on pushes to main (node-pnpm).
      - uses: ./.github/actions/node-pnpm
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      - uses: ./.github/actions/linux-webkit
      - run: cargo xtask check

  # The desktop app (apps/desktop, ADR 0008) built on each OS the way `tauri build` builds it, without
  # installers (D6b makes those). Only when `cargo xtask changes` says the app's inputs changed
  # (`desktop`: the app, packages/, crates/, the manifests, lockfiles and toolchain, this workflow);
  # the gate requires it then. Ubuntu 22.04: the oldest Linux the app supports, so its glibc and
  # WebKitGTK are the floor.
  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04 }
          - { os: macos, runner: macos-15 }
          - { os: windows, runner: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs exactly what rust-toolchain.toml pins. Its own cache: only this job builds the
      # app's debug binary with Tauri's tree, saved on pushes to main.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-shared-key: desktop
          cache-bin: false
      - uses: ./.github/actions/node-pnpm
      - uses: ./.github/actions/linux-webkit
      - uses: ./.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      # The frontend imports the built @laminapdf/ui, tokens, fonts and icons, and the viewer over
      # @laminapdf/sdk and its WebAssembly (D2d).
      - name: Build the packages the frontend imports
        run: cargo xtask desktop-frontend
      - name: Typecheck the frontend against them
        run: pnpm --filter @laminapdf/desktop run typecheck:wasm
      # desktop:build merges tauri.bundle.conf.json, whose beforeBuildCommand runs
      # `cargo xtask desktop-sidecar` (the engine, and PDFium from its pinned, hash-checked release).
      - name: Build the app with its engine and PDFium (tauri build --debug --no-bundle)
        run: pnpm --filter @laminapdf/desktop run desktop:build --debug --no-bundle
      # Tauri copied the sidecar and the resources next to the app: neither may be missing or empty.
      - name: Check the engine and PDFium are next to the app
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          test -s "target/debug/laminapdf-desktop-engine$exe"
          find target/debug/pdfium -maxdepth 1 -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -size +1M | grep -q .
      # ADR 0008 §3: the main process never links the parser or PDFium. Exact names: the app and
      # the protocol crate are expected.
      - name: Check the main process links no parser or renderer
        shell: bash
        run: |
          set -euo pipefail
          found=$(cargo tree --locked -p laminapdf-desktop -e normal --prefix none --format '{p}' \
            | awk '{print $1}' | sort -u \
            | grep -Fx -e laminapdf -e laminapdf-render -e laminapdf-render-pdfium -e laminapdf-desktop-engine -e pdfium-render || true)
          if [ -n "$found" ]; then
            echo "::error::laminapdf-desktop depends on $found"
            exit 1
          fi
      # ADR 0008 §8: only builds with the `e2e` feature have the end-to-end tests' commands, the
      # WebdriverIO plugins and the frontend's probe (D2e).
      - name: Check the build has no end-to-end command, plugin or probe
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          for name in debug_kill_engine e2e_queue_pick e2e_interactive tauri-plugin-wdio TAURI_WEBDRIVER_PORT; do
            if grep -aq "$name" "target/debug/laminapdf-desktop$exe"; then
              echo "::error::the app holds $name without the e2e feature"
              exit 1
            fi
          done
          if grep -rlq -e __laminaE2e -e __wdio apps/desktop/dist; then
            echo "::error::the frontend bundle holds the e2e probe or WebdriverIO's plugin"
            exit 1
          fi

  # The reader's end-to-end scenarios (D2e) against the desktop app's e2e build on each OS:
  # WebdriverIO drives the app through the WebDriver server it embeds (tauri-plugin-wdio-webdriver,
  # feature `e2e`), so no driver is installed. Linux runs it on a virtual display. Screenshots and
  # logs of failed scenarios are uploaded.
  desktop-e2e:
    name: Desktop e2e (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.desktop == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04 }
          - { os: macos, runner: macos-15 }
          - { os: windows, runner: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-shared-key: desktop-e2e
          cache-bin: false
      - uses: ./.github/actions/node-pnpm
      - uses: ./.github/actions/linux-webkit
      - uses: ./.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build the packages the frontend imports
        run: cargo xtask desktop-frontend
      - name: Typecheck the frontend and the scenarios
        run: pnpm --filter @laminapdf/desktop run typecheck:wasm
      # The 1,000-page and 1 GB fixtures, generated (never committed) and cached by what writes them:
      # the example and the crates its bytes come from (path crates aren't in Cargo.lock).
      # The builder's output is the same bytes on every OS, so the three legs share one entry;
      # like the other caches, it is saved only from main.
      - name: Restore the large fixtures
        id: fixtures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fixtures
          key: desktop-e2e-fixtures-${{ hashFiles('crates/laminapdf-desktop-engine/examples/large_pdf.rs', 'crates/laminapdf/src/**', 'crates/laminapdf-build/src/**', 'crates/laminapdf-cos/src/**', 'crates/laminapdf-model/src/**', 'crates/laminapdf-ops/src/**', 'crates/laminapdf-save/src/**', 'crates/laminapdf-syntax/src/**', 'crates/laminapdf-text/src/**', 'crates/laminapdf-test-fixtures/src/**', 'tools/xtask/src/fixtures.rs', 'Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Generate the large fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask fixtures large-pdf --pages 1000 --out target/fixtures/1000-pages.pdf
          cargo xtask fixtures large-pdf
      - name: Save the large fixtures
        if: steps.fixtures.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'linux'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fixtures
          key: ${{ steps.fixtures.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      - name: Build the e2e app (feature e2e, tauri.e2e.conf.json)
        run: pnpm --filter @laminapdf/desktop run desktop:build:e2e
      - name: Run the scenarios
        if: runner.os != 'Linux'
        run: pnpm --filter @laminapdf/desktop run e2e
      # xvfb-run and dbus-run-session come with GitHub's Ubuntu images, not from linux-webkit. The
      # session bus is how a second launch finds the running app (the single-instance plugin);
      # without one, it starts a second app.
      - name: Run the scenarios on a virtual display
        if: runner.os == 'Linux'
        run: >-
          dbus-run-session --
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24"
          pnpm --filter @laminapdf/desktop run e2e
      # Five launches of the e2e build, timed by the app to the empty state accepting input, into the
      # job summary. Recorded, not asserted: the 300 ms gate belongs to the reference machine (D2g).
      - name: Measure the cold start
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum pnpm --filter @laminapdf/desktop run cold-start
          else
            pnpm --filter @laminapdf/desktop run cold-start
          fi
      - name: Upload the failed scenarios' screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: target/desktop-e2e/
          if-no-files-found: ignore

  # The whole `cargo xtask check` on Windows x64 (todo X6): the docs, Rust and TypeScript checks,
  # where the fast lane's Windows legs run only `check rust`. It catches what only Windows breaks:
  # paths, `pnpm.cmd`, line endings, and the docs and website builds.
  check-windows:
    name: Check (Windows x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # node_modules and the docs build nest deeper than Windows' 260-character path limit.
      - run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs exactly what rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # Versions come from package.json and .nvmrc.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  # Four suites in one job, run one after another into one build directory: each takes under a
  # minute and a half, less than waiting for a runner and setting up, and they compile mostly the
  # same crates. Every suite runs even when one before it failed (`!cancelled()`).
  # - ADR 0018 tier 6: lamina vs pypdf's precomputed facts over the full set, 36 fixed-seed
  #   mutants per corpus file (fixtures/differential/full.json). No Python: the facts are
  #   committed. Runs under nextest's ci profile, so a hang is killed.
  # - Todo X2 (full-editor §3): every test tagged `/// capability: <ID> <surface> <status>`; fails
  #   when docs/capabilities/README.md differs from what they prove, or one fails. `cargo xtask
  #   check docs` (in `changes`, every PR) already rejects a README that claims more than any
  #   tagged test could prove; this checks the tests pass. Plain cargo test.
  # - ADR 0018 tier 7 (todo B3c): lamina saves every fixture x proving op x mode, reopens each
  #   output, and qpdf --check, pdf.js and PDFium check them (`cargo xtask roundtrip`; Node for
  #   pdfjs-dist from tools/roundtrip/package.json, a venv with tools/roundtrip/requirements.txt).
  # - Todo B5c (ADR 0018 tiers 3 and 8): the `laminapdf` examples, byte-compared with
  #   fixtures/golden/examples/ and checked by `qpdf --check` (`cargo xtask examples`). Their
  #   render goldens run in the `render-golden` job below, on macOS.
  # qpdf comes from the checksum-verified release in the shared setup action.
  suites:
    name: Suites (differential, capability matrix, round trip, examples)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qpdf
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: qpdf and the Python venv (pypdfium2)
        run: |
          qpdf --version
          python3 -m venv "$RUNNER_TEMP/roundtrip-venv"
          "$RUNNER_TEMP/roundtrip-venv/bin/pip" install -r tools/roundtrip/requirements.txt
      - name: Differential (full mutant set)
        run: cargo xtask differential --full
      - name: Capability matrix
        if: ${{ !cancelled() }}
        run: cargo xtask capabilities --check
      - name: Round trip (lamina, qpdf, pdf.js, PDFium)
        if: ${{ !cancelled() }}
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/roundtrip-venv/bin/python
        run: cargo xtask roundtrip
      - name: Examples (goldens, qpdf)
        if: ${{ !cancelled() }}
        run: cargo xtask examples
      - name: Upload the round-trip outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roundtrip-outputs
          path: target/xtask/roundtrip/
          if-no-files-found: ignore
      - name: Upload the example outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-outputs
          path: target/examples-out/
          if-no-files-found: ignore

  # The render goldens were written on macOS arm64, and PDFium's rasteriser (fonts, anti-aliasing)
  # differs by platform, so this is the one suite that stays on macOS. It waits for a Mac, so a PR
  # runs it only when it changes what the goldens draw (`render`, todo X9b); pushes to main always do.
  render-golden:
    name: Render goldens (PDFium and hayro)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.render == 'true' }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - name: The Python venv (pypdfium2)
        run: |
          python3 -m venv "$RUNNER_TEMP/render-venv"
          "$RUNNER_TEMP/render-venv/bin/pip" install -r tools/render/requirements.txt
      - name: Render goldens (PDFium and hayro)
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/render-venv/bin/python
        run: cargo xtask render-golden
      - name: Upload the diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-golden-diff
          path: target/xtask/render-golden/diff/
          if-no-files-found: ignore

  # A required check, with ci.yml's `fast-gate`. Fails unless `changes` succeeded with `code`
  # exactly "true" or "false"; then every suite must have succeeded (code) or been skipped
  # (docs-only). Any failure, cancellation, or skip of a suite that should have run fails it.
  # Every code suite must succeed; docs-only changes skip all suites.
  gate:
    name: gate
    if: always()
    needs: [changes, suites, render-golden, fuzz, check-linux, check-windows, desktop, desktop-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every suite passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          RENDER: ${{ needs.changes.outputs.render }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ]; then
            echo "::error::the changes job ended with '$changes'"
            exit 1
          fi
          case "$CODE" in
            true|false) echo "Suites needed: $CODE" ;;
            *)
              echo "::error::the changes job's code output is '$CODE', not true or false"
              exit 1
              ;;
          esac
          failed=0
          for job in $(jq -r 'del(.changes) | keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            # The desktop build and its e2e suite follow their own paths (`desktop`), the render
            # goldens theirs (`render`), every other suite `code`.
            needed=$CODE
            case "$job" in
              desktop | desktop-e2e) needed=$DESKTOP ;;
              render-golden) needed=$RENDER ;;
            esac
            echo "$job: $result"
            case "$needed/$result" in
              true/success | false/skipped) ;;
              *)
                echo "::error::$job ended with '$result' (needed: $needed)"
                failed=1
                ;;
            esac
          done
          exit "$failed"
