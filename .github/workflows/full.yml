# CI full lane (ADR 0018 §2, todo X4): every PR and every push to main, next to the fast lane
# (ci.yml). It always runs, so its required check never waits as "Expected": `changes` decides
# whether the change touches code (the docs allowlist is defined in tools/xtask/src/changes.rs),
# the suites run only if it does (pushes to main always count as code), and `gate` passes when
# every suite passed or was not needed. Branch protection requires `gate` and ci.yml's
# `fast-gate` (todo X7). Never add a workflow-level `paths` filter here.
#
# Adding a suite: give it `needs: changes`, the code-change condition below, and add it to
# `gate.needs`. All code suites are required, including the hosted Linux Arm64 check.
# Fresh hosted VMs replace the persistent Mac runners and Linux container.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Full lane

on:
  pull_request:
    # `edited` too: retargeting a PR (a new base branch) changes what `changes` diffs against.
    # A title or body edit also reruns the lane; the result is the same, only slower.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  # Also runs `cargo xtask check docs` on every PR (gate fails if it fails).
  # `code` is exactly "true" or "false": a PR is docs-only when every path changed since the
  # merge base with its base branch is on the docs allowlist; pushes to main are always code.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.pr.outputs.code || steps.push.outputs.code }}
    steps:
      - name: Pushes to main run every suite
        id: push
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the merge base with the base branch is always present.
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/host-rust
        with:
          cache: true
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"
      # Docs-only PRs skip both lanes' suites, so the docs checks run here, under `gate`:
      # links, prose, snippets, the todo board, portable paths and generated files (no network).
      - name: Docs checks (cargo xtask check docs)
        if: github.event_name == 'pull_request'
        run: cargo xtask check docs

  # ADR 0018 tier 9: every fuzz target under default Limits, 2 at once (`--jobs 2`: built once,
  # then separate cargo-fuzz processes): 30 s per target on PRs, a smoke test that keeps the PR
  # lane short, and 2 minutes on pushes to main, so the corpus main saves keeps growing (the
  # nightly lane runs 10 minutes per target). Every run starts from the corpus last saved on
  # main; only pushes to main save it, minimised first (`cargo fuzz cmin`), so the cache stays
  # one bounded entry per runner OS.
  fuzz:
    name: Fuzz smoke (${{ github.event_name == 'pull_request' && '30 s' || '2 min' }} per target)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned stable toolchain (rust-toolchain.toml) builds xtask; fuzz/ needs nightly.
      - uses: laudebugs/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: laudebugs/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the fuzz corpus saved on main
        uses: laudebugs/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-
      # Adds the seeds from fixtures/ and fuzz/seeds/ to the corpus, builds every target, then
      # fuzzes them 2 at once to fit the hosted Mac's memory with libFuzzer's
      # per-input timeout scaled to 40 s for the shared CPU, and at most 4 x 2048 MB of memory;
      # fails if any target failed (all of them still run).
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '30' || '120' }}
        run: cargo xtask fuzz --all --time "$SECONDS_PER_TARGET" --jobs 2
      - name: Minimise the corpus before saving it
        if: github.event_name == 'push'
        run: cargo xtask fuzz cmin
      - name: Save the fuzz corpus
        if: github.event_name == 'push'
        uses: laudebugs/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: laudebugs/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
      # Each target's libFuzzer output, streamed to a file while it runs, so a cancelled or
      # timed-out job still shows how far every target got.
      - name: Upload the fuzz logs
        if: ${{ failure() || cancelled() }}
        uses: laudebugs/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-logs
          path: target/xtask/fuzz/
          if-no-files-found: ignore

  # Full Rust and TypeScript checks on hosted Linux Arm64, in addition to ci.yml's
  # six-platform native Rust matrix. Every code change must pass this job.
  check-linux:
    name: Check (Linux ARM64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs exactly what rust-toolchain.toml pins.
      - uses: laudebugs/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Dependencies' build output and the registry. Only pushes to main save it (PR caches
          # are scoped to their PR anyway; this keeps them from filling the repository's quota).
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # The tools come from install-action below on every run.
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: laudebugs/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # Versions come from package.json and .nvmrc.
      - uses: laudebugs/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: laudebugs/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  # Four suites in one job, run one after another into one build directory: each takes under a
  # minute and a half, less than waiting for a runner and setting up, and they compile mostly the
  # same crates. Every suite runs even when one before it failed (`!cancelled()`).
  # - ADR 0018 tier 6: lamina vs pypdf's precomputed facts over the full set, 36 fixed-seed
  #   mutants per corpus file (fixtures/differential/full.json). No Python: the facts are
  #   committed. Runs under nextest's ci profile, so a hang is killed.
  # - Todo X2 (full-editor §3): every test tagged `/// capability: <ID> <surface> <status>`; fails
  #   when docs/capabilities/README.md differs from what they prove, or one fails. `cargo xtask
  #   check docs` (in `changes`, every PR) already rejects a README that claims more than any
  #   tagged test could prove; this checks the tests pass. Plain cargo test.
  # - ADR 0018 tier 7 (todo B3c): lamina saves every fixture x proving op x mode, reopens each
  #   output, and qpdf --check, pdf.js and PDFium check them (`cargo xtask roundtrip`; Node for
  #   pdfjs-dist from tools/roundtrip/package.json, a venv with tools/roundtrip/requirements.txt).
  # - Todo B5c (ADR 0018 tiers 3 and 8): the `laminapdf` examples, byte-compared with
  #   fixtures/golden/examples/ and checked by `qpdf --check` (`cargo xtask examples`), then every
  #   page rendered by PDFium (a venv with tools/render/requirements.txt) and hayro, compared with
  #   fixtures/render-golden/ and with each other (`cargo xtask render-golden`).
  # qpdf comes from the checksum-verified release in the shared setup action.
  suites:
    name: Suites (differential, capability matrix, round trip, examples and render goldens)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: laudebugs/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qpdf
      - uses: laudebugs/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: laudebugs/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: laudebugs/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150
      - uses: laudebugs/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: qpdf and the Python venvs (pypdfium2)
        run: |
          qpdf --version
          python3 -m venv "$RUNNER_TEMP/roundtrip-venv"
          "$RUNNER_TEMP/roundtrip-venv/bin/pip" install -r tools/roundtrip/requirements.txt
          python3 -m venv "$RUNNER_TEMP/render-venv"
          "$RUNNER_TEMP/render-venv/bin/pip" install -r tools/render/requirements.txt
      - name: Differential (full mutant set)
        run: cargo xtask differential --full
      - name: Capability matrix
        if: ${{ !cancelled() }}
        run: cargo xtask capabilities --check
      - name: Round trip (lamina, qpdf, pdf.js, PDFium)
        if: ${{ !cancelled() }}
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/roundtrip-venv/bin/python
        run: cargo xtask roundtrip
      - name: Examples (goldens, qpdf)
        if: ${{ !cancelled() }}
        run: cargo xtask examples
      - name: Render goldens (PDFium and hayro)
        if: ${{ !cancelled() }}
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/render-venv/bin/python
        run: cargo xtask render-golden
      - name: Upload the round-trip outputs
        if: failure()
        uses: laudebugs/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roundtrip-outputs
          path: target/xtask/roundtrip/
          if-no-files-found: ignore
      - name: Upload the example outputs and diff images
        if: failure()
        uses: laudebugs/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-outputs
          path: |
            target/examples-out/
            target/xtask/render-golden/diff/
          if-no-files-found: ignore

  # A required check, with ci.yml's `fast-gate`. Fails unless `changes` succeeded with `code`
  # exactly "true" or "false"; then every suite must have succeeded (code) or been skipped
  # (docs-only). Any failure, cancellation, or skip of a suite that should have run fails it.
  # Every code suite must succeed; docs-only changes skip all suites.
  gate:
    name: gate
    if: always()
    needs: [changes, suites, fuzz, check-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every suite passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ]; then
            echo "::error::the changes job ended with '$changes'"
            exit 1
          fi
          case "$CODE" in
            true|false) echo "Suites needed: $CODE" ;;
            *)
              echo "::error::the changes job's code output is '$CODE', not true or false"
              exit 1
              ;;
          esac
          failed=0
          for job in $(jq -r 'del(.changes) | keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            echo "$job: $result"
            case "$CODE/$result" in
              true/success | false/skipped) ;;
              *)
                echo "::error::$job ended with '$result' (suites needed: $CODE)"
                failed=1
                ;;
            esac
          done
          exit "$failed"
