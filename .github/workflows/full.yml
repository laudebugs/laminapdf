# CI full lane (ADR 0018 §2, todo X4): every PR and every push to main, next to the fast lane
# (ci.yml). It always runs, so its required check never waits as "Expected": `changes` reports
# which groups of suites the change can affect (tools/xtask/src/changes.rs), each suite runs only
# when its flag is true (pushes to main set every flag), and `gate` passes when every suite passed
# or was not needed. Branch protection requires `gate` and ci.yml's `fast-gate` (todo X7). Never
# add a workflow-level `paths` filter here.
#
# Adding a suite: give it `needs: changes`, an `if:` on its flag (`code` unless a narrower one
# fits: `desktop-run`, `rust`; CI caching plan §8.1), and add it to `gate.needs`; a suite on any
# flag but `code` also needs a line in the gate's `case`. A live differential added to the
# nightly needs its `differential-<mode>` flag and a sampled step in `live-differentials`, which
# tools/xtask/src/workflows/differential.rs checks. The desktop job also leaves out each leg that
# already passed on the same inputs (todo X10b). The render goldens run in ci.yml's macOS Arm64
# Rust leg, so this lane waits for at most one Mac. All suites are required, including the hosted
# Linux Arm64 and Windows x64 checks.
# Fresh hosted VMs replace the persistent Mac runners and Linux container.
# Actions are locked by .github/workflows/actions.lock (ADR 0019, todo X11): `uses:` names a release
# tag, and `gh actions-lock` rewrites the lockfile after a `uses:` line changes; Dependabot bumps both.
name: Full lane

on:
  pull_request:
    # Not `edited`: a title or body edit would rerun every suite, Macs included, and a run that
    # skipped itself would post a passing `gate` over the real one. After retargeting a PR (a new
    # base branch), rerun the lane or push, as for ci.yml.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  # Newer runs cancel older ones, on PRs and on main (todo X9d; ADR 0018 §2).
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  # Also runs `cargo xtask check docs` on every PR (gate fails if it fails).
  # `code` is exactly "true" or "false": a PR is docs-only when every path changed since the
  # merge base with its base branch is on the docs allowlist; pushes to main are always code.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Listing the cache entries that name a desktop leg's pass (todo X10b).
      actions: read
    outputs:
      code: ${{ steps.pr.outputs.code || steps.push.outputs.code }}
      desktop: ${{ steps.pr.outputs.desktop || steps.push.outputs.desktop }}
      # Whether the desktop job has a leg to run, and the legs (todo X10b).
      desktop-run: ${{ steps.desktop.outputs.run }}
      desktop-legs: ${{ steps.desktop.outputs.legs }}
      rust: ${{ steps.pr.outputs.rust || steps.push.outputs.rust }}
      ts: ${{ steps.pr.outputs.ts || steps.push.outputs.ts }}
      # Whether any live differential's inputs changed, and which (live/mode.rs's modes).
      differential: ${{ steps.pr.outputs.differential || steps.push.outputs.differential }}
      differential-facts: ${{ steps.pr.outputs.differential-facts || steps.push.outputs.differential-facts }}
      differential-text: ${{ steps.pr.outputs.differential-text || steps.push.outputs.differential-text }}
      differential-xmp: ${{ steps.pr.outputs.differential-xmp || steps.push.outputs.differential-xmp }}
      differential-inspect: ${{ steps.pr.outputs.differential-inspect || steps.push.outputs.differential-inspect }}
    steps:
      - name: Pushes to main run every suite
        id: push
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "code=true"
            echo "desktop=true"
            echo "rust=true"
            echo "ts=true"
            echo "differential=true"
            echo "differential-facts=true"
            echo "differential-text=true"
            echo "differential-xmp=true"
            echo "differential-inspect=true"
          } >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Full history, so the merge base with the base branch is always present.
          fetch-depth: 0
      - name: Set up the host Rust toolchain
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/host-rust
        with:
          cache: true
          shared-key: xtask
          save: "false"
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"
      # Docs-only PRs skip both lanes' suites, so the docs checks run here, under `gate`:
      # links, prose, snippets, the todo board, portable paths and generated files (no network).
      - name: Docs checks (cargo xtask check docs)
        if: github.event_name == 'pull_request'
        run: cargo xtask check docs
      # Todo X10b: each desktop leg saves an empty cache entry, desktop-passed-<key>-<os>,
      # once it passes, where <key> names the contents of every file the desktop job reads
      # (`cargo xtask desktop-key`). A PR leaves out each leg with such an entry, saved by this PR
      # or by main (the only scopes a PR's run can restore from), for its own key. Pushes to main
      # run every leg. A failed lookup leaves nothing out.
      - name: Choose the desktop legs
        id: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DESKTOP: ${{ steps.pr.outputs.desktop || steps.push.outputs.desktop }}
          KEY: ${{ steps.pr.outputs.desktop-key }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          legs='[
            {"os": "linux", "runner": "ubuntu-22.04"},
            {"os": "macos", "runner": "macos-15"},
            {"os": "windows", "runner": "windows-2025"}
          ]'
          passed='[]'
          if [ "$EVENT" = pull_request ] && [ "$DESKTOP" = true ]; then
            passed=$(for ref in "$PR_REF" refs/heads/main; do
              gh api -X GET "repos/$REPO/actions/caches" -f key="desktop-passed-$KEY-" -f ref="$ref" \
                -F per_page=100 --jq '[.actions_caches[].key]' || echo '[]'
            done | jq -cs 'add')
          fi
          chosen='[]'
          if [ "$DESKTOP" = true ]; then
            chosen=$(jq -c --arg prefix "desktop-passed-$KEY-" --argjson passed "$passed" \
              '[.[] | select((($prefix + .os) as $k | $passed | index($k)) == null)]' <<<"$legs")
          fi
          run=true
          if [ "$chosen" = '[]' ]; then run=false; fi
          {
            echo "legs=$chosen"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"
          echo "desktop legs: $chosen"

  # ADR 0018 tier 9: every fuzz target under default Limits, 2 at once (`--jobs 2`: built once,
  # then separate cargo-fuzz processes): 30 s per target on PRs, a smoke test that keeps the PR
  # lane short, and 2 minutes on pushes to main, so the corpus main saves keeps growing (the
  # nightly lane runs 10 minutes per target). Every run starts from the corpus last saved on
  # main; only pushes to main save it, minimised first (`cargo fuzz cmin`), so the cache stays
  # one bounded entry per runner OS.
  fuzz:
    name: Fuzz smoke (${{ github.event_name == 'pull_request' && '30 s' || '2 min' }} per target)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The pinned stable toolchain (rust-toolchain.toml) builds xtask; fuzz/ needs nightly.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - name: Install cargo-fuzz
        uses: $/.github/actions/install-tools
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the fuzz corpus saved on main
        uses: actions/cache/restore@v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-
      # Adds the seeds from fixtures/ and fuzz/seeds/ to the corpus, builds every target, then
      # fuzzes them 2 at once to fit the hosted runner's memory with libFuzzer's
      # per-input timeout scaled to 40 s for the shared CPU, and at most 4 x 2048 MB of memory;
      # fails if any target failed (all of them still run).
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '30' || '120' }}
        run: cargo xtask fuzz --all --time "$SECONDS_PER_TARGET" --jobs 2
      - name: Minimise the corpus before saving it
        if: github.event_name == 'push'
        run: cargo xtask fuzz cmin
      - name: Save the fuzz corpus
        if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
      # Each target's libFuzzer output, streamed to a file while it runs, so a cancelled or
      # timed-out job still shows how far every target got.
      - name: Upload the fuzz logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-logs
          path: target/xtask/fuzz/
          if-no-files-found: ignore

  # Full Rust and TypeScript checks on hosted Linux Arm64, in addition to ci.yml's
  # six-platform native Rust matrix. Every code change must pass this job.
  check-linux:
    name: Check (Linux ARM64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs exactly what rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          # ci.yml's Rust job's linux-arm64 leg builds the same and saves this cache on main; this
          # job only restores it (one cache, not two copies of about 600 MB).
          cache: true
          cache-save-if: false
          cache-shared-key: rust
          # The tools come from install-tools below on every run.
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - name: Install cargo-nextest and cargo-deny
        uses: $/.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # Versions come from package.json and .nvmrc.
      # The pnpm store is restored on every run and saved only on pushes to main (node-pnpm).
      - name: Set up Node and pnpm
        uses: $/.github/actions/node-pnpm
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      - name: Install WebKitGTK (Linux only)
        uses: $/.github/actions/linux-webkit
      - run: cargo xtask check

  # The desktop app (apps/desktop, ADR 0008) on each OS, in one job so each OS waits for one runner
  # (a Mac's queue is the lane's longest). First the app built the way `tauri build` builds it,
  # without installers (D6b makes those), and checked; then the reader's end-to-end scenarios (D2e)
  # against its e2e build: WebdriverIO drives the app through the WebDriver server it embeds
  # (tauri-plugin-wdio-webdriver, feature `e2e`), so no driver is installed, and Linux runs it on a
  # virtual display. Screenshots and logs of failed scenarios are uploaded. Only when `cargo xtask
  # changes` says the app's inputs changed (`desktop`: the app, packages/, crates/, the manifests,
  # lockfiles and toolchain, this workflow); the gate requires it then. Ubuntu 22.04: the oldest
  # Linux the app supports, so its glibc and WebKitGTK are the floor.
  desktop:
    name: Desktop build and e2e (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.desktop-run == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # The `changes` job's list: Linux, macOS and Windows, less those that passed on these inputs.
        include: ${{ fromJSON(needs.changes.outputs.desktop-legs) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Installs exactly what rust-toolchain.toml pins. Its own cache: only this job builds the
      # app's debug binaries with Tauri's tree, saved on pushes to main.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-shared-key: desktop
          cache-bin: false
      - name: Set up Node and pnpm
        uses: $/.github/actions/node-pnpm
      - name: Install WebKitGTK (Linux only)
        uses: $/.github/actions/linux-webkit
      - name: Install wasm-bindgen
        uses: $/.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      # The frontend imports the built @laminapdf/ui, tokens, fonts and icons, and the viewer over
      # @laminapdf/sdk and its WebAssembly (D2d).
      - name: Build the packages the frontend imports
        run: cargo xtask desktop-frontend
      - name: Typecheck the frontend against them
        run: pnpm --filter @laminapdf/desktop run typecheck:wasm
      # desktop:build merges tauri.bundle.conf.json, whose beforeBuildCommand runs
      # `cargo xtask desktop-sidecar` (the engine, and PDFium from its pinned, hash-checked release).
      - name: Build the app with its engine and PDFium (tauri build --debug --no-bundle)
        run: pnpm --filter @laminapdf/desktop run desktop:build --debug --no-bundle
      # Tauri copied the sidecar and the resources next to the app: neither may be missing or empty.
      - name: Check the engine and PDFium are next to the app
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          test -s "target/debug/laminapdf-desktop-engine$exe"
          find target/debug/pdfium -maxdepth 1 -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -size +1M | grep -q .
      # The app renders through its engine, never the viewer's WebAssembly, so none ships.
      - name: Check the frontend ships no WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          found=$(find apps/desktop/dist -name '*.wasm')
          if [ -n "$found" ]; then
            echo "::error::apps/desktop/dist holds WebAssembly: $found"
            exit 1
          fi
      # ADR 0008 §3: the main process never links the PDF parser or PDFium. ADR 0014 §10: nor the
      # minidump parser — it reads dumps by spawning a sandboxed engine, so only the dump writer
      # (minidump-writer, through minidumper, for the monitor the app binary also is) may appear,
      # never the reader, minidump, or its unwinder, minidump-unwind. Exact names; the app and protocol
      # crate are expected.
      - name: Check the main process links no parser or renderer
        shell: bash
        run: |
          set -euo pipefail
          found=$(cargo tree --locked -p laminapdf-desktop -e normal --prefix none --format '{p}' \
            | awk '{print $1}' | sort -u \
            | grep -Fx -e laminapdf -e laminapdf-render -e laminapdf-render-pdfium -e laminapdf-desktop-engine \
                -e pdfium-render -e minidump -e minidump-unwind || true)
          if [ -n "$found" ]; then
            echo "::error::laminapdf-desktop depends on $found"
            exit 1
          fi
      # ADR 0008 §8: only builds with the `e2e` feature have the end-to-end tests' commands, the
      # WebdriverIO plugins and the frontend's probe (D2e).
      - name: Check the build has no end-to-end command, plugin or probe
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          for name in debug_kill_engine e2e_queue_pick e2e_interactive e2e_crash_ DebugPanic tauri-plugin-wdio TAURI_WEBDRIVER_PORT "startup timings" update-test.json; do
            if grep -aq "$name" "target/debug/laminapdf-desktop$exe"; then
              echo "::error::the app holds $name without the e2e feature"
              exit 1
            fi
          done
          # The engine obeys the tests' forced panic and fault only when built for them (desktop-sidecar --e2e).
          for name in DebugPanic DebugSegv; do
            if grep -aq "$name" "target/debug/laminapdf-desktop-engine$exe"; then
              echo "::error::the engine holds $name without its e2e feature"
              exit 1
            fi
          done
          if grep -rlq -e __laminaE2e -e __wdio apps/desktop/dist; then
            echo "::error::the frontend bundle holds the e2e probe or WebdriverIO's plugin"
            exit 1
          fi
      # The 1,000-page and 1 GB fixtures, generated (never committed) and cached by what writes them:
      # the example and the crates its bytes come from (path crates aren't in Cargo.lock).
      # The builder's output is the same bytes on every OS, so the three legs share one entry;
      # like the other caches, it is saved only from main.
      - name: Restore the large fixtures
        id: fixtures
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/fixtures
          key: desktop-e2e-fixtures-${{ hashFiles('crates/laminapdf-desktop-engine/examples/large_pdf.rs', 'crates/laminapdf/src/**', 'crates/laminapdf-build/src/**', 'crates/laminapdf-cos/src/**', 'crates/laminapdf-model/src/**', 'crates/laminapdf-ops/src/**', 'crates/laminapdf-save/src/**', 'crates/laminapdf-syntax/src/**', 'crates/laminapdf-text/src/**', 'crates/laminapdf-test-fixtures/src/**', 'tools/xtask/src/fixtures.rs', 'Cargo.lock') }}
          enableCrossOsArchive: true
      - name: Generate the large fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask fixtures large-pdf --pages 1000 --out target/fixtures/1000-pages.pdf
          cargo xtask fixtures large-pdf
      - name: Save the large fixtures
        if: steps.fixtures.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'linux'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/fixtures
          key: ${{ steps.fixtures.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      - name: Build the e2e app (feature e2e, tauri.e2e.conf.json)
        run: pnpm --filter @laminapdf/desktop run desktop:build:e2e
      - name: Run the scenarios
        if: runner.os != 'Linux'
        run: pnpm --filter @laminapdf/desktop run e2e
      # xvfb-run and dbus-run-session come with GitHub's Ubuntu images, not from linux-webkit. The
      # session bus is how a second launch finds the running app (the single-instance plugin);
      # without one, it starts a second app.
      - name: Run the scenarios on a virtual display
        if: runner.os == 'Linux'
        run: >-
          dbus-run-session --
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24"
          pnpm --filter @laminapdf/desktop run e2e
      # Five launches of the e2e build, timed by the app to the empty state accepting input, into the
      # job summary. Recorded, not asserted: the 300 ms gate belongs to the reference machine (D2g).
      - name: Measure the cold start
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum pnpm --filter @laminapdf/desktop run cold-start
          else
            pnpm --filter @laminapdf/desktop run cold-start
          fi
      # Todo X10b: this leg passed on these inputs, so a later run with the same ones leaves it out.
      - name: Name this leg's pass
        id: passed
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p target/desktop-passed
          echo "$GITHUB_RUN_ID" > target/desktop-passed/run
          echo "key=desktop-passed-$(cargo xtask desktop-key)-$OS" >> "$GITHUB_OUTPUT"
      - name: Save this leg's pass
        uses: actions/cache/save@v6.1.0
        with:
          path: target/desktop-passed
          key: ${{ steps.passed.outputs.key }}
      - name: Upload the failed scenarios' screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: target/desktop-e2e/
          if-no-files-found: ignore

  # The whole `cargo xtask check` on Windows x64 (todo X6): the docs, Rust and TypeScript checks,
  # where the fast lane's Windows legs run only `check rust`. It catches what only Windows breaks:
  # paths, `pnpm.cmd`, line endings, and the docs and website builds.
  check-windows:
    name: Check (Windows x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # node_modules and the docs build nest deeper than Windows' 260-character path limit.
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs exactly what rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - name: Install cargo-nextest and cargo-deny
        uses: $/.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # Versions come from package.json and .nvmrc.
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  # Four suites in one job, run one after another into one build directory: each takes under a
  # minute and a half, less than waiting for a runner and setting up, and they compile mostly the
  # same crates. Every suite runs even when one before it failed (`!cancelled()`).
  # - ADR 0018 tier 6: lamina vs pypdf's precomputed facts over the full set, 36 fixed-seed
  #   mutants per corpus file (fixtures/differential/full.json). No Python: the facts are
  #   committed. Runs under nextest's ci profile, so a hang is killed.
  # - Todo X2 (full-editor §3): every test tagged `/// capability: <ID> <surface> <status>`; fails
  #   when docs/capabilities/README.md differs from what they prove, or one fails. `cargo xtask
  #   check docs` (in `changes`, every PR) already rejects a README that claims more than any
  #   tagged test could prove; this checks the tests pass. Plain cargo test.
  # - ADR 0018 tier 7 (todo B3c): lamina saves every fixture x proving op x mode, reopens each
  #   output, and qpdf --check, pdf.js and PDFium check them (`cargo xtask roundtrip`; Node for
  #   pdfjs-dist from tools/roundtrip/package.json, a venv with tools/roundtrip/requirements.txt).
  # - Todo B5c (ADR 0018 tiers 3 and 8): the `laminapdf` examples, byte-compared with
  #   fixtures/golden/examples/ and checked by `qpdf --check` (`cargo xtask examples`). Their
  #   render goldens run in ci.yml's macOS Arm64 Rust leg.
  # qpdf comes from the checksum-verified release in the shared setup action.
  suites:
    name: Suites (differential, capability matrix, round trip, examples)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install qpdf
        uses: $/.github/actions/qpdf
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - name: Install cargo-nextest
        uses: $/.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: qpdf and the Python venv (pypdfium2)
        run: |
          qpdf --version
          python3 -m venv "$RUNNER_TEMP/roundtrip-venv"
          "$RUNNER_TEMP/roundtrip-venv/bin/pip" install -r tools/roundtrip/requirements.txt
      - name: Differential (full mutant set)
        run: cargo xtask differential --full
      - name: Capability matrix
        if: ${{ !cancelled() }}
        run: cargo xtask capabilities --check
      - name: Round trip (lamina, qpdf, pdf.js, PDFium)
        if: ${{ !cancelled() }}
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/roundtrip-venv/bin/python
        run: cargo xtask roundtrip
      - name: Examples (goldens, qpdf)
        if: ${{ !cancelled() }}
        run: cargo xtask examples
      - name: Upload the round-trip outputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: roundtrip-outputs
          path: target/xtask/roundtrip/
          if-no-files-found: ignore
      - name: Upload the example outputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: examples-outputs
          path: target/examples-out/
          if-no-files-found: ignore

  # The nightly's live differentials (ADR 0018 tier 6) on a stratified sample of 40 inputs each,
  # so a change to what one compares fails here, not on the next night. What one compares is its
  # xtask code, its exceptions file, the example that writes Lamina PDF's side and the crates it
  # builds from, the committed PDFs it reads, and its tool runners and pins. `changes` sets `differential-<mode>` for each mode whose inputs changed
  # (tools/xtask/src/changes/differential.rs) and `differential` when any did; only those modes'
  # tools are set up and run. The sample is the same files on every run (live.rs's `sample`).
  # The setup is the nightly's (.github/actions/differential-tools).
  live-differentials:
    name: Live differentials (sampled)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.differential == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAMPLE: "40"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up the host Rust toolchain
        uses: $/.github/actions/host-rust
        with:
          cache: true
      - name: Fetch the corpus and install the tools
        uses: $/.github/actions/differential-tools
        with:
          facts: ${{ needs.changes.outputs.differential-facts }}
          text: ${{ needs.changes.outputs.differential-text }}
          xmp: ${{ needs.changes.outputs.differential-xmp }}
          inspect: ${{ needs.changes.outputs.differential-inspect }}
      # Each runs even when one before it failed, so one run reports them all.
      - name: Differential
        if: ${{ !cancelled() && needs.changes.outputs.differential-facts == 'true' }}
        run: cargo xtask differential --live --sample "$SAMPLE"
      - name: Text differential
        if: ${{ !cancelled() && needs.changes.outputs.differential-text == 'true' }}
        run: cargo xtask differential --live --text --sample "$SAMPLE"
      - name: XMP differential
        if: ${{ !cancelled() && needs.changes.outputs.differential-xmp == 'true' }}
        run: cargo xtask differential --live --xmp --sample "$SAMPLE"
      - name: Inspection differential
        if: ${{ !cancelled() && needs.changes.outputs.differential-inspect == 'true' }}
        run: cargo xtask differential --live --inspect --sample "$SAMPLE"
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: differential-reports
          path: |
            target/nightly/differential/*.json
            target/nightly/differential/*.md
            target/nightly/differential-text/*.json
            target/nightly/differential-text/*.md
            target/nightly/differential-xmp/*.json
            target/nightly/differential-xmp/*.md
            target/nightly/differential-inspect/*.json
            target/nightly/differential-inspect/*.md
          if-no-files-found: ignore

  # A required check, with ci.yml's `fast-gate`. Fails unless `changes` succeeded with every flag
  # exactly "true" or "false"; then each suite must have succeeded when its flag is true, or been
  # skipped when it is false. Any failure, cancellation, or skip of a suite that should have run
  # fails it.
  gate:
    name: gate
    if: always()
    needs: [changes, suites, fuzz, check-linux, check-windows, desktop, live-differentials]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every suite passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          DESKTOP_RUN: ${{ needs.changes.outputs.desktop-run }}
          RUST: ${{ needs.changes.outputs.rust }}
          TS: ${{ needs.changes.outputs.ts }}
          DIFFERENTIAL: ${{ needs.changes.outputs.differential }}
          DIFFERENTIAL_FACTS: ${{ needs.changes.outputs.differential-facts }}
          DIFFERENTIAL_TEXT: ${{ needs.changes.outputs.differential-text }}
          DIFFERENTIAL_XMP: ${{ needs.changes.outputs.differential-xmp }}
          DIFFERENTIAL_INSPECT: ${{ needs.changes.outputs.differential-inspect }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ]; then
            echo "::error::the changes job ended with '$changes'"
            exit 1
          fi
          for flag in "code=$CODE" "desktop=$DESKTOP" "desktop-run=$DESKTOP_RUN" \
            "rust=$RUST" "ts=$TS" "differential=$DIFFERENTIAL" \
            "differential-facts=$DIFFERENTIAL_FACTS" "differential-text=$DIFFERENTIAL_TEXT" \
            "differential-xmp=$DIFFERENTIAL_XMP" "differential-inspect=$DIFFERENTIAL_INSPECT"; do
            case "${flag#*=}" in
              true|false) echo "Needed: $flag" ;;
              *)
                echo "::error::the changes job's ${flag%%=*} output is '${flag#*=}', not true or false"
                exit 1
                ;;
            esac
          done
          failed=0
          for job in $(jq -r 'del(.changes) | keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            # Each job follows a flag (todos X9c, X10b): desktop `desktop-run` (false when no leg
            # is left to run); fuzz `rust`; live-differentials `differential`; the others `code`,
            # since check-linux and check-windows run the whole `cargo xtask check` and the suites
            # read both Rust and the TypeScript tests' capability tags.
            needed=$CODE
            case "$job" in
              desktop) needed=$DESKTOP_RUN ;;
              fuzz) needed=$RUST ;;
              live-differentials) needed=$DIFFERENTIAL ;;
            esac
            echo "$job: $result"
            case "$needed/$result" in
              true/success | false/skipped) ;;
              *)
                echo "::error::$job ended with '$result' (needed: $needed)"
                failed=1
                ;;
            esac
          done
          exit "$failed"
