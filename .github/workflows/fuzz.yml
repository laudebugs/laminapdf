# Scheduled fuzzing (ADR 0018 tier 9): every fuzz target for 10 minutes under default Limits,
# nightly and on demand. Crashes are uploaded as artefacts; each becomes a minimised file in
# fixtures/regressions/ and a named test (fuzz/README.md). X3a folds this into the nightly lane.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Fuzz

on:
  # TEMPORARY (B2c acceptance): one 60 s run per target on the PR; removed before merge.
  pull_request:
    paths: [".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse_object, flate_decode, open, page_tree]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned stable toolchain (rust-toolchain.toml) builds xtask; fuzz/ needs nightly.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      # Builds fuzz/corpus/<target> from fixtures/ and fuzz/seeds/, then runs
      # cargo +nightly fuzz run <target> -- -max_total_time=… -timeout=10 -rss_limit_mb=2048.
      - name: Fuzz ${{ matrix.target }} for ${{ env.FUZZ_SECONDS }} s
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask fuzz "$TARGET" --time "$FUZZ_SECONDS"
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
