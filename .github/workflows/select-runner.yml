# Picks the runner for CI jobs: a self-hosted runner when one is online, otherwise GitHub-hosted
# Ubuntu. Callers use `runs-on: ${{ fromJSON(needs.<job>.outputs.runner) }}`.
# Listing self-hosted runners needs Administration read access, which github.token lacks, so the
# lookup uses the RUNNER_STATUS_TOKEN secret. Without it, everything runs on GitHub-hosted Ubuntu.
name: Select preferred runner

on:
  workflow_call:
    secrets:
      RUNNER_STATUS_TOKEN:
        description: Optional token with repository Administration read access for runner status.
        required: false
    outputs:
      runner:
        description: JSON array of runner labels for runs-on.
        value: ${{ jobs.choose.outputs.runner }}

permissions:
  contents: read

jobs:
  choose:
    name: Select runner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      # No checkout: the status token is used only by this inline API request.
      - name: Prefer an online self-hosted runner
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN != '' }}
        with:
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          retries: 0
          script: |
            // Only runners with all of these labels count, and jobs ask for exactly these, so a
            // different self-hosted runner (Linux, x64) can't make the check pass or take the job.
            const selfHosted = ["self-hosted", "macOS", "ARM64"];
            let runner = ["ubuntu-latest"];
            let reason;
            const pr = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (pr && pr.head.repo?.full_name !== repository) {
              // Keeps fork code off the self-hosted machines in the normal case. Not a security
              // boundary: a PR runs its own copy of this workflow. Restricting who can open PRs
              // (or runner-group settings) is what actually enforces that.
              reason = "Fork pull requests use GitHub-hosted Ubuntu.";
            } else if (process.env.HAS_RUNNER_STATUS_TOKEN !== "true") {
              reason = "RUNNER_STATUS_TOKEN is not configured; using GitHub-hosted Ubuntu.";
              core.warning(reason);
            } else {
              try {
                const runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForRepo, {
                  ...context.repo,
                  per_page: 100,
                  // Octokit uses fetch, which ignores request.timeout; abort with a signal instead.
                  request: { signal: AbortSignal.timeout(10000) },
                });
                const online = runners.some((candidate) =>
                  candidate.status === "online" &&
                  selfHosted.every((name) => candidate.labels.some((label) => label.name === name))
                );
                if (online) {
                  runner = selfHosted;
                  reason = "An online self-hosted runner is available; busy runners may queue work.";
                } else {
                  reason = "No online self-hosted runner is available; using GitHub-hosted Ubuntu.";
                }
              } catch {
                reason = "Runner status lookup failed; using GitHub-hosted Ubuntu.";
                core.warning(reason);
              }
            }
            core.setOutput("runner", JSON.stringify(runner));
            core.info(reason);
            // The summary is informational: a failure writing it must not fail the job.
            try {
              await core.summary
                .addHeading("Runner selection")
                .addRaw(`${reason}\n\nRequested labels: ${JSON.stringify(runner)}\n`)
                .write();
            } catch (error) {
              core.warning(`Could not write the job summary: ${error}`);
            }
