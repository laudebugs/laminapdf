# Nightly lane (ADR 0018 §2; todo X3a): the expensive, environment-sensitive checks, every night on
# main and on demand. A failure opens (or comments on) an issue labelled `nightly` and blocks the
# next release (B7b's release lane checks this workflow's latest run on main), not unrelated PRs.
#
#   differential  lamina vs live pdf.js, PDFium, qpdf and pypdf over the external corpus and the
#                 nightly mutant set (`cargo xtask corpus fetch`, `cargo xtask differential --live`),
#                 then lamina's page text vs pdf.js and pdftotext over the external corpus
#                 (`cargo xtask differential --live --text`; todo B9f)
#   fuzz          every target of harness::FUZZ_TARGETS for 10 minutes, corpus kept in the Actions
#                 cache, crashes minimised and uploaded, each run's summary (executions, corpus size)
#                 uploaded for `proof` (`cargo xtask fuzz <target> --time 600`, `cargo xtask fuzz tmin`)
#   scaling       release-mode #[ignore]d tests, one retry that only reports flakiness
#                 (`cargo xtask scaling`)
#   bench         criterion benchmarks with history on the `bench-data` branch, after every job
#                 that doesn't depend on them; a regression
#                 over 10% opens an issue, never fails the run (`cargo xtask bench`)
#   pdf-runtimes  @laminapdf/sdk's example suite in Node, Chromium, Firefox, WebKit, Deno, Bun and
#                 workerd, its timings and WebAssembly memory recorded in the benchmark history
#                 (`cargo xtask pdf-runtimes --record`; todo B6c); never a regression issue
#   links         every external URL in the tracked Markdown answers, with retries, a per-host
#                 rate limit and an allowlist (`cargo xtask docs-links --external`; todo X3c)
#   render-diff   every page (the first 20 per file) of the external corpus by laminapdf-render's
#                 hayro and PDFium adapters at 96 DPI, compared with the hayro-parity spike's
#                 metric; the pass rate per source goes to the bench-data history
#                 (`render-diff/<source>`), and a drop of more than 2 points opens an issue,
#                 never a failure (`cargo xtask render-diff`; todo X3b)
#   verapdf       every generated example validated by veraPDF for the profiles its XMP claims
#                 (PDF/UA-1, PDF/A-2b, 2u, 3b); any violation fails (`cargo xtask verapdf`;
#                 ADR 0018 tier 10, todo B8b). veraPDF is the pinned Java CLI (doctor.rs), run
#                 as an external process (ADR 0019), with Java 21 from setup-java
#   roundtrip     lamina saves every fixture × op × mode and reopens each output, then qpdf --check,
#                 pdf.js and PDFium check them (`cargo xtask roundtrip`, ADR 0018 tier 7; the full
#                 lane runs it on every push to main too); its counts go to `proof`
#   proof         after the jobs above: their reports gathered into one record, kind "proof" (corpus
#                 outcomes, differentials, render diff, fuzz runs, veraPDF, round trip, runtimes),
#                 appended to the bench-data history only for a full-budget night on main
#                 (`cargo xtask proof --jobs "$NEEDS"`; todo T1a)
#
# Every step is a `cargo xtask …` command that runs locally too; `cargo xtask nightly --quick`
# runs them all with short budgets.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Nightly
# The run's title says whether it was a full nightly, for the release guard (ADR 0018 §2,
# `cargo xtask release-guard`): it accepts a scheduled run, or a dispatched one titled
# "Nightly (full budgets)", which only a dispatch with every input at its default gets.
# `release.rs` checks this expression; GitHub ignores run-name under workflow_call.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && (inputs.fuzz-seconds == '600' && inputs.differential-sample == '' && inputs.render-diff-sample == '' && !inputs.force-failure
  && 'Nightly (full budgets)' || 'Nightly (short budgets)') || 'Nightly' }}

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Seconds per fuzz target
        default: "600"
      differential-sample:
        description: Inputs for the differential (empty for all)
        default: ""
      render-diff-sample:
        description: Files for the render diff (empty for all)
        default: ""
      force-failure:
        description: Fail on purpose, to check that an issue is opened
        type: boolean
        default: false
  # The release lane (B7b) runs these suites on the release commit with `record: false`, so the
  # run writes nothing: no benchmark history, no fuzz cache, no issue. The caller still grants
  # `contents: write` and `issues: write`, because GitHub refuses a called job that declares more
  # than its caller grants, even when the steps that would use them are skipped.
  workflow_call:
    inputs:
      record:
        description: Record results (bench-data history, fuzz cache, nightly issue); false for the release lane
        type: boolean
        default: true
      concurrency-group:
        description: Concurrency group for this run (the release lane passes its own, apart from main's nights)
        type: string
        default: ""
      fuzz-seconds:
        description: Seconds per fuzz target
        type: string
        default: "600"
      differential-sample:
        description: Inputs for the differential (empty for all)
        type: string
        default: ""
      render-diff-sample:
        description: Files for the render diff (empty for all)
        type: string
        default: ""
      force-failure:
        description: Fail on purpose, to check that an issue is opened
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency-group || format('nightly-{0}', github.ref) }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FUZZ_SECONDS: ${{ inputs.fuzz-seconds || '600' }}
  DIFFERENTIAL_SAMPLE: ${{ inputs.differential-sample || '' }}
  RENDER_DIFF_SAMPLE: ${{ inputs.render-diff-sample || '' }}
  # "false" only when a caller passed `record: false` (schedule and dispatch have no such input).
  # inputs.record is null on scheduled and dispatched runs, and GitHub's == coerces null and false
  # both to 0, so `inputs.record != false` would be false there too. toJSON keeps them apart.
  NIGHTLY_RECORD: ${{ toJSON(inputs.record) != 'false' }}

defaults:
  run:
    shell: bash

jobs:
  # Hosted Linux x64 VMs with explicit tool setup; pdf-runtimes' WebKit leg and render-diff (its
  # thresholds were measured on macOS, ADR 0004 §6) stay on macOS Arm64.
  differential:
    name: Differential (pdf.js, PDFium, qpdf, pypdf, pdftotext)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # xtask and the lamina example only build for the host: no components or cross targets.
      - uses: ./.github/actions/qpdf
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/host-rust
        with:
          # This job's own dependency cache (per job and OS), saved by the scheduled runs on
          # main: the next night rebuilds only Lamina PDF's crates.
          cache: true
      # Corpus checkouts are fetched and SHA-256 verified on each fresh VM.
      - name: Point xtask at the corpus folder and the venv
        run: |
          echo "LAMINA_PDF_CORPUS_DIR=$RUNNER_TOOL_CACHE/lamina-corpus" >> "$GITHUB_ENV"
          echo "LAMINA_PDF_PYTHON=$RUNNER_TEMP/differential-venv/bin/python" >> "$GITHUB_ENV"
      - name: Install pypdf and pypdfium2 in a venv (tools/differential/requirements.txt)
        run: |
          python3 -m venv "$RUNNER_TEMP/differential-venv"
          "$LAMINA_PDF_PYTHON" -m pip install --disable-pip-version-check -q -r tools/differential/requirements.txt
      - name: Install pdf.js (tools/differential)
        uses: ./.github/actions/node-pnpm
        with:
          package-json-file: tools/differential/package.json
          install: tools/differential
      # Checks out each source at its pinned commit (or reuses the cache) and verifies every
      # file's SHA-256 against fixtures/corpus-manifest.toml.
      - run: cargo xtask corpus fetch
      # Every reader runs at once, in chunks of separate processes with time limits, so a crash
      # or hang costs one file, not the run (tools/xtask/src/runner.rs).
      - name: Differential
        run: cargo xtask differential --live ${DIFFERENTIAL_SAMPLE:+--sample "$DIFFERENTIAL_SAMPLE"}
      - uses: ./.github/actions/poppler
        if: ${{ !cancelled() }}
      # Page text (todo B9f) runs even when the structural differential failed, so one night
      # reports both. At the poppler version doctor.rs pins, pdftotext takes part; at another,
      # xtask warns and compares with pdf.js only, and pages where only pdftotext would agree
      # then fail: keep the runners' poppler at the pin. Agreement per source goes to the summary.
      - name: Text differential
        if: ${{ !cancelled() }}
        run: cargo xtask differential --live --text ${DIFFERENTIAL_SAMPLE:+--sample "$DIFFERENTIAL_SAMPLE"}
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-report
          path: |
            target/nightly/differential/*.json
            target/nightly/differential/*.log
            target/nightly/differential-text/*.json
            target/nightly/differential-text/*.log
          if-no-files-found: ignore
      - name: Upload the report (Markdown)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-report-md
          path: |
            target/nightly/differential/report.md
            target/nightly/differential-text/report.md
          if-no-files-found: ignore

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Exactly harness::FUZZ_TARGETS (tools/xtask/src/workflows.rs checks).
        target:
          [
            lex,
            parse_object,
            flate_decode,
            open,
            page_tree,
            content,
            ops_json,
            save_roundtrip,
            extract_text,
            extract,
            markdown,
            engine_protocol_decode,
          ]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned stable toolchain (host only) builds xtask; fuzz/ needs nightly.
      - uses: ./.github/actions/host-rust
        with:
          # full.yml's fuzz job has the same key and saves it on pushes to main.
          cache: true
          save: "false"
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      # Same version as tools/xtask/src/doctor.rs; xtask fails if it drifts.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-fuzz@0.13.2
      # This target's corpus from earlier nights, else the full lane's last one saved on main
      # (all targets). xtask adds the seeds from fixtures/ to it.
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-nightly-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            fuzz-nightly-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-
            fuzz-corpus-main-${{ runner.os }}-${{ runner.arch }}-
      # cargo +nightly fuzz run <target> -- -max_total_time=… -timeout=10 -rss_limit_mb=2048
      - name: Fuzz ${{ matrix.target }} for ${{ env.FUZZ_SECONDS }} s
        run: cargo xtask fuzz "$TARGET" --time "$FUZZ_SECONDS"
      # The run's budget, executions, corpus size and whether it crashed, for the proof job. A
      # run that failed before fuzzing writes none.
      - name: Upload the run's summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-summary-${{ matrix.target }}
          path: target/xtask/fuzz/${{ matrix.target }}.json
          if-no-files-found: ignore
      # Only main's nights save, after `cargo fuzz cmin` and with only this target's folder, so
      # each entry stays bounded; older entries age out of the cache.
      - name: Minimise the corpus before saving it
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && env.NIGHTLY_RECORD == 'true' }}
        run: |
          cargo xtask fuzz cmin "$TARGET"
          find fuzz/corpus -mindepth 1 -maxdepth 1 ! -name "$TARGET" -exec rm -rf {} +
      - name: Save the fuzz corpus
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && env.NIGHTLY_RECORD == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-nightly-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      # Writes minimized-from-<hash> next to each crash; the report job puts them in the issue.
      - name: Minimise crashes
        if: ${{ failure() }}
        run: cargo xtask fuzz tmin "$TARGET"
      - name: Upload crashes
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  scaling:
    name: Scaling (release, ignored tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      flaky: ${{ steps.scaling.outputs.flaky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-rust
        with:
          # This job's own dependency cache (per job and OS), saved by the scheduled runs on
          # main: the next night rebuilds only Lamina PDF's crates.
          cache: true
      # The scaling tests (SCALING_TESTS in tools/xtask/src/nightly.rs) built with the `scaling`
      # profile, release without LTO; a failure is retried once and a pass on retry is reported
      # as flaky (flaky=true), never hidden (ADR 0018 §4).
      - id: scaling
        run: cargo xtask scaling

  bench:
    name: Benchmarks
    # A new label starts a hosted baseline, separate from the old private Macs. GitHub's
    # physical hosts vary, so timing regressions remain advisory. Preserve the job graph:
    # tools/xtask/src/workflows.rs checks these dependencies stay complete.
    needs: [differential, fuzz, scaling, links, render-diff, verapdf, roundtrip, forced-failure]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # A full run takes 3 to 11 minutes. A hung runner takes a job and runs no step until the
    # timeout, so a short one wastes less of the night.
    timeout-minutes: 30
    # Pushes the history to the bench-data branch (main only).
    permissions:
      contents: write
    outputs:
      regression: ${{ steps.bench.outputs.regression }}
    env:
      RECORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && toJSON(inputs.record) != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-rust
        with:
          # This job's own dependency cache (per job and OS), saved by the scheduled runs on
          # main: the next night rebuilds only Lamina PDF's crates.
          cache: true
      # history.jsonl on the orphan bench-data branch: one record per night (commit, runner,
      # ns/iter per benchmark). Created by the first run on main. The token goes only to the
      # bench-history steps, never to the step that builds and runs the benchmarks.
      - name: Fetch the benchmark history
        uses: ./.github/actions/bench-history
        with:
          mode: fetch
          token: ${{ github.token }}
      # Compares with the median of the last 5 records on this runner; regression=true when a
      # benchmark is over 10% slower. Never fails the job for a regression.
      - id: bench
        run: cargo xtask bench --history "$HISTORY" --runner "github-hosted/ubuntu-24.04-x64" ${{ env.RECORD == 'true' && '--record' || '' }}
      - name: Push the benchmark history
        if: ${{ env.RECORD == 'true' }}
        uses: ./.github/actions/bench-history
        with:
          mode: push
          token: ${{ github.token }}
          message: "bench: ${{ github.sha }}"
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: target/nightly/bench/
          if-no-files-found: ignore

  # Todo B6c: the whole runtime matrix on one runner, with the hello and 100-page report timings
  # and WebAssembly memory appended to history.jsonl on bench-data (`pdf/<runtime>/<case>` keys,
  # the record format of `cargo xtask bench`; main only). After `bench`, so the two pushes to
  # bench-data don't race (the bench-history action also retries a refused push). A runtime
  # that fails fails the job (and opens the nightly issue); the timings themselves are recorded,
  # not compared.
  pdf-runtimes:
    name: "@laminapdf/sdk in ${{ matrix.name }} (timings)"
    needs: bench
    if: ${{ !cancelled() }}
    outputs:
      flaky: ${{ steps.runtimes.outputs.flaky }}
    # WebKit on macOS (closest to Safari); every other runtime on Linux. Each records its timings
    # under its own runner label; bench-history retries a push the other one beat.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node, Chromium, Firefox, Deno, Bun and workerd
            group: linux
            runtimes: node chromium firefox deno bun workerd
            runner: ubuntu-24.04
            label: github-hosted/ubuntu-24.04-x64
          - name: WebKit
            group: webkit
            runtimes: webkit
            runner: macos-15
            label: github-hosted/macos-15-arm64
    permissions:
      contents: write
    env:
      RECORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && toJSON(inputs.record) != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-shared-key: wasm
          cache-bin: false
      # Same version as ci.yml's wasm job (tools/xtask/src/doctor.rs).
      - uses: ./.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129
      - uses: ./.github/actions/node-pnpm
      - run: cargo xtask wasm
      - name: Keep the Playwright browsers in the runner's tool cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
      - if: matrix.group == 'linux'
        uses: ./.github/actions/playwright-deps
        with:
          browsers: chromium firefox
      # As in the bench job: the token only reaches the bench-history steps.
      - name: Fetch the benchmark history
        if: ${{ env.RECORD == 'true' }}
        uses: ./.github/actions/bench-history
        with:
          mode: fetch
          token: ${{ github.token }}
      - name: The runtimes (recording on main)
        # Its browser suites write flaky=true here when a test passed only on its retry
        # (@laminapdf/test-utils/flaky). A leg that writes nothing leaves the other leg's value.
        id: runtimes
        env:
          RUNTIMES: ${{ matrix.runtimes }}
          LABEL: ${{ matrix.label }}
          GROUP: ${{ matrix.group }}
        run: |
          # shellcheck disable=SC2086 # one argument per runtime
          # --label keeps the two groups' files apart when the proof job downloads both:
          # runtimes-<group>.json and measurements-<group>.json.
          if [ "$RECORD" = true ]; then
            cargo xtask pdf-runtimes $RUNTIMES --label "$GROUP" --history "$HISTORY" --runner "$LABEL" --record
          else
            cargo xtask pdf-runtimes $RUNTIMES --label "$GROUP"
          fi
      # Also after a failed run: the runtimes that passed were recorded (the action does nothing
      # when no record was added).
      - name: Push the benchmark history
        if: ${{ !cancelled() && env.RECORD == 'true' }}
        uses: ./.github/actions/bench-history
        with:
          mode: push
          token: ${{ github.token }}
          message: "bench(pdf-runtimes, ${{ matrix.group }}): ${{ github.sha }}"
      - name: Upload the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-runtimes-${{ matrix.group }}
          path: target/xtask/pdf-runtimes/
          if-no-files-found: ignore

  links:
    name: External links in the docs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      flaky: ${{ steps.links.outputs.flaky }}
      missing: ${{ steps.links.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-rust
        with:
          cache: true
          shared-key: xtask
          save: "false"
      # The links that answered OK in the last 4 to 7 days aren't fetched again (xtask's
      # docs_links/cache.rs); every other link is. Restored from the last night's run, saved by
      # main's recording nights only.
      - name: Restore the checked links
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/link-check/cache.json
          key: link-check-${{ github.run_id }}
          restore-keys: link-check-
      # curl per URL: HEAD, then a one-byte GET if HEAD is refused; timeouts, 429 and 5xx are
      # retried once and a pass on retry is reported as flaky (flaky=true). A final 403 or 429 is
      # refused (a warning). A missing page or site (404, 410, no answer) doesn't fail the job:
      # missing=true, and the report job opens "Missing links in the docs on <ref>" from
      # missing.md, with each link's reason. Allowlist: .config/link-check.toml.
      - id: links
        run: cargo xtask docs-links --external --cache target/link-check/cache.json
      - name: Save the checked links
        if: ${{ !cancelled() && steps.links.outcome == 'success' && github.ref == 'refs/heads/main' && env.NIGHTLY_RECORD == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/link-check/cache.json
          key: link-check-${{ github.run_id }}
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: links-report
          path: target/nightly/links/
          if-no-files-found: ignore

  # Todo X3b: hayro vs PDFium on the external corpus (ADR 0004 §6: tracked, never gated). PDFium
  # is the pinned native build that `cargo xtask fetch-pdfium` keeps in the runner's tool cache
  # (render-diff fetches it the same way); the corpus is the differential's. A crash or hang
  # costs one file (per-file processes with time limits, tools/xtask/src/runner.rs). The pass
  # rates go to history.jsonl on bench-data (main only); the comparison with the last point
  # runs on every run and sets `regression`, which the report job turns into an issue.
  render-diff:
    name: Render diffs (hayro vs PDFium)
    runs-on: macos-15
    # The whole corpus took about an hour on the shared Mac (2,172 files, 5,108 pages).
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      regression: ${{ steps.render-diff.outputs.regression }}
    env:
      RECORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && toJSON(inputs.record) != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-rust
        with:
          # This job's own dependency cache (per job and OS), saved by the scheduled runs on
          # main: the next night rebuilds only Lamina PDF's crates.
          cache: true
      - name: Point xtask at the corpus folder
        run: echo "LAMINA_PDF_CORPUS_DIR=$RUNNER_TOOL_CACHE/lamina-corpus" >> "$GITHUB_ENV"
      - run: cargo xtask corpus fetch
      - run: cargo xtask fetch-pdfium
      # As in the bench job: the token only reaches the bench-history steps.
      - name: Fetch the benchmark history
        uses: ./.github/actions/bench-history
        with:
          mode: fetch
          token: ${{ github.token }}
      # The last report and the key of what it was made from (xtask's render_diff/reuse.rs):
      # when the renderer's code, the corpus and the settings are unchanged, --reuse reports it
      # again instead of rendering the corpus for half an hour.
      - name: Restore the last report
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/nightly/render-diff
          key: render-diff-report-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: render-diff-report-${{ runner.os }}-${{ runner.arch }}-
      - id: render-diff
        name: Render diff
        run: >-
          cargo xtask render-diff --corpus external --pages 20 --reuse
          ${RENDER_DIFF_SAMPLE:+--sample "$RENDER_DIFF_SAMPLE"}
          --history "$HISTORY" --runner "github-hosted/macos-15-arm64"
          ${{ env.RECORD == 'true' && '--record' || '' }}
      # A reused report adds no point to the history, and is already in the cache.
      - name: Push the benchmark history
        if: ${{ env.RECORD == 'true' && steps.render-diff.outputs.reused != 'true' }}
        uses: ./.github/actions/bench-history
        with:
          mode: push
          token: ${{ github.token }}
          message: "bench(render-diff): ${{ github.sha }}"
      - name: Save the report for the next night
        if: ${{ !cancelled() && steps.render-diff.outcome == 'success' && steps.render-diff.outputs.reused != 'true' && env.RECORD == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/nightly/render-diff
          key: render-diff-report-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff
          path: target/nightly/render-diff/
          if-no-files-found: ignore

  # Writes nothing but its artefact, so it needs no record gate. The veraPDF install stays in
  # the runner's tool cache ($RUNNER_TOOL_CACHE/lamina-verapdf) during the job.
  verapdf:
    name: veraPDF (PDF/UA-1, PDF/A-2b, 2u, 3b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-rust
        with:
          # This job's own dependency cache (per job and OS), saved by the scheduled runs on
          # main: the next night rebuilds only Lamina PDF's crates.
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo xtask verapdf
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verapdf
          path: target/xtask/verapdf/
          if-no-files-found: ignore

  # Todo T1a: the round-trip suite (ADR 0018 tier 7), set up as full.yml's `suites` job, so the
  # proof record has its counts. It writes nothing but its artefact, so it needs no record gate.
  roundtrip:
    name: Round trip (lamina, qpdf, pdf.js, PDFium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qpdf
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/host-rust
        with:
          # This job's own dependency cache (per job and OS), saved by the scheduled runs on
          # main: the next night rebuilds only Lamina PDF's crates.
          cache: true
      # pdf.js: xtask installs tools/roundtrip's pinned pdfjs-dist with npm when it is missing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: qpdf and the Python venv (pypdfium2)
        run: |
          qpdf --version
          python3 -m venv "$RUNNER_TEMP/roundtrip-venv"
          "$RUNNER_TEMP/roundtrip-venv/bin/pip" install --disable-pip-version-check -q -r tools/roundtrip/requirements.txt
      - name: Round trip
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/roundtrip-venv/bin/python
        run: cargo xtask roundtrip
      # summary.json (counts, each tool's version and result), versions.json and the manifest;
      # summary.json is written even when a tool fails.
      - name: Upload the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roundtrip
          path: target/xtask/roundtrip/*.json
          if-no-files-found: ignore

  # Todo T1a: every job's report gathered into one record (`cargo xtask proof`), on any result but
  # a cancelled run, so a failed night still records which job failed (its section is null).
  # Each artefact is downloaded back to the folder its job wrote: upload-artifact roots an
  # artefact at the least common ancestor of its search paths, so each `path` below is that root.
  # Only a full-budget night on main appends to the history; xtask reads the budgets from the
  # reports themselves.
  proof:
    name: Proof record
    needs: [differential, fuzz, scaling, render-diff, verapdf, roundtrip, pdf-runtimes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Pushes the history to the bench-data branch (main only).
    permissions:
      contents: write
    env:
      RECORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && toJSON(inputs.record) != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-rust
        with:
          cache: true
          shared-key: xtask
          save: "false"
      # A missing artefact (its job failed early or was skipped) leaves its section null.
      - name: Download the differential reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: differential-report
          path: target/nightly
      - name: Download the render-diff report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: render-diff
          path: target/nightly/render-diff
      - name: Download the fuzz summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: fuzz-summary-*
          merge-multiple: true
          path: target/xtask/fuzz
      - name: Download the veraPDF report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: verapdf
          path: target/xtask/verapdf
      - name: Download the round-trip summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: roundtrip
          path: target/xtask/roundtrip
      - name: Download the runtimes' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pdf-runtimes-*
          merge-multiple: true
          path: target/xtask/pdf-runtimes
      # As in the bench job: the token only reaches the bench-history steps.
      - name: Fetch the benchmark history
        if: ${{ env.RECORD == 'true' }}
        uses: ./.github/actions/bench-history
        with:
          mode: fetch
          token: ${{ github.token }}
      - name: The proof record (recording on main)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "$RECORD" = true ]; then
            cargo xtask proof --jobs "$NEEDS" --history "$HISTORY" --runner "github-hosted/ubuntu-24.04-x64" --record
          else
            cargo xtask proof --jobs "$NEEDS"
          fi
      # Does nothing when no record was added (a night that wasn't full).
      - name: Push the benchmark history
        if: ${{ env.RECORD == 'true' }}
        uses: ./.github/actions/bench-history
        with:
          mode: push
          token: ${{ github.token }}
          message: "bench(proof): ${{ github.sha }}"
      - name: Upload the record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof
          path: target/nightly/proof/
          if-no-files-found: ignore

  # workflow_dispatch with force-failure: checks the issue-on-failure path end to end.
  forced-failure:
    name: Forced failure (on request)
    if: ${{ inputs.force-failure }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::force-failure was requested: failing on purpose to test the nightly issue"
          exit 1

  # Opens or comments on one issue per kind and ref (labelled `nightly`): "Nightly lane failing
  # on <ref>" for a failed or timed-out job, a flaky scaling test or a flaky link, "Missing links
  # in the docs on <ref>" for links whose page or site is missing (never a failure), "Nightly
  # benchmark regression on <ref>" for a >10% regression, "Nightly render-diff regression on
  # <ref>" for a pass rate more than 2 points below the last point (`cargo xtask render-diff
  # --dry-run` prints that issue locally). The ref in the title keeps a branch or tag run from
  # appending to main's issue (and main's runs from reusing an issue a test run opened).
  report:
    name: Open an issue on failure
    needs:
      [differential, fuzz, scaling, bench, pdf-runtimes, links, render-diff, verapdf, roundtrip, proof, forced-failure]
    # Never for a caller that passed `record: false` (the release lane fails on its own result),
    # nor for a run someone cancelled. A job that hit its timeout-minutes ends `cancelled`, not
    # `failure`, but fails the run all the same: 2026-11-02's Benchmarks job landed on a hung
    # runner, timed out with no step run and blocked the release, and the issue named no job.
    if: >-
      ${{ !cancelled() && toJSON(inputs.record) != 'false' && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled')
      || needs.scaling.outputs.flaky == 'true' || needs.links.outputs.flaky == 'true'
      || needs.pdf-runtimes.outputs.flaky == 'true'
      || needs.links.outputs.missing == 'true'
      || needs.bench.outputs.regression == 'true' || needs.render-diff.outputs.regression == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Download crash inputs and the differential report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "{fuzz-artifacts-*,differential-report,bench-results}"
          path: artefacts
      # By name, so it always lands in its own folder (a pattern matching one artifact unpacks it
      # straight into `path`).
      - name: Download the link report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: links-report
          path: artefacts/links-report
      - name: Download the render-diff report
        if: ${{ needs.render-diff.outputs.regression == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: render-diff
          path: artefacts/render-diff
      - name: Open or update the issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLAKY: ${{ needs.scaling.outputs.flaky }}
          LINKS_FLAKY: ${{ needs.links.outputs.flaky }}
          BROWSER_FLAKY: ${{ needs.pdf-runtimes.outputs.flaky }}
          LINKS_MISSING: ${{ needs.links.outputs.missing }}
          REGRESSION: ${{ needs.bench.outputs.regression }}
          RENDER_REGRESSION: ${{ needs.render-diff.outputs.regression }}
        run: |
          set -euo pipefail
          gh label create nightly --color B60205 --description "Nightly lane failure (ADR 0018)" --force
          upsert() { # title body-file
            number=$(gh issue list --label nightly --state open --search "in:title \"$1\"" --json number,title \
              --jq "map(select(.title == \"$1\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$2"
            else
              gh issue create --title "$1" --label nightly --body-file "$2"
            fi
          }
          jobs_with() { # result: the ids of the jobs that ended with it, comma-separated
            jq -r --arg result "$1" 'to_entries | map(select(.value.result == $result) | .key) | join(", ")' <<< "$NEEDS"
          }
          failed=$(jobs_with failure)
          # A timeout ends a job `cancelled`; so does a job cancelled on its own.
          timed_out=$(jobs_with cancelled)
          # One section of the links report (`### <title>…` up to the next heading), at most 30 rows.
          links_section() { # title-prefix report
            table=$(sed -n "/^### $1/,/^### /p" "$2" | sed '1!{ /^### /d; }' | sed '/^$/d')
            rows=$(( $(wc -l <<< "$table") - 3 ))
            echo
            head -n 33 <<< "$table"
            if [ "$rows" -gt 30 ]; then
              echo
              echo "… and $((rows - 30)) more (full report in the run's artefacts)."
            fi
          }
          if [ -n "$failed$timed_out" ] || [ "$FLAKY" = "true" ] || [ "$LINKS_FLAKY" = "true" ] || [ "$BROWSER_FLAKY" = "true" ]; then
            {
              # A flaky result passed on its retry: it doesn't fail the run, so it doesn't block
              # the release, but it is still reported (ADR 0018 §4).
              if [ -n "$failed$timed_out" ]; then
                echo "The [nightly run]($RUN_URL) on \`$GITHUB_SHA\` ($GITHUB_REF_NAME) failed. It blocks the next release (ADR 0018 §2)."
              else
                echo "The [nightly run]($RUN_URL) on \`$GITHUB_SHA\` ($GITHUB_REF_NAME) passed, with the flaky results below. They don't block the release. Fix them; for a link whose host refuses bots, add the host to \`.config/link-check.toml\` (ADR 0018 §4)."
              fi
              echo
              [ -n "$failed" ] && echo "Failed jobs: **$failed**."
              # A job that ran no step landed on a hung runner, so a re-run usually passes.
              [ -n "$timed_out" ] && echo "Timed out or cancelled: **$timed_out**. If the job's log shows no step, it landed on a hung runner: re-run it with \`gh run rerun $GITHUB_RUN_ID --failed\` and report the runner to its owner."
              [ "$FLAKY" = "true" ] && echo "The scaling tests failed once and passed on retry: **flaky** (ADR 0018 §4)."
              [ "$LINKS_FLAKY" = "true" ] && echo "Some external links failed once and passed on retry: **flaky** (ADR 0018 §4)."
              [ "$BROWSER_FLAKY" = "true" ] && echo "Some browser tests failed once and passed on retry: **flaky** (ADR 0018 §4). The pdf-runtimes jobs' warning annotations and job summary name them."
              report=artefacts/differential-report/report.json
              if [ -f "$report" ]; then
                failures=$(jq '[.disagreements[] | select(.kind == "failure")] | length' "$report")
                panics=$(jq '(.lamina_errors + .missing + .broken_readers) | length' "$report")
                echo
                echo "Differential: $failures failures, $panics lamina errors, missing files or broken readers (full report in the run's artefacts)."
              fi
              if [ -f "$report" ] && [ $((failures + panics)) -gt 0 ]; then
                echo
                echo "The first 30 of each:"
                echo
                jq -r '([.disagreements[] | select(.kind == "failure")][:30][] | "- \u0060\(.file)\u0060 \(.fact): lamina \(.lamina | tojson | .[:60])"), ((.lamina_errors + .missing + .broken_readers)[:30][] | "- \u0060\(.)\u0060")' "$report"
              fi
              links=artefacts/links-report/report.md
              for section in Flaky; do
                if [ -f "$links" ] && grep -q "^### $section" "$links"; then
                  links_section "$section" "$links"
                fi
              done
              for dir in artefacts/fuzz-artifacts-*; do
                [ -d "$dir" ] || continue
                echo
                echo "Fuzz \`${dir#artefacts/fuzz-artifacts-}\` (minimise and commit per fuzz/README.md):"
                for f in "$dir"/minimized-from-* "$dir"/crash-* "$dir"/timeout-* "$dir"/oom-*; do
                  [ -f "$f" ] || continue
                  size=$(wc -c < "$f")
                  echo
                  echo "- \`$(basename "$f")\` ($size bytes)"
                  if [ "$size" -le 4096 ]; then
                    fence='```'
                    printf '\n  %s base64\n  %s\n  %s\n' "$fence" "$(base64 < "$f" | tr -d '\n')" "$fence"
                  fi
                done
              done
            } > failure.md
            upsert "Nightly lane failing on $GITHUB_REF_NAME" failure.md
          fi
          # Missing links don't fail the run; they get their own issue, with each link's reason
          # (cargo xtask docs-links --external writes missing.md).
          if [ "$LINKS_MISSING" = "true" ] && [ -f artefacts/links-report/missing.md ]; then
            {
              echo "The [nightly run]($RUN_URL) on \`$GITHUB_SHA\` ($GITHUB_REF_NAME) found links in the docs whose page or site is missing. They don't fail the run."
              echo
              cat artefacts/links-report/missing.md
            } > missing-links.md
            upsert "Missing links in the docs on $GITHUB_REF_NAME" missing-links.md
          fi
          if [ "$REGRESSION" = "true" ]; then
            {
              echo "The [nightly run]($RUN_URL) on \`$GITHUB_SHA\` found a benchmark regression over 10% (ADR 0018 tier 11). It does not fail the build."
              echo
              cat artefacts/bench-results/regressions.md 2>/dev/null || true
            } > regression.md
            upsert "Nightly benchmark regression on $GITHUB_REF_NAME" regression.md
          fi
          if [ "$RENDER_REGRESSION" = "true" ]; then
            {
              echo "The [nightly run]($RUN_URL) on \`$GITHUB_SHA\` found a render-diff regression (todo X3b; report and diff images in the run's \`render-diff\` artefact)."
              echo
              cat artefacts/render-diff/regression.md 2>/dev/null || true
            } > render-regression.md
            upsert "Nightly render-diff regression on $GITHUB_REF_NAME" render-regression.md
          fi
