# The desktop app's release (todo D6b; ADR 0014; docs/guidelines/desktop-release.md): every target
# built and bundled by the Tauri CLI on a hosted runner of its own OS and CPU, checked, attested, and
# published to R2 with the channel's manifest. Not a required check.
#
#   plan           the run's version, channel, environment and build matrix
#                  (`cargo xtask desktop-release plan`, tools/xtask/src/desktop_release/plan.rs); no
#                  environment, no secrets
#   build-dry-run  pull requests (and dispatches with dry_run): every target with no environment, no
#                  secrets, no updater or Linux signing, nothing uploaded but the workflow artifacts;
#                  Windows x64 also as a tag builds it (NSIS and MSI)
#   build-nightly  the schedule, in `desktop-nightly`: the nightly updater key only; macOS ad-hoc
#                  signed, Windows unsigned, Linux with SHA256SUMS only
#   build-release  tags and staging dispatches, in `desktop-release` (the owner approves): the release
#                  updater key, the Linux GPG key, on macOS the Developer ID and the notarisation
#                  key (signed, notarised and stapled; D6c), and on Windows Authenticode through Azure
#                  Artifact Signing (OIDC, no secret; D6d)
#   attest         build provenance and SBOM attestations for every file (public repository only)
#   publish-*      the files to R2 under releases/<version>/<platform>/, the channel's manifest
#                  (apps/updates/scripts/manifest.ts), then the update Worker asked for each platform
#   archive-symbols  tags only: each build's Breakpad symbols to the private R2 bucket
#                  lamina-pdf-symbols, for `cargo xtask crash symbolicate` (todo D7d)
#
# Each build job reads only its environment's secrets, and no job in `desktop-nightly` may name an
# APPLE_*, AZURE_* or LINUX_SIGNING_* secret (tools/xtask/src/workflows/desktop_release.rs checks it).
# macOS and Windows are both signed (D6c, D6d), so tags publish: SIGNED_PLATFORMS below says what
# a platform left out of it would change.
#
# Actions are locked by .github/workflows/actions.lock (ADR 0019, todo X11): `uses:` names a release
# tag, and `gh actions-lock` rewrites the lockfile after a `uses:` line changes.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  # 04:23 UTC, after the day's merges; `plan` skips the build when nothing the app is built from
  # changed in the last 24 hours.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: The channel (beta and stable come from desktop-v* tags, nightly from the schedule)
        type: choice
        options: [staging]
        default: staging
      dry_run:
        description: Build every target with no environment and publish nothing
        type: boolean
        default: false
      only_os:
        description: Build and publish one OS's targets only, for a staging trial that can't wait on another platform's signing
        type: choice
        options: [all, macos, windows, linux]
        default: all
      allow_unsigned_platforms:
        description: Publish to staging although a platform isn't signed (left out of SIGNED_PLATFORMS)
        type: boolean
        default: false
      app_store:
        description: "The Mac App Store package: package builds and checks it with no secret; upload signs it and sends it to App Store Connect (a dry run only packages)"
        type: choice
        options: [none, package, upload]
        default: none
  # The dry run proves the workflow on the pull requests that change it; the app's own changes are
  # built on every OS by full.yml's desktop job, and every night by the schedule.
  pull_request:
    paths:
      - .github/workflows/desktop-release.yml
      - .github/actions/desktop-app-store/**
      - .github/actions/desktop-build/**
      - .github/actions/dump-syms/**
      - .github/actions/desktop-publish/**
      - apps/desktop/scripts/**
      - apps/desktop/src-tauri/app-store/**
      - apps/desktop/src-tauri/tauri*.conf.json
      - apps/desktop/src-tauri/windows/**
      - apps/updates/scripts/edits.ts
      - apps/updates/scripts/manifest.ts
      - apps/updates/scripts/release.ts
      - tools/xtask/src/desktop_release.rs
      - tools/xtask/src/desktop_release/**
      - tools/xtask/src/desktop_sidecar.rs
      - tools/xtask/src/notices.rs
      - tools/xtask/src/pdfium.rs
      - tools/xtask/src/workflows/desktop_release.rs

permissions:
  contents: read

# A pull request's newer push replaces its dry run. Every other run is its own group: GitHub keeps
# one pending run per group, so a shared group would drop a queued staging dispatch behind a
# nightly. The publish jobs take the channel's own group.
concurrency:
  group: desktop-release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The platforms the workflow signs at the OS level: macos (D6c) and windows (D6d). With both
  # here, tags publish; a platform left out would make tags fail `plan` and staging need
  # allow_unsigned_platforms.
  SIGNED_PLATFORMS: "macos,windows"

jobs:
  plan:
    name: Plan
    # Never for a fork's pull request: the dry run has no secrets, but its runners are this repository's.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      downloads: ${{ steps.plan.outputs.downloads }}
      environment: ${{ steps.plan.outputs.environment }}
      dry-run: ${{ steps.plan.outputs.dry-run }}
      app-store: ${{ steps.plan.outputs.app-store }}
      store-version: ${{ steps.plan.outputs.store-version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      skip: ${{ steps.skip.outputs.skip }}
      public: ${{ steps.visibility.outputs.public }}
    steps:
      # The whole history and its tags: the nightly's version follows the latest desktop-v* tag.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      # GitHub attests only for a public repository. A scheduled run's event names no repository,
      # so ask the API.
      - name: Whether the repository is public
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # A failed API call fails the step: a release must not skip its attestations silently.
        run: |
          visibility=$(gh api "repos/$REPO" --jq .visibility)
          echo "public=$([ "$visibility" = public ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Plan the run
        id: plan
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_UNSIGNED_PLATFORMS: ${{ inputs.allow_unsigned_platforms }}
          INPUT_ONLY_OS: ${{ inputs.only_os }}
          INPUT_APP_STORE: ${{ inputs.app_store }}
          # The repository variable that limits a tag to some OSes (runbook §6); unset builds all six.
          DESKTOP_TAG_OS: ${{ vars.DESKTOP_TAG_OS }}
        run: BUILD_DATE=$(date -u +%Y%m%d) cargo xtask desktop-release plan
      # A night with no change to what the app is built from publishes nothing.
      - name: Skip a nightly with nothing new
        id: skip
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          base=$(git rev-list -n 1 --before="24 hours ago" HEAD)
          desktop=$(cargo xtask changes --base "$base" | sed -n 's/^desktop=//p')
          if [ "$desktop" = true ]; then echo "skip=false"; else echo "skip=true"; fi >> "$GITHUB_OUTPUT"
          [ "$desktop" = true ] || echo "Nothing the desktop app is built from changed since $base: no nightly." >> "$GITHUB_STEP_SUMMARY"

  build-dry-run:
    name: Dry run (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.dry-run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the desktop app (${{ matrix.platform }}, ${{ matrix.target }})
        uses: $/.github/actions/desktop-build
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          mode: ${{ matrix.mode }}
          version: ${{ matrix.version }}
          bundles: ${{ matrix.bundles }}
          channel: ${{ needs.plan.outputs.channel }}
          updater: "false"

  build-nightly:
    name: Nightly (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.environment == 'desktop-nightly' && needs.plan.outputs.skip != 'true'
    environment: desktop-nightly
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # The nightly-only updater key (D5a): nightlies sign with it and trust only it.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the desktop app (${{ matrix.platform }}, ${{ matrix.target }})
        uses: $/.github/actions/desktop-build
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          mode: ${{ matrix.mode }}
          version: ${{ matrix.version }}
          bundles: ${{ matrix.bundles }}
          channel: ${{ needs.plan.outputs.channel }}
          updater: "true"

  build-release:
    name: Release (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.environment == 'desktop-release'
    environment: desktop-release
    runs-on: ${{ matrix.runner }}
    # macOS adds Apple's notarisation of the .app and the .dmg to the build: usually minutes, but
    # the .dmg's wait may take up to 45 (Notarise and staple the .dmg).
    timeout-minutes: 150
    # id-token: the Windows legs trade GitHub's OIDC token for an Azure session (azure/login in
    # desktop-build), which only this environment's federated credential accepts.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Read by the Linux legs only (sign-linux below).
      LINUX_SIGNING_KEY: ${{ matrix.os == 'linux' && secrets.LINUX_SIGNING_KEY || '' }}
      LINUX_SIGNING_KEY_PASSPHRASE: ${{ matrix.os == 'linux' && secrets.LINUX_SIGNING_KEY_PASSPHRASE || '' }}
      # Read by the macOS legs only (sign-macos below): the Developer ID, CI's keychain and the
      # App Store Connect key that notarises (runbook §1.3, §1.4).
      APPLE_CERTIFICATE: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      KEYCHAIN_PASSWORD: ${{ matrix.os == 'macos' && secrets.KEYCHAIN_PASSWORD || '' }}
      APPLE_API_KEY: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY || '' }}
      APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_P8: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY_P8 || '' }}
      # The Entra app and tenant Artifact Signing signs through (runbook §1.5): IDs, not credentials.
      # Read by the Windows legs only (sign-windows below).
      AZURE_CLIENT_ID: ${{ matrix.os == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_TENANT_ID: ${{ matrix.os == 'windows' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_SUBSCRIPTION_ID: ${{ matrix.os == 'windows' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the desktop app (${{ matrix.platform }}, ${{ matrix.target }})
        uses: $/.github/actions/desktop-build
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          mode: ${{ matrix.mode }}
          version: ${{ matrix.version }}
          bundles: ${{ matrix.bundles }}
          channel: ${{ needs.plan.outputs.channel }}
          updater: "true"
          sign-linux: ${{ matrix.os == 'linux' }}
          sign-macos: ${{ matrix.os == 'macos' }}
          sign-windows: ${{ matrix.os == 'windows' }}

  # The Mac App Store package (todo D8c; ADR 0014 §11; runbook §8), beside the direct downloads and
  # in none of their way: a failure here never holds a release's publish. The pull request's and
  # a dispatch's `package` run reads no secret and uploads nothing; `upload`, in desktop-release,
  # signs the package with the store certificates and sends it to App Store Connect, where the
  # owner submits it for review. The build number is the run's number and attempt, which only
  # rises, so a re-run uploads a newer build of the same version.
  build-app-store-package:
    name: Mac App Store package
    needs: plan
    if: needs.plan.outputs.app-store == 'package'
    runs-on: macos-15
    # Two architectures of the engine (fat LTO) and of the app, one after the other.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build, sign ad hoc and check the Mac App Store package
        uses: $/.github/actions/desktop-app-store
        with:
          mode: package
          version: ${{ needs.plan.outputs.store-version }}
          build-number: ${{ github.run_number }}.${{ github.run_attempt }}

  build-app-store:
    name: Mac App Store upload
    needs: plan
    if: needs.plan.outputs.environment == 'desktop-release' && needs.plan.outputs.app-store == 'upload'
    environment: desktop-release
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build, sign, check and upload the Mac App Store package
        uses: $/.github/actions/desktop-app-store
        with:
          mode: upload
          version: ${{ needs.plan.outputs.store-version }}
          build-number: ${{ github.run_number }}.${{ github.run_attempt }}
          # The two store certificates and the provisioning profile (runbook §8), and the keychain
          # password and App Store Connect key shared with the direct download's macOS signing (§1.3,
          # §1.4). The key's role must be able to upload builds (Developer or App Manager). Inputs,
          # not job env: the action puts each in the env of the step that needs it, so the build's
          # scripts never see them.
          distribution-certificate: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          distribution-certificate-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          installer-certificate: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          installer-certificate-password: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          app-store-profile: ${{ secrets.APPLE_APP_STORE_PROFILE }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}

  # GitHub makes these only for a public repository (docs/guidelines/desktop-release.md §3).
  attest:
    name: Attest (${{ matrix.name }})
    needs: [plan, build-nightly, build-release]
    if: >-
      !cancelled() && needs.plan.outputs.public == 'true' && needs.plan.outputs.dry-run == 'false'
      && needs.plan.outputs.skip != 'true'
      && (needs.build-nightly.result == 'success' || needs.build-release.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.mode }}
          path: built
      # SHA256SUMS lists every file the build made but the signatures (desktop-build's last steps).
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: built/${{ matrix.platform }}/SHA256SUMS
      # One SBOM attestation each: the app's crates, the engine's, and the window's npm packages.
      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: built/${{ matrix.platform }}/SHA256SUMS
          sbom-path: built/${{ matrix.platform }}/sbom/laminapdf-desktop.cdx.json
      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: built/${{ matrix.platform }}/SHA256SUMS
          sbom-path: built/${{ matrix.platform }}/sbom/laminapdf-desktop-engine.cdx.json
      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: built/${{ matrix.platform }}/SHA256SUMS
          sbom-path: built/${{ matrix.platform }}/sbom/laminapdf-desktop-npm.cdx.json

  publish-nightly:
    name: Publish (nightly)
    needs: [plan, build-nightly, attest]
    if: >-
      !cancelled() && needs.plan.outputs.environment == 'desktop-nightly' && needs.build-nightly.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    environment: desktop-nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A re-run and the next night never write channels/nightly.json at once.
    concurrency:
      group: desktop-nightly-channel
      cancel-in-progress: false
    # The nightly bucket's R2 token and its Access Key ID (apps/updates/scripts/r2.ts reads them).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Publish the desktop release (${{ needs.plan.outputs.channel }} ${{ needs.plan.outputs.version }})
        uses: $/.github/actions/desktop-publish
        with:
          channel: ${{ needs.plan.outputs.channel }}
          version: ${{ needs.plan.outputs.version }}
          downloads: ${{ needs.plan.outputs.downloads }}
          mode: nightly

  publish-release:
    name: Publish (${{ needs.plan.outputs.channel }})
    needs: [plan, build-release, attest]
    if: >-
      !cancelled() && needs.plan.outputs.environment == 'desktop-release' && needs.build-release.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    environment: desktop-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # D5c's update test (desktop-update-e2e.yml) holds the same group while it writes
    # channels/staging.json, so the two never write the staging channel at once.
    concurrency:
      group: ${{ needs.plan.outputs.channel == 'staging' && 'desktop-staging-channel' || 'desktop-release-channel' }}
      cancel-in-progress: false
    # Each token writes one bucket: the releases bucket's for tags, staging's for dispatches.
    # apps/updates/scripts/r2.ts picks the pair the channel's bucket needs.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      CLOUDFLARE_STAGING_R2_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_R2_TOKEN }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Publish the desktop release (${{ needs.plan.outputs.channel }} ${{ needs.plan.outputs.version }})
        uses: $/.github/actions/desktop-publish
        with:
          channel: ${{ needs.plan.outputs.channel }}
          version: ${{ needs.plan.outputs.version }}
          downloads: ${{ needs.plan.outputs.downloads }}
          mode: tag

  # The Breakpad symbols of a tagged release's builds (todo D7d; docs/guidelines/desktop-release.md
  # §7) into the private bucket lamina-pdf-symbols, which `cargo xtask crash symbolicate` reads.
  # Only a tag push: nightlies would add a set every day, and staging trials reach no user's install.
  # It waits for what publish-release waits for, so the owner approves both at once. Without the
  # bucket's token it uploads nothing and says so; it never fails the release for that.
  archive-symbols:
    name: Archive the symbols
    needs: [plan, build-release, attest]
    if: >-
      !cancelled() && needs.plan.outputs.environment == 'desktop-release' && needs.build-release.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
      && github.event_name == 'push' && github.ref_type == 'tag'
    environment: desktop-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The symbols bucket's own token, under the names apps/updates/scripts/r2.ts reads for a bucket
    # other than staging's; this job holds no other bucket's.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SYMBOLS_R2_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.SYMBOLS_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Whether the symbols bucket's token is set
        id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::desktop-release has no token for lamina-pdf-symbols (runbook §7.3): this release's symbols are not archived"
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.token.outputs.set == 'true'
        with:
          persist-credentials: false
      - name: Set up Node and pnpm
        uses: $/.github/actions/node-pnpm
        if: steps.token.outputs.set == 'true'
      # Each artifact holds <debug file>/<debug ID>/ folders, the bucket's layout, so they merge.
      - uses: actions/download-artifact@v8.0.2
        if: steps.token.outputs.set == 'true'
        with:
          pattern: symbols-desktop-*-tag
          path: ${{ runner.temp }}/symbols
          merge-multiple: true
      - name: Upload the symbols
        if: steps.token.outputs.set == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/symbols"
          {
            echo "## Symbols archived in lamina-pdf-symbols"
            echo
            echo "| Key | Size |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          find . -type f | sed 's|^\./||' | sort | while read -r key; do
            case "$key" in *.sym) type=text/plain ;; *.tar.gz) type=application/gzip ;; *) type=application/octet-stream ;; esac
            pnpm --filter @laminapdf/updates r2 put lamina-pdf-symbols "$key" "$RUNNER_TEMP/symbols/$key" --content-type "$type"
            echo "| \`$key\` | $(wc -c < "$key" | tr -d ' ') B |" >> "$GITHUB_STEP_SUMMARY"
          done
