# TEMPORARY (D2c): the engine sandbox on Windows and Linux, which the author can't run locally.
# Deleted before the PR is ready.
name: D2c sandbox probe
on:
  push:
    branches: [feat/d2c-engine-sandbox]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d2c-probe
  cancel-in-progress: true
jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-shared-key: rust
          cache-bin: false
      - name: Probe
        shell: bash
        run: |
          set +e
          mkdir -p probe-logs
          log=probe-logs/probe.log
          { uname -a; cat /etc/os-release 2>/dev/null | head -2; cmd.exe /c ver 2>/dev/null; } | tee -a $log
          dir=$(cargo xtask fetch-pdfium | sed -n 's/^LAMINA_PDF_PDFIUM_DIR=//p')
          echo "LAMINA_PDF_PDFIUM_DIR=$dir" >> "$GITHUB_ENV"
          export LAMINA_PDF_PDFIUM_DIR=$dir
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p ~/.local/share/fonts
            curl -sfL -o ~/.local/share/fonts/NotoSansSC-Regular.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf || sudo apt-get install -y -q fonts-noto-cjk | tail -1
            ls -la ~/.local/share/fonts; fc-list :lang=zh | head -3
          fi
          cargo test --locked -p laminapdf-desktop-sandbox -p laminapdf-desktop-protocol -p laminapdf-desktop-engine \
            --features laminapdf-desktop-protocol/test-support,laminapdf-desktop-engine/selftest \
            -- --include-ignored --nocapture 2>&1 | tee -a probe-logs/tests.log
          exit ${PIPESTATUS[0]}
      - name: Linux seccomp trap build (names a refused call)
        if: runner.os == 'Linux' && failure()
        shell: bash
        run: |
          cargo test --locked -p laminapdf-desktop-engine --features seccomp-trap,selftest -- --include-ignored --nocapture 2>&1 | grep -E "seccomp refused|FAILED|panicked" | tee -a probe-logs/trap.log
      - name: Measure with and without the sandbox (release, debug assertions on for the switch)
        if: false
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: |
          set +e
          cargo xtask fixtures large-pdf 2>&1 | tail -1
          cargo build --locked --release -p laminapdf-desktop-engine --bins --examples 2>&1 | tail -1
          for i in 1 2 3; do
            for mode in on off; do
              if [ $mode = off ]; then export LAMINA_PDF_ENGINE_SANDBOX=off; else unset LAMINA_PDF_ENGINE_SANDBOX; fi
              echo "run $i $mode" | tee -a probe-logs/measure.log
              target/release/examples/measure --engine target/release/laminapdf-desktop-engine \
                --file target/fixtures/1gb.pdf --tiles 400 2>&1 | grep -E "Ready|PageInfo|tiles:|error" | tee -a probe-logs/measure.log
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ matrix.runner }}
          path: probe-logs/
