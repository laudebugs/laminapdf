# TEMPORARY (D2c): the engine sandbox on Windows and Linux, which the author can't run locally.
# Deleted before the PR is ready.
name: D2c sandbox probe
on:
  push:
    branches: [feat/d2c-engine-sandbox]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d2c-probe
  cancel-in-progress: true
jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: false
          cache-shared-key: rust
          cache-bin: false
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe-logs
          log=probe-logs/probe.log
          { uname -a; cat /etc/os-release 2>/dev/null | head -2; } | tee -a $log
          dir=$(cargo xtask fetch-pdfium | sed -n 's/^LAMINA_PDF_PDFIUM_DIR=//p')
          echo "LAMINA_PDF_PDFIUM_DIR=$dir" >> "$GITHUB_ENV"
          export LAMINA_PDF_PDFIUM_DIR=$dir
          cargo build --locked -p laminapdf-desktop-engine 2>&1 | tail -3
          exe=target/debug/laminapdf-desktop-engine
          for p in read write connect spawn threads memory fork exec clone3 nproc; do
            echo "== $p" | tee -a $log
            "$exe" --sandbox-selftest=$p 2>&1 | tee -a $log
            echo "exit ${PIPESTATUS[0]}" | tee -a $log
          done
          cargo test --locked -p laminapdf-desktop-sandbox -p laminapdf-desktop-protocol -p laminapdf-desktop-engine \
            --features laminapdf-desktop-protocol/test-support -- --include-ignored --nocapture 2>&1 | tee -a probe-logs/tests.log
          exit ${PIPESTATUS[0]}
      - name: Linux seccomp trap build (names a refused call)
        if: runner.os == 'Linux' && failure()
        shell: bash
        run: |
          cargo build --locked -p laminapdf-desktop-engine --features seccomp-trap
          for p in threads read memory; do target/debug/laminapdf-desktop-engine --sandbox-selftest=$p 2>&1 | tee -a probe-logs/trap.log; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ matrix.runner }}
          path: probe-logs/
