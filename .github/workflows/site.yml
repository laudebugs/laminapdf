# Website deploys (todo W1b): apps/site on Cloudflare Workers static assets (apps/site/wrangler.toml).
#
# Pull requests that touch the site or anything it is built from (paths below):
# - `preview-build` builds the PR's site with no secrets and uploads dist/ as an artifact. The
#   build marks it noindex itself: only a build with LAMINA_PDF_ENV=production omits the header.
# - `preview-deploy` holds the Cloudflare secrets and never checks out or runs the PR's code: it
#   takes wrangler.toml and the Wrangler version from the default branch, installs that exact
#   Wrangler into a fresh npm cache, uploads the artifact as a preview version under the alias
#   pr-<number> and comments its URL on the PR (one comment, updated on every push).
# Every push to main, a schedule and manual runs on main build with LAMINA_PDF_ENV=production and
# deploy in one job (`production`): main is trusted. Production is https://laminapdf.com (the
# custom domain route in wrangler.toml). Before building, it regenerates the roadmap
# (apps/site/src/data/progress.json) with `cargo xtask progress`: any merge can move a todo,
# whatever files it touches, so pushes have no path filter, and the schedule picks up the pull
# requests opened since the last deploy, whose todos show as in progress. The committed snapshot
# is what PR previews and local builds show.
#
# Fork deploy previews are skipped because they cannot receive deployment secrets. Without
# the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the deploy steps are skipped with a
# notice and the jobs pass. The fast lane checks the build on every PR anyway (`cargo xtask check
# ts`). Nothing a PR controls is interpolated into a script: values reach `run:` through `env:`.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: Website

on:
  pull_request:
    paths:
      - apps/site/**
      - packages/site-kit/**
      - packages/tokens/**
      - packages/fonts/**
      # What the home page reads at build time (apps/site/src/data/sources.ts): the first PDF, the
      # version, the command-line examples and the install page.
      - packages/sdk/examples/hello.ts
      - packages/sdk/package.json
      - crates/laminapdf/examples/hello.rs
      - crates/laminapdf-cli/README.md
      - apps/docs/src/content/docs/install.mdx
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .nvmrc
      - .github/workflows/site.yml
  push:
    branches: [main]
  schedule:
    # Every six hours, at a minute other workflows don't use.
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR previews are cancelled; production deploys run one after another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wrangler's usage metrics off (ADR 0011: no telemetry), Astro's too.
  WRANGLER_SEND_METRICS: "false"
  ASTRO_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  preview-build:
    name: Website preview (build)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-pnpm
      # Without LAMINA_PDF_ENV=production the build adds X-Robots-Tag: noindex (ADR 0011 §1).
      - run: pnpm --filter @laminapdf/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview-dist
          path: apps/site/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview-deploy:
    name: Website preview (deploy)
    needs: preview-build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The preview comment.
      pull-requests: write
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Website deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The owner needs to add them (see apps/site/README.md) to deploy the website; until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Use the default branch's deploy configuration, never the PR's.
      - name: Check out the default branch's deploy configuration
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .site-base
          persist-credentials: false
          sparse-checkout: |
            apps/site/wrangler.toml
            pnpm-workspace.yaml
            .nvmrc
          sparse-checkout-cone-mode: false
      - name: Read the Wrangler version
        id: tooling
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: .site-base
        run: |
          if [ ! -f apps/site/wrangler.toml ]; then
            echo "::notice title=Website preview skipped::The default branch has no apps/site/wrangler.toml yet (the PR that adds the site); previews start once it is on main."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^  wrangler: \([0-9][0-9.]*\)$/\1/p' pnpm-workspace.yaml)
          if [ -z "$version" ]; then
            echo "::error file=pnpm-workspace.yaml::no exact wrangler version in the default catalog"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.tooling.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .site-base/.nvmrc
      - name: Download the preview build
        if: steps.tooling.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-preview-dist
          path: .site-base/apps/site/dist/
      - name: Upload a preview version
        id: preview
        if: steps.tooling.outputs.ready == 'true'
        working-directory: .site-base/apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_VERSION: ${{ steps.tooling.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          # A fresh npm cache: nothing an earlier job left on this runner is reused.
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          rm -rf "$npm_config_cache" "$WRANGLER_OUTPUT_FILE_PATH"
          npx --yes "wrangler@$WRANGLER_VERSION" versions upload --preview-alias "pr-$PR" --message "PR #$PR at $SHA"
          url=$(node -e '
            const lines = require("node:fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            const upload = lines.map((l) => JSON.parse(l)).filter((e) => e.type === "version-upload").at(-1);
            process.stdout.write(upload?.preview_alias_url ?? upload?.preview_url ?? "");
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL (is preview_urls on for the lamina-pdf-site Worker?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Website preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          marker="<!-- lamina-pdf-site-preview -->"
          body=$(printf '%s\n**Website preview:** %s\n\nBuilt from %s. Updated on every push to this PR.' "$marker" "$URL" "$SHA")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      - name: Remove the deploy configuration checkout
        if: always()
        run: rm -rf .site-base

  production:
    name: Website production
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # `cargo xtask progress` reads the open pull requests and their files.
      pull-requests: read
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Website deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. The owner needs to add them (see apps/site/README.md) to deploy the website; until then this job only skips."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `cargo xtask progress` reads origin/main's history (the merged pull requests).
          fetch-depth: 0
      - if: steps.secrets.outputs.enabled == 'true'
        uses: ./.github/actions/host-rust
        with:
          cache: true
      - name: Refresh the roadmap
        if: steps.secrets.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cargo xtask progress
      - if: steps.secrets.outputs.enabled == 'true'
        uses: ./.github/actions/node-pnpm
      - name: Build the site
        if: steps.secrets.outputs.enabled == 'true'
        env:
          # The one build that search engines may index.
          LAMINA_PDF_ENV: production
        run: pnpm --filter @laminapdf/site build
      - name: Deploy production
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --message "main at $SHA"
