# CI fast lane (docs/research/architecture/notes/repo-and-packaging.md §6): every PR and every push
# to main. Jobs call the same `cargo xtask …` entry points developers run locally.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019); Dependabot bumps them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Prefer the self-hosted runners (macOS ARM64) when one is online; fall back to GitHub-hosted
  # Ubuntu otherwise, and for fork PRs. See select-runner.yml. Jobs that install Rust first run
  # the isolate-rust-home action so they don't touch the runner user's own ~/.cargo and ~/.rustup.
  select-runner:
    name: Choose CI runner
    permissions:
      contents: read
    uses: ./.github/workflows/select-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  rust:
    name: Rust (fmt, portability, clippy, tests, docs, cargo-deny, wasm)
    needs: select-runner
    # Still run if the runner check failed: an empty output falls back to GitHub-hosted Ubuntu.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      # No `toolchain` input: installs exactly what rust-toolchain.toml pins (version, components, targets).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: ${{ runner.environment == 'github-hosted' }}
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - run: cargo xtask check rust
      - run: cargo xtask wasm

  msrv:
    name: MSRV (rust-version)
    needs: select-runner
    # Still run if the runner check failed: an empty output falls back to GitHub-hosted Ubuntu.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - name: Read the declared rust-version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no rust-version found in [workspace.package]"
            exit 1
          fi
          echo "MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      # Installs rustup if missing and puts cargo on PATH (self-hosted runners have neither).
      # `toolchain` skips rust-toolchain.toml's components and targets. `override: false` keeps the
      # action from running `rustup override set`, which would outlive the job on a self-hosted
      # runner; the check below names the toolchain explicitly instead.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: ${{ runner.environment == 'github-hosted' }}
          toolchain: ${{ steps.msrv.outputs.version }}
          components: ""
          target: ""
          override: false
      - name: Check the workspace on the declared rust-version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --locked --workspace --all-targets --all-features

  typescript:
    name: TypeScript (biome, typecheck, tests, npm licences)
    needs: select-runner
    # Still run if the runner check failed: an empty output falls back to GitHub-hosted Ubuntu.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      # No `version` input: uses packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per-job install dir: the default (~/setup-pnpm) is shared by every self-hosted
          # runner on the same machine, and concurrent jobs delete each other's pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # xtask is the entry point for the TS checks too, but it only needs to build for the host.
      # Passing `toolchain` makes the action skip rust-toolchain.toml's components and cross
      # targets, and RUSTUP_TOOLCHAIN makes cargo use that bare toolchain instead of installing
      # them. The version is still read from rust-toolchain.toml. RUSTUP_TOOLCHAIN replaces the
      # action's `rustup override set`, which would outlive the job on a self-hosted runner.
      - name: Read the pinned Rust version
        id: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: ${{ runner.environment == 'github-hosted' }}
          toolchain: ${{ steps.rust.outputs.channel }}
          components: ""
          target: ""
          override: false
      - run: cargo xtask check ts

  # The pdf-basics spike is frozen research code outside both workspaces, but its tests are the
  # evidence behind several decisions. Its Rust core is ported to crates/lamina-syntax and
  # crates/lamina-cos (Round A3); this job keeps the frozen record (incl. the TS twin) green.
  spikes:
    name: Spike pdf-basics (Rust + TS)
    needs: select-runner
    # Still run if the runner check failed: an empty output falls back to GitHub-hosted Ubuntu.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-workspaces: spikes/pdf-basics/rust
      - run: spikes/pdf-basics/rust/scripts/check-targets.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per-job install dir: the default (~/setup-pnpm) is shared by every self-hosted
          # runner on the same machine, and concurrent jobs delete each other's pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: spikes/pdf-basics/ts/pnpm-lock.yaml
      - name: TypeScript spike (typecheck, lint, tests incl. WASM interop)
        working-directory: spikes/pdf-basics/ts
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
