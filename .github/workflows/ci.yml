# CI fast lane (docs/research/architecture/notes/repo-and-packaging.md §6, ADR 0018 §2): every PR
# and every push to main. Jobs call the same `cargo xtask …` entry points developers run locally.
# The full lane (full.yml) runs alongside it. Branch protection requires `fast-gate` (the last
# job in this file) and full.yml's `gate` (todo X7). A new job here uses exactly
#     if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
# (so it is skipped on docs-only PRs: a job that runs there fails `fast-gate`) and joins
# `fast-gate`'s `needs`.
# Native Rust checks cover Linux, macOS and Windows on x64 and Arm64. Everything else runs on
# Linux x64, except WebKit, which runs on macOS Arm64 (closest to Safari). Each job gets a
# fresh hosted VM.
# Rust caches are saved only on main; fork PRs have read-only tokens and no secrets.
# Cargo tools install through .github/actions/install-tools.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019); Dependabot bumps them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  # Same classification as the full lane (cargo xtask changes): on a docs-only PR the jobs
  # below are skipped, and the full lane's `changes` job runs the docs checks under `gate`.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.pr.outputs.code || steps.push.outputs.code }}
    steps:
      - name: Pushes to main run every job
        id: push
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/host-rust
        with:
          cache: true
          # Runs only on pull requests; the typescript job saves this cache on main.
          shared-key: xtask
          save: "false"
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"

  rust:
    name: Rust (${{ matrix.platform }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The compile cache's trial (todo X8a) runs on the legs marked compile-cache. On a push to
    # main they take the rust-compile-cache environment, which only main may use and which holds
    # the token that writes; every other run gets no environment and the read-only token.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.compile-cache && 'rust-compile-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, host: x86_64-unknown-linux-gnu, compile-cache: true }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, host: aarch64-unknown-linux-gnu }
          - { platform: macos-x64, runner: macos-15-intel, host: x86_64-apple-darwin, compile-cache: true }
          - { platform: macos-arm64, runner: macos-15, host: aarch64-apple-darwin, compile-cache: true }
          - { platform: windows-x64, runner: windows-2025, host: x86_64-pc-windows-msvc }
          - { platform: windows-arm64, runner: windows-11-arm, host: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base with main: `check maintainability` compares its record files with
          # main's, and clippy-examples is strict on the examples a PR changes.
          fetch-depth: 0
      # No `toolchain` input: installs exactly what rust-toolchain.toml pins (version, components, targets).
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-shared-key: rust
          cache-bin: false
      - name: Verify the Rust compiler runs natively
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          actual=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          if [ "$actual" != "$EXPECTED_HOST" ]; then
            echo "::error::Expected native host $EXPECTED_HOST, got $actual"
            exit 1
          fi
      # After the toolchain step, so the Rust cache's key doesn't change (docs/plans/ci-caching.md §4.1).
      - name: Set up the compile cache
        if: matrix.compile-cache
        uses: ./.github/actions/rust-compile-cache
        with:
          endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # On PRs the full lane's `changes` job runs these checks; it skips them on pushes to main,
      # so they run here only then.
      - name: Docs checks (cargo xtask check docs)
        if: github.event_name == 'push' && matrix.platform == 'linux-x64'
        run: cargo xtask check docs
      # On pushes to main, `check rust` renders the rustdoc into an empty doc/ (cargo rewrites
      # every crate's pages when they are missing), so the artefact below holds this commit's
      # crates only, including when the dependency cache restored a doc directory.
      - name: Start the rustdoc from an empty directory
        if: github.event_name == 'push' && matrix.platform == 'linux-x64'
        run: cargo clean --doc
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      - uses: ./.github/actions/linux-webkit
      - run: cargo xtask check rust
      # The rendered rustdoc of every workspace crate (`check rust` builds it with warnings
      # denied), from main only: the docs site's Rust API page points here until the crates are
      # on docs.rs (B7a).
      - name: Upload the rustdoc
        if: github.event_name == 'push' && matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdoc
          path: ${{ env.CARGO_TARGET_DIR }}/doc/
          if-no-files-found: error
          retention-days: 30
      - name: Compile cache statistics
        if: ${{ !cancelled() && matrix.compile-cache }}
        uses: ./.github/actions/rust-compile-cache
        with:
          stats: "true"

  # The @laminapdf/wasm modules (ADR 0016): built, tested in Node (wasm-bindgen-test and the
  # package's smoke test), and measured against the size budgets, failing above them.
  wasm:
    name: WASM (lamina_pdf_base + lamina_pdf_text, Node tests, size budgets)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # "true" once the built packages are uploaded: the pdf-runtimes legs need the build, not
      # the whole job (a size-budget failure after the upload still lets them run).
      dist: ${{ steps.dist.outputs.uploaded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-shared-key: wasm
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs (wasm-bindgen-cli = the crate in Cargo.lock);
      # xtask fails if they drift. binaryen's wasm-opt is fetched by `cargo xtask wasm` itself
      # (pinned release, SHA-256 checked) into target/tools/.
      - uses: ./.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129,twiggy@0.8.0
      - uses: ./.github/actions/node-pnpm
      - run: cargo xtask wasm
      # The built modules and @laminapdf/sdk's dist/ for the pdf-runtimes jobs (paths are kept
      # relative to packages/).
      - name: Upload the built packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lamina-pdf-dist
          path: |
            packages/wasm/dist/
            packages/sdk/dist/
          if-no-files-found: error
          retention-days: 1
      - id: dist
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - run: cargo xtask size
      - name: Upload the size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: target/size-report.json
          if-no-files-found: warn

  # Todo B6c (pdf-library §5): @laminapdf/sdk's example suite, byte-identical to the Rust goldens,
  # in every runtime it supports, over the `wasm` job's build (Node 24, .nvmrc, is the `wasm`
  # job's own run of the suite). Three jobs rather than one per runtime: each runtime's suite takes
  # 20 to 70 s, less than setting up a job. `browsers` runs Chromium (with a Vite production
  # build run in a Chromium page) and Firefox on Linux, `webkit` WebKit on macOS (Vitest browser
  # mode with Playwright);
  # `servers` runs Deno, Bun, workerd (wrangler's test harness) and Node 22 and 26. Every runtime
  # runs even when one fails. Timings and WebAssembly memory go to the job summary (`cargo
  # xtask pdf-runtimes`; recorded, not asserted).
  pdf-runtimes:
    name: "@laminapdf/sdk in ${{ matrix.name }}"
    needs: [changes, wasm]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.wasm.outputs.dist == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: browsers, name: "Chromium and Firefox", runtimes: "chromium firefox", runner: ubuntu-24.04 }
          - { group: webkit, name: "WebKit", runtimes: "webkit", runner: macos-15 }
          - {
              group: servers,
              name: "Deno, Bun, workerd and Node 22 and 26",
              runtimes: "deno bun workerd",
              runner: ubuntu-24.04,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lamina-pdf-dist
          path: packages/
      - uses: ./.github/actions/host-rust
        with:
          cache: true
          shared-key: xtask
          save: "false"
      # Deno, Bun and wrangler (workerd) are dev dependencies of @laminapdf/sdk.
      - uses: ./.github/actions/node-pnpm
      - name: Keep the Playwright browsers in the runner's tool cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
      - if: matrix.group == 'browsers'
        uses: ./.github/actions/playwright-deps
        with:
          browsers: chromium firefox
      # Every runtime runs even when one before it failed (`!cancelled()`); the Node runs come
      # last, each after switching the Node on PATH. `--label` gives each run its own
      # measurements file.
      - name: "@laminapdf/sdk in ${{ matrix.group == 'servers' && 'Deno, Bun and workerd' || matrix.name }}"
        env:
          RUNTIMES: ${{ matrix.runtimes }}
          GROUP: ${{ matrix.group }}
        run: |
          # shellcheck disable=SC2086 # one argument per runtime
          cargo xtask pdf-runtimes $RUNTIMES --label "$GROUP"
      - if: ${{ !cancelled() && matrix.group == 'servers' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: "@laminapdf/sdk in Node 22"
        if: ${{ !cancelled() && matrix.group == 'servers' }}
        run: cargo xtask pdf-runtimes node --label node22
      - if: ${{ !cancelled() && matrix.group == 'servers' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: "@laminapdf/sdk in Node 26"
        if: ${{ !cancelled() && matrix.group == 'servers' }}
        run: cargo xtask pdf-runtimes node --label node26
      - name: Upload the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-runtimes-${{ matrix.group }}
          path: target/xtask/pdf-runtimes/
          if-no-files-found: ignore

  # Todo P3: the published crates (cargo-semver-checks) and @laminapdf/sdk's public API (API
  # Extractor) against the newest published version, over the `wasm` job's build. A breaking
  # change fails unless a pending changeset bumps the fixed group's minor version (the stability
  # policy); the job summary lists every change found either way (`cargo xtask semver`).
  semver:
    name: Semver against the published version
    needs: [changes, wasm]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.wasm.outputs.dist == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lamina-pdf-dist
          path: packages/
      - uses: ./.github/actions/host-rust
        with:
          cache: true
      # Same version as tools/xtask/src/doctor.rs.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-semver-checks@0.51.0
      - uses: ./.github/actions/node-pnpm
      - run: cargo xtask semver

  # Two short checks in one job, since each takes about a minute, less than waiting for a runner.
  # MSRV: the workspace builds on the declared rust-version. The pdf-basics spike is frozen
  # research code outside both workspaces, but its tests are the evidence behind several
  # decisions. Its Rust core is ported to crates/laminapdf-syntax and crates/laminapdf-cos (Round A3);
  # these steps keep the frozen record (incl. the TS twin) green.
  msrv-and-spike:
    name: MSRV (rust-version) and the pdf-basics spike (Rust + TS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the declared rust-version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no rust-version found in [workspace.package]"
            exit 1
          fi
          echo "MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      # The MSRV check names its toolchain explicitly; the next step restores the pinned one.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          toolchain: ${{ steps.msrv.outputs.version }}
          components: ""
          target: ""
          override: false
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      - uses: ./.github/actions/linux-webkit
      - name: Check the workspace on the declared rust-version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --locked --workspace --all-targets --all-features
      # The pinned toolchain with rust-toolchain.toml's components and targets, for the spike.
      - if: ${{ !cancelled() }}
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          # No `rustup override set` either: rust-toolchain.toml already picks this toolchain.
          override: false
      # The spike builds into its own target/ (unsetting the MSRV check's CARGO_TARGET_DIR): its
      # scripts and TS tests read its wasm from spikes/pdf-basics/rust/target/.
      - name: Rust spike (cross-target checks, wasm build, fmt, clippy, tests)
        if: ${{ !cancelled() }}
        run: env -u CARGO_TARGET_DIR spikes/pdf-basics/rust/scripts/check-targets.sh
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/node-pnpm
        with:
          install: spikes/pdf-basics/ts
      - name: TypeScript spike (typecheck, lint, tests incl. WASM interop)
        if: ${{ !cancelled() }}
        working-directory: spikes/pdf-basics/ts
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

  typescript:
    name: TypeScript (biome, typecheck, tests, npm licences)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-pnpm
      # xtask is the entry point for the TS checks too, but it only needs to build for the host.
      - uses: ./.github/actions/host-rust
        with:
          cache: true
          # Builds only xtask, and runs on pushes to main: it saves the `xtask` cache.
          shared-key: xtask
      - run: cargo xtask check ts

  # The fast lane's required check (todo X7): every job above passed, or was skipped on a
  # docs-only PR. Rules for new jobs: see the header (tools/xtask/src/workflows.rs checks
  # `needs`). The shell is full.yml gate's without the Linux skip; change both together.
  fast-gate:
    name: fast-gate
    if: always()
    needs: [changes, rust, wasm, pdf-runtimes, semver, msrv-and-spike, typescript]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ]; then
            echo "::error::the changes job ended with '$changes'"
            exit 1
          fi
          case "$CODE" in
            true|false) echo "Jobs needed: $CODE" ;;
            *)
              echo "::error::the changes job's code output is '$CODE', not true or false"
              exit 1
              ;;
          esac
          failed=0
          for job in $(jq -r 'del(.changes) | keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            echo "$job: $result"
            case "$CODE/$result" in
              true/success | false/skipped) ;;
              *)
                echo "::error::$job ended with '$result' (jobs needed: $CODE)"
                failed=1
                ;;
            esac
          done
          exit "$failed"
