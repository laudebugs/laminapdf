# CI fast lane (docs/research/architecture/notes/repo-and-packaging.md §6, ADR 0018 §2): every PR
# and every push to main. Jobs call the same `cargo xtask …` entry points developers run locally.
# The full lane (full.yml) runs alongside it; its `gate` job is the required check.
# Every job runs on the self-hosted macOS ARM64 runners (labels [self-hosted, macOS, ARM64]):
# GitHub-hosted minutes are not used. (The Linux runner container, tools/ci-runner/linux, only
# serves full.yml's check-linux.) The runners share one machine, so jobs that install Rust
# run isolate-rust-home first, pnpm installs into the runner's temp dir, and rust-cache is off.
# Instead, isolate-rust-home's `target-dir` keeps each job's build output on its runner between
# runs, apart per job and per kind of trigger, so PR output is never reused on main (see the
# action). Jobs that only build xtask share `xtask`. The spikes job keeps the checkout's target/:
# the frozen spike's scripts and TS tests read its wasm from spikes/pdf-basics/rust/target/.
# The repository is private, so fork PRs (which must never run on self-hosted runners) can't occur.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019); Dependabot bumps them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

jobs:
  # Same classification as the full lane (cargo xtask changes): on a docs-only PR the jobs
  # below are skipped, and the full lane's `changes` job runs the docs checks under `gate`.
  changes:
    name: Changed paths
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    outputs:
      code: ${{ steps.pr.outputs.code || steps.push.outputs.code }}
    steps:
      - name: Pushes to main run every job
        id: push
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: xtask
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/host-rust
        with:
          cache: false
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"

  rust:
    name: Rust (docs links and todo board, fmt, portability, clippy, tests, docs, cargo-deny)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: ci-rust
      # No `toolchain` input: installs exactly what rust-toolchain.toml pins (version, components, targets).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: false
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - run: cargo xtask check docs
      # On pushes to main, `check rust` renders the rustdoc into an empty doc/ (cargo rewrites
      # every crate's pages when they are missing), so the artefact below holds this commit's
      # crates only: the job's CARGO_TARGET_DIR is kept between runs and would carry pages of
      # renamed or removed crates.
      - name: Start the rustdoc from an empty directory
        if: github.event_name == 'push'
        run: rm -rf "${CARGO_TARGET_DIR:?isolate-rust-home sets it}/doc"
      - run: cargo xtask check rust
      # The rendered rustdoc of every workspace crate (`check rust` builds it with warnings
      # denied), from main only: the docs site's Rust API page points here until the crates are
      # on docs.rs (B7a).
      - name: Upload the rustdoc
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdoc
          path: ${{ env.CARGO_TARGET_DIR }}/doc/
          if-no-files-found: error
          retention-days: 30

  # The @laminapdf/wasm modules (ADR 0016): built, tested in Node (wasm-bindgen-test and the
  # package's smoke test), and measured against the size budgets, failing above them.
  wasm:
    name: WASM (lamina_base + lamina_text, Node tests, size budgets)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    outputs:
      # "true" once the built packages are uploaded: the pdf-runtimes legs need the build, not
      # the whole job (a size-budget failure after the upload still lets them run).
      dist: ${{ steps.dist.outputs.uploaded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: ci-wasm
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: false
      # Same versions as tools/xtask/src/doctor.rs (wasm-bindgen-cli = the crate in Cargo.lock);
      # xtask fails if they drift. binaryen's wasm-opt is fetched by `cargo xtask wasm` itself
      # (pinned release, SHA-256 checked) into target/tools/.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.129,twiggy@0.8.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per-job install dir: the default (~/setup-pnpm) is shared by every self-hosted
          # runner on the same machine, and concurrent jobs delete each other's pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask wasm
      # The built modules and @laminapdf/sdk's dist/ for the pdf-runtimes jobs (paths are kept
      # relative to packages/).
      - name: Upload the built packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lamina-pdf-dist
          path: |
            packages/wasm/dist/
            packages/sdk/dist/
          if-no-files-found: error
          retention-days: 1
      - id: dist
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - run: cargo xtask size
      - name: Upload the size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: target/size-report.json
          if-no-files-found: warn

  # Todo B6c (pdf-library §5): @laminapdf/sdk's example suite, byte-identical to the Rust goldens,
  # in Node 22 and 26 and in Chromium (with a Vite production build run in a Chromium page),
  # over the `wasm` job's build. Node 24 (.nvmrc) is the `wasm` job's own run of the suite
  # (`cargo xtask wasm`), so it has no leg here; its timings are the nightly lane's. Firefox, WebKit, Deno, Bun and workerd run in the full lane
  # (full.yml) and the nightly lane. Timings and WebAssembly memory go to the job summary
  # (`cargo xtask pdf-runtimes`; recorded, not asserted).
  pdf-runtimes:
    name: "@laminapdf/sdk in ${{ matrix.runtime == 'node' && format('Node {0}', matrix.node) || 'Chromium' }}"
    needs: [changes, wasm]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.wasm.outputs.dist == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, node: "22" }
          - { runtime: node, node: "26" }
          # Node from .nvmrc (an empty node-version falls back to node-version-file).
          - { runtime: chromium, node: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lamina-pdf-dist
          path: packages/
      - uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: xtask
      - uses: ./.github/actions/host-rust
        with:
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per-job install dir: the default (~/setup-pnpm) is shared by every self-hosted
          # runner on the same machine, and concurrent jobs delete each other's pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browsers stay in the runner's own tool cache between runs (`playwright install`
      # only downloads a missing or outdated one), like the corpus in nightly.yml.
      - name: Keep the Playwright browsers in the runner's tool cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
      - env:
          RUNTIME: ${{ matrix.runtime }}
        run: cargo xtask pdf-runtimes "$RUNTIME"
      - name: Upload the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-runtimes-${{ matrix.runtime }}${{ matrix.node }}
          path: target/xtask/pdf-runtimes/
          if-no-files-found: ignore

  msrv:
    name: MSRV (rust-version)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: ci-msrv
      - name: Read the declared rust-version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no rust-version found in [workspace.package]"
            exit 1
          fi
          echo "MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      # Installs rustup if missing and puts cargo on PATH (self-hosted runners have neither).
      # `toolchain` skips rust-toolchain.toml's components and targets. `override: false` keeps the
      # action from running `rustup override set`, which would outlive the job on a self-hosted
      # runner; the check below names the toolchain explicitly instead.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: false
          toolchain: ${{ steps.msrv.outputs.version }}
          components: ""
          target: ""
          override: false
      - name: Check the workspace on the declared rust-version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --locked --workspace --all-targets --all-features

  typescript:
    name: TypeScript (biome, typecheck, tests, npm licences)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
        with:
          target-dir: xtask
      # No `version` input: uses packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per-job install dir: the default (~/setup-pnpm) is shared by every self-hosted
          # runner on the same machine, and concurrent jobs delete each other's pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # xtask is the entry point for the TS checks too, but it only needs to build for the host.
      - uses: ./.github/actions/host-rust
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: false
      - run: cargo xtask check ts

  # The pdf-basics spike is frozen research code outside both workspaces, but its tests are the
  # evidence behind several decisions. Its Rust core is ported to crates/lamina-syntax and
  # crates/lamina-cos (Round A3); this job keeps the frozen record (incl. the TS twin) green.
  spikes:
    name: Spike pdf-basics (Rust + TS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/isolate-rust-home
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # rust-cache's post step on macOS runs `sudo /usr/sbin/purge`, which hangs forever on
          # self-hosted runners without passwordless sudo. Self-hosted runners keep their own
          # CARGO_HOME between jobs, so caching is only for GitHub-hosted runners.
          cache: false
          cache-workspaces: spikes/pdf-basics/rust
      - run: spikes/pdf-basics/rust/scripts/check-targets.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per-job install dir: the default (~/setup-pnpm) is shared by every self-hosted
          # runner on the same machine, and concurrent jobs delete each other's pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: spikes/pdf-basics/ts/pnpm-lock.yaml
      - name: TypeScript spike (typecheck, lint, tests incl. WASM interop)
        working-directory: spikes/pdf-basics/ts
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
