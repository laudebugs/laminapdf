# CI fast lane (docs/research/architecture/notes/repo-and-packaging.md §6, ADR 0018 §2): every PR
# and every push to main. Jobs call the same `cargo xtask …` entry points developers run locally.
# The full lane (full.yml) runs alongside it. Branch protection requires `fast-gate` (the last
# job in this file) and full.yml's `gate` (todo X7). A new job here runs on its group's flag from
# `cargo xtask changes` (todo X9c): native Rust jobs on
#     if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
# and TypeScript and WebAssembly jobs on `ts`, but for the runtime legs, which follow `runtimes`
# and run only the suites a PR's paths reach (todo X12). Every flag is false on docs-only PRs. Add
# the job to `fast-gate`'s `needs`; a Rust job also needs a line in fast-gate's `case`, which
# defaults to `ts`.
# A job that must run on every PR, docs-only ones included, has no `if:` and a `<job>) needed=true ;;`
# line in that `case` (the `lockfile` job).
# Native Rust checks cover Linux, macOS and Windows on x64 and Arm64 (macOS x64 on pushes to main
# and in the nightly only, todo X9a). Everything else runs on
# Linux x64, except WebKit, which runs on macOS Arm64 (closest to Safari) on pushes to main and on
# Linux x64 on PRs, and the render goldens, a step of the macOS Arm64 Rust leg. A Mac's queue is
# the longest, so a PR asks for one Mac in this lane. Each job gets a fresh hosted VM.
# Rust caches are saved only on main; fork PRs have read-only tokens and no secrets.
# Cargo tools install through .github/actions/install-tools.
# Actions are locked by .github/workflows/actions.lock (ADR 0019, todo X11): `uses:` names a release
# tag, and `gh actions-lock` rewrites the lockfile after a `uses:` line changes; Dependabot bumps both.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Newer runs cancel older ones, on PRs and on main (todo X9d; ADR 0018 §2).
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # .config/nextest.toml: no retries in the PR lanes (ADR 0018 §4).
  NEXTEST_PROFILE: ci

defaults:
  run:
    shell: bash

jobs:
  # Same classification as the full lane (cargo xtask changes): on a docs-only PR the jobs
  # below are skipped, and the full lane's `changes` job runs the docs checks under `gate`.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.pr.outputs.rust || steps.push.outputs.rust }}
      ts: ${{ steps.pr.outputs.ts || steps.push.outputs.ts }}
      render: ${{ steps.pr.outputs.render || steps.push.outputs.render }}
      rust-legs: ${{ steps.legs.outputs.rust-legs }}
      runtime-legs: ${{ steps.runtime-legs.outputs.runtime-legs }}
      runtimes: ${{ steps.runtime-legs.outputs.runtimes }}
    steps:
      # The native Rust legs, read by the `rust` job's matrix. Pull requests leave out macOS x64,
      # because its runners queue longest; the leg runs on pushes to main and in the nightly
      # (nightly.yml's rust-macos-x64; todo X9a). A matrix `exclude` can't do this: GitHub applies
      # it before `include`, and this matrix is only `include` entries.
      - name: Choose the native Rust legs
        id: legs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          legs='[
            {"platform": "linux-x64", "runner": "ubuntu-24.04", "host": "x86_64-unknown-linux-gnu"},
            {"platform": "linux-arm64", "runner": "ubuntu-24.04-arm", "host": "aarch64-unknown-linux-gnu"},
            {"platform": "macos-x64", "runner": "macos-15-intel", "host": "x86_64-apple-darwin"},
            {"platform": "macos-arm64", "runner": "macos-15", "host": "aarch64-apple-darwin"},
            {"platform": "windows-x64", "runner": "windows-2025", "host": "x86_64-pc-windows-msvc"},
            {"platform": "windows-arm64", "runner": "windows-11-arm", "host": "aarch64-pc-windows-msvc"}
          ]'
          if [ "$EVENT" = pull_request ]; then
            legs=$(jq -c 'map(select(.platform != "macos-x64"))' <<< "$legs")
          fi
          echo "rust-legs=$(jq -c . <<< "$legs")" >> "$GITHUB_OUTPUT"
      - name: Pushes to main run every job
        id: push
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "rust=true"
            echo "ts=true"
            echo "render=true"
          } >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: $/.github/actions/host-rust
        with:
          cache: true
          # Runs only on pull requests; the typescript job saves this cache on main.
          shared-key: xtask
          save: "false"
      - name: Classify the changed paths
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE: origin/${{ github.base_ref }}
        run: cargo xtask changes --base "$BASE"
      # The runtime legs, read by the `pdf-runtimes` job's matrix (todo X12; CI caching plan
      # §8.3): on a pull request, each browser leg runs the suites `cargo xtask changes` found the
      # paths reach, and the server leg runs only when they reach the SDK's examples. Pushes to
      # main run every leg and suite. WebKit runs on Linux on a pull request and on macOS on
      # main: a Mac waits longest for a runner, and main still catches what only Safari's
      # platform does. `runtimes` is false, and the job skipped, when no leg runs or
      # `ts` is false.
      - name: Choose the runtime legs
        id: runtime-legs
        env:
          EVENT: ${{ github.event_name }}
          SUITES: ${{ steps.pr.outputs.suites }}
          TS: ${{ steps.pr.outputs.ts || steps.push.outputs.ts }}
        run: |
          legs='[
            {"group": "chromium", "name": "Chromium", "runtimes": "chromium", "runner": "ubuntu-24.04"},
            {"group": "firefox", "name": "Firefox", "runtimes": "firefox", "runner": "ubuntu-24.04"},
            {"group": "webkit", "name": "WebKit", "runtimes": "webkit", "runner": "macos-15"},
            {"group": "servers", "name": "Deno, Bun, workerd and Node 22 and 26", "runtimes": "deno bun workerd", "runner": "ubuntu-24.04"}
          ]'
          if [ "$EVENT" = pull_request ]; then
            legs=$(jq -c --arg suites "$SUITES" '
              ($suites | split(",") | map(select(. != ""))) as $s
              | if ($s | length) == 0 then []
                else map(
                  if .group == "servers" then
                    if ($s | index("examples")) then . + {suites: "examples"} else empty end
                  elif .group == "webkit" then . + {suites: ($s | join(",")), runner: "ubuntu-24.04"}
                  else . + {suites: ($s | join(","))} end)
                end' <<< "$legs")
          else
            legs=$(jq -c 'map(. + {suites: ""})' <<< "$legs")
          fi
          runtimes=false
          if [ "$TS" = true ] && [ "$(jq length <<< "$legs")" -gt 0 ]; then runtimes=true; fi
          {
            echo "runtime-legs=$legs"
            echo "runtimes=$runtimes"
          } >> "$GITHUB_OUTPUT"
          echo "Runtime legs (runtimes=$runtimes): $legs"

  rust:
    name: Rust (${{ matrix.platform }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The `changes` job's list: every leg, but macOS x64 only on pushes to main (todo X9a).
        include: ${{ fromJSON(needs.changes.outputs.rust-legs) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The merge base with main: `check maintainability` compares its record files with
          # main's, and clippy-examples is strict on the examples a PR changes.
          fetch-depth: 0
      # No `toolchain` input: installs exactly what rust-toolchain.toml pins (version, components, targets).
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-shared-key: rust
          cache-bin: false
      - name: Verify the Rust compiler runs natively
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          actual=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          if [ "$actual" != "$EXPECTED_HOST" ]; then
            echo "::error::Expected native host $EXPECTED_HOST, got $actual"
            exit 1
          fi
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: $/.github/actions/install-tools
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # On PRs the full lane's `changes` job runs these checks; it skips them on pushes to main,
      # so they run here only then.
      - name: Docs checks (cargo xtask check docs)
        if: github.event_name == 'push' && matrix.platform == 'linux-x64'
        run: cargo xtask check docs
      # On pushes to main, `check rust` renders the rustdoc into an empty doc/ (cargo rewrites
      # every crate's pages when they are missing), so the artefact below holds this commit's
      # crates only, including when the dependency cache restored a doc directory.
      - name: Start the rustdoc from an empty directory
        if: github.event_name == 'push' && matrix.platform == 'linux-x64'
        run: cargo clean --doc
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      - uses: $/.github/actions/linux-webkit
      - run: cargo xtask check rust
      # The render goldens were written on macOS arm64, and PDFium's rasteriser (fonts,
      # anti-aliasing) differs by platform, so they run on this leg only, and only when the change
      # reaches what they draw (`render`, todo X9b; every render input is a Rust one too). A step
      # here, not a job, so a PR waits for one Mac, not two. Pushes to main always run them.
      - if: ${{ !cancelled() && matrix.platform == 'macos-arm64' && needs.changes.outputs.render == 'true' }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Render goldens (PDFium and hayro)
        if: ${{ !cancelled() && matrix.platform == 'macos-arm64' && needs.changes.outputs.render == 'true' }}
        env:
          LAMINA_PDF_PYTHON: ${{ runner.temp }}/render-venv/bin/python
        run: |
          python3 -m venv "$RUNNER_TEMP/render-venv"
          "$RUNNER_TEMP/render-venv/bin/pip" install -r tools/render/requirements.txt
          cargo xtask render-golden
      - name: Upload the render diff images
        if: failure() && matrix.platform == 'macos-arm64'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: render-golden-diff
          path: target/xtask/render-golden/diff/
          if-no-files-found: ignore
      # The rendered rustdoc of every workspace crate (`check rust` builds it with warnings
      # denied), from main only: the docs site's Rust API page points here until the crates are
      # on docs.rs (B7a).
      - name: Upload the rustdoc
        if: github.event_name == 'push' && matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rustdoc
          path: ${{ env.CARGO_TARGET_DIR }}/doc/
          if-no-files-found: error
          retention-days: 30

  # The @laminapdf/wasm modules (ADR 0016): built, tested in Node (wasm-bindgen-test and the
  # package's smoke test), and measured against the size budgets, failing above them.
  wasm:
    name: WASM (lamina_pdf_base + lamina_pdf_text, Node tests, size budgets)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # "true" once the built packages are uploaded: the pdf-runtimes legs need the build, not
      # the whole job (a size-budget failure after the upload still lets them run).
      dist: ${{ steps.dist.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-shared-key: wasm
          cache-bin: false
      # Same versions as tools/xtask/src/doctor.rs (wasm-bindgen-cli = the crate in Cargo.lock);
      # xtask fails if they drift. binaryen's wasm-opt is fetched by `cargo xtask wasm` itself
      # (pinned release, SHA-256 checked) into target/tools/.
      - uses: $/.github/actions/install-tools
        with:
          tool: wasm-bindgen@0.2.129,twiggy@0.8.0
      - uses: $/.github/actions/node-pnpm
      - run: cargo xtask wasm
      # The built modules and @laminapdf/sdk's dist/ for the pdf-runtimes jobs (paths are kept
      # relative to packages/).
      - name: Upload the built packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lamina-pdf-dist
          path: |
            packages/wasm/dist/
            packages/sdk/dist/
          if-no-files-found: error
          retention-days: 1
      - id: dist
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - run: cargo xtask size
      - name: Upload the size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: size-report
          path: target/size-report.json
          if-no-files-found: warn

  # Todo B6c (pdf-library §5): @laminapdf/sdk's example suite, byte-identical to the Rust goldens,
  # in every runtime it supports, over the `wasm` job's build (Node 24, .nvmrc, is the `wasm`
  # job's own run of the suite). The servers share a job: each one's suite takes 20 to 70 s, less
  # than setting up a job. Each browser has its own, since a browser also runs the packages' browser
  # tests and the reader's e2e suite, 10 to 12 minutes each: `chromium` (with a Vite production
  # build run in a Chromium page) and `firefox` on Linux, `webkit` on Linux on PRs and on macOS on
  # main (Vitest browser mode with Playwright);
  # `servers` runs Deno, Bun, workerd (wrangler's test harness) and Node 22 and 26. Every runtime
  # runs even when one fails. Timings and WebAssembly memory go to the job summary (`cargo
  # xtask pdf-runtimes`; recorded, not asserted).
  pdf-runtimes:
    name: "@laminapdf/sdk in ${{ matrix.name }}"
    needs: [changes, wasm]
    # The legs and the suites each runs come from the changes job (todo X12).
    if: ${{ !cancelled() && needs.changes.outputs.runtimes == 'true' && needs.wasm.outputs.dist == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.runtime-legs) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download the built packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: lamina-pdf-dist
          path: packages/
      - uses: $/.github/actions/host-rust
        with:
          cache: true
          shared-key: xtask
          save: "false"
      # Deno, Bun and wrangler (workerd) are dev dependencies of @laminapdf/sdk.
      - uses: $/.github/actions/node-pnpm
      - name: Keep the Playwright browsers in the runner's tool cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
      # A no-op on macOS (WebKit on pushes to main).
      - if: matrix.group != 'servers'
        uses: $/.github/actions/playwright-deps
        with:
          browsers: ${{ matrix.runtimes }}
      # Every runtime runs even when one before it failed (`!cancelled()`); the Node runs come
      # last, each after switching the Node on PATH. `--label` gives each run its own
      # measurements file.
      - name: "@laminapdf/sdk in ${{ matrix.group == 'servers' && 'Deno, Bun and workerd' || matrix.name }}"
        env:
          RUNTIMES: ${{ matrix.runtimes }}
          GROUP: ${{ matrix.group }}
          SUITES: ${{ matrix.suites }}
        run: |
          # An empty list (pushes to main) runs every suite.
          suites=()
          if [ -n "$SUITES" ]; then suites=(--suites "$SUITES"); fi
          # shellcheck disable=SC2086 # one argument per runtime
          cargo xtask pdf-runtimes $RUNTIMES "${suites[@]}" --label "$GROUP"
      - if: ${{ !cancelled() && matrix.group == 'servers' }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: "@laminapdf/sdk in Node 22"
        if: ${{ !cancelled() && matrix.group == 'servers' }}
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          suites=()
          if [ -n "$SUITES" ]; then suites=(--suites "$SUITES"); fi
          cargo xtask pdf-runtimes node "${suites[@]}" --label node22
      - if: ${{ !cancelled() && matrix.group == 'servers' }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: "@laminapdf/sdk in Node 26"
        if: ${{ !cancelled() && matrix.group == 'servers' }}
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          suites=()
          if [ -n "$SUITES" ]; then suites=(--suites "$SUITES"); fi
          cargo xtask pdf-runtimes node "${suites[@]}" --label node26
      - name: Upload the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-runtimes-${{ matrix.group }}
          path: target/xtask/pdf-runtimes/
          if-no-files-found: ignore

  # Todo P3: the published crates (cargo-semver-checks) and @laminapdf/sdk's public API (API
  # Extractor) against the newest published version, over the `wasm` job's build. A breaking
  # change fails unless a pending changeset bumps the fixed group's minor version (the stability
  # policy); the job summary lists every change found either way (`cargo xtask semver`).
  semver:
    name: Semver against the published version
    needs: [changes, wasm]
    if: ${{ !cancelled() && needs.changes.outputs.ts == 'true' && needs.wasm.outputs.dist == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download the built packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: lamina-pdf-dist
          path: packages/
      - uses: $/.github/actions/host-rust
        with:
          cache: true
      # Same version as tools/xtask/src/doctor.rs.
      - uses: $/.github/actions/install-tools
        with:
          tool: cargo-semver-checks@0.51.0
      - uses: $/.github/actions/node-pnpm
      - run: cargo xtask semver

  # Two short checks in one job, since each takes about a minute, less than waiting for a runner.
  # MSRV: the workspace builds on the declared rust-version. The pdf-basics spike is frozen
  # research code outside both workspaces, but its tests are the evidence behind several
  # decisions. Its Rust core is ported to crates/laminapdf-syntax and crates/laminapdf-cos (Round A3);
  # these steps keep the frozen record (incl. the TS twin) green.
  msrv-and-spike:
    name: MSRV (rust-version) and the pdf-basics spike (Rust + TS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the declared rust-version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no rust-version found in [workspace.package]"
            exit 1
          fi
          echo "MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      # The MSRV check names its toolchain explicitly; the next step restores the pinned one.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          toolchain: ${{ steps.msrv.outputs.version }}
          components: ""
          target: ""
          override: false
      # Tauri (apps/desktop/src-tauri) is a workspace member: Linux needs WebKitGTK to build it.
      - uses: $/.github/actions/linux-webkit
      - name: Check the workspace on the declared rust-version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --locked --workspace --all-targets --all-features
      # The pinned toolchain with rust-toolchain.toml's components and targets, for the spike.
      - if: ${{ !cancelled() }}
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: true
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          # No `rustup override set` either: rust-toolchain.toml already picks this toolchain.
          override: false
      # The spike builds into its own target/ (unsetting the MSRV check's CARGO_TARGET_DIR): its
      # scripts and TS tests read its wasm from spikes/pdf-basics/rust/target/.
      - name: Rust spike (cross-target checks, wasm build, fmt, clippy, tests)
        if: ${{ !cancelled() }}
        run: env -u CARGO_TARGET_DIR spikes/pdf-basics/rust/scripts/check-targets.sh
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/node-pnpm
        with:
          install: spikes/pdf-basics/ts
      - name: TypeScript spike (typecheck, lint, tests incl. WASM interop)
        if: ${{ !cancelled() }}
        working-directory: spikes/pdf-basics/ts
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

  typescript:
    name: TypeScript (biome, typecheck, tests, npm licences)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/node-pnpm
      # xtask is the entry point for the TS checks too, but it only needs to build for the host.
      - uses: $/.github/actions/host-rust
        with:
          cache: true
          # Builds only xtask, and runs on pushes to main: it saves the `xtask` cache.
          shared-key: xtask
      - run: cargo xtask check ts

  # Todo X11 (ADR 0019): .github/workflows/actions.lock locks every action the workflows
  # use, direct and transitive. It runs on every PR, docs-only ones included, so no `if:`: a
  # workflow edit is the change it exists to catch. fast-gate always needs it.
  lockfile:
    name: Workflow lockfile (gh actions-lock --verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The version is tools/xtask/src/doctor.rs's GH_ACTIONS_LOCK_VERSION (a test holds them together).
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  # The fast lane's required check (todo X7): every job above passed, or was skipped on a
  # PR its paths can't affect (its flag false). Rules for new jobs: see the header
  # (tools/xtask/src/workflows.rs checks `needs` and each job's flag). The shell follows full.yml's
  # gate; change both together.
  fast-gate:
    name: fast-gate
    if: always()
    needs: [changes, rust, wasm, pdf-runtimes, semver, msrv-and-spike, typescript, lockfile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUST: ${{ needs.changes.outputs.rust }}
          TS: ${{ needs.changes.outputs.ts }}
          RUNTIMES: ${{ needs.changes.outputs.runtimes }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ]; then
            echo "::error::the changes job ended with '$changes'"
            exit 1
          fi
          for flag in "rust=$RUST" "ts=$TS" "runtimes=$RUNTIMES"; do
            case "${flag#*=}" in
              true|false) echo "Needed: $flag" ;;
              *)
                echo "::error::the changes job's ${flag%%=*} output is '${flag#*=}', not true or false"
                exit 1
                ;;
            esac
          done
          failed=0
          for job in $(jq -r 'del(.changes) | keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            # Each job follows its group's flag (todo X9c): the native Rust jobs `rust`, the
            # TypeScript and WebAssembly ones `ts`; the lockfile check none.
            case "$job" in
              rust | msrv-and-spike) needed=$RUST ;;
              # `ts` and at least one runtime leg (todo X12).
              pdf-runtimes) needed=$RUNTIMES ;;
              # Runs on every PR (todo X11).
              lockfile) needed=true ;;
              *) needed=$TS ;;
            esac
            echo "$job: $result"
            case "$needed/$result" in
              true/success | false/skipped) ;;
              *)
                echo "::error::$job ended with '$result' (needed: $needed)"
                failed=1
                ;;
            esac
          done
          exit "$failed"
