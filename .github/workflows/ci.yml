# CI fast lane (docs/research/architecture/notes/repo-and-packaging.md §6): every PR and every push
# to main. Jobs call the same `cargo xtask …` entry points developers run locally.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019); Dependabot bumps them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, portability, clippy, tests, docs, cargo-deny, wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `toolchain` input: installs exactly what rust-toolchain.toml pins (version, components, targets).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      # Same versions as tools/xtask/src/doctor.rs; xtask fails if they drift.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - run: cargo xtask check rust
      - run: cargo xtask wasm

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workspace on the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --workspace --all-targets --all-features

  typescript:
    name: TypeScript (biome, typecheck, tests, npm licences)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version` input: uses packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # xtask is the entry point for the TS checks too; only the host toolchain is needed here.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo xtask check ts

  # The pdf-basics spike is frozen research code outside both workspaces, but its tests are the
  # evidence behind several decisions; keep them green until its code has been ported (Round A3).
  spikes:
    name: Spike pdf-basics (Rust + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspaces: spikes/pdf-basics/rust
      - run: spikes/pdf-basics/rust/scripts/check-targets.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: spikes/pdf-basics/ts/pnpm-lock.yaml
      - name: TypeScript spike (typecheck, lint, tests incl. WASM interop)
        working-directory: spikes/pdf-basics/ts
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
