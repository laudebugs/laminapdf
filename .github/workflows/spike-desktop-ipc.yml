# TEMPORARY (todo D1a): runs spikes/desktop-ipc's benchmark on GitHub-hosted runners, the only
# Windows and Linux machines the spike can reach. Spikes are not in CI: this file is deleted
# before the PR merges, and the CSVs it uploads are committed under spikes/desktop-ipc/results/.
name: Spike desktop-ipc

on:
  push:
    branches: [spike/d1a-desktop-ipc]
    paths:
      - spikes/desktop-ipc/**
      - .github/workflows/spike-desktop-ipc.yml

permissions:
  contents: read

concurrency:
  group: spike-desktop-ipc
  cancel-in-progress: true

env:
  # quick: one run of one combination per transport (a smoke test); full: the README's plan.
  SPIKE_MODE: full

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, label: windows-2025 }
          - { os: macos-15, label: macos-15-hosted }
          - { os: ubuntu-24.04, label: linux-x11-dmabuf-on, display: x11, dmabuf: "0" }
          - { os: ubuntu-24.04, label: linux-x11-dmabuf-off, display: x11, dmabuf: "1" }
          - { os: ubuntu-24.04, label: linux-wayland-dmabuf-on, display: wayland, dmabuf: "0" }
          - { os: ubuntu-24.04, label: linux-wayland-dmabuf-off, display: wayland, dmabuf: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: ./.github/actions/node-pnpm
        with:
          package-json-file: spikes/desktop-ipc/package.json
          install: spikes/desktop-ipc
      - name: Linux packages (WebKitGTK 4.1, Xvfb, Weston)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb weston mesa-utils
      - name: PDFium
        shell: bash
        run: cargo xtask fetch-pdfium | grep '^LAMINA_PDF_PDFIUM_DIR=' >> "$GITHUB_ENV"
      - name: Run (Windows)
        if: runner.os == 'Windows'
        run: spikes/desktop-ipc/scripts/run-all.ps1 ${{ matrix.label }} $env:SPIKE_MODE
      - name: Run (macOS)
        if: runner.os == 'macOS'
        run: spikes/desktop-ipc/scripts/run-all.sh ${{ matrix.label }} "$SPIKE_MODE"
      - name: Run (Linux, X11 on Xvfb)
        if: matrix.display == 'x11'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: ${{ matrix.dmabuf }}
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1920x1080x24" spikes/desktop-ipc/scripts/run-all.sh ${{ matrix.label }} "$SPIKE_MODE"
      - name: Run (Linux, Wayland on headless Weston)
        if: matrix.display == 'wayland'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: ${{ matrix.dmabuf }}
          GDK_BACKEND: wayland
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" WAYLAND_DISPLAY=wayland-spike
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket="$WAYLAND_DISPLAY" --width=1920 --height=1080 &
          sleep 3
          spikes/desktop-ipc/scripts/run-all.sh ${{ matrix.label }} "$SPIKE_MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: results-${{ matrix.label }}
          path: spikes/desktop-ipc/results/
          if-no-files-found: warn
