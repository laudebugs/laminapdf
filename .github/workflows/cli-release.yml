# The `laminapdf` CLI's release (todos L4d, L4g; ADR 0031): archives built by cargo-dist
# (dist-workspace.toml; `dist`, cargo-about and cargo-cyclonedx pinned in tools/xtask/src/doctor.rs)
# for all eight targets, each installed and run before anything could be published. Not a required
# check: it runs beside ci.yml and full.yml, on the files that change what it builds.
#
#   plan              every run: `dist plan` for the tag (`laminapdf-cli-v<version>`, the crate's
#                     version), which fails on a broken config or a tag that names another version
#   build             each target on a GitHub-hosted runner of its own OS and CPU: the archive
#                     (binary, licences, third-party notices, man pages, completions) extracted and
#                     run (`--version`, `info` on a fixture); the npm wrapper and the target's
#                     platform package installed from their tarballs and run where npm installs
#                     them (not the musl packages, whose `libc` the glibc runners don't match: the
#                     musl binaries are checked to be static, so they run on any Linux, and run
#                     here); on macOS, the Homebrew formula installed from the local archive through
#                     a throwaway local tap and run
#   global            the Homebrew formula and sha256.sum over every archive, the nine npm packages
#                     packed with publish.json (tools/cli-release/generate.ts --pack), and a CycloneDX
#                     SBOM of the binary's crates (`mcp` feature on); on a tag push it fails unless
#                     every build passed
#   publish           the GitHub release with the archives, checksums, formula and SBOM, and
#                     build-provenance attestations (ADR 0017 §7; skipped if the repository is
#                     private again)
#   publish-npm       the platform packages, then the wrapper, with npm's trusted publishing (no
#                     stored token); a version already on npm is skipped, so a re-run finishes a
#                     partial publish
#   publish-homebrew  dist's formula written to laudebugs/homebrew-tap's Formula/laminapdf.rb with a
#                     release-bot token minted for that repository alone, after the GitHub release
#                     its URLs point at
#
# The three publish jobs run only on a `laminapdf-cli-v*` tag push, while the owner's repository
# variable LAMINA_PDF_PUBLISH_CLI is 'true', in the `release` environment, after every build passed
# (tools/xtask/src/workflows.rs tests the condition). Pull requests that touch the CLI or these
# files run `plan` only. A `workflow_dispatch` run (`gh workflow run cli-release.yml --ref <branch>`)
# runs every build and uploads the files as artifacts, the npm tarballs included; it never publishes
# (`dry-run` stays true; false is refused). The owner's one-time setup (the tap repository, the
# release bot on it, each npm package's first publish and trusted publisher) is in
# tools/release/README.md.
#
# Same runner rules as ci.yml: fresh hosted VMs, Rust caches saved only on main.
# Actions are pinned by full commit SHA with the release in a comment (ADR 0019).
name: CLI release

on:
  pull_request:
    paths:
      - crates/laminapdf-cli/**
      - dist-workspace.toml
      - packages/cli/**
      - tools/cli-release/**
      - .github/workflows/cli-release.yml
  push:
    tags: ["laminapdf-cli-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing (a dispatch never publishes; only a tag push can)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: dist plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: A dispatch is a dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.dry-run
        run: |
          echo "::error::a dispatch never publishes: push a laminapdf-cli-v<version> tag (with LAMINA_PDF_PUBLISH_CLI set to true)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dist plan reads the workspace through cargo, and the tag step runs `cargo pkgid`.
      - uses: ./.github/actions/host-rust
        with:
          cache: true
      - name: The release tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
          else
            # `cargo pkgid` ends in `#laminapdf-cli@<version>` (or `#<version>`), whatever Cargo.toml's layout.
            tag="laminapdf-cli-v$(cargo pkgid -p laminapdf-cli | sed 's/.*[#@]//')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Same version as tools/xtask/src/doctor.rs.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-dist@0.32.0
      - name: dist plan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: dist plan --tag "$TAG"

  build:
    name: Build and install (${{ matrix.target }})
    needs: plan
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, package: cli-darwin-arm64, os: macos }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, package: cli-darwin-x64, os: macos }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, package: cli-linux-arm64-gnu, os: linux }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, package: cli-linux-x64-gnu, os: linux }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, package: cli-linux-arm64-musl, os: musl }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, package: cli-linux-x64-musl, os: musl }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, package: cli-win32-arm64, os: windows }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, package: cli-win32-x64, os: windows }
    defaults:
      run:
        # Git Bash on Windows: the same scripts everywhere.
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PACKAGE: ${{ matrix.package }}
      TAG: ${{ needs.plan.outputs.tag }}
      # dist's archive format per OS (dist-workspace.toml).
      ARCHIVE_EXT: ${{ matrix.os == 'windows' && 'zip' || 'tar.xz' }}
    steps:
      - if: matrix.os == 'windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag's run saves no Rust cache.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true
          cache-save-if: false
          cache-bin: false
          target: ${{ matrix.target }}
      # Same versions as tools/xtask/src/doctor.rs.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-dist@0.32.0,cargo-about@0.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # pnpm/action-setup's self-installer can't verify its darwin-x64 binary on macos-15-intel
      # (ERR_PNPM_PNPM_ENGINE_IDENTITY_UNVERIFIABLE), so npm installs package.json's pinned pnpm.
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      # Only what the npm steps below use: @laminapdf/cli's TypeScript and Vitest.
      - run: pnpm install --frozen-lockfile --filter @laminapdf/cli
      - name: Man pages, completions and third-party notices for the archive
        run: cargo xtask cli-dist
      - name: dist build
        run: |
          distrib="${CARGO_TARGET_DIR:-$PWD/target}/distrib"
          rm -rf "$distrib"
          dist build --tag "$TAG" --artifacts=local --target "$TARGET" --output-format=json > "$RUNNER_TEMP/manifest.json"
          # `global` reads each build's checksums from these manifests (dist's own CI does the same).
          cp "$RUNNER_TEMP/manifest.json" "$distrib/$TARGET-dist-manifest.json"
          # Later actions run in Node, which reads C:/... but not Git Bash's /d/... paths.
          if command -v cygpath >/dev/null; then distrib=$(cygpath -m "$distrib"); fi
          echo "DISTRIB=$distrib" >> "$GITHUB_ENV"
      - name: The archive installs and runs
        run: tools/cli-release/archive-test.sh "$DISTRIB/laminapdf-cli-$TARGET.$ARCHIVE_EXT" fixtures/golden/examples/hello.pdf
      # A static binary has no program interpreter: it needs no C library at run time, so the run
      # above on this glibc runner stands for Alpine too.
      - name: The musl binary is statically linked
        if: matrix.os == 'musl'
        run: |
          tar -xJf "$DISTRIB/laminapdf-cli-$TARGET.tar.xz" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/laminapdf-cli-$TARGET/laminapdf"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "::error::the musl binary is dynamically linked"; exit 1
          fi
      # npm installs a platform package only where its `os`, `cpu` and `libc` match this runner,
      # so the musl packages are generated and packed by `global` but not installed here.
      - name: The npm packages install and run
        if: matrix.os != 'musl'
        run: |
          pnpm --filter @laminapdf/cli build
          node tools/cli-release/generate.ts --artifacts "$DISTRIB" --out target/cli-npm
          tools/cli-release/install-test.sh target/cli-npm "$PACKAGE" fixtures/golden/examples/hello.pdf
      # dist's formula points at the GitHub release; a local tap's copy points at the archive.
      - name: The Homebrew formula installs and runs
        if: matrix.os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          dist build --tag "$TAG" --artifacts=global --target "$TARGET"
          tap="laminapdf-ci/local-${GITHUB_RUN_ID}"
          brew tap-new --no-git "$tap"
          trap 'brew uninstall --formula laminapdf || true; brew untap "$tap" || true' EXIT
          archive="$DISTRIB/laminapdf-cli-$TARGET.tar.xz"
          sed "s#url \".*/laminapdf-cli-$TARGET.tar.xz\"#url \"file://$archive\"#" "$DISTRIB/laminapdf.rb" \
            > "$(brew --repository "$tap")/Formula/laminapdf.rb"
          brew install --formula "$tap/laminapdf"
          "$(brew --prefix)/bin/laminapdf" --version
          "$(brew --prefix)/bin/laminapdf" info fixtures/golden/examples/hello.pdf
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-archive-${{ matrix.target }}
          path: |
            ${{ env.DISTRIB }}/laminapdf-cli-${{ env.TARGET }}.${{ env.ARCHIVE_EXT }}
            ${{ env.DISTRIB }}/laminapdf-cli-${{ env.TARGET }}.${{ env.ARCHIVE_EXT }}.sha256
            ${{ env.DISTRIB }}/${{ env.TARGET }}-dist-manifest.json
          if-no-files-found: error

  global:
    name: Formula, checksums, npm packages and SBOM
    needs: [plan, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # A dispatch may finish with the archives that did build; a release may not, since a version
      # published without some of its archives and npm packages can't gain them later.
      - name: A tag push needs every build
        if: ${{ github.event_name == 'push' && needs.build.result != 'success' }}
        env:
          BUILD: ${{ needs.build.result }}
        run: |
          echo "::error::the builds were $BUILD, so this release is not published; fix them and re-run the workflow"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-rust
        with:
          cache: true
      # Same versions as tools/xtask/src/doctor.rs.
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-dist@0.32.0,cargo-cyclonedx@0.5.9
      - uses: ./.github/actions/node-pnpm
      - run: pnpm install --frozen-lockfile --filter @laminapdf/cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives
      # dist reads each build's checksums from its manifest in its output folder; with `--target`
      # for each, the formula and sha256.sum cover only the targets built.
      - name: Homebrew formula and sha256.sum
        run: |
          distrib="${CARGO_TARGET_DIR:-$PWD/target}/distrib"
          rm -rf "$distrib" && mkdir -p "$distrib"
          cp "$RUNNER_TEMP"/archives/* "$distrib/"
          targets=()
          for manifest in "$distrib"/*-dist-manifest.json; do
            target=${manifest##*/}
            targets+=(--target "${target%-dist-manifest.json}")
          done
          dist build --tag "$TAG" --artifacts=global "${targets[@]}"
          mkdir -p target/cli-release
          # A dispatch may lack some archives (a build failed): copy those that are there.
          shopt -s nullglob
          cp "$distrib"/laminapdf-cli-*.tar.xz* "$distrib"/laminapdf-cli-*.zip* "$distrib/laminapdf.rb" "$distrib/sha256.sum" target/cli-release/
          echo "DISTRIB=$distrib" >> "$GITHUB_ENV"
      # The wrapper and a platform package per archive, packed, with publish.json in publish order.
      - name: npm packages
        run: |
          pnpm --filter @laminapdf/cli build
          node tools/cli-release/generate.ts --artifacts "$DISTRIB" --out target/cli-npm --pack
      # A release publishes every platform package (platforms.json) and the wrapper.
      - name: A tag push packs every npm package
        if: github.event_name == 'push'
        run: |
          want=$(( $(jq length packages/cli/platforms.json) + 1 ))
          got=$(jq '.packages | length' target/cli-npm/packs/publish.json)
          [ "$got" -eq "$want" ] || { echo "::error::publish.json lists $got packages, not $want"; exit 1; }
      # cargo-cyclonedx writes one SBOM per workspace member; keep the CLI's.
      - name: CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path crates/laminapdf-cli/Cargo.toml --features mcp --format json
          mv crates/laminapdf-cli/laminapdf-cli.cdx.json target/cli-release/
          find crates tools -name '*.cdx.json' -delete
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release
          path: target/cli-release/
          if-no-files-found: error
      - name: Upload the npm packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-npm
          path: target/cli-npm/packs/
          if-no-files-found: error

  # The owner's switches, all required for each publish job: the repository variable, a tag push
  # (never a dispatch or a pull request), every build passed, and the `release` environment.
  # tools/xtask/src/workflows.rs tests the condition.
  publish:
    name: Publish the GitHub release
    needs: [plan, build, global]
    if: ${{ needs.global.result == 'success' && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/laminapdf-cli-v') && vars.LAMINA_PDF_PUBLISH_CLI == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      # The GitHub release.
      contents: write
      # Build-provenance attestations (OIDC); GitHub makes them only for a public repository.
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release
          path: ${{ runner.temp }}/cli-release
      # GitHub refuses attestations for a private repository (ADR 0017 §7).
      - name: Attest the archives
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/cli-release/laminapdf-cli-*.tar.xz
            ${{ runner.temp }}/cli-release/laminapdf-cli-*.zip
      # A re-run finds the release it made and uploads the files again, so publish-homebrew can follow.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "$RUNNER_TEMP"/cli-release/*
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --prerelease --title "$TAG" \
              --notes "The laminapdf command-line tool, ${TAG#laminapdf-cli-v}." \
              "$RUNNER_TEMP"/cli-release/*
          fi

  # npm's trusted publishing accepts only cloud-hosted runners (ADR 0017 §7): no checkout, the
  # packed tarballs only, each value in publish.json checked before it reaches a command. Unlike
  # release.yml's publish-npm, it runs in the `release` environment, so each package's trusted
  # publisher names that environment (tools/release/README.md); the environment has no reviewers.
  publish-npm:
    name: Publish the npm packages
    needs: [plan, build, global]
    if: ${{ needs.global.result == 'success' && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/laminapdf-cli-v') && vars.LAMINA_PDF_PUBLISH_CLI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      # npm's trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-npm
          path: packs/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later, newer than the npm some Node releases bundle.
      - name: Install npm 11.17.0
        run: npm install --global npm@11.17.0
      - name: npm publish, platform packages first
        working-directory: packs
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          version=$(jq -r .version publish.json)
          dist_tag=$(jq -r .tag publish.json)
          entries=$(jq -r '.packages[] | "\(.name) \(.tarball)"' publish.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "publish.json's version: $version"
          [ "$TAG" = "laminapdf-cli-v$version" ] || fail "publish.json is $version, the tag $TAG"
          [[ "$dist_tag" =~ ^[a-z]+$ ]] || fail "publish.json's dist-tag: $dist_tag"
          [ -n "$entries" ] || fail "publish.json lists no packages"
          while read -r name tarball; do
            [[ "$name" =~ ^@laminapdf/cli(-[a-z0-9-]+)?$ ]] || fail "publish.json's package name: $name"
            [[ "$tarball" =~ ^[a-z0-9.-]+\.tgz$ && -f "$tarball" ]] || fail "publish.json's tarball for $name: $tarball"
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is on npm already: skipped"
              continue
            fi
            # A package's first publish is the owner's (tools/release/README.md): trusted publishing
            # can only be set on a package that exists.
            npm view "$name" name >/dev/null 2>&1 || fail "$name isn't on npm yet: publish it once by hand, then add this workflow as its trusted publisher (tools/release/README.md)"
            npm publish "./$tarball" --access public --tag "$dist_tag" --ignore-scripts
          done <<<"$entries"

  # The formula's URLs are the GitHub release's, so it is pushed once that release exists.
  publish-homebrew:
    name: Push the Homebrew formula
    needs: [plan, build, global, publish]
    if: ${{ needs.publish.result == 'success' && needs.global.result == 'success' && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/laminapdf-cli-v') && vars.LAMINA_PDF_PUBLISH_CLI == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release
          path: ${{ runner.temp }}/cli-release
      # A token for the tap repository alone, from the release bot (tools/release/README.md).
      - name: Create the release bot's token for the tap
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: laudebugs
          repositories: homebrew-tap
          permission-contents: write
      - name: Write Formula/laminapdf.rb
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          path=Formula/laminapdf.rb
          formula="$RUNNER_TEMP/cli-release/laminapdf.rb"
          grep -q "laminapdf-cli-v" "$formula" || { echo "::error::laminapdf.rb names no release"; exit 1; }
          # The file's current blob: the contents API replaces a file only when given it. Only a 404
          # means the file is new; any other error (the bot not installed on the tap) stops here.
          if ! sha=$(gh api "repos/laudebugs/homebrew-tap/contents/$path" --jq .sha 2> "$RUNNER_TEMP/sha.err"); then
            grep -q "HTTP 404" "$RUNNER_TEMP/sha.err" || { cat "$RUNNER_TEMP/sha.err"; exit 1; }
            sha=
          fi
          args=(-X PUT "repos/laudebugs/homebrew-tap/contents/$path"
            -f message="laminapdf ${TAG#laminapdf-cli-v}"
            -f content="$(base64 -w0 "$formula")")
          [ -z "$sha" ] || args+=(-f sha="$sha")
          gh api "${args[@]}" --jq .commit.html_url
