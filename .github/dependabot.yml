# Dependency updates (ADR 0019). Weekly, minor/patch grouped per ecosystem, with a cooldown so
# brand-new releases (the usual window for a compromised publish) are not picked up immediately.
# Only the root workspaces are covered: spikes/ is frozen research code. The docker entry bumps
# the Linux CI runner's base image (tools/ci-runner/linux); the runner's agent rebuilds from main.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Tauri and its plugins move together (ADR 0008): one PR, checked by the desktop build.
      # Listed first, since a dependency joins the first group that matches it.
      tauri:
        patterns: ["tauri", "tauri-*"]
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The desktop app's @tauri-apps/api and cli, in step with the tauri crate (ADR 0008).
      tauri:
        patterns: ["@tauri-apps/*"]
      # The docs site's Starlight, Astro and Starlight's plugins, which move together, majors
      # included; the site upgrades them one minor per PR (apps/docs/README.md, "Upgrading Starlight
      # and Astro"). Any later @astrojs/* package joins this group too.
      starlight:
        patterns: ["astro", "@astrojs/*", "starlight-*"]
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    # The workflows, and the actions our composite actions pin (.github/actions/*/action.yml).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /tools/ci-runner/linux
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
