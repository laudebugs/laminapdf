# Self-hosted runners run as a real user on a shared machine. Without this, setup-rust-toolchain
# and install-action write into that user's ~/.cargo and ~/.rustup: they reinstall rustup and add
# directory overrides, and two runners doing so at once can leave the user without a rustup binary.
# This points CARGO_HOME and RUSTUP_HOME at the runner's own tool cache instead, so each runner
# keeps a private, persistent Rust install. GitHub-hosted runners keep their preinstalled one.
#
# It also installs rustup into that CARGO_HOME, once per runner, and puts its bin/ first on the
# PATH, so every later step runs this runner's rustup and cargo. setup-rust-toolchain then skips
# its own rustup install, and install-action puts the tools in $CARGO_HOME/bin: it does so only
# when the first `cargo` on the PATH is there (.github/actions/install-tools). Before, rustup was
# left to setup-rust-toolchain, which installs it only when no `rustup` is on the PATH, and with
# rustup-init's defaults, which add `. "<CARGO_HOME>/env"` to the user's shell profiles
# (~/.zshenv, ~/.profile, ~/.bash_profile). So the first runner to install it put its cargo/bin
# on the PATH of every runner started from a shell afterwards (or configured from one: a
# runner's .path file keeps the PATH config.sh ran with). Those runners then ran its rustup and
# its cargo, and install-action, seeing a cargo outside their own CARGO_HOME, fell back to the
# ~/.install-action that all of them share (ci.yml's Rust job, 2026-11-05). This install passes
# --no-modify-path and is pinned by version and SHA-256, like the Linux runner image's
# (tools/ci-runner/linux/Dockerfile; tools/xtask/src/workflows.rs keeps the versions equal).
# A runner that still starts with another runner's cargo/bin on its PATH gets a warning: delete
# the `cargo/env` lines from the shell profiles and that entry from the runner's .path file,
# then restart the runner.
#
# With `target-dir`, it also points CARGO_TARGET_DIR at a persistent build directory in that tool
# cache, so a job reuses the build output of the runner's previous run of the same job instead
# of compiling from scratch (actions/checkout cleans the workspace's target/, and rust-cache is
# off on macOS: its post step hangs on `sudo purge`). The directory is
#
#     $RUNNER_TOOL_CACHE/lamina-target/<bucket>/<target-dir>
#
# - One per runner: each runner has its own tool cache and runs one job at a time.
# - One per job (`target-dir`, e.g. `ci-rust`): jobs build different features, profiles and
#   targets, and sharing one directory would keep rebuilding each other's output.
# - One per kind of run (<bucket>), keyed on the event and the ref:
#     main-push      pushes to main
#     main-nightly   scheduled and dispatched runs on main (the nightly lane, the website's scheduled deploy)
#     pull_request   pull requests
#     other          anything else (a dispatch on another branch, a tag push, …): rare, so it is
#                    emptied before every use rather than kept
#   .github/actions/node-pnpm keys the pnpm store on the same buckets; change both together.
#   Build output a pull request's (or another branch's) code produced is never reused by a run
#   on main: main's runs only ever build into, and read from, directories that only main's runs
#   write. This is the same rule as check-linux's rust-cache (only main saves). It keeps cargo
#   from reusing PR output; it is not a sandbox: PR code runs as the runner's user, which can
#   write anywhere in the tool cache, as it can CARGO_HOME today. The repository is public, so
#   no workflow may run it on a runner that fork PRs reach.
# - Bounded, since cargo never deletes stale output and the runners share one disk. Every job
#   touches `.last-used` in its directory, and directories are deleted oldest-used first:
#     every job (cheap: df)  while the disk has under 25 GB free;
#     once a day per runner  (du, stamp `.sizes-checked`) any directory over 15 GB, then more
#                            until this runner's directories total at most 40 GB.
#   A deleted directory only means that job builds from scratch once.
#
# xtask reads the directory from `cargo metadata` (Workspace::target_dir) wherever it needs
# cargo's output. Its reports stay in the checkout's target/ (target/xtask/, target/nightly/,
# target/examples-out/), where the workflows upload them from, fresh for every job.
name: Isolate the Rust install on self-hosted runners
description: Use a per-runner CARGO_HOME with its own rustup, RUSTUP_HOME (and optionally CARGO_TARGET_DIR) on self-hosted runners.
inputs:
  target-dir:
    description: >-
      Name of this job's persistent build directory (letters, digits, `-`, `_`), unique per
      workflow job. Empty: cargo builds into the checkout's target/ as usual.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: runner.environment == 'self-hosted'
      shell: bash
      env:
        # From https://static.rust-lang.org/rustup/archive/<version>/<target>/rustup-init.sha256
        RUSTUP_VERSION: "1.28.2"
        RUSTUP_INIT_SHA256_AARCH64_APPLE_DARWIN: 20ef5516c31b1ac2290084199ba77dbbcaa1406c45c1d978ca68558ef5964ef5
      run: |
        set -euo pipefail
        export CARGO_HOME="$RUNNER_TOOL_CACHE/cargo"
        export RUSTUP_HOME="$RUNNER_TOOL_CACHE/rustup"
        own="$CARGO_HOME/bin"
        echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
        echo "$own" >> "$GITHUB_PATH"

        # Another runner's Rust install on the PATH this runner started with (see above): a
        # cargo/bin in a tool cache named like this runner's, other than its own.
        tool_cache=$(basename "$RUNNER_TOOL_CACHE")
        others=()
        IFS=: read -r -a dirs <<< "$PATH"
        for d in "${dirs[@]}"; do
          if [[ "$d" != "$own" && "$d" == */"$tool_cache"/cargo/bin && -e "$d/cargo" ]]; then
            others+=("$d")
          fi
        done
        if [ "${#others[@]}" -gt 0 ]; then
          list=$(printf '%s\n' "${others[@]}" | sort -u | paste -sd ' ' -)
          echo "::warning::The runner started with another runner's Rust install on its PATH ($list). This job uses its own, $own, which comes first; to remove the other, see .github/actions/isolate-rust-home."
        fi

        if [ ! -x "$own/rustup" ] || [ ! -x "$own/cargo" ]; then
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64) target=aarch64-apple-darwin sum=$RUSTUP_INIT_SHA256_AARCH64_APPLE_DARWIN ;;
            *)
              echo "::error::no pinned rustup-init for $RUNNER_OS $RUNNER_ARCH: add its SHA-256 to .github/actions/isolate-rust-home"
              exit 1
              ;;
          esac
          echo "Installing rustup $RUSTUP_VERSION into $CARGO_HOME"
          init="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSLo "$init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$target/rustup-init"
          echo "$sum  $init" | shasum -a 256 -c -
          chmod +x "$init"
          # Outside the checkout, so rust-toolchain.toml plays no part. The path check would only
          # repeat the warning above. rustup-init writes its --profile into settings.toml, so it
          # gets the one RUSTUP_HOME already has (rustup's own default when there is none).
          profile=$(sed -n 's/^profile = "\(.*\)"$/\1/p' "$RUSTUP_HOME/settings.toml" 2>/dev/null || true)
          (cd "$RUNNER_TEMP" && RUSTUP_INIT_SKIP_PATH_CHECK=yes "$init" -y --no-modify-path \
            --default-toolchain none --profile "${profile:-default}")
          rm -f "$init"
        fi
    - if: runner.environment == 'self-hosted' && inputs.target-dir != ''
      shell: bash
      env:
        NAME: ${{ inputs.target-dir }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        if ! [[ "$NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
          echo "::error::target-dir '$NAME' must be letters, digits, '-' and '_' only"
          exit 1
        fi
        case "$EVENT/$REF" in
          push/refs/heads/main) bucket=main-push ;;
          schedule/refs/heads/main | workflow_dispatch/refs/heads/main) bucket=main-nightly ;;
          pull_request/*) bucket=pull_request ;;
          *) bucket=other ;;
        esac
        root="$RUNNER_TOOL_CACHE/lamina-target"
        dir="$root/$bucket/$NAME"
        dir_limit_kb=$((15 * 1024 * 1024))
        total_limit_kb=$((40 * 1024 * 1024))
        min_free_kb=$((25 * 1024 * 1024))
        mkdir -p "$root"

        # This runner's build directories, least recently used first: any without `.last-used`
        # (never stamped, so never evicted otherwise) count as the oldest. `ls -t`, not find:
        # macOS's find has no -printf, and every path component here matches [A-Za-z0-9_-]+.
        # shellcheck disable=SC2012
        oldest_first() {
          for d in "$root"/*/*; do
            if [ -d "$d" ] && [ ! -e "$d/.last-used" ]; then
              printf '%s\n' "$d"
            fi
          done
          ls -1tr "$root"/*/*/.last-used 2>/dev/null | sed 's|/\.last-used$||' || true
        }
        free_kb() { df -Pk "$root" | awk 'NR == 2 { print $4 }'; }
        evict() { # dir reason
          echo "::notice::deleting the build directory $1 ($2); its job builds from scratch once"
          rm -rf "$1"
        }

        if [ "$bucket" = other ]; then
          rm -rf "$dir"
        fi
        # Every job: free disk space, without walking any directory.
        while [ "$(free_kb)" -lt "$min_free_kb" ]; do
          victim=$(oldest_first | head -n 1)
          if [ -z "$victim" ]; then
            echo "::warning::under 25 GB free on the runner's disk and no build directory left to delete"
            break
          fi
          evict "$victim" "under 25 GB free on the disk"
        done
        # Once a day: sizes (du), per directory and in total, oldest first.
        stamp="$root/.sizes-checked"
        if [ ! -f "$stamp" ] || [ -z "$(find "$stamp" -mtime -1)" ]; then
          total=0
          kept=""
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            size=$(du -sk "$d" | cut -f1)
            if [ "$size" -gt "$dir_limit_kb" ]; then
              evict "$d" "over 15 GB"
            else
              total=$((total + size))
              kept="$kept$size $d"$'\n'
            fi
          done <<< "$(oldest_first)"
          while IFS=' ' read -r size d; do
            [ -n "$d" ] && [ "$total" -gt "$total_limit_kb" ] || continue
            evict "$d" "this runner's build directories are over 40 GB"
            total=$((total - size))
          done <<< "$kept"
          echo "This runner's build directories: $((total / 1024)) MB"
          touch "$stamp"
        fi

        if [ -d "$dir" ]; then
          echo "Build directory $dir: reused"
        else
          echo "Build directory $dir: new, this job builds from scratch"
        fi
        mkdir -p "$dir"
        touch "$dir/.last-used"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
