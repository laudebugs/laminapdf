# One target of the desktop release (todo D6b; .github/workflows/desktop-release.yml): the app built
# and bundled by the Tauri CLI, checked, and uploaded as the artifact desktop-<platform>-<mode> whose
# files sit in <platform>/, as the publish job reads them.
#
# Each build also writes the Breakpad symbols of the app's two binaries (symbols.sh; todo D7d) into
# the artifact symbols-desktop-<platform>-<mode>, which only the symbols archive reads; its name
# stays out of the publish job's desktop-*-<mode> pattern.
#
# The three build jobs (dry run, nightly, release) share these steps. A composite action can't read
# secrets: the release job sets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD), LINUX_SIGNING_KEY,
# LINUX_SIGNING_KEY_PASSPHRASE, on its macOS legs the APPLE_* secrets and KEYCHAIN_PASSWORD, and on
# its Windows legs the AZURE_* IDs in its env; the nightly job only the first two, the dry run none.
#
# macOS (todo D6c; runbook §1.3, §1.4): a release build signs with the owner's Developer ID and the
# hardened runtime, Tauri notarises and staples the .app, and this action notarises and staples
# the .dmg. Every other build is signed ad hoc without the hardened runtime, whose library
# validation would refuse PDFium (it then has no Team ID).
name: Desktop release build
description: Build, bundle, sign (Linux, macOS, Windows) and check one target of the desktop app.
inputs:
  target:
    description: The Rust target triple, which the runner's own CPU and OS run.
    required: true
  platform:
    description: The update manifest's platform key, such as darwin-aarch64.
    required: true
  mode:
    description: "`tag` (plain version: NSIS and MSI) or `nightly` (NSIS only on Windows)."
    required: true
  version:
    description: The version the build carries.
    required: true
  bundles:
    description: The Tauri CLI's --bundles, or empty for tauri.<os>.conf.json's targets.
    required: false
    default: ""
  channel:
    description: The channel the build is for (LAMINA_UPDATE_CHANNEL, which release builds compile in).
    required: true
  updater:
    description: "`true` to sign updater bundles with the environment's key; dry runs have none."
    required: true
  sign-linux:
    description: "`true` to sign the Linux packages with the owner's GPG key (desktop-release only)."
    required: false
    default: "false"
  sign-windows:
    description: "`true` to Authenticode-sign as the owner through Azure Artifact Signing (desktop-release only)."
    required: false
    default: "false"
  sign-macos:
    description: "`true` to sign with the owner's Developer ID and notarise (desktop-release macOS only)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # A clean build, with no cache: nothing a pull request saved reaches a release.
    - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      with:
        cache: false
    - uses: $/.github/actions/node-pnpm
    - uses: $/.github/actions/linux-webkit
    # What Tauri's Linux bundlers run: AppImage's linuxdeploy (FUSE 2, patchelf, file, librsvg for the
    # icons); and for the signed packages debsigs, rpmsign, and debsig-verify and rpm to check them.
    - name: Install the Linux packaging tools
      if: runner.os == 'Linux'
      uses: nick-fields/retry@v4.0.0
      with:
        timeout_minutes: 15
        max_attempts: 3
        retry_wait_seconds: 60
        shell: bash
        command: |
          set -euo pipefail
          sudo timeout -k 30 60 dpkg --configure -a
          bash .github/actions/apt-fail-fast/update.sh
          sudo timeout -k 30 420 apt-get install -y -q --no-install-recommends \
            libfuse2 patchelf file librsvg2-dev xdg-utils debsigs debsig-verify rpm
    # The same versions as tools/xtask/src/doctor.rs.
    - uses: $/.github/actions/install-tools
      with:
        tool: wasm-bindgen@0.2.129,cargo-cyclonedx@0.5.9${{ inputs.target != 'x86_64-apple-darwin' && ',cargo-about@0.9.2' || '' }}
    # cargo-about ships no x86_64-apple-darwin binary, and install-action's source fallback leaves
    # out the `cli` feature its binary needs (as in cli-release.yml).
    - name: Build cargo-about 0.9.2
      if: inputs.target == 'x86_64-apple-darwin'
      shell: bash
      run: cargo install cargo-about --locked --version 0.9.2 --features cli
    # Writes the app's Breakpad symbols (symbols.sh), on every leg: the dry run checks they come out.
    - uses: $/.github/actions/dump-syms
    - name: Build the packages the frontend imports
      shell: bash
      run: cargo xtask desktop-frontend
    # Before the build: the bundle carries the notices (tauri.release.conf.json, Help ▸ View licences).
    - name: Write the third-party notices the bundle carries
      shell: bash
      run: cargo xtask desktop-notices --bundle
    # The key is the owner's signing subkey alone (runbook §1.6: its primary is a stub). Its
    # passphrase is preset in gpg's agent, so every tool that calls gpg (appimagetool while Tauri
    # bundles, debsigs, rpmsign) signs without asking.
    - name: Import and unlock the Linux signing key
      if: inputs.sign-linux == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${LINUX_SIGNING_KEY:-}" ]; then
          echo "::error::the desktop-release environment has no LINUX_SIGNING_KEY"
          exit 1
        fi
        printf '%s' "$LINUX_SIGNING_KEY" | gpg --batch --import
        # The fingerprint and keygrip of the key that can sign (capability s, field 12).
        read -r fpr grip < <(gpg --batch --with-colons --with-keygrip --list-secret-keys | awk -F: '
          $1 == "sec" || $1 == "ssb" { signs = ($12 ~ /s/) }
          signs && $1 == "fpr" && !fpr { fpr = $10 }
          signs && $1 == "grp" && !grip { grip = $10 }
          END { print fpr, grip }')
        if [ -z "$fpr" ] || [ -z "$grip" ]; then
          echo "::error::LINUX_SIGNING_KEY holds no key that can sign"
          exit 1
        fi
        echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
        gpgconf --kill gpg-agent
        gpg-connect-agent /bye
        "$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase" --preset "$grip" <<< "$LINUX_SIGNING_KEY_PASSPHRASE"
        {
          echo "SIGN=1"
          echo "SIGN_KEY=$fpr"
          # Fail the build rather than ship an unsigned AppImage when signing fails.
          echo "APPIMAGETOOL_FORCE_SIGN=1"
          echo "LINUX_SIGNING_FPR=$fpr"
        } >> "$GITHUB_ENV"
    # The owner's Authenticode identity (runbook §1.5, ADR 0014 §6): SignTool with Microsoft's Artifact
    # Signing dlib, which signs through the Azure CLI session azure/login opens below. The dlib comes
    # from Microsoft.ArtifactSigning.Client, pinned by version and SHA-256 and fetched only here,
    # never committed or shipped (its licence allows it to sign apps on Windows). It is x64 only, so
    # the x64 SignTool loads it; Arm64 runners emulate both. The configuration this step writes makes
    # the Tauri CLI sign the app, the engine, the installers and the uninstaller (signCommand), and
    # PDFium's DLL, which the bundle copies as it is, just before bundling (beforeBundleCommand,
    # after desktop-sidecar has fetched PDFium and checked its hash).
    - name: Set up Windows signing
      if: inputs.sign-windows == 'true'
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($name in 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID') {
          if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
            Write-Host "::error::the desktop-release environment has no $name"; exit 1
          }
        }
        $version = '1.0.151'
        $sha256 = '35375A4BC4E1102DA729FC3D8D9925F774C3BAAE6B8B7FF6398D948CA9AB0D8A'
        $client = Join-Path $env:RUNNER_TEMP 'artifact-signing'
        $zip = "$client.zip"
        Invoke-WebRequest -UseBasicParsing -OutFile $zip `
          -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg"
        $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
        if ($got -ne $sha256) { Write-Host "::error::Microsoft.ArtifactSigning.Client $version has SHA-256 $got, not $sha256"; exit 1 }
        Expand-Archive -LiteralPath $zip -DestinationPath $client -Force
        $dlib = Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll'
        $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
        $signtool = Get-ChildItem -Path (Join-Path $kits '10.*\x64\signtool.exe') |
          Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
        if (-not $signtool) { Write-Host "::error::no x64 signtool.exe under $kits"; exit 1 }
        $app = (Resolve-Path 'apps/desktop/src-tauri').Path
        $script = (Resolve-Path 'apps/desktop/scripts/sign-windows.ps1').Path
        $pwsh = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $script)
        # PDFium where the bundle may take it from: the resources folder, and the build's copy.
        $pdfium = @(
          (Join-Path $app 'resources\pdfium\pdfium.dll'),
          (Join-Path $env:GITHUB_WORKSPACE "target\$env:TARGET\release\pdfium\pdfium.dll")
        )
        # The Tauri CLI hands the hook to cmd.exe with quotes kept in the arguments, so the hook
        # quotes nothing: the script's path has no space, and PDFium's places come by environment.
        if ($script -match '\s') { Write-Host "::error::the hook can't name $script, which has a space"; exit 1 }
        $hook = "pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Presign"
        $config = @{
          build = @{ beforeBundleCommand = $hook }
          bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = $pwsh + '%1' } } }
        }
        $file = Join-Path $env:RUNNER_TEMP 'tauri.windows-sign.conf.json'
        $config | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $file -Encoding utf8NoBOM
        Get-Content -LiteralPath $file
        Add-Content -LiteralPath $env:GITHUB_ENV -Value @(
          'LAMINA_PDF_WIN_SIGN_PATH=artifact-signing',
          "SIGNTOOL=$($signtool.FullName)",
          "ARTIFACT_SIGNING_DLIB=$dlib",
          "ARTIFACT_SIGNING_METADATA=$(Join-Path $app 'windows\artifact-signing.json')",
          "WINDOWS_SIGN_CONFIG=$file",
          "LAMINA_PDF_WIN_PRESIGN=$($pdfium -join ';')"
        )
    # A keychain of its own, in the search list, so both signers find the identity: the engine and
    # PDFium are signed by `cargo xtask desktop-sidecar` before Tauri bundles, then Tauri signs the
    # rest. Tauri isn't given APPLE_CERTIFICATE (the build step drops it), which would make it
    # import the certificate again into a keychain of its own.
    - name: Import the Developer ID certificate
      if: inputs.sign-macos == 'true'
      shell: bash
      run: |
        set -euo pipefail
        for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD \
          APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
          if [ -z "${!name:-}" ]; then
            echo "::error::the desktop-release environment has no $name"
            exit 1
          fi
        done
        keychain="$RUNNER_TEMP/lamina-signing.keychain-db"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
        # Named at once, so the last step deletes it even if this one fails part-way.
        echo "APPLE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
        certificate="$RUNNER_TEMP/developer-id.p12"
        # The decoded certificate goes as soon as the step ends, whether the import worked or not.
        trap 'rm -f "$certificate"' EXIT
        printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
        security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security > /dev/null
        # The Developer ID G2 intermediate the certificate chains to (runbook §1.3), pinned by SHA-256.
        intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
        curl -fsSL --retry 3 -o "$intermediate" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
        if ! echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $intermediate" | shasum -a 256 --check --status; then
          echo "::error::Apple's Developer ID G2 certificate doesn't match its pinned SHA-256"
          exit 1
        fi
        security import "$intermediate" -k "$keychain" > /dev/null
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
        # Ahead of the login keychain, which keeps its place in the list.
        read -r -a others <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
        security list-keychains -d user -s "$keychain" "${others[@]}"
        if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
          echo "::error::the keychain holds no valid identity named APPLE_SIGNING_IDENTITY"
          exit 1
        fi
        # The App Store Connect key as Tauri reads it (runbook §1.4).
        key="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
        mkdir -p "$(dirname "$key")"
        printf '%s' "$APPLE_API_KEY_P8" > "$key"
        echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
    - name: Build and bundle (tauri build)
      shell: bash
      working-directory: apps/desktop
      env:
        TARGET: ${{ inputs.target }}
        MODE: ${{ inputs.mode }}
        VERSION: ${{ inputs.version }}
        BUNDLES: ${{ inputs.bundles }}
        UPDATER: ${{ inputs.updater }}
        SIGN_LINUX: ${{ inputs.sign-linux }}
        SIGN_WINDOWS: ${{ inputs.sign-windows }}
        SIGN_MACOS: ${{ inputs.sign-macos }}
        LAMINA_UPDATE_CHANNEL: ${{ inputs.channel }}
        # Function names, lines and inlined frames for the crash symbols (todo D7d), at a fraction of
        # full debug information's size. Only the release build here: the workspace's profile is
        # unchanged for everyone else.
        CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      run: |
        set -euo pipefail
        # Shipped binaries carry no debug information; it goes beside them, then into symbols.sh's
        # archive. macOS: a dSYM, made before rustc strips the binary. Windows: the PDB, which the
        # linker writes only when nothing is stripped (rustc strips a PE with /DEBUG:NONE). Linux:
        # the binaries keep their DWARF until symbols.sh, as the beforeBundleCommand, moves it out.
        case "$RUNNER_OS" in
          macOS)
            export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed
            export CARGO_PROFILE_RELEASE_STRIP=symbols ;;
          *) export CARGO_PROFILE_RELEASE_STRIP=none ;;
        esac
        # The version isn't committed: the run's plan gives it. A file, not a JSON argument,
        # because Windows passes pnpm's arguments through cmd.exe, which mangles the quotes.
        run_config="$RUNNER_TEMP/tauri.run.conf.json"
        hook=""
        if [ "$RUNNER_OS" = Linux ]; then
          hook=$(printf ',"build":{"beforeBundleCommand":"bash %s/.github/actions/desktop-build/symbols.sh %s %s/desktop-symbols"}' \
            "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP")
        fi
        printf '{"version":"%s","bundle":{"createUpdaterArtifacts":%s}%s}\n' "$VERSION" "$UPDATER" "$hook" > "$run_config"
        args=(--ci --target "$TARGET" --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.release.conf.json)
        # Nightlies trust the nightly updater key only, so they update only to nightlies.
        if [ "$MODE" = nightly ]; then args+=(--config src-tauri/tauri.nightly.conf.json); fi
        args+=(--config "$run_config")
        if [ "$SIGN_WINDOWS" = true ]; then args+=(--config "$WINDOWS_SIGN_CONFIG"); fi
        bundles=()
        if [ -n "$BUNDLES" ]; then bundles=(--bundles "$BUNDLES"); fi
        if [ "$SIGN_LINUX" = true ]; then export APPIMAGETOOL_SIGN_PASSPHRASE="$LINUX_SIGNING_KEY_PASSPHRASE"; fi
        # The Developer ID build adds the hardened runtime. The certificate stays in the keychain the
        # last step made; Tauri signs with APPLE_SIGNING_IDENTITY and notarises with APPLE_API_*.
        if [ "$SIGN_MACOS" = true ]; then
          args+=(--config src-tauri/tauri.developer-id.conf.json)
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
        fi
        # Every other leg leaves the Apple variables unset: an empty one would name an empty identity.
        for name in APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH; do
          if [ -z "${!name:-}" ]; then unset "$name"; fi
        done
        if [ "$SIGN_WINDOWS" = true ]; then
          # Compile only: the Azure session azure/login opens lasts minutes, not the compile, so
          # the next steps sign in and then bundle and sign (tauri bundle, with the same arguments).
          printf '%s\n' "${args[@]}" ${bundles[@]+"${bundles[@]}"} > "$RUNNER_TEMP/tauri-bundle-args"
          pnpm exec tauri build "${args[@]}" --no-bundle
        else
          pnpm exec tauri build "${args[@]}" ${bundles[@]+"${bundles[@]}"}
        fi
    # GitHub's OIDC token for the desktop-release environment, traded for an Azure CLI session: the
    # Entra app's federated credential trusts only that environment, and no client secret exists.
    - name: Sign in to Azure for Artifact Signing
      if: inputs.sign-windows == 'true'
      uses: azure/login@v3.1.0
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Bundle and sign (tauri bundle)
      if: inputs.sign-windows == 'true'
      shell: bash
      working-directory: apps/desktop
      run: |
        set -euo pipefail
        mapfile -t args < "$RUNNER_TEMP/tauri-bundle-args"
        pnpm exec tauri bundle "${args[@]}"
    # Linux wrote them while Tauri bundled (the beforeBundleCommand above).
    - name: Write the Breakpad symbols
      if: runner.os != 'Linux'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: bash .github/actions/desktop-build/symbols.sh "$TARGET" "$RUNNER_TEMP/desktop-symbols"
    - name: Collect the files people download and the updater installs
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        # Forward slashes on Windows (D:/a/_temp): the later steps glob this path, and a glob reads
        # D:\a\_temp's backslashes as escapes. Windows programs (xtask) accept the same form.
        temp="$RUNNER_TEMP"
        if command -v cygpath > /dev/null; then temp=$(cygpath -m "$temp"); fi
        out="$temp/desktop/$PLATFORM"
        mkdir -p "$out"
        # Globs, not find: on Windows, `find` is the system's own find.exe. Files only: the .app
        # folder ships inside the .dmg and the .app.tar.gz.
        shopt -s nullglob
        for file in target/"$TARGET"/release/bundle/*/*; do
          case "$file" in
            *.dmg | *.app.tar.gz | *-setup.exe | *.msi | *.AppImage | *.deb | *.rpm | *.sig)
              if [ -f "$file" ]; then cp "$file" "$out/"; fi ;;
          esac
        done
        ls -l "$out"
        echo "DESKTOP_OUT=$out" >> "$GITHUB_ENV"
    # A nightly's pre-release version fits neither an MSI nor an rpm, so it builds neither.
    - name: Check the bundles the mode asks for
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        UPDATER: ${{ inputs.updater }}
      run: |
        set -euo pipefail
        has() { compgen -G "$DESKTOP_OUT/$1" > /dev/null; }
        fail() { echo "::error::$1"; exit 1; }
        case "$RUNNER_OS" in
          macOS) has '*.dmg' || fail "no .dmg" ;;
          Windows)
            has '*-setup.exe' || fail "no NSIS installer"
            if [ "$MODE" = tag ]; then has '*.msi' || fail "a tag build makes an MSI too"; fi
            if [ "$MODE" = nightly ] && has '*.msi'; then fail "a nightly can't carry an MSI"; fi ;;
          Linux)
            has '*.AppImage' || fail "no AppImage"
            has '*.deb' || fail "no .deb"
            if [ "$MODE" = tag ]; then has '*.rpm' || fail "a tag build makes an .rpm too"; fi ;;
        esac
        if [ "$UPDATER" = true ] && ! has '*.sig'; then fail "no updater signature"; fi
    # Tauri notarises and staples the .app, which the .dmg and the updater bundle hold; the .dmg
    # needs a ticket of its own for Gatekeeper's check while the Mac is offline.
    - name: Notarise and staple the .dmg
      if: inputs.sign-macos == 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        notary=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
        # Hand-written retries rather than nick-fields/retry: a submission that Apple has (it has an
        # id) is waited on again, never sent twice, and a rejection fails at once with Apple's log.
        for dmg in "$DESKTOP_OUT"/*.dmg; do
          name=$(basename "$dmg")
          id=""
          for attempt in 1 2 3; do
            id=$(xcrun notarytool submit "$dmg" "${notary[@]}" --output-format json | jq -r '.id // empty') || id=""
            if [ -n "$id" ]; then break; fi
            echo "::warning::$name wasn't submitted (attempt $attempt); trying again in 60 s"
            sleep 60
          done
          [ -n "$id" ] || { echo "::error::$name couldn't be submitted for notarisation"; exit 1; }
          echo "Submission $id for $name"
          # Apple's queue is usually minutes; a wait that runs out resumes the same submission.
          for attempt in 1 2 3; do
            if xcrun notarytool wait "$id" "${notary[@]}" --timeout 15m; then break; fi
            echo "::warning::still waiting for submission $id (attempt $attempt)"
          done
          status=""
          for attempt in 1 2 3; do
            status=$(xcrun notarytool info "$id" "${notary[@]}" --output-format json | jq -r '.status // empty') || status=""
            if [ -n "$status" ]; then break; fi
            sleep 30
          done
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$id" "${notary[@]}" || true
            echo "::error::Apple's notary service answered ${status:-nothing} for $name (submission $id)"
            exit 1
          fi
          # The ticket can take a minute to reach Apple's servers after the notary accepts.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$dmg"; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::$name was notarised but its ticket couldn't be stapled"
              exit 1
            fi
            sleep 30
          done
        done
    # The runbook's checks (§3): a signature, a staple or an entitlement out of place fails the release.
    - name: Verify the macOS signatures and tickets
      if: inputs.sign-macos == 'true'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        fail() { echo "::error::$1"; exit 1; }
        apps=(target/"$TARGET"/release/bundle/macos/*.app)
        app=${apps[0]}
        team=$(sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p' <<< "$APPLE_SIGNING_IDENTITY")
        [ -n "$team" ] || fail "APPLE_SIGNING_IDENTITY ends in no Team ID"
        # Gatekeeper's verdict, when the runner lets it give one: a runner image may turn its
        # assessments off, and spctl then accepts everything. The staples are checked either way.
        sudo spctl --master-enable 2> /dev/null || true
        gatekeeper=false
        if spctl --status 2>&1 | grep -q 'assessments enabled'; then gatekeeper=true; else
          echo "::warning::Gatekeeper's assessments are off on this runner: its verdicts are left out"
        fi
        assess() {
          if [ "$gatekeeper" != true ]; then return 0; fi
          spctl -a -vvv "$@" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
        }
        codesign --verify --deep --strict --verbose=2 "$app"
        assess -t exec "$app" || fail "Gatekeeper doesn't accept the .app as notarised"
        xcrun stapler validate "$app"
        # Every piece of code in the bundle: the owner's Team ID; executables with the hardened runtime.
        while IFS= read -r -d '' file; do
          if ! file -b "$file" | grep -q 'Mach-O'; then continue; fi
          details=$(codesign -dvv "$file" 2>&1)
          grep -q "TeamIdentifier=$team" <<< "$details" || fail "$file isn't signed with the Developer ID"
          if file -b "$file" | grep -q 'executable'; then
            grep -qE 'flags=.*runtime' <<< "$details" || fail "$file lacks the hardened runtime"
          fi
        done < <(find "$app" -type f -print0)
        # Neither the app nor the engine has an entitlement (ADR 0008 §5, ADR 0014 §6). Tauri signs
        # the engine with the app's entitlements, so one added to the app would reach the engine.
        for code in "$app" "$app/Contents/MacOS/laminapdf-desktop-engine"; do
          if codesign -d --entitlements - --xml "$code" 2> /dev/null | grep -q '<key>'; then
            fail "$(basename "$code") has entitlements; the app and the engine need none"
          fi
        done
        for dmg in "$DESKTOP_OUT"/*.dmg; do
          assess -t open --context context:primary-signature "$dmg" || fail "Gatekeeper doesn't accept $(basename "$dmg") as notarised"
          xcrun stapler validate "$dmg"
        done
        # The updater installs the .app from this archive: it must be the signed, stapled one.
        for archive in "$DESKTOP_OUT"/*.app.tar.gz; do
          unpacked="$RUNNER_TEMP/updater-app"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          for bundled in "$unpacked"/*.app; do
            codesign --verify --deep --strict "$bundled"
            xcrun stapler validate "$bundled"
          done
        done
    # Every macOS build, signed or ad hoc: the bundled engine, as signed, loads the bundled PDFium and
    # draws a page. The hardened runtime's library validation refuses PDFium otherwise, and the
    # engine then draws nothing.
    - name: Draw a page with the bundled engine and PDFium
      if: runner.os == 'macOS'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        CARGO_PROFILE_RELEASE_STRIP: symbols
      run: |
        set -euo pipefail
        cargo build --locked --release -p laminapdf-desktop-engine --example measure
        apps=(target/"$TARGET"/release/bundle/macos/*.app)
        app=${apps[0]}
        LAMINA_PDF_PDFIUM_DIR="$app/Contents/Resources/pdfium" target/release/examples/measure \
          --engine "$app/Contents/MacOS/laminapdf-desktop-engine" --file fixtures/golden/examples/hello.pdf --tiles 2
    - name: Check the notices are in the bundle
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          macOS) test -s target/"$TARGET"/release/bundle/macos/*.app/Contents/Resources/THIRD_PARTY_NOTICES.txt ;;
          # The listing goes to a file: grep -q stops early, and dpkg-deb's tar fails on the closed pipe.
          Linux)
            dpkg-deb -c "$DESKTOP_OUT"/*.deb > "$RUNNER_TEMP/deb-files.txt"
            grep -q 'THIRD_PARTY_NOTICES.txt$' "$RUNNER_TEMP/deb-files.txt" ;;
          # The installers pack their files; the build copies the resource next to the executable.
          Windows) test -s target/"$TARGET"/release/THIRD_PARTY_NOTICES.txt ;;
        esac
    # Every PE file in both installers, and the installers, signed by the owner with a timestamp
    # (runbook §3's check, made on what ships). The name is the certificate's CN (runbook §1.5).
    - name: Check the Windows signatures
      if: inputs.sign-windows == 'true'
      shell: pwsh
      run: ./apps/desktop/scripts/verify-windows-signatures.ps1 -Dir $env:DESKTOP_OUT -Publisher 'Laurence Ininda'
    # Each installer installed and removed on the runner: registered for PDFs and never the
    # default, the MSI's install flavour, nothing left behind (ADR 0008 §10, ADR 0014).
    - name: Install and uninstall the Windows installers
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SIGN_WINDOWS: ${{ inputs.sign-windows }}
      run: |
        $signed = $env:SIGN_WINDOWS -eq 'true'
        ./apps/desktop/scripts/check-windows-installers.ps1 -Dir $env:DESKTOP_OUT -Signed:$signed
    # The AppImage was signed while Tauri bundled it; the .deb and .rpm carry their signatures inside.
    - name: Sign the .deb and the .rpm
      if: inputs.sign-linux == 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        for deb in "$DESKTOP_OUT"/*.deb; do debsigs --sign=origin -k "$LINUX_SIGNING_FPR" "$deb"; done
        # Signed under a name without spaces: Ubuntu's rpmsign hands gpg the path unquoted, so
        # "Lamina PDF-….rpm" reached gpg as two arguments.
        for rpm in "$DESKTOP_OUT"/*.rpm; do
          plain="$RUNNER_TEMP/signing.rpm"
          cp "$rpm" "$plain"
          rpmsign --addsign --define "_gpg_name $LINUX_SIGNING_FPR" "$plain"
          mv "$plain" "$rpm"
        done
    - name: Write SHA256SUMS
      shell: bash
      run: |
        set -euo pipefail
        cd "$DESKTOP_OUT"
        sum() { if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
        # Every file but the signatures, which sign these files rather than ship on their own, and
        # SHA256SUMS itself: the redirect below creates it before the glob expands.
        for file in *; do
          case "$file" in *.sig | *.asc | SHA256SUMS) ;; *) if [ -f "$file" ]; then sum "$file"; fi ;; esac
        done > SHA256SUMS
        cat SHA256SUMS
    - name: Sign every Linux file and SHA256SUMS (detached)
      if: inputs.sign-linux == 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        for file in "$DESKTOP_OUT"/*.AppImage "$DESKTOP_OUT"/*.deb "$DESKTOP_OUT"/*.rpm "$DESKTOP_OUT"/SHA256SUMS; do
          gpg --batch --local-user "$LINUX_SIGNING_FPR" --armor --detach-sign --output "$file.asc" "$file"
        done
    # The runbook's checks (§3), here with the key just used: a bad signature fails the release.
    - name: Verify the Linux signatures
      if: inputs.sign-linux == 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        cd "$DESKTOP_OUT"
        public="$RUNNER_TEMP/lamina-release.asc"
        gpg --batch --armor --export "$LINUX_SIGNING_FPR" > "$public"
        for asc in *.asc; do gpg --batch --verify "$asc" "${asc%.asc}"; done
        sha256sum --check SHA256SUMS
        id=${LINUX_SIGNING_FPR: -16}
        sudo mkdir -p "/usr/share/debsig/keyrings/$id" "/etc/debsig/policies/$id"
        gpg --dearmor < "$public" | sudo tee "/usr/share/debsig/keyrings/$id/debsig.gpg" > /dev/null
        sudo tee "/etc/debsig/policies/$id/lamina-pdf.pol" > /dev/null <<POLICY
        <?xml version="1.0"?>
        <!DOCTYPE Policy SYSTEM "https://www.debian.org/debsig/1.0/policy.dtd">
        <Policy xmlns="https://www.debian.org/debsig/1.0/">
          <Origin Name="Lamina PDF" id="$id" Description="Lamina PDF releases"/>
          <Selection><Required Type="origin" File="debsig.gpg" id="$id"/></Selection>
          <Verification MinOptional="0"><Required Type="origin" File="debsig.gpg" id="$id"/></Verification>
        </Policy>
        POLICY
        for deb in *.deb; do debsig-verify "$deb"; done
        # One rpm database for the import and the check: Ubuntu's rpm keeps it in $HOME, which sudo changes.
        rpmdb="$RUNNER_TEMP/rpmdb"
        mkdir -p "$rpmdb"
        rpm --dbpath "$rpmdb" --import "$public"
        for rpm in *.rpm; do rpm --dbpath "$rpmdb" -K "$rpm" | tee /dev/stderr | grep -q 'signatures OK'; done
        for appimage in *.AppImage; do
          chmod +x "$appimage"
          test -n "$("./$appimage" --appimage-signature)"
        done
    - name: Check the installers against the 16 MB budget
      shell: bash
      run: cargo xtask desktop-release sizes "$DESKTOP_OUT"
    - name: Write the SBOMs
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: cargo xtask desktop-release sbom "$TARGET" "$DESKTOP_OUT/sbom"
    # The keychain and the App Store Connect key leave the runner, whatever the build came to.
    - name: Remove the signing keychain and key
      if: always() && inputs.sign-macos == 'true'
      shell: bash
      run: |
        if [ -n "${APPLE_KEYCHAIN:-}" ]; then security delete-keychain "$APPLE_KEYCHAIN" || true; fi
        rm -rf "$RUNNER_TEMP/private_keys"
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: desktop-${{ inputs.platform }}-${{ inputs.mode }}
        path: ${{ runner.temp }}/desktop
        if-no-files-found: error
        retention-days: 14
    # Apart from the files above, which are attested and published: the archive job of a tagged
    # release uploads these to the private symbols bucket (desktop-release.yml's archive-symbols).
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: symbols-desktop-${{ inputs.platform }}-${{ inputs.mode }}
        path: ${{ runner.temp }}/desktop-symbols
        if-no-files-found: error
        retention-days: 14
