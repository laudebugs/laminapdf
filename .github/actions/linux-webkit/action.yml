name: Linux WebKitGTK
description: >-
  The system libraries the desktop app (apps/desktop/src-tauri, ADR 0008) links on Linux, for any
  job that builds the whole Cargo workspace. A no-op on macOS and Windows.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/apt-fail-fast
    - name: Install WebKitGTK 4.1 and D-Bus development packages
      if: runner.os == 'Linux'
      # apt can fail on a mirror hiccup: three tries, each retry a warning (ADR 0018 §4).
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 15
        max_attempts: 3
        shell: bash
        # webkit2gtk-4.1 brings GTK 3, libsoup 3 and JavaScriptCore (Tauri's webview); libdbus for
        # tauri's `dbus` feature. The same list as `cargo xtask doctor`'s desktop line.
        command: |
          set -euo pipefail
          # Root stops its own apt: the retry action can't kill a root process (EPERM).
          sudo timeout --kill-after=30s 5m apt-get update -q
          sudo timeout --kill-after=30s 8m apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config
