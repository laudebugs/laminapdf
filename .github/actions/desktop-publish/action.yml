# The desktop release's publish (todo D6b; .github/workflows/desktop-release.yml): every target's
# files to R2 under releases/<version>/<platform>/ in the channel's bucket, the channel's manifest
# written with the new release, the update Worker asked for each platform as a fresh install
# would, then downloads/<channel>.json written for the website's download page. Both publish jobs use it; each sets its environment's R2 tokens and their Access Key IDs,
# each scoped to one bucket (ADR 0014 §1), under the names apps/updates/scripts/r2.ts reads. Every
# R2 call goes through the manifest tool (apps/updates/scripts/manifest.ts), over R2's S3 API.
name: Desktop release publish
description: Upload a desktop release to R2, update its channel and check the update Worker.
inputs:
  channel:
    description: nightly, staging or beta.
    required: true
  version:
    description: The version the builds carry.
    required: true
  downloads:
    description: The bucket's download address.
    required: true
  mode:
    description: The build artifacts' mode suffix, `nightly` or `tag`.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node and pnpm
      uses: $/.github/actions/node-pnpm
    - uses: actions/download-artifact@v8.0.2
      with:
        pattern: desktop-*-${{ inputs.mode }}
        path: ${{ runner.temp }}/built
        # Each artifact holds one <platform>/ folder.
        merge-multiple: true
    - name: Upload the files
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
      run: pnpm --filter @laminapdf/updates manifest upload "$CHANNEL" "$RUNNER_TEMP/built" --version "$VERSION"
    # Every channel starts at 100 %: nightly and staging always, beta for its testers. Stable
    # starts low through `manifest promote` (ADR 0014 §2; docs/guidelines/desktop-release.md).
    - name: Make it the channel's release
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
        DOWNLOADS: ${{ inputs.downloads }}
        NOTES: Lamina PDF ${{ inputs.version }}, built from ${{ github.sha }}
      run: |
        pnpm --filter @laminapdf/updates manifest publish "$CHANNEL" "$RUNNER_TEMP/built" \
          --version "$VERSION" --downloads "$DOWNLOADS" --notes "$NOTES" --rollout 100
    # D5c's update test (desktop-update-e2e.yml) leaves the staging channel paused and offering
    # nothing, and a paused channel answers every install with 204. A staging trial publishes to be
    # served, so it resumes the channel; beta and stable keep any pause the owner set.
    - name: Serve the staging channel
      if: inputs.channel == 'staging'
      shell: bash
      run: pnpm --filter @laminapdf/updates manifest resume staging
    # The Worker caches a manifest for 30 s: try for two minutes.
    - name: Ask the update Worker for each platform
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
      run: |
        for attempt in 1 2 3 4; do
          sleep 30
          if pnpm --filter @laminapdf/updates manifest verify "$CHANNEL" "$VERSION"; then exit 0; fi
          echo "::warning::try $attempt: the Worker doesn't serve $VERSION everywhere yet"
        done
        exit 1
    # The website's list of the installers (apps/updates/scripts/downloads.ts), once the Worker
    # serves the release; the website's next deploy shows it (site.yml, every six hours).
    - name: List the installers for the download page
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
        DOWNLOADS: ${{ inputs.downloads }}
      run: |
        pnpm --filter @laminapdf/updates manifest downloads "$CHANNEL" "$RUNNER_TEMP/built" \
          --version "$VERSION" --downloads "$DOWNLOADS"
    - name: Summary
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
        DOWNLOADS: ${{ inputs.downloads }}
      run: |
        {
          echo "## Published $VERSION to $CHANNEL"
          echo
          echo "| Platform | File | Size |"
          echo "| --- | --- | ---: |"
          for dir in "$RUNNER_TEMP"/built/*/; do
            platform=$(basename "$dir")
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              case "$name" in *.sig | *.asc) continue ;; esac
              echo "| $platform | [$name]($DOWNLOADS/releases/$VERSION/$platform/${name// /%20}) | $(wc -c < "$file" | tr -d ' ') B |"
            done
          done
        } >> "$GITHUB_STEP_SUMMARY"
