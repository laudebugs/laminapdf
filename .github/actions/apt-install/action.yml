# Every Linux apt install in the workflows and actions goes through here
# (docs/bugs/ci-apt-slow-or-unreachable-mirror). The downloaded .deb files are cached per runner
# image and package list, so most runs install without a download; each try first finishes
# anything an earlier try left half done; and a slow mirror gets 15 minutes by default. A no-op off
# Linux.
name: apt install
description: >-
  Install Ubuntu packages with `apt-get install --no-install-recommends`, from cached .deb files
  where it can, in up to three tries a minute apart; nothing on macOS and Windows.
inputs:
  packages:
    description: >-
      Space- or newline-separated packages, as `apt-get install` takes them (`name=version`
      pins too); empty installs nothing.
    required: true
  timeout:
    description: >-
      Seconds each try's `apt-get install` may take before it ends itself; at most 1,100, so the
      whole try stays inside the retry's 30-minute limit (install.sh adds up the terms).
    required: false
    default: "900"
runs:
  using: composite
  steps:
    - name: Make apt fail fast
      id: fail-fast
      if: runner.os == 'Linux' && inputs.packages != ''
      uses: $/.github/actions/apt-fail-fast
    # One folder and key per package list, so two installs in a job keep separate caches. The
    # key names the runner image (GitHub sets ImageOS and ImageVersion), whose package versions
    # the files match; the restore key takes an older image's files, which apt uses where they
    # are still current.
    - name: Name the package cache
      id: key
      if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        set -f
        # The list in one order and spacing, so its hash names the packages alone; unquoted, one
        # word per package.
        # shellcheck disable=SC2086
        list=$(printf '%s\n' $PACKAGES | sort -u | tr '\n' ' ')
        hash=$(printf '%s' "$list" | sha256sum | cut -c1-16)
        dir="$HOME/.cache/apt-install/$hash"
        mkdir -p "$dir/partial"
        # A runner that isn't GitHub-hosted sets neither variable: its release names the files.
        image=${ImageOS:-$(. /etc/os-release && echo "$ID$VERSION_ID")}
        prefix="apt-$image-$RUNNER_ARCH-$hash-"
        {
          echo "dir=$dir"
          echo "prefix=$prefix"
          echo "key=$prefix${ImageVersion:-unversioned}"
        } >> "$GITHUB_OUTPUT"
    - name: Restore the cached packages
      id: restore
      if: runner.os == 'Linux' && inputs.packages != ''
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    # apt can fail on a mirror hiccup: three tries a minute apart, each retry a warning (ADR 0018
    # §4). apt runs as root, which the retry can't stop at its timeout ("kill EPERM"), so each
    # apt call in install.sh ends itself first, under `sudo timeout` (docs/bugs/
    # ci-apt-retry-kill-eperm).
    - name: Install the packages
      if: runner.os == 'Linux' && inputs.packages != ''
      uses: nick-fields/retry@v4.0.0
      env:
        APT_ARCHIVES: ${{ steps.key.outputs.dir }}
        APT_TIMEOUT: ${{ inputs.timeout }}
        APT_UPDATE: ${{ steps.fail-fast.outputs.update }}
        INSTALL: ${{ github.action_path }}/install.sh
        PACKAGES: ${{ inputs.packages }}
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_wait_seconds: 60
        shell: bash
        command: bash "$INSTALL"
    # apt, as root, leaves a root-only `lock` in the folder and gives `partial/` to `_apt` (mode
    # 700). The cache tars the folder as the runner, so it would fail on them and only warn. Run
    # only when the save below will.
    - name: Hand the package folder back to the runner
      if: >-
        runner.os == 'Linux' && inputs.packages != '' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule') &&
        steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        APT_ARCHIVES: ${{ steps.key.outputs.dir }}
        CACHE_KEY: ${{ steps.key.outputs.key }}
      run: |
        set -euo pipefail
        sudo rm -rf "$APT_ARCHIVES/lock" "$APT_ARCHIVES/partial"
        sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"
        mkdir -p "$APT_ARCHIVES/partial"
        unreadable=$(find "$APT_ARCHIVES" ! -readable -print -quit)
        if [ -n "$unreadable" ]; then
          echo "::warning::the apt cache $CACHE_KEY can't be saved: the runner can't read $unreadable"
        fi
    # Only pushes and scheduled runs on main save, as node-pnpm does: they run main's own code,
    # while a dispatched run may check out another ref, and a pull request's cache would reach
    # only that pull request. Saved right after the install, before the job's own steps run.
    - name: Save the downloaded packages (main only)
      if: >-
        runner.os == 'Linux' && inputs.packages != '' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule') &&
        steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
