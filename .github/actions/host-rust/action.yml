name: Host-only Rust toolchain
description: Install the pinned Rust version without components or cross targets.
inputs:
  cache:
    description: Restore Rust dependencies; only pushes to main save the cache.
    required: true
  shared-key:
    description: >-
      One cache for every job that builds the same thing (rust-cache's `shared-key`, still per OS
      and CPU); empty keeps a cache per job.
    required: false
    default: ""
  save:
    description: >-
      "false" only restores, for a job that shares another job's key and builds less than it
      (the first save wins, so only the job that builds the most saves).
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Read the pinned Rust version
      id: rust
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::no channel found"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: ${{ inputs.cache }}
        cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.save == 'true' }}
        cache-key: ${{ runner.os }}-${{ runner.arch }}
        cache-shared-key: ${{ inputs.shared-key }}
        cache-bin: false
        toolchain: ${{ steps.rust.outputs.channel }}
        components: ""
        target: ""
        override: false
