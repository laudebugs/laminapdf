# Playwright's Chromium for a package's browser tests, installed into the runner's tool cache
# (`playwright install`, with its system libraries on Linux). Later steps of the job find it
# through PLAYWRIGHT_BROWSERS_PATH.
name: Playwright's Chromium
description: Install Playwright's Chromium into the runner's tool cache and point later steps at it.
inputs:
  package:
    description: The workspace package whose Playwright version installs the browser.
    required: false
    default: "@laminapdf/web"
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
    - uses: ./.github/actions/apt-fail-fast
    # The download can fail on a CDN hiccup: three tries, each retry a warning (ADR 0018 §4).
    - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        PACKAGE: ${{ inputs.package }}
      with:
        timeout_minutes: 15
        max_attempts: 3
        shell: bash
        command: |
          # On Linux, also the system libraries Chromium needs (hosted Ubuntu lacks some).
          deps=()
          if [ "$RUNNER_OS" = Linux ]; then deps=(--with-deps); fi
          pnpm --filter "$PACKAGE" exec playwright install "${deps[@]}" chromium
