name: apt fails fast
description: >-
  Makes apt give up on a stalled or unreachable mirror in about a minute instead of hanging, and
  makes `apt-get update` fail when it can't fetch an index (by default it only warns, and the
  install that follows hangs). A hang outlasted nick-fields/retry's timeout, whose kill of the
  root-owned apt process then failed (EPERM) and ended the job without a retry. A no-op on macOS
  and Windows.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "3";' \
          'APT::Update::Error-Mode "any";' \
          | sudo tee /etc/apt/apt.conf.d/99-fail-fast > /dev/null
