name: apt fails fast
description: >-
  Makes a failing apt try end in about a minute: each download gets 30 s and 3 tries, and
  `apt-get update` fails when it can't fetch an index (by default it only warns, and the install
  after it hangs until its `sudo timeout`; docs/bugs/ci-apt-retry-kill-eperm). A no-op on macOS
  and Windows.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "3";' \
          'APT::Update::Error-Mode "any";' \
          | sudo tee /etc/apt/apt.conf.d/99-fail-fast > /dev/null
