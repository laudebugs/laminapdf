name: apt fails fast
description: >-
  Makes a failing apt try end sooner (docs/bugs/ci-apt-retry-kill-eperm): each download gets
  30 s and 3 tries, rather than waiting on a stalled mirror until the try's `sudo timeout`. Its
  `update.sh`, which the setup actions run inside their retry, fails a try at once when an Ubuntu
  index can't be fetched. A no-op on macOS and Windows.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "3";' \
          | sudo tee /etc/apt/apt.conf.d/99-fail-fast > /dev/null
