# The system libraries Playwright's browsers need on a hosted Ubuntu runner. A no-op elsewhere:
# macOS needs none. Run after node-pnpm (it uses @laminapdf/sdk's Playwright).
name: Playwright's system libraries
description: Install the Linux packages Playwright's browsers need; nothing on other systems.
inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: false
    default: chromium
runs:
  using: composite
  steps:
    # apt can fail on a mirror hiccup: three tries, each retry a warning (ADR 0018 §4).
    - if: runner.os == 'Linux'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        BROWSERS: ${{ inputs.browsers }}
      with:
        timeout_minutes: 15
        max_attempts: 3
        shell: bash
        # $BROWSERS unquoted on purpose: one argument per browser.
        command: pnpm --filter @laminapdf/sdk exec playwright install-deps $BROWSERS
