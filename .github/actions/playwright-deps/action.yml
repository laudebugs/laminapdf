# The system libraries Playwright's browsers need on a hosted Ubuntu runner. A no-op elsewhere:
# macOS needs none. Run after node-pnpm (it uses @laminapdf/sdk's Playwright).
name: Playwright's system libraries
description: Install the Linux packages Playwright's browsers need; nothing on other systems.
inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: false
    default: chromium
runs:
  using: composite
  steps:
    # apt can fail on a mirror hiccup: three tries a minute apart, each retry a warning (ADR 0018
    # §4). Playwright runs apt through sudo, which the retry can't stop at its timeout ("kill
    # EPERM": the step fails with no retry), so Playwright runs as root under `sudo timeout` (KILL
    # 30 s after TERM) and ends itself first (docs/bugs/ci-apt-retry-kill-eperm).
    - if: runner.os == 'Linux'
      uses: nick-fields/retry@v4.0.0
      env:
        BROWSERS: ${{ inputs.browsers }}
      with:
        timeout_minutes: 15
        max_attempts: 3
        retry_wait_seconds: 60
        shell: bash
        # $BROWSERS unquoted on purpose: one argument per browser. PATH passed on for node.
        command: >-
          bash .github/actions/apt-fail-fast/update.sh &&
          sudo env "PATH=$PATH" timeout -k 30 540 packages/sdk/node_modules/.bin/playwright install-deps $BROWSERS
