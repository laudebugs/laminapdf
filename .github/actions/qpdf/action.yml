name: Pinned qpdf on macOS Arm64
description: Install the checksum-verified qpdf release used by the PDF suites.
runs:
  using: composite
  steps:
    - name: Install qpdf
      shell: bash
      env:
        QPDF_VERSION: "12.4.2"
        # https://github.com/qpdf/qpdf/releases/download/v12.4.2/qpdf-12.4.2.sha256
        QPDF_SHA256: 62e46987a30ea167cbc530ccb22690aec3d8c812ed09979a941bcee92e504b79
      run: |
        set -euo pipefail
        test "$RUNNER_OS/$RUNNER_ARCH" = macOS/ARM64
        zip="qpdf-$QPDF_VERSION-bin-macos-arm64.zip"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" "https://github.com/qpdf/qpdf/releases/download/v$QPDF_VERSION/$zip"
        echo "$QPDF_SHA256  $RUNNER_TEMP/$zip" | shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/qpdf"
        echo "$RUNNER_TEMP/qpdf/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/qpdf/bin/qpdf" --version
