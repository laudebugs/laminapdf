name: Pinned qpdf
description: Install the checksum-verified qpdf release used by the PDF suites (Linux x64/Arm64, macOS Arm64).
runs:
  using: composite
  steps:
    - name: Install qpdf
      shell: bash
      env:
        QPDF_VERSION: "12.4.2"
        # From https://github.com/qpdf/qpdf/releases/download/v12.4.2/qpdf-12.4.2.sha256
        QPDF_SHA256_MACOS_ARM64: 62e46987a30ea167cbc530ccb22690aec3d8c812ed09979a941bcee92e504b79
        QPDF_SHA256_LINUX_X64: db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1
        QPDF_SHA256_LINUX_ARM64: 8fd9d009eb0838398180a603f2cf76531e5c68a4ecc8847598e0a1ccb1d3b600
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          macOS/ARM64) asset=macos-arm64 sum=$QPDF_SHA256_MACOS_ARM64 ;;
          Linux/X64) asset=linux-x86_64 sum=$QPDF_SHA256_LINUX_X64 ;;
          Linux/ARM64) asset=linux-aarch64 sum=$QPDF_SHA256_LINUX_ARM64 ;;
          *) echo "::error::no pinned qpdf for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        zip="qpdf-$QPDF_VERSION-bin-$asset.zip"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" "https://github.com/qpdf/qpdf/releases/download/v$QPDF_VERSION/$zip"
        echo "$sum  $RUNNER_TEMP/$zip" | shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/qpdf"
        echo "$RUNNER_TEMP/qpdf/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/qpdf/bin/qpdf" --version
