# pnpm (packageManager in package.json) and Node on the self-hosted macOS runners, with the pnpm
# store kept between jobs.
#
# pnpm/action-setup installs pnpm into the job's temp dir (`dest`): the default (~/setup-pnpm) is
# shared by every runner on the same machine, and concurrent jobs delete each other's pnpm. pnpm
# puts its store next to itself, so without `pnpm_config_store_dir` every job would start with an
# empty store, and setup-node's `cache: pnpm` refilled it by downloading ~290 MB from the Actions
# cache (one to three minutes per job, and as long again to save it). Instead the store lives in
# the runner's own tool cache, like isolate-rust-home's build directories: one per runner (used
# by one job at a time) and one per kind of run, with the same buckets, so what a pull request's
# install wrote is never linked into a run on main. `pnpm install` then only links what it
# already has.
#
# Not for the jobs in the Linux runner container (full.yml's check-linux and release.yml's Linux
# check): the container starts empty for every job, so they keep setup-node's cache.
name: Node and pnpm on self-hosted runners
description: Install pnpm and Node, keep the pnpm store in the runner's tool cache, and optionally install.
inputs:
  node-version:
    description: Node version; empty uses .nvmrc.
    required: false
    default: ""
  package-json-file:
    description: The package.json whose packageManager names the pnpm version.
    required: false
    default: package.json
  install:
    description: >-
      Folder to run `pnpm install --frozen-lockfile` in, relative to the checkout (`.` for the
      root workspace); empty skips the install.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        dest: ${{ runner.temp }}/setup-pnpm
        package_json_file: ${{ inputs.package-json-file }}
    - name: Keep the pnpm store in the runner's tool cache
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        # isolate-rust-home's buckets; `other` is emptied before every use.
        case "$EVENT/$REF" in
          push/refs/heads/main) bucket=main-push ;;
          schedule/refs/heads/main | workflow_dispatch/refs/heads/main) bucket=main-nightly ;;
          pull_request/*) bucket=pull_request ;;
          *) bucket=other ;;
        esac
        store="$RUNNER_TOOL_CACHE/pnpm-store/$bucket"
        if [ "$bucket" = other ]; then
          rm -rf "$store"
        fi
        mkdir -p "$store"
        echo "pnpm store: $store"
        echo "pnpm_config_store_dir=$store" >> "$GITHUB_ENV"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # An empty node-version falls back to node-version-file.
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        # The store above replaces setup-node's cache; `package-manager-cache: false` stops it
        # from turning one on because package.json names pnpm.
        package-manager-cache: false
    - name: pnpm install
      if: inputs.install != ''
      shell: bash
      working-directory: ${{ inputs.install }}
      run: pnpm install --frozen-lockfile
