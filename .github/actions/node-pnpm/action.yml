name: Node and pnpm
description: Install pnpm and Node with a lockfile-keyed dependency cache.
inputs:
  node-version:
    description: Node version; empty uses .nvmrc.
    required: false
    default: ""
  package-json-file:
    description: The package.json whose packageManager names the pnpm version.
    required: false
    default: package.json
  install:
    description: >-
      Folder to run `pnpm install --frozen-lockfile` in, relative to the checkout (`.` for the
      root workspace); empty skips the install.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        dest: ${{ runner.temp }}/setup-pnpm
        package_json_file: ${{ inputs.package-json-file }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # An empty node-version falls back to node-version-file.
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: ${{ inputs.install != '' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.install }}/pnpm-lock.yaml
        package-manager-cache: false
    - name: pnpm install
      if: inputs.install != ''
      shell: bash
      working-directory: ${{ inputs.install }}
      run: pnpm install --frozen-lockfile
