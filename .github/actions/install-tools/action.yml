# taiki-e/install-action, the one way workflows install cargo tools (tools/xtask/src/workflows.rs
# checks it), so its pin is bumped in one place.
#
# Earlier this step gave install-action a HOME of its own, because the self-hosted runners on one
# Mac shared ~/.install-action. Hosted VMs are used once, so it no longer does: with that HOME, a
# tool install-action has no manifest for (cargo-dist 0.32.0) went through cargo-binstall into
# $HOME/.cargo/bin, which is not on the PATH.
name: Install tools with install-action
description: Run taiki-e/install-action for the given tools.
inputs:
  tool:
    description: The tools, as install-action's `tool` input (comma-separated `name@version`).
    required: true
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      with:
        tool: ${{ inputs.tool }}
