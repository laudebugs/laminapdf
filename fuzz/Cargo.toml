# cargo-fuzz targets (ADR 0018 tier 9) in the layout OSS-Fuzz expects for Rust. Its own
# workspace, excluded from the root one, because libFuzzer needs nightly Rust; the root
# toolchain pin does not apply (`cargo +nightly fuzz …`). Run with `cargo xtask fuzz <target>`.
[package]
name = "laminapdf-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# Fuzzing harness only, never shipped: (MIT OR Apache-2.0) AND NCSA (it bundles LLVM's
# libFuzzer). Outside the root workspace, so cargo-deny's allow-list does not apply.
libfuzzer-sys = "0.4.10"
laminapdf-syntax = { path = "../crates/laminapdf-syntax" }
laminapdf-cos = { path = "../crates/laminapdf-cos" }
laminapdf-model = { path = "../crates/laminapdf-model" }
laminapdf-content = { path = "../crates/laminapdf-content" }
laminapdf-ops = { path = "../crates/laminapdf-ops" }
laminapdf-save = { path = "../crates/laminapdf-save" }
laminapdf-text = { path = "../crates/laminapdf-text" }
serde_json = "1.0.154"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_object"
path = "fuzz_targets/parse_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flate_decode"
path = "fuzz_targets/flate_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "page_tree"
path = "fuzz_targets/page_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ops_json"
path = "fuzz_targets/ops_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "save_roundtrip"
path = "fuzz_targets/save_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_text"
path = "fuzz_targets/extract_text.rs"
test = false
doc = false
bench = false
