# Virtual manifest for lamina's Rust workspace (docs/guidelines/code-organization.md §1, rust.md).
# Shared package fields, dependencies, lints and profiles live here; members inherit them.

[workspace]
resolver = "3"
# ADR 0015 also lists "apps/*/src-tauri"; Cargo rejects a glob that matches nothing, so it is added
# with the first Tauri app (Round D).
members = ["crates/*", "tools/xtask"]
# Spikes are frozen research code and fuzz/ is its own (nightly) workspace: never members (ADR 0015).
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV policy (rust.md): while nothing is published, the MSRV tracks the pinned toolchain in
# rust-toolchain.toml. Before the first public release we move to N-2. CI's `msrv` job checks it.
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/laudebugs/lamina"
publish = false

[workspace.dependencies]
# Internal crates are added here as `lamina-x = { path = "crates/lamina-x" }`.
lamina-syntax = { path = "crates/lamina-syntax" }
lamina-cos = { path = "crates/lamina-cos" }

# Flate (zlib) codec, pure Rust; `with-alloc` is the default feature, named so it stays on.
# MIT OR Zlib OR Apache-2.0 (dependency adler2: 0BSD OR MIT OR Apache-2.0)
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

# Library errors. MIT OR Apache-2.0
thiserror = { version = "2.0.21", default-features = false }
# Binaries, xtask and tests only (never in library APIs). MIT OR Apache-2.0
anyhow = "1.0.104"
# MIT OR Apache-2.0
serde_json = "1.0.154"
# Reading deny.toml and rust-toolchain.toml in xtask. MIT OR Apache-2.0
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
# Markdown links and headings for `cargo xtask docs-links`; no default features (they add HTML
# output and a CLI). MIT (dependencies bitflags, memchr, unicase: MIT OR Apache-2.0)
pulldown-cmark = { version = "0.13.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"            # core crates additionally #![forbid(unsafe_code)]
missing_docs = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }   # enforced: CI's -D warnings turns these into errors
must_use_candidate = "allow"    # pedantic allow-list: each entry says why (here: #[must_use] on every getter is noise)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
redundant_clone = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"                   # unfinished code never merges; keep todo!/unimplemented! on your branch
unimplemented = "deny"
allow_attributes = "deny"       # outer #[allow] is rejected: use #[expect] (inner #![allow] is not covered)
allow_attributes_without_reason = "deny"   # every #[allow]/#[expect] states why

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
# Line tables are enough for backtraces and keep debug builds and target/ smaller.
debug = "line-tables-only"

# The flate-bomb robustness test inflates ~64 MiB; keep the codec fast in debug test builds
# (the spike's setting).
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3

[profile.release]
lto = "thin"

# Size-optimised profile for WebAssembly builds (`cargo xtask wasm`); the spike's settings.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
