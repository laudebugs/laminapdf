# Virtual manifest for lamina's Rust workspace (docs/guidelines/code-organization.md §1, rust.md).
# Shared package fields, dependencies, lints and profiles live here; members inherit them.

[workspace]
resolver = "3"
# The Tauri apps' Rust crates (ADR 0015) are listed one by one, the desktop reader first
# (ADR 0008): Dependabot reads a wildcard only at a path's end, and "apps/*/src-tauri" failed
# every Cargo update (docs/bugs/dependabot-cargo-workspace-glob).
members = ["crates/*", "apps/desktop/src-tauri", "tools/xtask", "tools/std14-gen"]
# Spikes are frozen research code and fuzz/ is its own (nightly) workspace: never members (ADR 0015).
# tools/render (hayro, for `cargo xtask render-golden`) is its own workspace too, with its own
# Cargo.lock, so the fast lane never compiles a renderer; the full lane builds it.
exclude = ["spikes", "fuzz", "tools/render"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# MSRV policy (rust.md): N-2, at least two stable releases behind the pinned toolchain in
# rust-toolchain.toml (1.99), since the first registry release. CI's `msrv-and-spike` job checks it.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/laudebugs/laminapdf"
homepage = "https://laminapdf.com"
# crates.io links here instead of docs.rs; the site's Rust API page links every crate's docs.rs page.
documentation = "https://docs.laminapdf.com"
publish = false

[workspace.dependencies]
# Internal crates are added here as `laminapdf-x = { path = "crates/laminapdf-x" }`; `cargo xtask version sync`
# gives each the workspace version (ADR 0017).
# No default features: `saslprep` (R5/R6 passwords, ~130 KB of Unicode tables in WASM) is asked
# for by the crates and builds that want it (laminapdf-cos and the façade by default; ADR 0016 §5).
laminapdf-syntax = { version = "0.2.0", path = "crates/laminapdf-syntax", default-features = false }
laminapdf-cos = { version = "0.2.0", path = "crates/laminapdf-cos", default-features = false }
laminapdf-model = { version = "0.2.0", path = "crates/laminapdf-model", default-features = false }
laminapdf-ops = { version = "0.2.0", path = "crates/laminapdf-ops" }
laminapdf-source = { version = "0.2.0", path = "crates/laminapdf-source" }
laminapdf-save = { version = "0.2.0", path = "crates/laminapdf-save", default-features = false }
laminapdf-content = { version = "0.2.0", path = "crates/laminapdf-content" }
laminapdf-text = { version = "0.2.0", path = "crates/laminapdf-text" }
laminapdf-extract = { version = "0.2.0", path = "crates/laminapdf-extract", default-features = false }
# No default features: dependents ask for `text` (fonts and text) explicitly (ADR 0016 §4).
laminapdf-build = { version = "0.2.0", path = "crates/laminapdf-build", default-features = false }
laminapdf = { version = "0.2.0", path = "crates/laminapdf", default-features = false }
laminapdf-render = { version = "0.2.0", path = "crates/laminapdf-render" }
laminapdf-render-pdfium = { version = "0.2.0", path = "crates/laminapdf-render-pdfium" }
laminapdf-render-wasm = { version = "0.2.0", path = "crates/laminapdf-render-wasm" }
laminapdf-tiff-wasm = { version = "0.2.0", path = "crates/laminapdf-tiff-wasm" }
# The desktop reader's engine process and its protocol (ADR 0008 §3): app crates, never published.
laminapdf-desktop-protocol = { version = "0.2.0", path = "crates/laminapdf-desktop-protocol" }
laminapdf-desktop-engine = { version = "0.2.0", path = "crates/laminapdf-desktop-engine" }
laminapdf-desktop-sandbox = { version = "0.2.0", path = "crates/laminapdf-desktop-sandbox" }
laminapdf-desktop-os = { version = "0.2.0", path = "crates/laminapdf-desktop-os" }

# Flate (zlib) codec, pure Rust; `with-alloc` is the default feature, named so it stays on.
# MIT OR Zlib OR Apache-2.0 (dependency adler2: 0BSD OR MIT OR Apache-2.0)
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

# Standard security handler decryption (B2b): RustCrypto, pure Rust, no default features. RC4 is
# our own (crypt/rc4.rs), so no API anywhere offers the broken primitives for writing.
# AES block cipher (AESV2/AESV3 crypt filters, Algorithm 2.B); the CBC chaining is ours, a few
# lines in laminapdf-syntax's crypt/aes.rs. MIT OR Apache-2.0 (cpufeatures → libc on aarch64 only
# reads CPU capabilities; allowed by `cargo xtask portability`)
aes = { version = "0.9.3", default-features = false }
# MD5 (Algorithms 2-7, per-object keys; read-only, never offered for writing). MIT OR Apache-2.0
md-5 = { version = "0.11.0", default-features = false }
# SHA-256/384/512 (R5, R6 Algorithm 2.B). MIT OR Apache-2.0
sha2 = { version = "0.11.1", default-features = false }
# SASLprep (RFC 4013) for R6 passwords. MIT OR Apache-2.0
stringprep = { version = "0.1.5", default-features = false }

# Fonts (laminapdf-text, B4a; ADR 0005 §6). skrifa: font loading, cmap and metrics over read-fonts
# (re-exported as `skrifa::raw`); pinned to the version subsetter's `variable-fonts` feature uses,
# so the graph has one copy. MIT OR Apache-2.0 (read-fonts, font-types, bytemuck: likewise)
skrifa = { version = "=0.42.0", default-features = false, features = ["std"] }
# Subsetting TrueType/CFF/CFF2 into PDF-ready font programs, with variable-font instancing
# (`variable-fonts`, its default feature: write-fonts, kurbo). MIT OR Apache-2.0
subsetter = { version = "=0.2.6" }
# Content-stream operators: laminapdf-build's content streams (ADR 0005 §6), laminapdf-text's tests and
# goldens. MIT OR Apache-2.0
pdf-writer = { version = "=0.15.0", default-features = false }
# PNG encoding: laminapdf-render's page export (feature `export`, E3h), laminapdf-build's tests,
# and the reference its own decoder (surface/png/, B6a) is compared with. No default features. MIT OR Apache-2.0 (bitflags,
# crc32fast, fdeflate, flate2, miniz_oxide 0.8 [a second copy, deny.toml warns], simd-adler32:
# MIT OR Apache-2.0 / Zlib)
png = { version = "0.18.1", default-features = false }
# Page export (laminapdf-render's `export` feature, todo E3h): JPEG through jpeg-encoder
# ((MIT OR Apache-2.0) AND IJG: deny.toml's exception) and TIFF through tiff (MIT), Deflate only.
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
# The pure-Rust renderer behind laminapdf-render's `hayro` feature (ADR 0004): the same pin as
# tools/render and the hayro-parity spike. MIT OR Apache-2.0 (dependencies: kurbo, vello_cpu,
# skrifa-family crates, moxcms, pic-scale, …: MIT/Apache/BSD/Zlib; cargo-deny checks them).
hayro = { version = "=0.8.0" }
# The fax and JBIG2 image decoders hayro uses, standalone for image extraction (laminapdf-extract).
# Apache-2.0 OR MIT.
hayro-ccitt = { version = "=0.4.0", default-features = false }
hayro-jbig2 = { version = "=0.3.1", default-features = false }
# ONNX Runtime bindings for laminapdf-layout-onnx only (edge, native): no default features, so
# nothing is downloaded at build time; the app loads ONNX Runtime from a path (load-dynamic).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
# PDFium bindings for laminapdf-render-pdfium (ADR 0004 §3): loaded at runtime, never linked at build
# time; `thread_safe` serialises every FFI call. MIT OR Apache-2.0 (libloading: ISC).
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }

# Shaping, bidi and line breaking (laminapdf-text, B4b; ADR 0005 §6). HarfRust: HarfBuzz's shaping
# algorithm in Rust. Pinned to 0.8.0, the last release on read-fonts 0.39 (skrifa 0.42's, see
# above), so the graph keeps one read-fonts; move it with skrifa/subsetter. Its own Unicode
# tables (no `icu` feature). MIT (bitflags, bytemuck, smallvec: MIT OR Apache-2.0 / Zlib)
harfrust = { version = "=0.8.0", default-features = false, features = ["std"] }
# UAX #14 line breaking and UAX #29 grapheme clusters with compiled (baked) data; no `auto`/`lstm`
# (dictionary and LSTM models for Thai, Lao, Khmer, Burmese: out of scope, and most of the size).
# `unstable` for `LineSegmenter::new_17_for_non_complex_scripts`, the Unicode 17 rules (the stable
# constructor's data predates LB20a, LB28a, LB30b's unassigned pictographs and drops CLDR's LB25
# tailoring only there): it passes all of LineBreakTest-17.0.0 but the dictionary scripts.
# `unstable` APIs are semver-exempt, hence the exact pin. Unicode-3.0 (ICU4X; allowed in deny.toml)
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data", "unstable"] }
# Unicode properties with compiled data: Script (itemisation, UAX #24) and Bidi_Class, fed to
# unicode-bidi through its `unicode_bidi` adapter so bidi uses ICU4X's data. Unicode-3.0
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data", "unicode_bidi"] }
# The UAX #9 algorithm (ICU4X has the data, not the algorithm). Without `hardcoded-data`: the
# Bidi_Class data comes from icu_properties above. MIT OR Apache-2.0
unicode-bidi = { version = "0.3.18", default-features = false, features = ["std"] }

# XML tokenizer under laminapdf-model's XMP reader (E1 plan §4): no DTD or entity expansion,
# byte positions for lossless edits; laminapdf-model only. MIT
quick-xml = { version = "0.42.0", default-features = false }
# Library errors. MIT OR Apache-2.0
thiserror = { version = "2.0.21", default-features = false }
# Memory-mapped files for laminapdf-source's opt-in `mmap` feature (MIT OR Apache-2.0).
memmap2 = "0.9.12"
# Binaries, xtask and tests only (never in library APIs). MIT OR Apache-2.0
anyhow = "1.0.104"
# The desktop engine protocol's encoding (ADR 0008 §3): serde's compact binary format.
# MIT OR Apache-2.0 (dependency cobs: MIT OR Apache-2.0). `use-std` without the default
# `heapless-cas` (the protocol allocates).
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Wipes secrets (a document's password) from memory when they're dropped. Apache-2.0 OR MIT.
zeroize = { version = "1.9.1", default-features = false, features = ["std"] }
# Locks a password's buffer into RAM (mlock / VirtualLock) so it never reaches swap. MIT.
region = "4.0.1"
# Lossless WebP for the desktop reader's tiles (ADR 0008 §4; D1a measured it): pure Rust. MIT OR
# Apache-2.0 (dependencies byteorder-lite: Unlicense OR MIT; quick-error: MIT OR Apache-2.0).
image-webp = "=0.2.4"
# The engine process's sandbox (laminapdf-desktop-sandbox, D2c; ADR 0008 §5). libc: the raw calls
# (setrlimit, prctl, sandbox_init, the selftest's fork/execve/clone3). MIT OR Apache-2.0
libc = "0.2.191"
# Linux: Landlock rulesets (file system, TCP, scopes). MIT OR Apache-2.0 (enumflags2: MIT OR Apache-2.0)
landlock = "0.4.7"
# Linux: seccomp-bpf filters, from Firecracker. Apache-2.0
seccompiler = { version = "0.5.0", default-features = false }
# Windows: restricted tokens, job objects, process attributes and mitigation policies. MIT OR Apache-2.0
windows-sys = { version = "0.61.2", default-features = false }
# Serialisable ops (ADR 0006 §1, §6): derive only. MIT OR Apache-2.0
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
# MIT OR Apache-2.0
serde_json = "1.0.154"
# The JSON Pointer of the value a laminapdf.document/1 document gets wrong (laminapdf-build's `serde`).
serde_path_to_error = "0.1.20"
# The desktop reader's shell (ADR 0008): Tauri 2.12, pinned (its config schema, IPC and permission
# model change between minors). MIT OR Apache-2.0; its own dependencies add MPL-2.0 crates with
# per-crate exceptions in deny.toml (ADR 0019). App crates only (apps/*/src-tauri).
tauri = "=2.12.5"
tauri-build = "=2.7.4"
# Rust-side plugins only: no permission of theirs reaches the webview (ADR 0008 §6). Each a release
# at least two weeks old when added. MIT OR Apache-2.0.
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
# The desktop reader's file watching (D3b): the OS's change events (FSEvents, inotify,
# ReadDirectoryChangesW). CC0-1.0
notify = { version = "=8.2.1", default-features = false, features = ["macos_fsevent"] }
# A file's identity (inode, or Windows' file index), so a replaced file reads as changed. MIT OR Apache-2.0
file-id = "=0.2.3"
# The desktop reader's OS recent lists (laminapdf-desktop-os, D3b), at the versions Tauri already uses: AppKit's
# NSDocumentController (MIT), Windows' Shell and Jump List (MIT OR Apache-2.0), GTK's
# RecentManager (MIT).
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
windows = { version = "=0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
gtk = { version = "=0.18.2", default-features = false }
# The desktop end-to-end tests' plugins (D2e), only in `laminapdf-desktop`'s `e2e` builds: the
# test API (execute, logs) and the WebDriver server inside the app.
tauri-plugin-wdio = "=1.5.1"            # MIT OR Apache-2.0
tauri-plugin-wdio-webdriver = "=1.5.1"  # MIT
# Structured logs in the app crates (tauri-plugin-log routes `log` and these). MIT
tracing = { version = "=0.1.44", default-features = false, features = ["std", "log"] }
# The laminapdf CLI (ADR 0031): argument parsing, colour that respects NO_COLOR, JSON Schemas of its reports.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "color"] }
anstream = { version = "1.0.0", default-features = false, features = ["auto"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
# Its shell completions and man pages (MIT OR Apache-2.0), and the progress bar of a batch (MIT).
clap_complete = { version = "4.6.11", default-features = false }
clap_mangen = { version = "0.3.3", default-features = false }
indicatif = { version = "0.18.6", default-features = false }
# `laminapdf mcp` (L4c, ADR 0031 §9): the MCP SDK, pinned (MCP revises often), and the runtime it needs.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time"] }
# JSON Schema 2020-12 validation, for xtask (`gen codes` validates fixtures/codes.json against
# fixtures/codes.schema.json) and tests (errors against the generated laminapdf.error/1 schema):
# never in a library. 0.6.1 (2025-01). MIT OR Apache-2.0 (ahash, base64, idna, url, once_cell,
# regex: MIT OR Apache-2.0; appendlist, fluent-uri: MIT; borrow-or-share: MIT-0, a deny.toml
# exception; ICU4X via idna: Unicode-3.0). Chosen
# over `jsonschema` for its smaller graph and no network resolver.
boon = "0.6.1"
# TypeScript declarations for serde types (ADR 0002), only behind laminapdf-ops' optional `tsify`
# feature (off by default, so core builds never see it; laminapdf-wasm enables it in B6a). tsify
# needs `js` or `json`; `js` (serde-wasm-bindgen) is ADR 0002's. laminapdf-wasm uses only the declarations:
# its records cross as JSON (ADR 0016 §7), so the conversion code is never linked.
# MIT OR Apache-2.0
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
# The Tsify derive expands to wasm-bindgen glue, so the crate deriving it names wasm-bindgen too.
# Edge-only (xtask portability): reachable from a core crate only through that optional feature.
# MIT OR Apache-2.0
wasm-bindgen = { version = "0.2.129", default-features = false }
# laminapdf-wasm's JS values (objects, Uint8Array, JSON). Records cross as JSON through serde_json,
# not serde-wasm-bindgen (ADR 0016 §7). Edge-only. MIT OR Apache-2.0
js-sys = { version = "0.3.106", default-features = false, features = ["std"] }
# laminapdf-wasm's tests in a wasm runtime (Node), dev-dependency only. MIT OR Apache-2.0
wasm-bindgen-test = { version = "0.3", default-features = false, features = ["std"] }
# Property tests (ADR 0018 tier 5), dev-dependency only; `std` without the fork/timeout runner
# (which needs processes and temp files). MIT OR Apache-2.0
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Reading deny.toml and rust-toolchain.toml in xtask. MIT OR Apache-2.0
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
# Benchmarks only (`benches/`, run nightly by `cargo xtask bench`; ADR 0018 tier 11), never a
# library dependency. No default features: no rayon and no plotters backend (criterion-plot, a
# non-optional dependency, still builds but draws nothing). Apache-2.0 OR MIT
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Brotli sizes in `cargo xtask size` (xtask only). No default features: compression only, no
# SIMD. BSD-3-Clause AND MIT (alloc-no-stdlib, alloc-stdlib, brotli-decompressor: BSD-3-Clause OR MIT)
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
# Markdown links and headings for `cargo xtask docs-links`, and laminapdf-build's `markdown`
# feature (ADR 0032 §5–§6); no default features (they add HTML output and a CLI). MIT
# (dependencies bitflags, memchr, unicase: MIT OR Apache-2.0)
pulldown-cmark = { version = "0.13.6", default-features = false }
# Unicode general categories for GitHub's heading slugs (marks such as U+0301 and the Devanagari
# virama are kept; std has no category API). MIT OR Apache-2.0
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[workspace.lints.rust]
unsafe_code = "deny"            # core crates additionally #![forbid(unsafe_code)]
missing_docs = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"        # `pub` in a private module is `pub(crate)`: the public surface is only what lib.rs exports

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }   # enforced: CI's -D warnings turns these into errors
must_use_candidate = "allow"    # pedantic allow-list: each entry says why (here: #[must_use] on every getter is noise)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
redundant_clone = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"                   # unfinished code never merges; keep todo!/unimplemented! on your branch
unimplemented = "deny"
allow_attributes = "deny"       # outer #[allow] is rejected: use #[expect] (inner #![allow] is not covered)
allow_attributes_without_reason = "deny"   # every #[allow]/#[expect] states why
cognitive_complexity = "warn"   # a nursery lint (not in `all` or `pedantic`), so it is named here; threshold: the default 25

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
# Line tables are enough for backtraces and keep debug builds and target/ smaller.
debug = "line-tables-only"

# The flate-bomb robustness test inflates ~64 MiB; keep the codec fast in debug test builds
# (the spike's setting).
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
# `cargo xtask size` compresses megabytes of WASM at brotli's highest quality; unoptimised it
# takes minutes.
[profile.dev.package.brotli]
opt-level = 3

[profile.release]
lto = "thin"

# The `laminapdf` release binaries (cargo-dist, dist-workspace.toml; todo L4d).
[profile.dist]
inherits = "release"

# `cargo xtask scaling`: release code without the release profile's link-time optimisation,
# which made the nightly link every test binary for half an hour. The tests measure ratios
# (twice the input, at most about twice the time), which optimisation level, not LTO, decides.
[profile.scaling]
inherits = "release"
lto = false

# Size-optimised profile for WebAssembly builds (`cargo xtask wasm`); the spike's settings.
[profile.wasm-release]
inherits = "release"
# "z" over "s": a 6–7 % smaller gzip for the WASM modules (ADR 0016 §5).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Keep the name section: `cargo xtask wasm` strips it with wasm-opt after keeping a named copy
# for twiggy (`cargo xtask size`).
strip = "debuginfo"
