<!doctype html>
<!--
  The portrait card: 1080 × 1350 (4:5), for LinkedIn and Threads.
  Copy it to docs/stories/<story>/visuals/<name>-portrait.html. The picture explains; words only
  label it. Keep ONE figure, .bars (a comparison chart) or .drawing (an SVG illustration or diagram),
  delete the other, and replace the example with the story's own. Every colour is a --paper-*
  token, never a hex value. Render: pnpm --filter @laminapdf/site story-image docs/stories/<story>
-->
<html data-theme="light"><head><meta charset="utf-8">
<meta name="lamina-size" content="1080x1350">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/fonts.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; }
  body { background: var(--paper-ground); color: var(--paper-text); font-family: var(--paper-font-sans);
    display: flex; align-items: center; justify-content: center; }
  .sheet { box-sizing: border-box; width: 952px; height: 1222px; padding: 64px 72px; background: var(--paper-surface);
    border-radius: 4px; box-shadow: var(--paper-shadow-page); display: flex; flex-direction: column; gap: 28px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; }
  .wordmark { font: 700 30px/1 var(--paper-font-sans); }
  .kicker { color: var(--paper-muted); font: 600 22px/1 var(--paper-font-sans); letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { margin: 0; font: 400 56px/1.1 var(--paper-font-serif); letter-spacing: -0.005em; text-wrap: balance; }
  .figure { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .foot { display: flex; justify-content: space-between; color: var(--paper-muted); font-size: 22px; }

  /* Figure 1: a bar chart. Each bar's length is its value over the largest, in --v (0 to 1). */
  .bars { gap: 34px; }
  .bar .name { font: 600 30px/1.2 var(--paper-font-sans); margin-bottom: 12px; display: flex; justify-content: space-between; }
  .bar .name .value { color: var(--paper-text-2); font-weight: 400; }
  .bar .track { height: 64px; background: var(--paper-gutter); border-radius: 4px; }
  .bar .fill { height: 100%; width: calc(var(--v) * 100%); min-width: 6px; background: var(--paper-control-border); border-radius: 4px; }
  .bar.ours .fill { background: var(--paper-accent); }
  .bar.ours .name { color: var(--paper-accent); }
  .bars .note { font: 400 26px/1.35 var(--paper-font-sans); color: var(--paper-muted); }

  /* Figure 2: an SVG drawing. Classes give token colours; draw in the viewBox's units. */
  .drawing svg { width: 100%; height: 100%; max-height: 820px; }
  .ink { fill: none; stroke: var(--paper-text); stroke-width: 3; }
  .rule { fill: none; stroke: var(--paper-hairline); stroke-width: 2; }
  .page { fill: var(--paper-field); stroke: var(--paper-control-border); stroke-width: 2; }
  .good { fill: var(--paper-accent-tint); stroke: var(--paper-accent); stroke-width: 3; }
  .bad { fill: var(--paper-danger-tint); stroke: var(--paper-danger); stroke-width: 4; }
  .label { fill: var(--paper-text-2); font: 400 28px var(--paper-font-sans); }
  .label.strong { fill: var(--paper-text); font-weight: 600; }
  .label.bad-text { fill: var(--paper-danger); font-weight: 600; }
</style></head><body><div class="sheet">
  <div class="top"><span class="wordmark">Lamina PDF</span><span class="kicker">Kicker: the topic</span></div>
  <h1>The headline: ten words at most</h1>

  <div class="figure bars">
    <div class="bar"><div class="name"><span>Them</span><span class="value">7.4&nbsp;MB</span></div>
      <div class="track"><div class="fill" style="--v: 1"></div></div></div>
    <div class="bar ours"><div class="name"><span>Lamina PDF</span><span class="value">19&nbsp;KB</span></div>
      <div class="track"><div class="fill" style="--v: 0.0026"></div></div></div>
    <div class="note">What the bars measure, in a few words.</div>
  </div>

  <div class="figure drawing">
    <!-- Example: a page cut into tiles; the one the renderer refused is marked. -->
    <svg viewBox="0 0 808 820" role="img" aria-label="A page split into tiles, one marked as refused">
      <rect class="page" x="104" y="20" width="600" height="760" rx="4"/>
      <g class="rule">
        <line x1="404" y1="20" x2="404" y2="780"/><line x1="104" y1="273" x2="704" y2="273"/><line x1="104" y1="526" x2="704" y2="526"/>
      </g>
      <rect class="good" x="104" y="20" width="300" height="253"/>
      <rect class="bad" x="404" y="273" width="300" height="253"/>
      <text class="label bad-text" x="554" y="408" text-anchor="middle">refused</text>
      <text class="label" x="404" y="815" text-anchor="middle">One short caption under the drawing</text>
    </svg>
  </div>

  <div class="foot"><span>laminapdf.com</span><span>Source: where the fact comes from</span></div>
</div></body></html>
