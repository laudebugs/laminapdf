[package]
name = "lamina-flow-layout"
version = "0.0.0"
edition = "2024"
description = "Research spike: flowing layout, our own engine over Surface or Typst (T4a, ADR 0032)"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: spikes are outside the root workspace (docs/guidelines/code-organization.md §12).
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "flow-layout"
path = "src/main.rs"
required-features = ["own", "typst", "frames"]

[features]
default = ["own", "typst", "frames"]
own = []
typst = ["dep:typst", "dep:typst-pdf", "dep:typst-layout"]
frames = ["typst"]

[dependencies]
laminapdf = { path = "../../crates/laminapdf", default-features = false, features = ["text"] }
laminapdf-build = { path = "../../crates/laminapdf-build", features = ["text"] }
laminapdf-text = { path = "../../crates/laminapdf-text" }
laminapdf-model = { path = "../../crates/laminapdf-model" }
laminapdf-cos = { path = "../../crates/laminapdf-cos" }
# Typst 0.15.1, the current release on 2026-11-08.
typst = { version = "=0.15.1", optional = true }
typst-pdf = { version = "=0.15.1", optional = true }
typst-layout = { version = "=0.15.1", optional = true }
serde_json = "1"
comemo = "=0.5.1"

# The root workspace's WASM profile, copied (T4a: measure as `cargo xtask wasm` builds).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
