[package]
name = "lamina-pdf-basics"
version = "0.1.0"
edition = "2024"
description = "Research spike: a minimal, panic-free PDF core (object model, writer, tolerant reader, content builder)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
# rlib for native/mobile consumers and integration tests, cdylib for the WASM C-ABI shim.
crate-type = ["rlib", "cdylib"]

[dependencies]
# MIT OR Zlib OR Apache-2.0
miniz_oxide = "0.9.1"
# MIT OR Apache-2.0
thiserror = "2.0.21"

[dev-dependencies]
# MIT OR Apache-2.0
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
redundant_clone = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The flate-bomb robustness test inflates ~64 MiB; keep the codec fast in debug test builds.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
