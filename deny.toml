# cargo-deny: licences, advisories, bans and sources for the Rust workspace.
# Run with `cargo xtask deny` (or `cargo deny check`); CI runs EmbarkStudios/cargo-deny-action.
# Policy: docs/guidelines/rust.md#dependencies and ADR 0019 (supply-chain and licence hygiene).

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable, unsound and yanked crates fail the check. ADR 0019 wants
# unmaintained advisories to warn, but cargo-deny >= 0.18 has no warn level for them: they fail
# too, and each accepted one goes in `ignore` with its ID, a reason and a review date:
#   { id = "RUSTSEC-YYYY-NNNN", reason = "…; review 2027-01" }
yanked = "deny"
ignore = [
    # Tauri's tree (apps/desktop, ADR 0008), Linux builds only. Unmaintained, no vulnerability.
    # zbus 5 through tauri-plugin-opener 2.7.2: zvariant, zvariant_derive and zbus_names were merged
    # into zbus 6, which only opener 3.0's alphas use.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 via tauri-plugin-opener; gone with opener 3 (zbus 6); review 2027-02" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 via tauri-plugin-opener; gone with opener 3 (zbus 6); review 2027-02" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 via tauri-plugin-opener; gone with opener 3 (zbus 6); review 2027-02" },
    # The GTK 3 bindings (gtk-rs 0.18) that Tauri's Linux runtime uses, through glib-macros.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros 0.18 via Tauri's GTK 3 runtime (build time only); review 2027-02" },
]

[licenses]
# Permissive licences only (ADR 0019). No GPL, LGPL or AGPL in any form; MPL-2.0 and other weak
# copyleft only as a per-crate exception with a written reason. OFL-1.1 only for font-data crates,
# as a per-crate exception. This list is also the npm allow-list: `cargo xtask npm-licenses` reads it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The allow-list is policy, not an inventory: licences nobody uses yet are fine.
unused-allowed-license = "allow"
# UniFFI (Swift/Kotlin bindings, ADR 0002 §5, ADR 0029): MPL-2.0, allowed for these crates only
# (owner decision 2026-10-30). MPL-2.0 is file-level copyleft: lamina stays MIT OR Apache-2.0;
# the unmodified UniFFI sources stay available on crates.io and the MPL-2.0 text ships with the
# mobile SDK. Used by spikes/lamina-ffi now and crates/laminapdf-ffi (L6b) later.
exceptions = [
    { name = "uniffi", allow = ["MPL-2.0"] },
    { name = "uniffi_bindgen", allow = ["MPL-2.0"] },
    { name = "uniffi_core", allow = ["MPL-2.0"] },
    { name = "uniffi_internal_macros", allow = ["MPL-2.0"] },
    { name = "uniffi_macros", allow = ["MPL-2.0"] },
    { name = "uniffi_meta", allow = ["MPL-2.0"] },
    { name = "uniffi_pipeline", allow = ["MPL-2.0"] },
    { name = "uniffi_udl", allow = ["MPL-2.0"] },
    # Tauri 2 (the desktop shell, ADR 0008): MPL-2.0 crates that Tauri itself depends on, allowed
    # for these crates only (owner decision 2026-11-09, found by the desktop-ipc spike). selectors,
    # cssparser, cssparser-macros and dtoa-short come through dom_query in tauri-utils, which
    # parses the app's HTML to inject the CSP; option-ext comes through dirs in tauri and wry.
    # Every Tauri 2 app has them. As with UniFFI, lamina stays MIT OR Apache-2.0; the sources are
    # unmodified on crates.io, and the desktop app's third-party notices will carry the MPL-2.0 text (D2a).
    { name = "selectors", allow = ["MPL-2.0"] },
    { name = "cssparser", allow = ["MPL-2.0"] },
    { name = "cssparser-macros", allow = ["MPL-2.0"] },
    { name = "dtoa-short", allow = ["MPL-2.0"] },
    { name = "option-ext", allow = ["MPL-2.0"] },
    # MIT-0 (MIT without the notice condition; OSI-approved, more permissive than MIT). Reached
    # only through boon → fluent-uri, the JSON Schema validator of xtask and the façade's tests
    # (L1b): never in a library build. Every 2020-12 validator in Rust (boon, jsonschema) uses
    # fluent-uri.
    { name = "borrow-or-share", allow = ["MIT-0"] },
]

[licenses.private]
# Our own unpublished crates (publish = false) are MIT OR Apache-2.0 by workspace inheritance.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; allowed because every member is publish = false.
allow-wildcard-paths = true
highlight = "all"
# Belt and braces: AGPL PDF engines and their bindings, whatever licence metadata claims.
deny = [
    { name = "mupdf", reason = "AGPL-3.0 (ADR 0001, ADR 0019)" },
    { name = "mupdf-sys", reason = "AGPL-3.0 (ADR 0001, ADR 0019)" },
]
skip = []

[sources]
# crates.io only: no git dependencies or other registries without an explicit entry here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
