# cargo-deny: licences, advisories, bans and sources for the Rust workspace.
# Run with `cargo xtask deny` (or `cargo deny check`); CI runs EmbarkStudios/cargo-deny-action.
# Policy: docs/guidelines/rust.md#dependencies and ADR 0019 (supply-chain and licence hygiene).

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable, unmaintained, unsound and yanked crates fail the check.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. No GPL, LGPL or AGPL (copyleft) in anything we ship.
# Keep in sync with ALLOWED in tools/xtask/src/licenses.rs (the npm check).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
]
confidence-threshold = 0.93
# The allow-list is policy, not an inventory: licences nobody uses yet are fine.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Our own unpublished crates (publish = false) are MIT OR Apache-2.0 by workspace inheritance.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; allowed because every member is publish = false.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []

[sources]
# crates.io only: no git dependencies or other registries without an explicit entry here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
