<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: add a signature image, type</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&amp;family=Newsreader:ital,opsz,wght@1,6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5C63}a:hover{color:#16454B}
button,input,textarea{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECE7DE; font-family: 'Source Sans 3', system-ui, sans-serif; color: #1F1D1A">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: #F7F4EE; border-bottom: 1px solid #E4DED3; box-sizing: border-box">
    <button aria-label="Back to files" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.2">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 500">Q3 Board Report</span>
      <span style="font-size: 12px; color: #6B645A">Page 24 · Board approval</span>
    </div>
    <button aria-label="More options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5.5" cy="12" r="0.9"></circle><circle cx="12" cy="12" r="0.9"></circle><circle cx="18.5" cy="12" r="0.9"></circle></svg></button>
  </header>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(31,29,26,0.30)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="ps-t" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FBF9F5; border-top: 1px solid #E4DED3; border-radius: 12px 12px 0 0; box-shadow: 0 -8px 28px rgba(60,48,30,0.12); display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; justify-content: center">
      <button aria-label="Resize sheet" style="width: 64px; height: 44px; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; box-sizing: border-box; border: 0; background: transparent"><span style="width: 36px; height: 5px; border-radius: 3px; background: #8A8174"></span></button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: -18px; padding: 0 8px 4px 20px">
      <h2 id="ps-t" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 500">Add a signature image</h2>
      <button aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; color: #4A453E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <p style="margin: 0; padding: 0 20px 12px; font-size: 14px; color: #4A453E">Puts a picture of your signature on the page; it doesn’t prove who signed.</p>

    <div role="tablist" aria-label="How to make the signature" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 12px; border-bottom: 1px solid #E4DED3">
      <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; font-size: 14px; color: #6B645A; border-bottom: 2px solid transparent">Draw</button>
      <button role="tab" aria-selected="true" style="height: 44px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: #1F1D1A; border-bottom: 2px solid {{accent}}">Type</button>
      <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; font-size: 14px; color: #6B645A; border-bottom: 2px solid transparent">Photo</button>
      <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; font-size: 14px; color: #6B645A; border-bottom: 2px solid transparent">Saved</button>
    </div>

    <div role="tabpanel" aria-label="Type" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px; overflow: auto">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="nm" style="font-size: 12px; font-weight: 600; color: #4A453E">Your name</label>
        <input id="nm" value="Amara Okafor" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A8174; border-radius: 4px; background: #FFFFFF; font-size: 16px; outline: 2px solid {{accent}}; outline-offset: 1px">
      </div>
      <div role="radiogroup" aria-label="Style" style="display: flex; flex-direction: column; gap: 8px">
        <span aria-hidden="true" style="font-size: 12px; font-weight: 600; color: #4A453E">Style</span>
        <button role="radio" aria-checked="true" style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border: 1px solid {{accent}}; background: {{accentTint}}; border-radius: 4px; text-align: left">
          <span style="font-family: 'Caveat', cursive; font-size: 32px; font-weight: 500; color: #1F2F5C">Amara Okafor</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true"><path d="M6 12.5l4 4 8-9"></path></svg>
        </button>
        <button role="radio" aria-checked="false" style="min-height: 64px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 4px; text-align: left">
          <span style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 26px; color: #1F2F5C">Amara Okafor</span>
        </button>
        <button role="radio" aria-checked="false" style="min-height: 64px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 4px; text-align: left">
          <span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; letter-spacing: 0.04em; color: #1F2F5C">A. Okafor</span>
        </button>
      </div>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px">
        <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: {{accent}}">Keep in my signatures on this device
      </label>
      <div role="note" style="display: flex; gap: 10px; padding: 10px 12px; background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 4px; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A453E" stroke-width="1.5" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M4 17c3-6 5-9 7-9s1 6 3 6 3-4 6-6"></path></svg>
        <span><strong style="font-weight: 600">Not a digital signature.</strong> To prove who signed, choose Sign with a certificate in the Sign sheet.</span>
      </div>
    </div>

    <div style="padding: 12px 20px 34px; border-top: 1px solid #E4DED3; display: flex; flex-direction: column; gap: 8px">
      <button style="height: 48px; border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; border-radius: 6px; font-size: 16px; font-weight: 600">Use this signature</button>
    </div>
  </section>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #1F1D1A; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C63","options":["#1F5C63","#2D4A6B","#3E4A3C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#1F5C63';
    function mix(hex, base, t) {
      var p = function (h, i) { return parseInt(h.replace('#', '').substr(i, 2), 16); };
      var out = '#';
      for (var i = 0; i < 6; i += 2) {
        var v = Math.round(p(hex, i) * t + p(base, i) * (1 - t));
        out += (v < 16 ? '0' : '') + v.toString(16);
      }
      return out;
    }
    return { accent: accent, accentTint: mix(accent, '#FBF9F5', 0.12) };
  }
}
</script>
</body>
</html>
