<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lamina desktop, settings, appearance section</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0;background:#DCD6CB}
a{color:#1F5C63}a:hover{color:#16454B}
button,input,textarea,select{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; box-sizing: border-box; padding: 40px 16px; background: #DCD6CB; font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.4; color: #1F1D1A">
<div style="width: 100%; max-width: 880px; min-height: 640px; display: flex; flex-direction: column; background: #F7F4EE; border: 1px solid #C9C2B6; border-radius: 10px; overflow: hidden; box-sizing: border-box; box-shadow: 0 18px 48px rgba(31,29,26,0.22)">

  <div style="height: 30px; flex: 0 0 auto; display: flex; align-items: center; padding: 0 12px; background: #EFEBE3; border-bottom: 1px solid #E0D9CD; position: relative">
    <div aria-hidden="true" style="display: flex; gap: 8px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #EC6A5E; border: 0.5px solid #D2574C"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #F4BF4F; border: 0.5px solid #D9A63A"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #61C554; border: 0.5px solid #4CAA40"></span>
    </div>
    <div style="position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; color: #3A3631; pointer-events: none">Settings</div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap">
    <nav aria-label="Settings sections" style="flex: 0 0 200px; box-sizing: border-box; border-right: 1px solid #E4DED3; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; color: #1F1D1A; text-decoration: none">General</a>
      <a href="#" aria-current="page" style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; color: #1F5C63; background: #E1E6E3; font-weight: 600; text-decoration: none">Appearance</a>
      <a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; color: #1F1D1A; text-decoration: none">Updates</a>
      <a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; color: #1F1D1A; text-decoration: none">Privacy</a>
      <a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; color: #1F1D1A; text-decoration: none">Shortcuts</a>
      <a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; color: #1F1D1A; text-decoration: none">Advanced</a>
      <a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; color: #1F1D1A; text-decoration: none">About</a>
    </nav>

    <main style="flex: 999 1 480px; min-width: 0; box-sizing: border-box; background: #FBF9F5; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 24px">
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 24px; font-weight: 500">Appearance</h1>

      <section aria-labelledby="a-theme" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 id="a-theme" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 18px; line-height: 24px; font-weight: 500">Theme</h2>
          <span style="font-size: 12px; color: #6B645A">Colours of lamina’s own windows and panels.</span>
        </div>
        <div role="group" aria-labelledby="a-theme" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <button aria-pressed="true" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 2px solid #1F5C63; border-radius: 6px; background: #FFFFFF; text-align: left; font-size: 13px; font-weight: 600; outline: 2px solid #1F5C63; outline-offset: 2px">
            <span aria-hidden="true" style="display: flex; height: 52px; border-radius: 3px; overflow: hidden; border: 1px solid #D8D1C5"><span style="flex: 1 1 50%; background: #F7F4EE; display: flex; align-items: flex-end; justify-content: center"><span style="width: 26px; height: 34px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(60,48,30,0.12)"></span></span><span style="flex: 1 1 50%; background: #1E1D1A; display: flex; align-items: flex-end; justify-content: center"><span style="width: 26px; height: 34px; background: #FFFFFF"></span></span></span>
            Match system
          </button>
          <button aria-pressed="false" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #D8D1C5; border-radius: 6px; background: #FBF9F5; text-align: left; font-size: 13px">
            <span aria-hidden="true" style="display: flex; align-items: flex-end; justify-content: center; height: 52px; border-radius: 3px; background: #F7F4EE; border: 1px solid #D8D1C5"><span style="width: 26px; height: 34px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(60,48,30,0.12)"></span></span>
            Light
          </button>
          <button aria-pressed="false" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #D8D1C5; border-radius: 6px; background: #FBF9F5; text-align: left; font-size: 13px">
            <span aria-hidden="true" style="display: flex; align-items: flex-end; justify-content: center; height: 52px; border-radius: 3px; background: #1E1D1A; border: 1px solid #D8D1C5"><span style="width: 26px; height: 34px; background: #FFFFFF"></span></span>
            Dark
          </button>
          <button aria-pressed="false" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #D8D1C5; border-radius: 6px; background: #FBF9F5; text-align: left; font-size: 13px">
            <span aria-hidden="true" style="display: flex; align-items: flex-end; justify-content: center; height: 52px; border-radius: 3px; background: #000000; border: 1px solid #D8D1C5"><span style="width: 26px; height: 34px; background: #000000; border: 1px solid #FFFFFF; box-sizing: border-box"></span></span>
            High contrast
          </button>
        </div>
      </section>

      <section aria-labelledby="a-page" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 id="a-page" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 18px; line-height: 24px; font-weight: 500">Page appearance</h2>
          <span style="font-size: 12px; color: #6B645A">How pages look on screen. The file is not changed; photos and comment colours stay as they are.</span>
        </div>
        <div role="group" aria-labelledby="a-page" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <button aria-pressed="true" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 2px solid #1F5C63; border-radius: 6px; background: #FFFFFF; text-align: left; font-size: 13px; font-weight: 600">
            <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 3px; background: #FFFFFF; border: 1px solid #D8D1C5; color: #262421; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 400">Aa</span>
            Original
          </button>
          <button aria-pressed="false" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #D8D1C5; border-radius: 6px; background: #FBF9F5; text-align: left; font-size: 13px">
            <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 3px; background: #F4ECD8; color: #3B2F20; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px">Aa</span>
            Sepia
          </button>
          <button aria-pressed="false" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #D8D1C5; border-radius: 6px; background: #FBF9F5; text-align: left; font-size: 13px">
            <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 3px; background: #22211F; color: #E6E1D8; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px">Aa</span>
            Dark
          </button>
          <button aria-pressed="false" style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #D8D1C5; border-radius: 6px; background: #FBF9F5; text-align: left; font-size: 13px">
            <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 3px; background: #000000; color: #FFFFFF; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 600">Aa</span>
            High contrast
          </button>
        </div>
      </section>

      <section aria-labelledby="a-open" style="display: flex; flex-direction: column">
        <h2 id="a-open" style="margin: 0 0 4px; font-family: 'Newsreader', Georgia, serif; font-size: 18px; line-height: 24px; font-weight: 500">When a document opens</h2>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 12px 0">
          <label for="zoom">Zoom</label>
          <div style="position: relative; flex: 0 0 auto">
            <select id="zoom" style="width: 180px; height: 32px; box-sizing: border-box; padding: 0 30px 0 10px; border: 1px solid #8A8174; border-radius: 4px; background: #FFFFFF; appearance: none"><option>Fit width</option><option>Fit page</option><option>Actual size</option><option>Last used for the file</option></select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A453E" stroke-width="1.5" aria-hidden="true" style="position: absolute; right: 8px; top: 8px; pointer-events: none"><path d="M7 10l5 5 5-5"></path></svg>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 12px 0; border-top: 1px solid #E4DED3">
          <label for="layout">Page layout</label>
          <div style="position: relative; flex: 0 0 auto">
            <select id="layout" style="width: 180px; height: 32px; box-sizing: border-box; padding: 0 30px 0 10px; border: 1px solid #8A8174; border-radius: 4px; background: #FFFFFF; appearance: none"><option>Continuous</option><option>Single page</option><option>Two pages</option></select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A453E" stroke-width="1.5" aria-hidden="true" style="position: absolute; right: 8px; top: 8px; pointer-events: none"><path d="M7 10l5 5 5-5"></path></svg>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 12px 0; border-top: 1px solid #E4DED3">
          <span id="sw-rail">Show the sidebar</span>
          <button role="switch" aria-checked="true" aria-labelledby="sw-rail" style="flex: 0 0 auto; width: 32px; height: 18px; padding: 0; border: 1px solid #1F5C63; border-radius: 9px; background: #1F5C63; position: relative"><span style="position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span></button>
        </div>
      </section>
    </main>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
