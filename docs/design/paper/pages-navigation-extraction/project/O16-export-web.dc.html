<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export in progress, web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0;background:#F7F4EE}
a{color:#1F5C63}a:hover{color:#16454B}
button,input,textarea,select{font:inherit;color:inherit}
</style>
</helmet>
<div style="position: relative; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; background: #F7F4EE; font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.4; color: #1F1D1A">

  <header style="min-height: 40px; flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 0 16px; border-bottom: 1px solid #E4DED3">
    <div style="display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0">
      <button aria-label="Sidebar" aria-pressed="true" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #4A453E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect><path d="M9 4.5v15"></path></svg></button>
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 16px; font-weight: 500; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Q3-board-report.pdf</span>
      <span style="font-size: 12px; color: #6B645A; white-space: nowrap; font-variant-numeric: tabular-nums">No unsaved changes</span>
      <span aria-hidden="true" style="width: 1px; height: 18px; flex: 0 0 auto; background: #E4DED3; margin: 0 2px"></span>
      <div style="display: flex; align-items: center; gap: 2px">
        <button aria-label="Undo" disabled style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #A39C91"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 7L4.5 11.5 9 16"></path><path d="M4.5 11.5H15a4.5 4.5 0 0 1 0 9h-3"></path></svg></button>
        <button aria-label="Redo" disabled style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #A39C91"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 7l4.5 4.5L15 16"></path><path d="M19.5 11.5H9a4.5 4.5 0 0 0 0 9h3"></path></svg></button>
      </div>
    </div>
    <div role="group" aria-label="Mode" style="display: flex; align-items: stretch; gap: 22px; height: 40px">
      <button aria-pressed="true" style="height: 40px; display: flex; align-items: center; border: 0; background: transparent; padding: 2px 0 0; color: #1F1D1A; font-weight: 600; border-bottom: 2px solid {{accent}}">Read</button>
      <button aria-pressed="false" style="height: 40px; display: flex; align-items: center; border: 0; background: transparent; padding: 2px 0 0; color: #6B645A; border-bottom: 2px solid transparent">Comment</button>
      <button aria-pressed="false" style="height: 40px; display: flex; align-items: center; border: 0; background: transparent; padding: 2px 0 0; color: #6B645A; border-bottom: 2px solid transparent">Fill &amp; Sign</button>
      <button aria-pressed="false" style="height: 40px; display: flex; align-items: center; border: 0; background: transparent; padding: 2px 0 0; color: #6B645A; border-bottom: 2px solid transparent">Organise</button>
      <button aria-pressed="false" style="height: 40px; display: flex; align-items: center; border: 0; background: transparent; padding: 2px 0 0; color: #6B645A; border-bottom: 2px solid transparent">Edit</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex: 1 1 220px">
      <div style="display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums">
        <label for="pg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Page</label>
        <input id="pg" value="3" style="width: 30px; height: 24px; box-sizing: border-box; text-align: center; border: 1px solid #8A8174; border-radius: 4px; background: #FFFFFF; font-variant-numeric: tabular-nums">
        <span style="color: #6B645A; white-space: nowrap; flex-shrink: 0">/ 24</span>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums">
        <button aria-label="Zoom out" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #4A453E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
        <span style="min-width: 40px; text-align: center">100%</span>
        <button aria-label="Zoom in" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #4A453E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg></button>
      </div>
      <button aria-label="Find in document" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #4A453E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg></button>
      <button aria-label="View settings" aria-haspopup="dialog" aria-expanded="false" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #4A453E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle><path d="M12 4.5v15M12 8.5h5.5M12 12h7.5M12 15.5h5.5"></path></svg></button>
      <button aria-pressed="false" style="height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid transparent; background: transparent; color: #4A453E; border-radius: 4px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 6.5c-2-1.3-4.5-2-8-2v13c3.5 0 6 .7 8 2 2-1.3 4.5-2 8-2v-13c-3.5 0-6 .7-8 2z"></path><path d="M12 6.5v13"></path></svg>Reader</button>
      <button style="height: 26px; flex-shrink: 0; white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border: 1px solid #E4DED3; background: #FBF9F5; border-radius: 4px; color: #6B645A; font-size: 13px"><span>Commands</span><span style="font-size: 11px; padding: 1px 5px; border: 1px solid #D8D1C5; border-radius: 3px; white-space: nowrap; color: #4A453E; background: #FFFFFF">Ctrl K</span></button>
      <button aria-label="More actions" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #4A453E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5.5" cy="12" r="0.9"></circle><circle cx="12" cy="12" r="0.9"></circle><circle cx="18.5" cy="12" r="0.9"></circle></svg></button>
    </div>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; display: flex">
    <aside aria-label="Sidebar" style="flex: 0 0 220px; min-width: 0; box-sizing: border-box; border-right: 1px solid #E4DED3; background: #F7F4EE; display: flex; flex-direction: column; overflow: hidden">
      <div role="tablist" aria-label="Sidebar" style="display: flex; gap: 16px; padding: 14px 18px 0; border-bottom: 1px solid #E4DED3">
        <button role="tab" aria-selected="true" style="border: 0; background: transparent; padding: 0 0 8px; font-size: 13px; font-weight: 600; color: #1F1D1A; border-bottom: 2px solid {{accent}}">Pages</button>
        <button role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 0 0 8px; font-size: 13px; color: #6B645A; border-bottom: 2px solid transparent">Outline</button>
        <button role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 0 0 8px; font-size: 13px; color: #6B645A; border-bottom: 2px solid transparent">Attachments</button>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 22px 0; overflow: hidden">
        <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="4">
          <span style="display: flex; flex-direction: column; align-items: center; gap: 8px">
            <span style="{{t.frame}}"></span>
            <span style="{{t.num}}">{{t.n}}</span>
          </span>
        </sc-for>
      </div>
    </aside>
    <main style="flex: 999 1 560px; min-width: 0; background: #ECE7DE; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px; box-sizing: border-box">
      <div style="width: 100%; max-width: 612px; min-height: 790px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(60,48,30,0.08), 0 8px 28px rgba(60,48,30,0.10)"></div>
    </main>
  </div>

  <footer style="min-height: 28px; flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding: 0 16px; border-top: 1px solid #E4DED3; font-size: 12px; color: #6B645A">
    <button style="min-height: 24px; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 0 4px; font-size: 12px; color: #6B645A"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" aria-hidden="true"><path d="M12 3.5l7 2.5v5.5c0 4.3-3 7.6-7 9-4-1.4-7-4.7-7-9V6z"></path><path d="M9 12l2.2 2.2L15.5 10"></path></svg><span style="color: #1F1D1A; font-variant-numeric: tabular-nums">0 network requests for this document</span><span>· Offline-safe: nothing uploaded</span></button>
    <span style="font-variant-numeric: tabular-nums">Page 3 of 24</span>
  </footer>

  <div style="position: absolute; inset: 0; background: rgba(31,29,26,0.30); display: flex; justify-content: center; align-items: flex-start; padding: 140px 16px 24px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="xp-t" aria-describedby="xp-d" style="width: 100%; max-width: 440px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #FBF9F5; border: 1px solid #D8D1C5; border-radius: 6px; box-shadow: 0 18px 48px rgba(31,29,26,0.22)">
      <h2 id="xp-t" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 500; line-height: 1.2">Exporting 24 pages as PNG</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="xp-l" aria-live="polite" style="font-size: 12px; color: #6B645A; font-variant-numeric: tabular-nums">15 of 24 pages · 62%</span>
        <div role="progressbar" aria-labelledby="xp-l" aria-valuemin="0" aria-valuemax="24" aria-valuenow="15" style="height: 4px; border-radius: 2px; background: #E4DED3; overflow: hidden"><div style="width: 62%; height: 4px; background: {{accent}}"></div></div>
      </div>
      <p id="xp-d" style="margin: 0">Pages are drawn on this device and packed into <span style="font-weight: 600">Q3-board-report-pages.zip</span>, which your browser downloads when it’s ready. Nothing is uploaded.</p>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button style="height: 32px; padding: 0 16px; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 4px; outline: 2px solid {{accent}}; outline-offset: 2px">Cancel export</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C63","options":["#1F5C63","#2D4A6B","#5B3B6B","#495533"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = String(this.props.accent ?? '#1F5C63').toUpperCase();
    var thumbs = [1, 2, 3, 4].map(function (n) {
      var cur = n === 3;
      return {
        n: n,
        frame: 'display: block; width: 116px; height: 150px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(60,48,30,0.12); ' + (cur ? 'outline: 2px solid ' + accent + '; outline-offset: 3px;' : 'outline: 1px solid #E4DED3;'),
        num: 'font-size: 12px; font-variant-numeric: tabular-nums; ' + (cur ? 'color: #1F1D1A; font-weight: 600;' : 'color: #6B645A;')
      };
    });
    function mix(hex, base, t) {
      var p = function (h, i) { return parseInt(h.replace('#', '').substr(i, 2), 16); };
      var out = '#';
      for (var i = 0; i < 6; i += 2) {
        var v = Math.round(p(hex, i) * t + p(base, i) * (1 - t));
        out += (v < 16 ? '0' : '') + v.toString(16);
      }
      return out;
    }
    var accentTint = mix(accent, '#FBF9F5', 0.12), selTint = mix(accent, '#FFFFFF', 0.22), fieldTint = mix(accent, '#FFFFFF', 0.08);
    var accentStrong = ({ '#1F5C63': '#16454B', '#2D4A6B': '#1A3757', '#5B3B6B': '#472856', '#495533': '#35401F' })[accent] || accent;
    return { accent: accent, thumbs: thumbs };
  }
}
</script>
</body>
</html>
