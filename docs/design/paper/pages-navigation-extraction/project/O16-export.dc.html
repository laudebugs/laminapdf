<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C63","options":["#1F5C63","#2D4A6B","#5B3B6B","#495533"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#1F5C63';
    function mix(hex, base, t) {
      var p = function (h, i) { return parseInt(h.replace('#', '').substr(i, 2), 16); };
      var out = '#';
      for (var i = 0; i < 6; i += 2) {
        var v = Math.round(p(hex, i) * t + p(base, i) * (1 - t));
        out += (v < 16 ? '0' : '') + v.toString(16);
      }
      return out;
    }
    var accentTint = mix(accent, '#FBF9F5', 0.12), selTint = mix(accent, '#FFFFFF', 0.22), fieldTint = mix(accent, '#FFFFFF', 0.08);
    var accentStrong = ({ '#1F5C63': '#16454B', '#2D4A6B': '#1A3757', '#5B3B6B': '#472856', '#495533': '#35401F' })[accent] || accent;
    return { accent: accent, accentTint: accentTint };
  }
}
</script>
