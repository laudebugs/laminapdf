<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lamina, downloading a whole file</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0;background:#F7F4EE}
a{color:#1F5C63}a:hover{color:#16454B}
button,input,textarea{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F7F4EE; color: #1F1D1A; font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.4">

  <header style="min-height: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 0 16px; border-bottom: 1px solid #E4DED3; background: #F7F4EE">
    <div style="display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 18px; font-weight: 500">lamina</span>
      <span aria-hidden="true" style="width: 1px; height: 18px; background: #E4DED3"></span>
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind-asset-survey-2026.pdf</span>
      <span style="font-size: 12px; color: #6B645A; white-space: nowrap">Downloading…</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex: 1 1 220px">
      <button style="height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border: 1px solid #E4DED3; background: #FBF9F5; border-radius: 4px; color: #6B645A; font-size: 13px"><span>Commands</span><span style="font-size: 11px; padding: 1px 5px; border: 1px solid #D8D1C5; border-radius: 3px; color: #4A453E; background: #FFFFFF">Ctrl K</span></button>
      <button aria-label="More actions" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 4px; color: #4A453E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5.5" cy="12" r="0.9"></circle><circle cx="12" cy="12" r="0.9"></circle><circle cx="18.5" cy="12" r="0.9"></circle></svg></button>
    </div>
  </header>

  <main style="flex: 1 1 auto; background: #ECE7DE; display: flex; justify-content: center; align-items: flex-start; padding: 120px 16px 48px; box-sizing: border-box">
    <section aria-labelledby="dl-t" style="width: 100%; max-width: 440px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #FBF9F5; border: 1px solid #D8D1C5; border-radius: 6px">
      <h1 id="dl-t" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.2; font-weight: 500">Downloading the whole file</h1>
      <p style="margin: 0">files.example.org can’t send parts of a file, so lamina needs all of it before it can show the first page. Larger files take longer.</p>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #6B645A; font-variant-numeric: tabular-nums">
          <span id="dl-l">29.8 of 48.0 MB</span><span>62%</span>
        </div>
        <div role="progressbar" aria-labelledby="dl-l" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" style="height: 4px; border-radius: 2px; background: #E4DED3; overflow: hidden">
          <span style="display: block; width: 62%; height: 4px; background: #1F5C63"></span>
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button style="height: 32px; padding: 0 16px; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 4px; outline: 2px solid #1F5C63; outline-offset: 2px">Cancel</button>
      </div>
    </section>
  </main>

  <footer style="min-height: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding: 0 16px; border-top: 1px solid #E4DED3; background: #F7F4EE; font-size: 12px; color: #6B645A">
    <button style="min-height: 24px; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 0 4px; font-size: 12px; color: #6B645A">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1F5C63" stroke-width="1.5" aria-hidden="true"><path d="M12 3.5l7 2.5v5.5c0 4.3-3 7.6-7 9-4-1.4-7-4.7-7-9V6z"></path><path d="M9 12l2.2 2.2L15.5 10"></path></svg>
      <span style="color: #1F1D1A; font-variant-numeric: tabular-nums">2 network requests for this document</span>
      <span>· to files.example.org only</span>
    </button>
    <span>Opening</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
