<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lamina phone, password required</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5C63}a:hover{color:#16454B}
button,input,textarea{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECE7DE; font-family: 'Source Sans 3', system-ui, sans-serif; color: #1F1D1A; font-size: 14px; line-height: 1.4">

  <div aria-hidden="true">
    <header style="position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: #F7F4EE; border-bottom: 1px solid #E4DED3; box-sizing: border-box">
      <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></span>
      <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.2">
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 500">Q3-board-report.pdf</span>
        <span style="font-size: 12px; color: #6B645A">Locked</span>
      </div>
      <span style="width: 44px; height: 44px"></span>
    </header>
    <div style="position: absolute; left: 16px; top: 72px; width: 358px; height: 470px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(60,48,30,0.08), 0 6px 20px rgba(60,48,30,0.10)"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(31,29,26,0.30)"></div>

  <form role="dialog" aria-modal="true" aria-labelledby="pw-t" aria-describedby="pw-d" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FBF9F5; border-top: 1px solid #E4DED3; border-radius: 12px 12px 0 0; box-shadow: 0 -8px 28px rgba(60,48,30,0.12); display: flex; flex-direction: column; gap: 16px; padding: 28px 20px 40px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9" rx="1.5"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg>
      <h2 id="pw-t" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 500; line-height: 1.2">Enter the password</h2>
    </div>
    <p id="pw-d" style="margin: 0; font-size: 15px">Q3-board-report.pdf is encrypted. Enter its password to show the pages.</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="pw" style="font-size: 13px; font-weight: 600; color: #4A453E">Password</label>
      <div style="display: flex; align-items: center; height: 44px; box-sizing: border-box; border: 1px solid #8A8174; border-radius: 4px; background: #FFFFFF; outline: 2px solid {{accent}}; outline-offset: 1px">
        <input id="pw" type="password" autocomplete="current-password" aria-describedby="pw-h" value="northwind" style="flex: 1 1 auto; min-width: 0; height: 42px; box-sizing: border-box; padding: 0 12px; border: 0; outline: 0; background: transparent; font-size: 16px">
        <button type="button" aria-pressed="false" aria-label="Show password" style="height: 44px; margin: -1px -1px -1px 0; min-width: 64px; padding: 0 12px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600">Show</button>
      </div>
      <span id="pw-h" style="font-size: 13px; color: #6B645A">lamina uses it once to open the file on this phone and doesn’t save it.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 8px">
      <button type="submit" style="height: 44px; border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; border-radius: 6px; font-size: 16px; font-weight: 600">Open</button>
      <button type="button" style="height: 44px; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 6px; font-size: 16px">Cancel</button>
    </div>
  </form>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #1F1D1A; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C63","options":["#1F5C63","#2D4A6B","#5B3B6B","#495533"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#1F5C63';
    function mix(hex, base, t) {
      var p = function (h, i) { return parseInt(h.replace('#', '').substr(i, 2), 16); };
      var out = '#';
      for (var i = 0; i < 6; i += 2) {
        var v = Math.round(p(hex, i) * t + p(base, i) * (1 - t));
        out += (v < 16 ? '0' : '') + v.toString(16);
      }
      return out;
    }
    var strong = { '#1F5C63': '#16454B', '#2D4A6B': '#1A3757', '#5B3B6B': '#472856', '#495533': '#35401F' };
    return {
      accent: accent,
      accentStrong: strong[accent] || mix(accent, '#000000', 0.75),
      accentTint: mix(accent, '#FBF9F5', 0.12),
      selTint: mix(accent, '#FFFFFF', 0.22),
      fieldTint: mix(accent, '#FFFFFF', 0.08)
    };
  }
}
</script>
</body>
</html>
