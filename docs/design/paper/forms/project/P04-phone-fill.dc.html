<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lamina phone, filling a form field by field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5C63}a:hover{color:#16454B}
button,input,textarea{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECE7DE; font-family: 'Source Sans 3', system-ui, sans-serif; color: #1F1D1A">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 56px; z-index: 10; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: #F7F4EE; border-bottom: 1px solid #E4DED3; box-sizing: border-box">
    <button aria-label="Back to files" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; color: #1F1D1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.2">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">Repair request</span>
      <span style="font-size: 12px; color: #6B645A; font-variant-numeric: tabular-nums">5 of 9 required filled · 6 unsaved</span>
    </div>
    <button aria-label="More options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; color: #1F1D1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5.5" cy="12" r="0.9"></circle><circle cx="12" cy="12" r="0.9"></circle><circle cx="18.5" cy="12" r="0.9"></circle></svg></button>
  </header>

  <form aria-label="Repair request form, page 1, zoomed to the current field" style="position: absolute; left: 16px; top: 40px; width: 560px; height: 420px; box-sizing: border-box; background: #FFFFFF; box-shadow: 0 1px 2px rgba(60,48,30,0.08), 0 6px 20px rgba(60,48,30,0.10); padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; font-family: 'Source Serif 4', Georgia, serif; color: #262421">
    <h3 style="margin: 0; font-size: 21px; font-weight: 600; color: #1C1B19">2. The repair</h3>
    <div style="display: grid; grid-template-columns: 300px 220px; gap: 16px 20px; font-family: 'Source Sans 3', system-ui, sans-serif">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; color: #3A3733">Type of repair <span aria-hidden="true" style="color: #9B2335">*</span></span>
        <span style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border: 1px solid #8A8174; background: {{fieldTint}}; font-size: 16px">Damp and mould</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; color: #3A3733">Room</span>
        <span style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border: 1px solid #8A8174; background: {{fieldTint}}; font-size: 16px">Bedroom</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="m-date" style="font-size: 15px; color: #3A3733">Date you first noticed it <span aria-hidden="true" style="color: #9B2335">*</span></label>
        <input id="m-date" inputmode="numeric" aria-required="true" aria-describedby="m-hint" value="14/08/20" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #8A8174; border-radius: 0; background: #FFFFFF; font-size: 16px; color: #262421; outline: 2px solid {{accent}}; outline-offset: 1px; font-variant-numeric: tabular-nums">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; font-family: 'Source Sans 3', system-ui, sans-serif; width: 520px">
      <span style="font-size: 15px; color: #3A3733">Describe the problem <span aria-hidden="true" style="color: #9B2335">*</span></span>
      <span style="height: 96px; border: 1px solid #8A8174; background: {{fieldTint}}"></span>
    </div>
  </form>

  <div role="toolbar" aria-label="Form navigation" style="position: absolute; left: 0; right: 0; top: 468px; z-index: 40; box-sizing: border-box; padding: 8px 8px 8px 16px; display: flex; flex-direction: column; gap: 6px; background: #FBF9F5; border-top: 1px solid #E4DED3; box-shadow: 0 -8px 28px rgba(60,48,30,0.12)">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-right: 8px">
      <span style="font-size: 15px; font-weight: 600">Date you first noticed it</span>
      <span style="font-size: 13px; color: #6B645A; font-variant-numeric: tabular-nums">9 of 27</span>
    </div>
    <span id="m-hint" style="font-size: 13px; color: #4A453E">Required · Day, month, year, like 14/08/2026</span>
    <div style="display: flex; align-items: center; gap: 4px">
      <button aria-label="Previous field" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 6px; color: #1F1D1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 14l5-5 5 5"></path></svg></button>
      <button aria-label="Next field" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 6px; color: #1F1D1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg></button>
      <button style="height: 44px; padding: 0 12px; border: 0; background: transparent; border-radius: 6px; color: {{accent}}; font-weight: 600; font-size: 15px">Next required</button>
      <span style="flex: 1 1 auto"></span>
      <button style="height: 44px; padding: 0 18px; border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; border-radius: 6px; font-weight: 600; font-size: 15px">Done</button>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 580px; bottom: 0; display: flex; align-items: center; justify-content: center; background: #E4DED3; color: #4A453E; font-size: 13px">System keyboard (number pad)</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C63","options":["#1F5C63","#2D4A6B","#3E4A3C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#1F5C63';
    function mix(hex, base, t) {
      var p = function (h, i) { return parseInt(h.replace('#', '').substr(i, 2), 16); };
      var out = '#';
      for (var i = 0; i < 6; i += 2) {
        var v = Math.round(p(hex, i) * t + p(base, i) * (1 - t));
        out += (v < 16 ? '0' : '') + v.toString(16);
      }
      return out;
    }
    return { accent: accent, fieldTint: mix(accent, '#FFFFFF', 0.08) };
  }
}
</script>
</body>
</html>
