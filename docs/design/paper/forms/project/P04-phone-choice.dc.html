<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lamina phone, choosing an option in a form</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5C63}a:hover{color:#16454B}
button,input,textarea{font:inherit;color:inherit}
label:has(input[type="radio"]:focus-visible){outline:2px solid #1F5C63;outline-offset:-2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECE7DE; font-family: 'Source Sans 3', system-ui, sans-serif; color: #1F1D1A">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 56px; z-index: 10; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: #F7F4EE; border-bottom: 1px solid #E4DED3; box-sizing: border-box">
    <button aria-label="Back to files" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; color: #1F1D1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.2">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">Repair request</span>
      <span style="font-size: 12px; color: #6B645A; font-variant-numeric: tabular-nums">4 of 9 required filled · 5 unsaved</span>
    </div>
    <button aria-label="More options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; color: #1F1D1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5.5" cy="12" r="0.9"></circle><circle cx="12" cy="12" r="0.9"></circle><circle cx="18.5" cy="12" r="0.9"></circle></svg></button>
  </header>

  <div aria-hidden="true" style="position: absolute; left: 16px; top: 40px; width: 560px; height: 420px; box-sizing: border-box; background: #FFFFFF; box-shadow: 0 1px 2px rgba(60,48,30,0.08), 0 6px 20px rgba(60,48,30,0.10); padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; font-family: 'Source Serif 4', Georgia, serif; color: #262421">
    <span style="font-size: 21px; font-weight: 600; color: #1C1B19">2. The repair</span>
    <div style="display: grid; grid-template-columns: 300px 220px; gap: 16px 20px; font-family: 'Source Sans 3', system-ui, sans-serif">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; color: #3A3733">Type of repair <span style="color: #9B2335">*</span></span>
        <span style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border: 1px solid #8A8174; background: #FFFFFF; outline: 2px solid {{accent}}; outline-offset: 1px; font-size: 16px; color: #6E6A64">Choose a type</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; color: #3A3733">Room</span>
        <span style="height: 40px; border: 1px solid #8A8174; background: {{fieldTint}}"></span>
      </div>
    </div>
  </div>

  <section role="dialog" aria-modal="true" aria-labelledby="ch-t" style="position: absolute; left: 0; right: 0; top: 404px; bottom: 0; z-index: 40; background: #FBF9F5; border-top: 1px solid #E4DED3; border-radius: 12px 12px 0 0; box-shadow: 0 -8px 28px rgba(60,48,30,0.12); display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; justify-content: center">
      <button aria-label="Resize sheet" style="width: 64px; height: 44px; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; box-sizing: border-box; border: 0; background: transparent"><span style="width: 36px; height: 5px; border-radius: 3px; background: #8A8174"></span></button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: -18px; padding: 0 8px 4px 20px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 id="ch-t" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 500">Type of repair</h2>
        <span style="font-size: 13px; color: #6B645A; font-variant-numeric: tabular-nums">Required · field 7 of 27</span>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; color: #4A453E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div role="radiogroup" aria-labelledby="ch-t" style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 4px 12px; overflow: auto">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
        <label style="{{o.row}}">
          <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><input type="radio" name="rtype" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"></sc-if><sc-if value="{{o.off}}" hint-placeholder-val="{{ true }}"><input type="radio" name="rtype" style="position: absolute; opacity: 0; width: 1px; height: 1px"></sc-if>
          <span style="flex: 1 1 auto">{{o.name}}</span>
          <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 12.5l4 4 8-9"></path></svg></sc-if>
        </label>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px 16px 30px; border-top: 1px solid #E4DED3">
      <button style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #8A8174; background: #FFFFFF; border-radius: 6px; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 14l5-5 5 5"></path></svg>Previous</button>
      <button style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; border-radius: 6px; font-size: 15px; font-weight: 600">Next<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg></button>
    </div>
  </section>
  <span aria-hidden="true" style="position: absolute; z-index: 50; left: 50%; bottom: 6px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #1F1D1A; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C63","options":["#1F5C63","#2D4A6B","#3E4A3C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#1F5C63';
    function mix(hex, base, t) {
      var p = function (h, i) { return parseInt(h.replace('#', '').substr(i, 2), 16); };
      var out = '#';
      for (var i = 0; i < 6; i += 2) {
        var v = Math.round(p(hex, i) * t + p(base, i) * (1 - t));
        out += (v < 16 ? '0' : '') + v.toString(16);
      }
      return out;
    }
    var tint = mix(accent, '#FBF9F5', 0.12);
    var names = ['Plumbing', 'Heating and hot water', 'Damp and mould', 'Electrical', 'Doors, windows and joinery', 'Something else'];
    var opts = names.map(function (n, i) {
      var on = i === 2;
      return {
        name: n, on: on, off: !on,
        row: 'display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 6px; font-size: 16px; ' + (on ? 'background: ' + tint + '; color: ' + accent + '; font-weight: 600; outline: 2px solid ' + accent + '; outline-offset: -2px;' : 'color: #1F1D1A;')
      };
    });
    return { accent: accent, fieldTint: mix(accent, '#FFFFFF', 0.08), opts: opts };
  }
}
</script>
</body>
</html>
