# The capability matrix's rows: one per operation of the feature inventory
# (docs/research/pdf/06-feature-inventory.md §3), in its order (full-editor §3, todo X2).
# `cargo xtask capabilities` turns this file and the tagged tests into README.md; never edit
# README.md by hand.
#
# Each [[op]]:
#   id        `<group>.<nn>`, stable: never renumbered, never reused. When 06 drops or splits
#             an operation, remove its row and add its ID to `retired`.
#   name      the operation exactly as in 06 §3's first column (`cargo xtask check docs`
#             checks that every 06 operation has exactly one row and every row is in 06)
#   round     the editor round that targets it (full-editor §7)
#   target    the status that round must reach: unsupported | read | write | round-trip
#             (default round-trip)
#   surfaces  the columns it targets, of core, pdf, web, desktop (default all four)
#
# Generated once from 06 §3 (X2); maintained by hand since.

version = 1
retired = []

[[group]]
id = "A"
name = "Text & typography"

[[group]]
