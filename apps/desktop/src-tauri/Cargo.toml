[package]
name = "laminapdf-desktop"
description = "Lamina PDF's desktop reader: the Tauri 2 shell around @laminapdf/ui (ADR 0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as signed installers, never on crates.io (todos D6b–D6d).
publish = false
homepage.workspace = true

# Read by `cargo xtask`: an app crate, so it may use the file system, windows and processes.
[package.metadata.laminapdf]
layer = "app"

[lib]
name = "laminapdf_desktop_lib"
# Desktop only (ADR 0008): no `staticlib`/`cdylib` for a mobile build.
crate-type = ["rlib"]

[[bin]]
name = "laminapdf-desktop"
path = "src/main.rs"

[features]
# The end-to-end tests' commands (`debug_kill_engine`) and, from D2e, the WebDriver plugin. Off in
# every release build; CI checks the release binary holds none of them (ADR 0008 §8).
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# The engine process's protocol and supervisor; never the parser or PDFium (ADR 0008 §3).
image-webp = { workspace = true }
laminapdf-desktop-protocol = { workspace = true }
# Starts each engine inside its sandbox; its lock-down half (feature `engine`) is the engine's.
laminapdf-desktop-sandbox = { workspace = true }
# The OS's recent-documents lists and Windows' app ID: the FFI lives there, not here.
laminapdf-desktop-os = { workspace = true }
# Watching open files for changes on disk, and telling a replaced file from the one opened.
file-id = { workspace = true }
notify = { workspace = true }
region = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A document's fingerprint, the key its reading position is kept under (the viewer's own scheme).
sha2 = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-wdio = { workspace = true, optional = true }
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The fake engine (`supervisor::fake`) for the engine registry's tests.
laminapdf-desktop-protocol = { workspace = true, features = ["test-support"] }
# The menus' tests read each accelerator as the menus do.
muda = { workspace = true }

[lints]
workspace = true
