# Test code may unwrap/expect/panic/index: a panic there is a test failure. See docs/guidelines/rust.md.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# Output must be byte-deterministic (ADR 0001): RandomState iteration order must never reach output.
# Use BTreeMap/BTreeSet, IndexMap/IndexSet or a fixed-seed hasher.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "random iteration order; use BTreeMap, IndexMap or a fixed hasher" },
  { path = "std::collections::HashSet", reason = "random iteration order; use BTreeSet, IndexSet or a fixed hasher" },
]

# Spec and crate names that doc_markdown would otherwise want in backticks ("..": keep the defaults).
doc-valid-idents = ["..", "PDFDocEncoding", "SASLprep", "RustCrypto", "ToUnicode", "CMap", "CMaps", "CIDFont", "CIDFonts", "TrueType", "OpenType", "PostScript", "XObject", "XObjects", "ExtGState", "DeviceGray", "DeviceRGB", "DeviceCMYK", "DeviceN", "ICCBased", "HarfBuzz", "HarfRust", "ICU4X", "ICU4C", "PDFium", "CodeQL"]

# Keep this paragraph last: tools/xtask/clippy-examples/clippy.toml copies everything above it.
# A function is at most 100 lines (docs/guidelines/maintainability.md, "Size"). 100 is clippy's
# default too; it is set here so the budget is written down and a clippy release can't move it.
too-many-lines-threshold = 100
