# cargo-dist (`dist`, pinned in tools/xtask/src/doctor.rs) for the `laminapdf` binary only (todo
# L4d, ADR 0031): its archives, checksums and Homebrew formula. Our own workflow,
# .github/workflows/cli-release.yml, runs `dist plan` and `dist build`, so dist writes no CI of
# its own. The npm packages are ours too (tools/cli-release/, packages/cli), not dist's npm installer,
# which downloads the binary in a postinstall script.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
# cli-release.yml builds and runs every target on a GitHub-hosted runner of its own system and CPU
# (todo L4g; tools/xtask/src/workflows.rs checks the build matrix against this list).
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
installers = ["homebrew"]
tap = "laudebugs/homebrew-tap"
formula = "laminapdf"
# A tag `laminapdf-cli-v<version>` releases the CLI (dist's per-package tag format).
hosting = "github"
# Only so dist doesn't warn that the tap has no publish job: dist writes no CI here, so nothing
# runs it. The `global` job writes the formula, the release carries it, and cli-release.yml's
# publish-homebrew pushes it to the tap.
publish-jobs = ["homebrew"]
source-tarball = false
# dist's own pull-request runs; cli-release.yml runs `dist plan` itself.
pr-run-mode = "skip"
unix-archive = ".tar.xz"
windows-archive = ".zip"
checksum = "sha256"
# Written by `cargo xtask cli-dist` into target/cli-docs/ before `dist build`.
include = [
  "target/cli-docs/THIRD_PARTY_NOTICES.md",
  "target/cli-docs/man/",
  "target/cli-docs/completions/",
]
